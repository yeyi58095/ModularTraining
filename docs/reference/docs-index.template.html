<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ModularTraining 文件</title><style>
:root{color-scheme:light;--bg:#f5f7fb;--card:#fff;--ink:#192b43;--muted:#586e89;--line:#dce5f0;--accent:#087b9b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 system-ui,"Microsoft JhengHei",sans-serif}body.dark{color-scheme:dark;--bg:#0c1628;--card:#14213a;--ink:#edf4ff;--muted:#a6b8d2;--line:#2b405e;--accent:#65d8ee}header{display:flex;align-items:center;gap:16px;max-width:1280px;margin:auto;padding:30px 24px 20px}h1{font-size:28px;margin:0}header p{margin:4px 0;color:var(--muted)}button,input,a{font:inherit}button,input{color:inherit;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 13px}button{cursor:pointer}a{color:var(--accent)}#theme{margin-left:auto}main{max-width:1280px;margin:auto;padding:0 24px 50px}.entries{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:8px 0 28px}.entry{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;color:var(--ink)}.entry strong{display:block;font-size:19px;margin:3px 0}.entry span{color:var(--muted);font-size:13px}.entry .number{color:var(--accent);font:12px monospace}.search{display:flex;gap:10px;margin-bottom:18px}#search{flex:1;min-width:0}#list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}#list button{text-align:left;display:flex;align-items:center;gap:18px;padding:14px 16px}#list button:hover{border-color:var(--accent)}#list b{display:block}#list small{color:var(--muted);display:block}.group{color:var(--accent);font-size:12px;white-space:nowrap}footer{color:var(--muted);font-size:12px;margin-top:25px}#reader{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 32px;min-width:0}#reader[hidden],#catalog[hidden]{display:none}.reader-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}#article{overflow-wrap:anywhere}#article pre{overflow:auto;border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--bg);font:13px/1.7 Consolas,monospace;white-space:pre}#article code{font-family:Consolas,monospace;color:var(--accent)}#article table{border-collapse:collapse;font-size:13px;display:block;overflow:auto}#article td,#article th{padding:6px 10px;border:1px solid var(--line)}#article h1{font-size:25px;margin-top:22px}#article h2{font-size:21px;margin-top:26px}#article h3{font-size:18px}#article p{margin:12px 0}#article li{margin:5px 0}.crumb{color:var(--muted);font:12px monospace}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}@media(max-width:800px){.entries{grid-template-columns:1fr}#list{grid-template-columns:1fr}header{padding:20px 16px}h1{font-size:23px}main{padding-inline:16px}#reader{padding:18px}.group{white-space:normal}}
</style></head><body><header><div><h1>ModularTraining 文件</h1><p>從流程、操作或研究紀錄開始閱讀。</p></div><button id="theme">深色</button></header><main>
<section id="catalog"><div class="entries"><a class="entry" href="diagrams/training-explorer.html"><div class="number">01 · FLOW & SOURCE</div><strong>流程與程式原文</strong><span>點選方塊閱讀程式、課程 JSON 範例。</span></a><a class="entry" href="architecture.html"><div class="number">02 · ARCHITECTURE</div><strong>程式關係架構圖</strong><span>查看入口、runtime、模型與資料的關係。</span></a><a class="entry" href="README.md"><div class="number">03 · INDEX</div><strong>檔案與目錄索引</strong><span>完整分類、舊檔名與新位置的說明。</span></a></div><div class="search"><input id="search" type="search" placeholder="搜尋名稱、舊檔名或內容…" aria-label="搜尋文件"><button id="all">全部文件</button></div><div id="list"></div><footer>文件保留原紀錄日期；調查當時的結論不會因分類搬移而變成目前狀態。歷史收據與截圖存於 diagrams/evidence/。</footer></section>
<section id="reader" hidden><div class="reader-tools"><button id="back">← 回文件首頁</button><a id="source">開啟 Markdown 原檔</a><button id="raw">原文檢視</button><span id="crumb" class="crumb"></span></div><article id="article"></article></section>
</main><script>
const DOCS=/*__DOCUMENTS__*/;const $=id=>document.getElementById(id);let current=null,raw=false;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function target(file,href){if(/^(https?:|mailto:|#)/.test(href))return href;return new URL(href,new URL(file,location.href)).href;}
function inline(text,file){const codes=[];text=text.replace(/`([^`]+)`/g,(_,code)=>{codes.push('<code>'+esc(code)+'</code>');return '\u0000'+(codes.length-1)+'\u0000';});text=esc(text).replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,label,href)=>'<a href="'+esc(target(file,href))+'">'+label+'</a>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');return text.replace(/\u0000(\d+)\u0000/g,(_,i)=>codes[Number(i)]);}
function render(doc){const lines=doc.text.replace(/\r/g,'').split('\n'),out=[];let code=false,buffer=[],list=false,table=false;const close=()=>{if(list){out.push('</ul>');list=false;}if(table){out.push('</tbody></table>');table=false;}};for(const line of lines){if(line.startsWith('```')){if(code){out.push('<pre>'+esc(buffer.join('\n'))+'</pre>');buffer=[];code=false;}else{close();code=true;}continue;}if(code){buffer.push(line);continue;}if(!line.trim()){close();continue;}const heading=line.match(/^(#{1,6})\s+(.+)$/);if(heading){close();out.push('<h'+heading[1].length+'>'+inline(heading[2],doc.file)+'</h'+heading[1].length+'>');continue;}if(/^\s*\|.*\|\s*$/.test(line)){if(/^\s*\|[\s|:\-]+\|\s*$/.test(line))continue;if(!table){close();out.push('<table><tbody>');table=true;}out.push('<tr>'+line.trim().slice(1,-1).split('|').map(cell=>'<td>'+inline(cell.trim(),doc.file)+'</td>').join('')+'</tr>');continue;}const item=line.match(/^\s*(?:[-*]|\d+\.)\s+(.+)$/);if(item){if(table)close();if(!list){out.push('<ul>');list=true;}out.push('<li>'+inline(item[1],doc.file)+'</li>');continue;}close();out.push('<p>'+inline(line,doc.file)+'</p>');}close();return out.join('');}
function openDoc(doc){current=doc;raw=false;$('catalog').hidden=true;$('reader').hidden=false;$('source').href=doc.file;$('crumb').textContent=doc.file;$('raw').textContent='原文檢視';$('article').innerHTML=render(doc);history.replaceState(null,'','#'+encodeURIComponent(doc.file));scrollTo(0,0);}
function home(){current=null;$('reader').hidden=true;$('catalog').hidden=false;history.replaceState(null,'',location.pathname);}
function list(){const q=$('search').value.trim().toLowerCase(),exact=DOCS.filter(d=>d.name.toLowerCase()===q),matches=exact.length?exact:DOCS.filter(d=>(d.title+' '+d.file+' '+d.text).toLowerCase().includes(q));$('list').replaceChildren(...matches.map(d=>{const b=document.createElement('button'),detail=document.createElement('span'),group=document.createElement('span');group.className='group';group.textContent=d.group;detail.innerHTML='<b>'+esc(d.title)+'</b><small>'+esc(d.name)+'</small>';b.append(group,detail);b.onclick=()=>openDoc(d);return b;}));if(!matches.length)$('list').textContent='沒有符合的文件。';}
$('search').oninput=list;$('all').onclick=()=>{$('search').value='';list();};$('back').onclick=home;$('theme').onclick=()=>{document.body.classList.toggle('dark');$('theme').textContent=document.body.classList.contains('dark')?'淺色':'深色';};$('raw').onclick=()=>{raw=!raw;$('raw').textContent=raw?'格式化檢視':'原文檢視';$('article').innerHTML=raw?'<pre>'+esc(current.text)+'</pre>':render(current);};$('article').onclick=e=>{const a=e.target.closest('a');if(!a)return;const url=new URL(a.href),doc=DOCS.find(d=>new URL(d.file,location.href).pathname===url.pathname);if(doc){e.preventDefault();openDoc(doc);}};list();const requested=decodeURIComponent(location.hash.slice(1)),doc=DOCS.find(d=>d.file===requested);if(doc)openDoc(doc);
</script></body></html>
