移動目標追蹤與深度強化學習控制。\n§3.2.3、§5.4、第 6 章；本頁實驗建議為報告者討論。\n來源檔：NCKU_PBVS for Moving Ground Target Tracking Using a Fixed-Wing UAV with DRL Controller_unlocked.pdf\n\n## 原簡報第 36 頁\n\n研究進度日誌_2026-09-23.md；本地 training_autoretry_sessions 與 reward_history_preview.csv。\n\n## 原簡報第 37 頁\n\n研究進度日誌_2026-09-23.md；本地 training_autoretry_sessions 與 reward_history_preview.csv。\n\n## 原簡報第 38 頁\n\nreward_history_preview.csv；session 20260922_122929_tp02dc5edf_2a72_40db_9688_ae5cdbc2383e；每100回合取樣並保留第1回合。25,000 與 29,000 節點已核對 stdout.log。\n\n## 原簡報第 39 頁\n\nreward_history_preview.csv；四個100回合區間重新計算 mean(reward)、mean(steps) 及 steps==3000 的回合數。\n\n## 原簡報第 40 頁\n\n研究進度日誌_2026-09-23.md；本地 training_autoretry_sessions 與 reward_history_preview.csv。\n\n## 本次新增詳細流程頁\n\n架構：docs/diagrams/src/architecture.json（已修正為目前程式）。\n模型與快照：retry.m、training.m、+trainingmodels/load_profile.m、build_agent.m、validate_agent.m。\n重試與降級：runtime/checkpoint_supervisor.ps1、checkpoint_watchdog.ps1、checkpoint_open_pool.m、checkpoint_worker_diagnostics.ps1。\n訓練與存檔：runtime/checkpoint_attempt.m、training_engine.m、checkpoint_select_agent.m、checkpoint_save_final.m、checkpoint_mark_success.m。\n調參：+trainingmodels/ppo_lstm128_tuned_stability_20260923_v1/TUNING.md 與同名 .m 定義。\n\n流程核對屬於靜態程式檢查；未啟動新的長時間訓練，也不構成穩定性或收斂保證。\n"}];const $=id=>document.getElementById(id);let current=null,raw=false;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function target(file,href){if(/^(https?:|mailto:|#)/.test(href))return href;return new URL(href,new URL(file,location.href)).href;}
function inline(text,file){const codes=[];text=text.replace(/`([^`]+)`/g,(_,code)=>{codes.push('<code>'+esc(code)+'</code>');return '\u0000'+(codes.length-1)+'\u0000';});text=esc(text).replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,label,href)=>'<a href="'+esc(target(file,href))+'">'+label+'</a>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');return text.replace(/\u0000(\d+)\u0000/g,(_,i)=>codes[Number(i)]);}
function render(doc){const lines=doc.text.replace(/\r/g,'').split('\n'),out=[];let code=false,buffer=[],list=false,table=false;const close=()=>{if(list){out.push('</ul>');list=false;}if(table){out.push('</tbody></table>');table=false;}};for(const line of lines){if(line.startsWith('```')){if(code){out.push('<pre>'+esc(buffer.join('\n'))+'</pre>');buffer=[];code=false;}else{close();code=true;}continue;}if(code){buffer.push(line);continue;}if(!line.trim()){close();continue;}const heading=line.match(/^(#{1,6})\s+(.+)$/);if(heading){close();out.push('<h'+heading[1].length+'>'+inline(heading[2],doc.file)+'</h'+heading[1].length+'>');continue;}if(/^\s*\|.*\|\s*$/.test(line)){if(/^\s*\|[\s|:\-]+\|\s*$/.test(line))continue;if(!table){close();out.push('<table><tbody>');table=true;}out.push('<tr>'+line.trim().slice(1,-1).split('|').map(cell=>'<td>'+inline(cell.trim(),doc.file)+'</td>').join('')+'</tr>');continue;}const item=line.match(/^\s*(?:[-*]|\d+\.)\s+(.+)$/);if(item){if(table)close();if(!list){out.push('<ul>');list=true;}out.push('<li>'+inline(item[1],doc.file)+'</li>');continue;}close();out.push('<p>'+inline(line,doc.file)+'</p>');}close();return out.join('');}
function openDoc(doc){current=doc;raw=false;$('catalog').hidden=true;$('reader').hidden=false;$('source').href=doc.file;$('crumb').textContent=doc.file;$('raw').textContent='原文檢視';$('article').innerHTML=render(doc);history.replaceState(null,'','#'+encodeURIComponent(doc.file));scrollTo(0,0);}
function home(){current=null;$('reader').hidden=true;$('catalog').hidden=false;history.replaceState(null,'',location.pathname);}
function list(){const q=$('search').value.trim().toLowerCase(),exact=DOCS.filter(d=>d.name.toLowerCase()===q),matches=exact.length?exact:DOCS.filter(d=>(d.title+' '+d.file+' '+d.text).toLowerCase().includes(q));$('list').replaceChildren(...matches.map(d=>{const b=document.createElement('button'),detail=document.createElement('span'),group=document.createElement('span');group.className='group';group.textContent=d.group;detail.innerHTML='<b>'+esc(d.title)+'</b><small>'+esc(d.name)+'</small>';b.append(group,detail);b.onclick=()=>openDoc(d);return b;}));if(!matches.length)$('list').textContent='沒有符合的文件。';}
$('search').oninput=list;$('all').onclick=()=>{$('search').value='';list();};$('back').onclick=home;$('theme').onclick=()=>{document.body.classList.toggle('dark');$('theme').textContent=document.body.classList.contains('dark')?'淺色':'深色';};$('raw').onclick=()=>{raw=!raw;$('raw').textContent=raw?'格式化檢視':'原文檢視';$('article').innerHTML=raw?'<pre>'+esc(current.text)+'</pre>':render(current);};$('article').onclick=e=>{const a=e.target.closest('a');if(!a)return;const url=new URL(a.href),doc=DOCS.find(d=>new URL(d.file,location.href).pathname===url.pathname);if(doc){e.preventDefault();openDoc(doc);}};list();const requested=decodeURIComponent(location.hash.slice(1)),doc=DOCS.find(d=>d.file===requested);if(doc)openDoc(doc);
</script></body></html>
