const DOCS=[{"file":"guides/checkpoint-comparison.md","name":"checkpoint-comparison.md","title":"停訓後比較 checkpoint","group":"操作與設定","text":"# 停訓後比較 checkpoint\r\n\r\n`compare_training_checkpoints` 使用 `sim`，不呼叫 `train`、不回滾、不改寫課程狀態或 MAT checkpoint。先評估再決定是否續訓；另開分支使用 prepare_recovery_training。\r\n\r\n## 實驗室操作\r\n\r\n確認原實驗 stopped，於 PowerShell 更新：\r\n\r\n```powershell\r\ncd D:\\daniel\\ModularTraining\r\ngit pull --ff-only\r\n```\r\n\r\n在 MATLAB 專案根目錄執行（FAFA_Simulation 必須未開啟；建議另開乾淨 MATLAB）：\r\n\r\n```matlab\r\nsessionDir = fullfile(pwd,\"experiments\",\"progressive_v1\",\"runs\",\"20261009_201547_tpf1292058_f8ca_4ccd_bc7f_a66b20ee91b4\");\r\nevaluation = compare_training_checkpoints(sessionDir);\r\ndisp(jsonencode(evaluation.results,PrettyPrint=true))\r\n```\r\n\r\n預設比較 6100、10600 與最新 checkpoint，各在課程快照前三階段評估一次，最多各 3000 步。若最新與前兩個重複則去重。checkpoint 的 episode 以已保存訓練歷史驗證；最新候選不可讀時明確報錯，不偷偷改用較舊模型。\r\n\r\n使用 CPU、單程序，不啟動 worker pool，不更改正式 GPU／6 workers 設定。明確關閉策略探索，各次 sim 重載 agent；相同 seed、相同保存軌跡、模型初始條件與零風。以上為預設前三階段；2026-10-11 新增 random 與風場評估，使用方式及配對 seed、終端門檻證據的限制見 [Stage 5 診斷](stage5-evaluation.md)。\r\n\r\n## 結果\r\n\r\n每次建立新的 `run/reports/evaluation_\u003c時間>_\u003c唯一碼>/`，內含：\r\n\r\n- `evaluation.json`：checkpoint 路徑／episode／SHA256、目前 runtime／SLX／課程指紋、每次 reward、步數、IsDone、動作飽和比例等。可貼回對話；目前整個 evaluation 目錄受 Git 忽略，不使用 `git add -f` 上傳。\r\n- `scenarios.mat`：本次實際使用的固定軌跡與選項。\r\n- `ep*_stage*_seed*.mat`：原始 observation/action/reward/IsDone experience，留在實驗室。\r\n\r\n逐次保存結果；`status=complete` 才表示整組成功。失敗會記錄 failed 與錯誤，不能把部分完成當全組比較。Ctrl+C 可以停止評估，不會動訓練存檔；中斷時 JSON 可能仍為 running，已保存列可讀取但不是完整結果。編譯快取放在系統暫存目錄，避免 Windows 深層路徑限制；路徑會寫入 JSON。\r\n\r\n`reached_step_limit` 只表示跑到本次設定上限，不保證路徑完成或控制正確。`environment_done` 只代表模型的 IsDone；termination_evidence 新增終端 observation 門檻證據，並非直接記錄 IsDone 分支，不能推論失速；詳見 Stage 5 診斷文件。`observation7_rms` 是原始 observation 第 7 通道統計，不宣稱為公尺單位追蹤誤差。\r\n\r\n這是已訓練任務的固定條件診斷，不是獨立泛化測試。預設只有一個 seed；即使指定多個 seed，固定初始狀態／零風／確定策略也可能完全重複，不代表多個獨立測試情境。不能從此結果宣稱統計成功率。\r\n\r\n## 保護與驗證\r\n\r\n工具取得既有 supervisor.lock 排他鎖並檢查停止狀態；不呼叫會更新狀態的 trainingcurriculum.prepare。要求模型未開啟，不操作其他 pool。結束後還原 cwd、path、rng、原 Agent_Stage2、軌跡 globals 與 Simulink 快取設定；模型關閉但不存檔。checkpoint 比較前後比對 SHA256，sim 前後比對 actor／critic 權重。\r\n\r\n固定路徑與模型設定輔助程式取自目前 training_engine，避免更動活動訓練的程式；每次評估檢查固定路徑函式與引擎版本一致，若後續修改造成差異則拒絕執行。這仍是「目前執行版本」的評估，不能證明它與歷史訓練 runtime 完全相同。\r\n\r\n測試入口：`tests/test_checkpoint_comparison_guards.m`（不模擬）；`tests/test_checkpoint_comparison.m`（使用既有本機短測 checkpoint，六次各五步 CPU 真實模擬，不訓練）。\r\n\r\n2026-10-10 驗證：初次短測發現深層快取觸發 Windows 路徑限制，已改為系統暫存短路徑。通過真實模擬的範圍是本機既有短測 checkpoint，不是實驗室 6100／10600，也沒有測 GPU／多 worker 或長期收斂。\r\n"},{"file":"guides/continuous-training.md","name":"continuous-training.md","title":"明確啟用連續訓練","group":"操作與設定","text":"# 明確啟用連續訓練\n\n`configs/recovery_v2_18500_continuous.json` 是從 18500 checkpoint 建立新分支的歷史配方，不是已完成 39300 run 的下一輪啟動指令。本次同步不啟動訓練；下一輪從頭訓練與自動調整 learning rate 仍需另行設計。\n\n恢復配方明確設定 `continuous_training: true` 與 `max_additional_episodes: 0` 時，prepare 只修改新分支：\n\n- 所有階段 `on_limit` 設為 `continue`。到達 `max_episodes` 後仍等待原過關條件，不按預算強行換階段。\n- guard 設為 `budget_enabled: false`、`regression_action: \"monitor\"`，保存邊界仍計算退步並印出警告，但不因此暫停；仍保存候選與 assessment。\n- 每段 100 回合，`maxAttempts=0` 沿用無次數上限設定。最後階段過關仍正常成功結束；STOP、執行錯誤及既有已鎖定暫停仍可能中斷。\n- actor LR 維持來源的 2.5e-5；不自動回滾、選分支、調 LR，也不保證收斂或一定能無人介入跑完。\n\n未設定連續模式的配方仍有原預算及退步暫停。不要直接編輯既有 run 的課程或 guard 來解除暫停；prepare 保留父 run、checkpoint 與過關條件，新分支預設有 STOP，須明確 retry 才啟動。\n\n2026-10-19 驗證：`test_curriculum`、`test_recovery_guard`、`test_continuous_training` 通過。使用合成歷史、既有測試 checkpoint、新建測試分支及假引擎，覆蓋超預算繼續、退步警告、原預算暫停、暫停鎖定、過關／完成與父檔案 SHA 不變；沒有執行 train/sim。Python 42 項測試通過。未驗證正式長訓練或 GPU／多 workers。\n"},{"file":"guides/curriculum-layout.md","name":"curriculum-layout.md","title":"以課程管理實驗，保留既有訓練","group":"操作與設定","text":"# 以課程管理實驗，保留既有訓練\r\n\r\n2026-10-10 更新：課程定義與輸入在課程目錄，每次執行的進度、模型與報告留在自己的 run：\r\n\r\n```text\r\nconfigs/lab_gpu6.json                  硬體與重試設定\r\n+trainingmodels/ppo_lstm128/            模型定義\r\nexperiments/progressive_v1/\r\n  curriculum.json                     課程定義，指定模型和各階段條件\r\n  assets/                             可重建的 MAT 輸入（不納入 Git）\r\n  runs/\u003c時間_唯一碼>/\r\n    curriculum.json                   此實驗的課程快照\r\n    curriculum_assets/                軌跡輸入快照\r\n    curriculum_state.json             實際階段分界與進度\r\n    model.json、model_source/          此實驗使用的模型及原始碼\r\n    control.json                      此實驗的硬體／執行設定\r\n    Agent_Final.mat、checkpoints/      可用 checkpoint（訓練後產生）\r\n    attempt_*/、diagnostics/、runs/    日誌與分段紀錄\r\n    reports/report.json               此實驗精簡報告（可納入 Git）\r\n    reports/reward_history.png、.csv   圖與逐回合資料（不納入 Git）\r\n```\r\n\r\n標準入口是 experiments/\u003c課程>/curriculum.json，課程名稱取自父資料夾。其他獨立 JSON 範例仍按檔名分類。舊的 curricula/progressive_v1.json 入口由 retry／curriculum_plan 轉到新路徑並提示，不保留兩份可編輯定義。課程改版建議另取 progressive_v2。模型是課程參數；更換模型會建立不同實驗，並不代表不同架構可直接沿用權重。curriculum_state.json 是每次 run 的進度，不放在共享課程層。\r\n\r\n非 curriculum 訓練仍使用 `+trainingmodels/\u003cmodel>/runs/`。已有課程實驗無論放在此舊目錄或新目錄，都依 `retry(resume=完整實驗路徑)` 原位續用，不會被自動搬到新位置。新實驗目錄只放行課程定義與各 run 的 reports/report.json，其餘資料受 Git 忽略；舊模型目錄仍整體忽略。畫圖及報告工具可搜尋兩種結構。\r\n\r\n## 已遷移實驗的 reports 整理（本次更新）\r\n\r\n目前已在 experiments/progressive_v1/runs 下的實驗不需再搬 checkpoint，亦不重建模型。確認已 stopped，並停止舊的 Python watch 後，在實驗室專案根目錄執行：\r\n\r\n```powershell\r\ngit pull --ff-only\r\npowershell.exe -NoProfile -ExecutionPolicy Bypass -File .\\organize_training_reports.ps1 -SessionPath \"D:\\daniel\\ModularTraining\\experiments\\progressive_v1\\runs\\20261009_201547_tpf1292058_f8ca_4ccd_bc7f_a66b20ee91b4\" -Machine lab\r\n```\r\n\r\n此工具將根目錄 reports/lab/\u003c實驗>/report.json、run 根目錄舊 reward_history.png／.csv 複製到 run/reports，逐檔比對 SHA256，原件保留。不存在的來源會提示略過；已有相同內容可重跑，不同內容則拒絕覆蓋。若舊報告另存他處，可提供 -LegacyReportPath。來源報告必須符合 session_id 與 machine，避免混入其他實驗。\r\n\r\n之後原本匯出／畫圖指令不變，自動寫入 run/reports；--output 仍可明確選擇其他輸出位置。要重建頂層 assets，可在 MATLAB 執行 prepare_progressive_training()，不啟動訓練；目前停止的 Stage 3 問題尚未處理，不因更新目錄而自動續訓。\r\n\r\n## 舊版遷移背景：活動訓練的處理\r\n\r\n1. 保留目前 `+trainingmodels/ppo_lstm128/runs/20261009_201547_...` 原位，讓既有 supervisor 繼續執行。不需要為分類改變而停止訓練。\r\n2. 不搬移、不改名、不刪除該實驗，也不編輯其 control／curriculum 快照。活動中的程序持有舊絕對路徑，移動資料可能造成後續讀寫失敗。\r\n3. 現在若只要 stage 分界圖，只複製新版 `plot_training_rewards.py` 到實驗室，停止並重新啟動畫圖工具。不要在訓練中整包更新會被後續 attempt 載入的執行程式。畫圖工具只讀訓練資料、寫圖與 CSV；停止它不會停止訓練。\r\n4. 等訓練正常結束／暫停、supervisor 與 worker 都退出後，將整個實驗資料夾備份到另一位置；不要只備份單一 MAT。課程狀態、輸入與模型快照也需要保留。\r\n5. 再更新完整程式。可指定原路徑續訓，或使用下方工具把已停止的實驗複製到新結構；不支援活動實驗搬移或跨課程匯入。\r\n\r\nGitHub 的精簡 report.json 不是模型備份；MAT 與完整實驗仍留在原電腦。這次變更沒有操作實驗室檔案，不能取代對遠端磁碟／備份的確認。\r\n\r\n## 舊版完整遷移（已完成者不要重跑）\r\n\r\n2026-10-10 使用者已回報實驗室 attempt 8 為 stopped，並要求在新結構繼續這次模型。先在實驗室專案根目錄更新程式，再執行 PowerShell：\r\n\r\n```powershell\r\ngit pull --ff-only\r\npowershell.exe -NoProfile -ExecutionPolicy Bypass -File .\\migrate_training_session.ps1 -SourceSession \"D:\\daniel\\ModularTraining\\+trainingmodels\\ppo_lstm128\\runs\\20261009_201547_tpf1292058_f8ca_4ccd_bc7f_a66b20ee91b4\" -CurriculumName progressive_v1\r\n```\r\n\r\n工具取得 supervisor 排他鎖、拒絕活動狀態／已存在目的地／外置 diagnostics／連結目錄。完整複製到暫存位置，逐檔 SHA256 比對並保留原檔；只修正新副本的 control.json 執行路徑與 status／STOP，完成後才發布到 `experiments/progressive_v1/runs/\u003c原實驗 ID>/`。模型、課程狀態、輸入與歷史日誌保持原始內容；歷史日誌裡的舊路徑不改寫。複製全部資料需額外磁碟空間，雜湊驗證也可能花時間。\r\n\r\n失敗會保留原件與可能存在的 `.incoming_*` 暫存資料，絕不自動刪除；不要拿暫存目錄續訓。成功後仍不自動訓練。原 `matlabExe` 保留，同機續訓時 retry 會再以目前 MATLAB 更新它；此工具不是任意跨機遷移工具。\r\n\r\nMATLAB 的 Current Folder 切到實驗室專案根目錄：\r\n\r\n```matlab\r\nclear retry verify_training_session\r\nnewSession = fullfile(pwd,\"experiments\",\"progressive_v1\",\"runs\", ...\r\n    \"20261009_201547_tpf1292058_f8ca_4ccd_bc7f_a66b20ee91b4\");\r\nverified = verify_training_session(newSession);\r\n% 上行成功並確認顯示的 episode/stage 合理後，才執行：\r\ninfo = retry(resume=newSession);\r\n```\r\n\r\n驗證函式讀取最新可用 PPO checkpoint、真實累計回合數與課程位置，不啟動 pool 或訓練。不可讀的最新檔案會列出並嘗試較舊候選；若候選皆無效或早於目前階段起點，拒絕通過，不能從零開始冒充續訓。停止前未存檔回合仍需重跑。原件保留但不要同時續跑兩份。\r\n\r\n畫圖工具請停止舊 watch 並重新指向 `newSession` 的新完整路徑；MATLAB 的 info 在續訓後也會指向新位置。GPU、workers、階段及既有模型設定由副本保留，無須重跑 prepare_progressive_training 或新實驗入口。\r\n\r\n## 圖上的階段分界\r\n\r\n灰色虛線仍代表 attempt 邊界；橘色點劃線代表實際 stage 切換。Episode 軸下方標示 Stage 1／Stage 2 與階段 id。如果 Stage 2 的 start_episode=3000，線畫在 3000 與 3001 之間。\r\n\r\n標記只讀該實驗的 `curriculum.json` 和 `curriculum_state.json`，不依 JSON 預算或 reward 猜分界。沒有課程紀錄的舊實驗仍可畫 reward；狀態讀取不完整或不一致時會警告並暫不畫 stage，下次 watch 更新再讀取。\r\n\r\n2026-10-10 修正：MATLAB 重新編碼單筆 completed 時可能從陣列變成物件，畫圖端現在兼容兩種形狀；原先會誤報 Incomplete stage history。這不需要修改實驗 JSON 或停止訓練。PNG 改為暫存檔完成後原子替換；寫入失敗保留前張成功圖片，watch 提示後重試，持續失敗可關閉圖片檢視器或改用 --output 路徑。PNG 與 CSV 仍是分別輸出，不是兩檔交易式快照。\r\n\r\n啟動指令不變，務必指定正在跑的實驗完整路徑，避免自動選到別的測試實驗：\r\n\r\n```powershell\r\npython plot_training_rewards.py \"D:\\daniel\\ModularTraining\\+trainingmodels\\ppo_lstm128\\runs\\20261009_201547_tpf1292058_f8ca_4ccd_bc7f_a66b20ee91b4\" --watch 30\r\n```\r\n\r\n驗證：MATLAB 以 start=false 確認新目錄、舊課程目錄原位續用、非課程模型目錄相容；Python 驗證新舊搜尋、3000.5 分界、無課程／無效狀態，以及既有報告／退步診斷。另用合成資料產圖檢查標籤，非實驗室真實曲線。不重跑真實訓練。\r\n"},{"file":"guides/curriculum.md","name":"curriculum.md","title":"JSON 訓練課程：同一 agent，逐階段換軌跡","group":"操作與設定","text":"# JSON 訓練課程：同一 agent，逐階段換軌跡\n\n一份 JSON 描述「要訓練什麼、何時進下一階段、沒學會時怎麼辦」。規劃器解析固定欄位，不執行設定檔內的程式碼；目前採 JSON，尚未支援 YAML。\n\n依 2026-10-09 使用者確認，模型在整份課程最外層指定。階段切換沿用同一個 agent 的 checkpoint 和累計訓練歷史，不重新初始化網路，也不允許每階段偷偷換不同架構。各階段目前可改軌跡、風場與過關／預算條件；學習率與 PPO 超參數仍由 model profile 決定，不在課程中動態調整。\n\n## 直接使用\n\n```matlab\n% 只讀與檢查設定，不訓練、不建 pool：\nplan = curriculum_plan(\"curricula/fixed_to_random.json\");\n\n% 先建立可檢查的實驗快照，不啟動訓練：\ninfo = retry(curriculum=\"curricula/fixed_to_random.json\", start=false);\n\n% 使用者準備好時才執行：\n% info = retry(resume=info.sessionDir, workers=6, minWorkers=1);\n```\n\n`curricula/fixed_to_random.json` 不需要外部 MAT，依序使用現有固定路徑函式與現有隨機路徑生成器。條件數字是示範，不是已重現花偉傑論文成效的參數；內建固定路徑亦不能當成論文第一階段路徑的精確復原。\n\n`curricula/two_mat_then_random.example.json` 對應「軌跡1 → 軌跡2 → random」。其中 MAT 尚未提供，可先用 `curriculum_plan(...,checkFiles=false)` 檢查格式；真正建立實驗時必須有有效 MAT。\n\n## 一個階段怎麼寫\n\n```json\n{\n  \"id\": \"trajectory_one\",\n  \"trajectory\": {\n    \"type\": \"mat\",\n    \"file\": \"../trajectories/軌跡1.mat\",\n    \"waypoints_variable\": \"waypoints\",\n    \"velocity_variable\": \"velocity\"\n  },\n  \"wind\": {\"east_mps\": [0, 0], \"north_mps\": [0, 0], \"turbulence\": [0, 0]},\n  \"advance_when\": {\n    \"all\": [\n      {\"metric\": \"stage_episodes\", \"at_least\": 5000},\n      {\"metric\": \"reward_mean\", \"window\": 100, \"consecutive_windows\": 3, \"at_least\": 2500}\n    ]\n  },\n  \"max_episodes\": 20000,\n  \"on_limit\": \"pause\"\n}\n```\n\n含義：此階段至少完成 5000 回合，而且最近三個各 100 回合、不重疊的區間平均 reward 都 >=2500 才進下一階段。跑到 20000 回合還沒通過，就在存檔後暫停。\n`consecutive_windows:3` 是最近 300 回合切成三段全部符合，不是同一份日誌被規劃器讀三次，也不是三個重疊的 rolling average。\n\n最外層固定為 `{\"schema_version\":1,\"model\":\"ppo_lstm128\",\"stages\":[...]}`。\n新版 schema 2 另外要求最外層 `\"environment\":\"spatial_v1\"`，新 run 依環境 manifest 保存 SLX 與相依檔快照；schema 1 仍相容。續訓不得換環境；舊 run 需先完成 [環境保存](environment-versions.md)。\n`id` 使用不重複的英文字母開頭名稱，例如 `trajectory_one`；MAT 檔名可以用中文。\n\n## 條件字典\n\n| 欄位／指標 | 意義 |\n| --- | --- |\n| `all` | 裡面條件全部成立，等同 AND |\n| `any` | 裡面任一條件成立，等同 OR；可與 all 巢狀組合 |\n| `stage_episodes` | 目前這一階段已保存的回合數，不是全實驗累計數 |\n| `reward_mean` | 最近 window 回合的平均 reward |\n| `steps_mean` | 最近 window 回合的平均步數 |\n| `full_length_rate` | 最近 window 回合中，步數 >= steps_at_least 的比例（0～1） |\n| `at_least`／`at_most` | >=／\u003c=；每個指標只能選一種 |\n| `window` | reward／steps／比例指標必填，資料不足時不通過 |\n| `consecutive_windows` | 需連續符合的完整不重疊區間數，預設 1 |\n\n若單純要排程「此階段跑 10000 回合就換」，使用 `{\"metric\":\"stage_episodes\",\"at_least\":10000}`。\n若要「至少 5000 回合且表現達標」，用 all。不要把最少回合與 reward 寫成 any，否則只要跑滿回合就會過關。\n`full_length_rate` 是步數指標，不能當成真正任務成功率；目前環境未提供可供此規劃器判定的獨立成功旗標。\n\n## 軌跡與風場\n\n- `fixed_builtin`：使用 runtime 現有 `createFixedPath()`，整階段維持該路徑。\n- `mat`：位置與速度都需為有限實數 N×3 陣列、N>=2 且形狀相同。位置沿用現有模型的 East/North/高度公尺慣例，速度為相應三軸 m/s；不自動猜測座標系、插值或轉換 waypoint-only 檔案。請確認取樣間距、速度及起點適合目前 0.1 秒／15 m/s 環境。\n- `random`：必填 `refresh_every_worker_episodes`；10 代表每個 worker 的本地回合計數每 10 回合更新。程序重啟會重置本地計數，不代表全域精確每 10 回合同步換路徑。\n- `east_mps`／`north_mps` 是每回合均勻抽取的整數範圍；`[0,0]` 為零風。`turbulence` 是 0～2 的整數範圍。不是任意連續風速或 turbulence 物理量。\n\nMAT 路徑相對於 JSON 所在資料夾解析，不接受絕對路徑。MAT 輸入仍受專案 `*.mat` 忽略規則保護，不會自動上傳 GitHub；雙機準備新實驗時需另行提供這些輸入，或明確決定哪些小型輸入資產要版控。\n\n## 規劃器的執行與恢復\n\n1. `retry(curriculum=...)` 檢查所有階段與 MAT，保存 `curriculum.json` 和 `curriculum_assets/`。後續編輯原 JSON／MAT 不影響已建立實驗。\n2. 每個 attempt 選有效 checkpoint，再用其中保存的 EpisodeReward／EpisodeSteps 計算條件。stdout 與 worker-local 計數不作為切換依據。\n3. 一段最多執行 `episodesPerProcess` 回合（預設 1000），且不超過當前階段剩餘預算。只在存檔邊界判斷；條件成立後下一段換環境並沿用 agent。不是達到某個 reward 的瞬間中斷平行 workers。\n4. `curriculum_state.json` 保存階段索引、階段起始 episode 和已完成階段；重啟後不重複計算上一階段。checkpoint 若早於目前階段起點，或已有 checkpoint 卻遺失狀態檔，拒絕猜測與靜默回滾。\n5. 過關判斷優先於預算上限。同時滿足時算通過；未通過而達上限，`on_limit:\"pause\"` 保存後暫停；明確指定 `\"advance\"` 才按預算直接進下一階段。\n6. 最後一階段 advance 代表課程結束，保存 `Agent_Success.mat`。若原因是 `episode_budget_reached`，只代表預算排程完成，不代表學會任務。`curriculum_outcome.json` 保存實際原因。\n\n課程模式不使用全實驗 `targetReward` 作停止條件，顯式傳入它會被拒絕；過關全部寫在 advance_when。原本沒有 curriculum 的 retry 呼叫仍維持原流程。\n平均 reward 圖與 MATLAB 原有歷史仍是全實驗累計；規劃器指標只看當前階段。匯出報告的 learning_health 也改為只看當前階段，避免固定路徑→random 的難度變化直接觸發跨階段退步訊號。\n\n已開始實驗的課程是快照。預算耗盡後直接 resume 同一份設定，仍會停在相同限制，不會自動清零預算；目前不提供執行中改課程或 fork checkpoint 並更換課程的入口。調整原計畫並建立新實驗會從新 agent 開始，勿誤當接續舊權重。\n`+trainingcurriculum` 與 runtime 一樣屬執行程式，活動訓練期間不要修改或同步覆蓋它們。\n\n## 驗證範圍\n\n`tests/test_curriculum.m` 在 R2024b 用合成已保存訓練歷史測試條件、MAT 變數映射與快照、跨階段恢復、預算暫停和完成重入；不執行 train()，也不建立真實 worker pool。\n尚未完成真實 Simulink 平行訓練的跨階段驗證；使用者尚未提供軌跡1／軌跡2的實際 MAT，因此範例檔仍是待填入輸入的模板。\n"},{"file":"guides/diagnostic-package.md","name":"diagnostic-package.md","title":"跨機診斷 ZIP（不進 Git 歷史）","group":"操作與設定","text":"# 跨機診斷 ZIP（不進 Git 歷史）\n\n在已停止的實驗室副本，用 PowerShell 執行：\n\n```powershell\ncd D:\\daniel\\ModularTraining\ngit pull --ff-only\npowershell.exe -NoProfile -ExecutionPolicy Bypass -File .\\pack_training_diagnostics.ps1 -SessionPath \".\\experiments\\progressive_v1\\runs\\20261010_155437_recovery_tpebed29a8\" -EvaluationName \"evaluation_20261010_183235_tp0d559eeb\"\n```\n\n預設選取 Agent10600／10700、runs/r000001 的初始 agent／訓練選項／腳本快照、課程及恢復設定、指定完整 evaluation 的 JSON 與 traces、稽核 JSON 及 attempt 診斷日誌。可用 -Episodes 10600,10700,11000（直接以 PowerShell 呼叫腳本時）調整 checkpoint；預設兩個足以調查第一次退步。不納入模型快取或全部歷史 checkpoint。這是診斷子集，不能用作完整續訓備份。\n\nZIP 寫入專案 diagnostic_packages/（Git 忽略），含 manifest.json 的逐檔大小和 SHA256；封裝後重新讀 ZIP 核對每個來源雜湊。工具持有 supervisor 排他鎖並要求停止狀態；不更動來源，不上傳。失敗留下 .partial 供調查，不會冒充成功 ZIP。實際大型檔案的時間／大小須以實驗室結果為準；本機通過合成小檔案測試。\n\n## GitHub 傳送\n\n在 repository 的 Releases → Draft a new release，填獨立標籤如 diagnostics-20261010-recovery，將 Verified ZIP 對應的檔案加入附件，選 Save draft。不要用 Add file 將 ZIP 提交到程式碼，也不要以 git add -f 加入 MAT。\n\n草稿下載需要可存取草稿的帳號；宿舍端用相同／有權限帳號下載，告知本機 ZIP 路徑與打包印出的 SHA256，即可驗證後分析。如果改成正式發佈，先確認 repository 可見性與附件內容（檔案可能包含機器路徑）。啟用 immutable releases 時，正式發佈後有附件修改／刪除限制，診斷用途保持草稿即可。\n\n這裡的工具不自動建立 Release、刪除附件或重寫 Git 歷史。附件傳完後可手動刪除草稿；已下載的副本不會隨之刪除。\n\n參考：[GitHub 管理 Releases](https://docs.github.com/en/repositories/releasing-projects-on-github/managing-releases-in-a-repository)。\n"},{"file":"guides/endpoint-v2-training.md","name":"endpoint-v2-training.md","title":"第二版末端目標修正與續訓","group":"操作與設定","text":"# 第二版末端目標修正與續訓\n\n2026-10-12 使用者授權正式部署、push 及提供續訓指令。正式 runtime/FAFA_Simulation.slx 的 guidance 採用實驗室已評估的 endpoint_lookahead_v2 原碼；reward、IsDone、planner、課程與 optimizer 不變。這是環境變更，不能將前後分數差異全歸因於學習。\n\n實驗室 Agent21600：第二版既有 seeds201:210 的 Stage4/5 共20次、新 seeds211:220 共20次、前三階段 seed101 共3次，全跑滿3000步；另外原版新情境20次也全部完成。新情境小風平均reward原版2917.28、第二版2995.42，平均observation7 RMS 0.22024、0.21226。Stage5 抽樣包含零風案例，不代表全是非零風。最差距離仍接近46m；Stage6尚未驗證，不能宣稱整體合格。評估報告為使用者實驗室輸出，本機未執行21600checkpoint。\n\n新配方 configs/recovery_21600_endpoint_v2.json 從21600接續，actor LR保持2.5e-5，每段100，新增預算10000（最多31600），保留退步保護。繼承原課程Stage5進度，不因評估通過而跳階；提前課程完成、退步或其他暫停條件仍可能先停止。硬體沿父control（原目標6workers/GPU），不是本機驗證此組合。\n\n先確認實驗室沒有活動訓練／評估。PowerShell：\n\n```powershell\ncd D:\\daniel\\ModularTraining\ngit pull --ff-only\n```\n\nMATLAB：\n\n```matlab\ncd D:\\daniel\\ModularTraining\nclear prepare_recovery_training retry\nrehash\nif bdIsLoaded('FAFA_Simulation'), close_system('FAFA_Simulation',0); end\nroot=fileparts(which('retry'));\nparentSession=fullfile(root,'experiments','progressive_v1','runs', ...\n    '20261010_224522_recovery_tpc1c4f06e');\nnext=prepare_recovery_training(parentSession, ...\n    fullfile(root,'configs','recovery_21600_endpoint_v2.json'));\ninfo=retry(resume=next.sessionDir);\ndisp(info.sessionDir)\n```\n\n只執行一次 prepare；它每次建立新分支。後續查進度用 info.sessionDir。不要解除舊run的guard或從舊run直接retry。prepare 保留父checkpoint並記錄新環境SHA與繼承關係；純評估未消耗或增加訓練回合。課程快照、父實驗和checkpoint不覆寫。\n\n正式環境預設評估不再傳 guidanceVariant；baseline 指當前來源SLX。舊版A/B應使用歷史版本的獨立副本，禁止將舊版runtime覆蓋到活動訓練中。tests/fixtures/guidance_before_endpoint.m.txt 僅供幾何回歸，不是可續訓模型。\n\n本機驗證已通過：正式chart與已評估v2原碼相等、末端及邊界幾何、重複套用拒絕、110步CPU純sim、WindowManager初始化、實際短測checkpoint的分支權重/來源保留與假引擎預算暫停。未在本機啟動正式訓練或GPU/6workers測試。SLX其他差異僅視窗開啟狀態與存檔版本/metadata。\n\n使用者預計五小時後檢查一次、之後兩天不使用電腦。此次預算是回合數，不保證五小時跑完，也不自動在五小時停訓；到預算或guard暫停就保留結果等待人工判讀，不自動另開分支。保持實驗室主機供電、不休眠；五小時後可讀取status及最新日誌，不必停訓評估。\n"},{"file":"guides/environment-versions.md","name":"environment-versions.md","title":"環境版本與遠端更新","group":"操作與設定","text":"# 環境版本與遠端更新\r\n\r\n2026-10-15。Agent 定義、Simulink 環境、課程分開管理；環境選版不代表 reward 候選已部署。使用者後續授權 commit/push；遠端由使用者依指令操作，代理不自行連線更新或啟動訓練。\r\n\r\n## 現在的結構\r\n\r\n```text\r\n+trainingmodels/ppo_lstm128/       Agent 架構與 PPO profile\r\nenvironments/spatial_v1/\r\n    environment.json              環境 id、模型檔名、相依檔與 SHA256\r\n    FAFA_Simulation.slx            正式空間循跡；原 reward\r\nruntime/                          共用引擎與 supervisor\r\n    FAFA_Simulation.slx            保留給舊工具／直接執行的相容檔\r\nexperiments/progressive_v2/\r\n    curriculum.json               schema 2；指定 model 與 environment\r\n    assets/\r\n    runs/\u003c實驗>/\r\n        environment.json          本次實驗固定的環境 manifest\r\n        environment/              SLX 與列出的相依檔副本\r\n        curriculum.json           課程快照\r\n        model.json                Agent 設定\r\n        checkpoints/\r\n        attempt_*/environment_used.json  本次預檢模型／引擎 SHA\r\n```\r\n\r\n`spatial_v1` 是原有空間循跡環境，模型 SHA 為 `495afb97a9fa463b4500d168909ea28f649a12912f12c0631ec1e85b93c1b6be`。後續已另建 `spatial_v2`（reward id 為 `spatial_reward_v2`），見 [新版 reward 環境](spatial-v2.md)。一般入口預設環境仍為 spatial_v1；progressive_v2 已明確選 spatial_v2，不會把既有實驗切到新版。\r\n\r\n環境 manifest 只接受明列的同層 `.slx/.mat/.m/.sldd` 檔及 SHA256，拒絕路徑跳脫、重複名稱與保留的訓練檔名。現有 spatial_v1 的正式模型是自包含 SLX；日後需要額外資產必須列入 manifest。引擎目前只支援 FAFA_Simulation 的既有 observation/action 介面，不代表可直接換成任意 Simulink 模型。\r\n\r\n新的 run 預設選 spatial_v1，或使用 `retry(environment=\"版本id\",...)`；schema 2 課程的 environment 與入口參數必須一致。schema 1 課程仍可讀，新建 run 時使用明確指定的環境或預設 spatial_v1。續訓禁止傳入另一個 environment。\r\n\r\n## 遠端：先保留，再更新\r\n\r\n使用者已確認遠端停止或暫停。仍由工具在操作當下檢查 status 與排他鎖。以下在遠端執行，不需將 checkpoint 搬回本機。\r\n\r\n**第一步：只先把 `preserve_training_environment.ps1` 複製到遠端。不要先更新／覆蓋 runtime。** 腳本可獨立執行，不依賴新版 MATLAB 程式。每個未來需要續訓的舊 run 都要各自保存。\r\n\r\n若目標 run 最後使用的是已核對的正式空間循跡模型，在 PowerShell 執行（替換實驗路徑）：\r\n\r\n```powershell\r\n$session = 'D:\\你的遠端專案\\experiments\\progressive_v1\\runs\\你的實驗ID'\r\n.\\preserve_training_environment.ps1 -SessionDir $session `\r\n  -ExpectedModelSha256 '495afb97a9fa463b4500d168909ea28f649a12912f12c0631ec1e85b93c1b6be'\r\n```\r\n\r\n此 SHA 只適用於這個已知模型。若不符，腳本會拒絕，應先核對遠端 SLX 與最後實驗紀錄，不要為了通過就換上本機 SLX。保存的是**更新當下遠端檔案**，不是證明整段歷史都在同一環境跑過。若更新已發生，必須從可信備份找回並核對原檔，不能把新環境冒充舊環境。\r\n\r\n腳本從該 run 的 control.scriptDir 找當地來源，保存 SLX，以及 runtime 同層的 MAT／資料字典；額外同層 MATLAB 相依檔可用 `-AdditionalFiles 'helper.m'` 指定。一般 checkpoint 不在 runtime，且 Agent*.mat 不允許當環境資產。\r\n\r\n它會逐檔比對來源、目的 SHA，最後才發布 environment.json。不移動 run，不改 control、課程、checkpoint、STOP、guard 或歷史。相同副本可重跑驗證；不同內容拒絕覆寫；中斷留下 environment.preparing 時要求先檢查，不自動清除。\r\n\r\n**第二步：所有要保留的舊 run 保存完成後，再同步新版程式。** 確認遠端儲存庫已包含本次提交後，使用既有 Git 更新流程；不要同步生成的本機 runs 或覆蓋遠端訓練資料。可以先 git fetch 取得提交、僅抽出保存腳本到暫存目錄，完成保存後才 fast-forward 工作目錄；fetch 本身不更新 runtime。\r\n\r\n**第三步：遠端 MATLAB 根目錄先預檢舊 run。**\r\n\r\n```matlab\r\nsessionDir = \"D:\\你的遠端專案\\experiments\\progressive_v1\\runs\\你的實驗ID\";\r\n[modelFile, manifest] = trainingenv.resolve(sessionDir); % 唯讀驗證\r\ndisp(manifest.id)\r\ndisp(modelFile)\r\ninfo = retry(resume=sessionDir,start=false);            % 更新控制路徑，不啟動\r\n```\r\n\r\n預檢不解除 guard 暫停。只有決定正式續訓時才執行 `retry(resume=sessionDir)`；這不是本次要自動執行的步驟。已有 Agent_Success 的完成 run 不透過 retry 再訓練，仍可用 resolve 檢查環境。\r\n\r\n舊 run 沒有 environment.json 時，新的 retry／attempt 拒絕猜測並提示先保存環境。沒有 status.json 的舊 start=false 草稿不能由保存工具認定已停訓；若沒有 checkpoint，改用新版重新建立草稿即可，不需冒充有訓練歷史。\r\n\r\n## 遠端的新 progressive_v2\r\n\r\n```matlab\r\ninputs = prepare_progressive_v2_training();\r\ncfg = jsondecode(fileread(\"configs/lab_gpu6_progressive_v2.json\"));\r\nargs = namedargs2cell(cfg);\r\ninfo = retry(args{:}); % 設定內 start=false，只建立草稿\r\n[modelFile, manifest] = trainingenv.resolve(info.sessionDir);\r\n```\r\n\r\nprogressive_v2 後續依使用者明確要求改選 spatial_v2（新版 reward）；較早建立的 spatial_v1 草稿維持原快照，需另建新 run。每次 retry 新建都產生另一個 run，請保存 sessionDir。續訓會使用這個 run 的快照，而不依賴 registry 或 runtime 中的 SLX 後續是否改動。\r\n\r\n## 評估、恢復與限制\r\n\r\n- 已綁定 run 的 compare_training_checkpoints 使用其環境快照，必要時將所有列出的資產複製到評估暫存資料夾。沒有綁定的舊 run 保留既有唯讀診斷功能，但報告明列 `legacy_current_runtime_not_historical_proof`，不能當歷史環境重現。\r\n- 已綁定父 run 的 prepare_recovery_training 繼承環境快照；配方要求另一個 SLX SHA 時拒絕，不暗中換環境。舊未綁定父 run 的既有恢復配方仍保存 prepare 當下 runtime 並明列來源，不回寫父 run。\r\n- 環境快照固定 SLX 與列出資產；**共用 engine、課程引擎、MATLAB／工具箱版本並未全部封存**。每次 attempt 在 guard／engine 前記錄當下 engine SHA，guard 暫停時不代表已執行 engine。這不是整台電腦的完全可重現映像，也不會保留 optimizer 私有狀態的額外解讀。\r\n- 本次不提供自動跨環境 checkpoint 移植，也不修改活動實驗的課程快照。要改 reward 或任務規則，應另發布環境版本並建立明確的新實驗。\r\n- 保留 runtime SLX 是遷移相容安排；直接跑 training_engine.m 的舊方式仍可能使用它。正式實驗應走 retry／checkpoint_attempt，才能取得環境綁定與驗證。\r\n\r\n## 本機驗證\r\n\r\n通過 MATLAB 新建／續訓、schema 1/2、課程快照、跨位置環境讀取、雜湊改動拒絕、未知版本／路徑跳脫拒絕、實際 attempt 假引擎接線；既有課程、相對路徑、課程工作區及 recovery guard 測試亦通過。\r\n\r\nPowerShell 合成測試通過來源保存、MAT 相依檔、重跑、活動狀態拒絕、排他鎖拒絕、錯誤 SHA、路徑跳脫與副本被改動拒絕。另用測試恢復副本完成 CPU 五步純 sim，確認 evaluator 使用 run_snapshot、權重與來源 SHA 不變。沒有連線更新遠端，也沒有 GPU／多 worker 正式驗證。\r\n"},{"file":"guides/exploration-evaluation.md","name":"exploration-evaluation.md","title":"凍結模型的探索開關對照","group":"操作與設定","text":"# 凍結模型的探索開關對照\n\n`compare_training_checkpoints(..., useExploration=true)` 在CPU純sim中啟用已儲存PPO的動作抽樣。預設false維持原評估行為。兩者皆不train、不改checkpoint、不解除guard；報告`use_exploration`明確記錄模式，保留權重與SHA檢查。\n\n相同stage/seed先生成相同scenario；模擬前重設同一seed。探索模式的軌跡會因動作不同而改變。這不是重現並行訓練worker的完整隨機狀態，也不能由開關對照單獨證明崩落根因。\n\n實驗室恢復分支20261016_162607_recovery_tpf699ae87已有18000/18100/18200、stage4、seed601:606的關閉探索評估：reports/evaluation_20261016_194120_tpd47c04a4/evaluation.json。更新評估工具後只需同組開啟探索再評估18次，無須重跑原組：\n\n```matlab\nsession=fullfile(pwd,\"experiments\",\"progressive_v2\",\"runs\", ...\n    \"20261016_162607_recovery_tpf699ae87\");\nexploreReview=compare_training_checkpoints(session, ...\n    episodes=[18000 18100 18200],includeLatest=false, ...\n    stages=4,seeds=601:606,useExploration=true,routeMetrics=true);\ndisp(jsonencode(exploreReview.summary,PrettyPrint=true))\n```\n\n若只有探索組大量失敗，證明這批固定策略對動作抽樣敏感，不證明探索是訓練更新失控的唯一原因；若探索組也全跑滿，應優先調查更新過程、訓練路徑分佈與並行狀態差異。不要直接關閉PPO訓練探索或放寬過關條件。六seed屬診斷而非泛化認證。\n\n整合測試test_checkpoint_exploration接收既有checkpoint路徑，在獨立未訓練run做三次五步CPU模擬；檢查預設模式、探索模式動作不同、相同seed探索重播、配對scenario及checkpoint/權重未變。不代表GPU或正式訓練驗證。\r\n\n## 評估專用標準差縮放\n\n`useExploration=true, explorationStdScale=0.5` 將Gaussian actor的std輸出乘0.5（variance為原本0.25），保留原本均值分支與所有可學權重。只對記憶體中的actor新增無可學參數的scaling layer，不修改SLX、reward、checkpoint或訓練超參數，不另存可續訓agent。預設scale=1保持原行為；禁止scale\u003c=0、>1或未開啟探索時縮放，避免混淆評估條件。\n\n相同觀測歷史下均值不變；閉迴路觀測因動作不同而改變時，後續均值仍可能跟著改變，不能宣稱整段飛行的均值序列固定。此功能只支援本專案observation/mp_out/sdev命名的Gaussian actor。\n\n實驗室以18000/18100/18200、stage4、seed601:606執行同組18次，與既有scale=1及關閉探索報告比較。這是單一預設候選，不反覆調到seed601過關；通過仍不證明訓練穩定、所有隨機路徑合格或根因已修復。\n\n```matlab\nscaledReview=compare_training_checkpoints(session, ...\n    episodes=[18000 18100 18200],includeLatest=false, ...\n    stages=4,seeds=601:606,useExploration=true, ...\n    explorationStdScale=0.5,routeMetrics=true);\ndisp(jsonencode(scaledReview.summary,PrettyPrint=true))\n```\n\n報告記錄exploration_std_scale；舊報告缺此欄位表示當時原始actor未縮放，不修改既有報告。test_exploration_scale以既有觀測驗證均值不變、std精確減半、可學權重不變，並檢查短CPU模擬與seed重現性；不驗證正式訓練。\r\n"},{"file":"guides/github-artifact-sync.md","name":"github-artifact-sync.md","title":"GitHub 雙機成果同步","group":"操作與設定","text":"# GitHub 雙機成果同步\n\n程式碼、課程 JSON、精簡報告維持 Git push/pull；模型與完整評估使用同一個 repository 的 **Draft Release 附件**。`git pull` 不會下載附件，`training_artifacts.py sync` 才會下載並驗證它們。兩端的活動 run 不互相覆蓋。\n\n## 一次性準備\n\n兩端需 Python 3.9 以上（只用標準函式庫）與 GitHub CLI `gh`。若日常畫圖用的是 `py` 或特定 Python 路徑，下列 `python` 換成同一個執行檔。\n\nWindows 可從 [GitHub CLI](https://cli.github.com/) 安裝，或在 PowerShell 執行：\n\n```powershell\nwinget install --id GitHub.cli --exact\n```\n\n安裝後重開 PowerShell，再登入：\n\n```powershell\ngh auth login --hostname github.com --web\ngh auth status --hostname github.com\npython --version\n```\n\n兩台以有 repository 寫入權限的帳號登入，才能存取 draft。工具使用 `gh` 既有認證，不讀出、不保存 token。repository 自動取自腳本所在專案的 `origin`，只接受 github.com HTTPS／SSH URL，不硬編碼本機或實驗室路徑。\n\n## 實驗室：一個指令封裝並上傳\n\n先確認來源 run 沒有活動訓練／評估。在 PowerShell 更新程式後執行：\n\n```powershell\ncd D:\\daniel\\ModularTraining\ngit pull --ff-only\npython training_artifacts.py publish --session \"experiments/progressive_v2/runs/20261017_071436_recovery_tp323769ed\" --evaluation \"evaluation_20261018_234801_tpc304c6c6\"\n```\n\n完成會印出 `Uploaded and download-verified DRAFT`、tag，以及另一台可直接貼上的完整 `sync` 指令。把這段輸出貼回聊天即可。這次 run 的資料來自使用者回報：39300 回合完成，seeds901:910、八階段共80次無探索評估全跑滿；模型與完整 traces 尚未由代理在本機驗證。\n\n若只想先產生與檢查本機包，將 `publish` 換成 `pack`；pack 不需要 gh 或網路。封裝成功後再用相同 publish 指令會重用內容相同的包。\n\n若已產生 ZIP／JSON，但上傳中斷或更新了封裝工具，使用 `upload` 接續原本的包，不重新計算 exporter commit 或產生新 tag：\n\n```powershell\npython training_artifacts.py upload \"artifacts/packages/\u003c原本tag>.json\"\n```\n\n2026-10-19 首次實驗室發布回報 `Existing release belongs to different content`，但後續 `gh release view` 確認正確 tag、draft 與 SHA256 說明已存在。原程式把「建立後查不到」與「SHA 不符」合併成同一訊息；現改用 gh 的精確 tag 查詢，建立後查不到最多重試三次，仍不可見時給接續指令，真正 marker 不符則繼續拒絕上傳。瀏覽器草稿 URL 出現 `untagged-*` 不是模型 tag 遺失的證明。\n\n## 宿舍：一個指令下載並核對\n\n在宿舍專案更新程式、登入 gh 後，使用發布端印出的實際 tag：\n\n```powershell\npython training_artifacts.py sync --tag \"\u003c發布端印出的完整 tag>\"\n```\n\n結果在腳本所在專案的 `artifacts/results/\u003ctag>/`。兩端專案根目錄不同沒關係；不會把檔案寫進 `experiments/` 或父 run，不會改寫 JSON 裡保存的原機器路徑。那些路徑是歷史 metadata，不代表下載後可直接使用。\n\n**這是模型與評估封存包，不是完整可續訓 run。** 不包含 supervisor.lock、所有 attempts、全部歷史 checkpoints；不得對下載目錄直接 `retry(resume=...)`。後續本機分析直接讀封存資料；若要以既有 evaluator 重播，須另行建立經驗證的評估工作副本，而不是偽造停止狀態或擅自修寫原快照。\n\n## 包含與驗證內容\n\n- `Agent_Success.mat`，以及 evaluation.json 實際列出的受評估 checkpoint。相同 episode 不等於兩個 MAT 容器雜湊相同，因此各自保留與標示；工具不宣稱成功模型權重已與評估模型比對。\n- model.json、model_source/、environment.json、environment/；所有環境檔案核對快照 SHA，MAT 課程輸入核對存在且一併打包。\n- curriculum.json、curriculum_state.json、curriculum_outcome.json、control.json、status.json，以及存在時的 recovery／guard JSON。\n- 指定完整評估的 evaluation.json、scenarios.mat、results 列出的逐次 MAT traces。評估必須屬於此 run、包含完成回合、環境和課程 SHA 與目前快照吻合；受評估 checkpoint 必須仍有相同 SHA。\n- manifest.json：每個檔案的路徑、大小和 SHA256，以及 run、回合、evaluation、封裝工具當下的 Git commit／dirty 狀態。封裝工具版本**不等於歷史訓練執行版本證據**。\n- ZIP 外另有同名 JSON，保存 ZIP 大小、SHA256 及 manifest 身分。tag 由 run 名稱與 manifest hash 前12碼生成；資料不同建立另一版本，不覆蓋舊版本。\n\n來源包在 `artifacts/packages/`，下載包在 `artifacts/downloads/`，三個目錄均受 Git 忽略。可保留本機包以便離線搬移：先搬同名 ZIP／JSON，再執行 `python training_artifacts.py import \u003cJSON路徑>`，仍有完整雜湊檢查。\n\n## 停止、重跑與失敗語意\n\n封裝要求 status=success、outcome.success=true，且取得與 MATLAB supervisor 相容的 Windows FileShare.None 排他鎖。鎖失敗、檔案缺失、環境漂移或未完成評估會停止，不修改來源。Linux 使用 flock，跨平台的鎖不能用來推論 Windows 遠端正在停止。\n\n上傳建立 draft，不直接公開發佈、不修改既有 Release 狀態；不使用 `--clobber`。上傳中斷後再次執行相同 publish，先核對 release 的內容身分，只補缺少的附件。若已有同名但內容不符的附件，下載驗證會失敗，保留遠端與本機原件，需人工檢查。\n\n發布成功前會重新下載 ZIP／JSON，檢查整包與逐檔雜湊。sync 在驗證所有 ZIP entries 後才解壓，拒絕路徑穿越、Windows 保留名稱、大小寫重複、連結及額外未列明檔案；使用暫存目錄完成後再發布。已下載版本再次 sync 會重新核對，若本機內容被改動則拒絕覆寫。失敗的 `.partial`／下載暫存資料保留供調查，不當作完整成果。\n\nDraft 附件可能包含原機器路徑及完整研究資料；本工具不自動把 draft 改為公開 Release。每個附件須小於 GitHub 的2 GiB限制，目前超限會明確拒絕，尚未實作分卷。同步會用到 ZIP 加解壓資料的磁碟空間；不是持續鏡像或排程。\n\n## 驗證與限制\n\n`tests/test_training_artifacts.py` 以合成檔案測試成功封裝／匯入、重跑、來源不變、活動狀態與排他鎖拒絕、環境及checkpoint漂移、缺輸入、未完成評估、ZIP／逐檔雜湊、路徑攻擊、大小寫衝突、超限、認證失敗及模擬 gh 上傳重試／下載毀損。沒有使用真實模型或建立測試 Release；實驗室首次發布是實際網路端到端驗證。\n\n官方 CLI 介面：[create](https://cli.github.com/manual/gh_release_create)、[upload](https://cli.github.com/manual/gh_release_upload)、[download](https://cli.github.com/manual/gh_release_download)。\n"},{"file":"guides/lab-start.md","name":"lab-start.md","title":"實驗室啟動：6 workers 上限＋GPU","group":"操作與設定","text":"# 實驗室啟動：6 workers 上限＋GPU\r\n\r\n本機已通過 CPU／1 worker 的三階段真實短測，詳見 `validation-2026-10-09.md`。本設定的 GPU、多 worker、六階段長訓練尚未實測，收斂與門檻仍待校準。本次僅準備設定，不在本機啟動訓練。\r\n\r\n## 更新程式\r\n\r\n確認實驗室這份專案沒有活動訓練後，在專案根目錄的終端機執行：\r\n\r\n```powershell\r\ngit pull --ff-only\r\n```\r\n\r\nMATLAB 的 Current Folder 切到這份 ModularTraining 根目錄。以下所有相對路徑均以此為基準，不使用宿舍的絕對路徑。\r\n\r\n`retry` 的相對 curriculum／resume 路徑固定以 retry.m 所在專案根目錄解析，不依賴 Java 的程序工作目錄（Windows 有時為 System32）。MATLAB 的 fileread 設定檔指令仍需在上述 Current Folder 執行。\r\n\r\n## 新實驗：直接啟動\r\n\r\n```matlab\r\nprepare_progressive_training();\r\ncfg = jsondecode(fileread(\"configs/lab_gpu6.json\"));\r\nargs = namedargs2cell(cfg);\r\ninfo = retry(args{:});\r\ndisp(info.sessionDir)\r\n```\r\n\r\n第一行生成直線與 S 彎 MAT，後面讀取 JSON 並正式啟動背景 supervisor。請記下印出的 sessionDir；重複執行這段會建立另一個新實驗，並非續訓。MATLAB 返回提示符不代表背景訓練已結束。\r\n\r\n如要先檢查設定而不訓練，將上方 `info = retry(args{:});` 改為：\r\n\r\n```matlab\r\ninfo = retry(args{:}, start=false);\r\n% 檢查該 sessionDir 的 control.json、model.json、curriculum.json 後啟動：\r\ninfo = retry(resume=info.sessionDir);\r\n```\r\n\r\n## 設定含義\r\n\r\n- `configs/lab_gpu6.json` 是 retry 的執行參數；`experiments/progressive_v1/curriculum.json` 定義六階段路徑、風場與過關條件。分開保留，方便兩台電腦用不同硬體執行同一課程。\r\n- `workers:6`、`minWorkers:1`：最多 6 個 MATLAB workers，當次成功取得 n 個便使用 n 個，符合先前的可用數量策略。若整個 pool 建立失敗，後續 attempt 可用 4、2、1 作備援。不是強制湊滿 6 才開始。\r\n- `device:\"gpu\"`：模型使用 GPU；不代表需要或分配了 6 張 GPU，也不保證比 CPU 快。本設定不會自動改成 CPU。遠端需具備相容 GPU、驅動與相應 MATLAB 工具箱／授權。\r\n- 每 100 回合存 checkpoint，每段最多 1,000 回合後重啟 MATLAB 並評估階段條件。階段預算不足 1,000 時會縮短該段。\r\n- `maxAttempts:0` 不限制總 attempt 數；各階段仍有自己的回合上限，未過關會暫停。連續沒有進展的失敗限制為 3；不要把重試機制當成退步自動修正。\r\n\r\n若明確想要求「必須正好 6 個」，請同時設定 `minWorkers:6`、`fallbackWorkers:[]`；這會放棄可用 n 個就先跑的策略。\r\n\r\n## 查看、停止與續訓\r\n\r\n```matlab\r\nstatus = jsondecode(fileread(fullfile(info.sessionDir,\"status.json\")))\r\n```\r\n\r\nattempt 的 `pool_ready.json` 記錄實際 workers；`control.json` 的 trainingDevice 應為 gpu。遇到 GPU 或建池錯誤，查該 attempt 的 stdout.log／stderr.log。\r\n\r\n需要停止時，使用專案既有 STOP 機制：\r\n\r\n```matlab\r\nfid = fopen(fullfile(info.sessionDir,\"STOP\"),\"w\");\r\nassert(fid ~= -1); fclose(fid);\r\n```\r\n\r\nSTOP 可能中斷尚未存檔的回合，保留可用 checkpoint；確認 status 顯示停止且原 supervisor 已退出後才續訓。下一次 MATLAB 開啟後，使用原 sessionDir 的完整路徑：\r\n\r\n```matlab\r\ninfo = retry(resume=\"此處換成原實驗資料夾完整路徑\");\r\n```\r\n\r\n續訓讀取原 control.json（包含 GPU／worker 設定）與課程快照；不重新讀 configs/lab_gpu6.json。若因階段預算用盡而暫停，應先檢查報告與門檻，單純續訓不會自動增加預算。\r\n\r\n分享精簡診斷，在終端機執行：\r\n\r\n```powershell\r\npython export_training_report.py \"此處換成實驗資料夾完整路徑\" --machine lab\r\n```\r\n\r\n完整日誌與 MAT 留在實驗室，僅 reports 下的指定 report.json 可納入 Git。訓練流程與尚未實作的獨立評估／退步回滾見 `training-plan-v1.md`。\r\n"},{"file":"guides/learning-health.md","name":"learning-health.md","title":"純腳本如何應對學習退步","group":"操作與設定","text":"# 純腳本如何應對學習退步\r\n\r\n2026-10-09：使用者指出訓練環境只有腳本，沒有 AI 即時修正。可用確定性的規則實作偵測、保留成果與停損，但必須區分訓練 reward 波動、評估退步與程序故障。\r\n\r\n## 已實作：診斷訊號\r\n\r\n`learning_health.py` 由 `export_training_report.py` 呼叫。每 1000 個連續回合形成一個不重疊區間；若已有平均 >=500 的參考區間，後面連續 5 個完整區間平均低於先前最佳區間的 50%，標記 `suspected_regression`。例如先前最佳區間平均 1800，連續 5000 回合分段平均都小於 900 才觸發。這避免單回合尖峰或少量失敗立即触發停損。\r\n\r\n門檻皆可用 CLI 調整；它們只是初始工程規則，不是已驗證的 PPO 收斂判準。輸出會保存門檻、參考區間、最近完成區間、連續低迷次數與未滿區間的資料數。缺回合會打斷連續低迷計數；舊的最佳區間仍可當參考。\r\n\r\n這層只標記：每次匯出才計算，沒有背景服務，不會動 MATLAB、超參數或 checkpoint。它不等於已導入自動退步停訓。圖中實驗仍需在實驗室匯出資料，才能驗證訊號是否符合觀察。\r\n\r\n## 後續建議的處置順序（尚未實作）\r\n\r\n1. **用相同條件評估候選模型。** 定期用固定且獨立於訓練的路徑／風場／seed 集合測試；只評估，不更新權重。不要直接用不同 worker／風場下的單段訓練 reward 判定模型優劣。評估會增加運算成本，頻率應配合每段 1000 回合的設計。\r\n2. **分開保留最新與最佳模型。** latest 用來恢復進度，best-evaluation 用來保留已取得的能力；兩者保存各自模型、歷史與評估條件。即使後面退步，也不覆蓋 best。尚未有固定評估前，若保留 best-training 也應明確標為暫定候選。\r\n3. **持續退步後在段落邊界安全暫停。** 當多輪獨立評估都下降，先完成並保存當段，再記錄 `paused_regression`，而不是中途殺掉 MATLAB。目前 STOP 會強制終止所屬程序，不能直接拿它充當「保存後暫停」。必須新增 supervisor 在段落邊界的決策與持久化狀態。\r\n4. **恢復試驗另開分支實驗。** 可以事先定義候選策略，例如回到最佳模型、僅降低 actor learning rate，設定最多幾次恢復試驗及總訓練預算。保存父 checkpoint 指紋／父 episode 與新參數，避免不斷回滾、覆蓋歷史、重播同一輪失敗。現有 validator 與同目錄防回滾限制會拒絕部分此類操作，需專門設計 fork-from-checkpoint 入口。\r\n\r\n不建議偵測到 training reward 一跌就自動改 learning rate：worker 數、隨機風場、路徑或 episode 提前結束都可能造成同樣曲線；不同故障不適合套同一處方。PPO loss、策略 entropy／KL、action 飽和比例與終止原因的紀錄，可幫助選擇恢復策略。\r\n\r\n## Worker 數量變更的關係\r\n\r\n現在同一段可以用成功建立的 n 個 workers；下一段可重新嘗試目標上限。比較學習成效時仍要一起看 ActualWorkers、總環境步數與訓練時間。現有 seed 由 attempt 決定，跨段或跨機不是完全相同採樣條件。\r\n\r\n採用 MATLAB `parpool(cluster,[minWorkers workers])` 的範圍語意，已核對本機 R2024b 的 parpool 說明與 [MathWorks 文件](https://www.mathworks.com/help/parallel-computing/parpool.html)。此語意容許成功 pool 小於上限，不能保證所有授權／worker 連線錯誤都能自動產生小 pool。整個 pool 失敗時仍需 supervisor 的恢復機制。\r\n\r\n## 2026-10-10：手動比較工具\r\n\r\ncompare_training_checkpoints 已提供停止後的固定無風任務比較，不更新權重；見 [操作與限制](checkpoint-comparison.md)。這補上有限範圍的手動評估入口，仍沒有持續監控、獨立泛化測試集、自動 best 選擇、回滾或分支恢復。\r\n\r\n## 2026-10-10：恢復分支的 runtime guard\r\n\r\n現在也支援 [恢復試驗](recovery-training.md) 的保存後自動暫停。這是 +trainingguard 的另一組規則，並非本文件原本 learning_health.py 的匯出診斷：每段100回合、連續3個窗口、reward 和 steps 同時下降，或新增1000回合預算用完則暫停。原本沒有 training_guard.json 的實驗不會自動啟用。狀態與有限來源資訊可由 exporter 的 recovery_monitor 分享。\r\n"},{"file":"guides/progressive-v2-18000-recovery.md","name":"progressive-v2-18000-recovery.md","title":"progressive_v2：18000 受限恢復試驗","group":"操作與設定","text":"# progressive_v2：18000 受限恢復試驗\n\n本頁保留 2026-10-16 的歷史配方與診斷背景；2026-10-19 經使用者授權納入 Git 同步，不是目前已完成39300後的下一輪訓練指令。連續模式另見 [continuous-training.md](continuous-training.md)。下文的未提交與待執行描述為當時狀態。\n\n本配方 configs/recovery_v2_18000_guarded.json 從停止的原始 spatial_v2 run 的 Agent18000.mat 另開分支，沿用環境快照、課程與同一agent。不是修復根因的保證，也不是最佳模型認證。\n\nActor LR由5e-5減至2.5e-5，critic不變。這是控制更新幅度的待驗證干預，不把前次退步直接歸因於LR。每100回合保存／換程序；新增最多1000至19000。相同階段兩個連續100回合視窗的reward及steps都低於參考80%時，在保存邊界pause；不是每步監控，仍可能先退步。保留原課程過關條件。\n\n來源歷史截至18000的guard預檢未觸發：參考16300，reward2679.4、steps3000；最後100回合reward2528.7、steps2908。現階段約2143.5 reward與2400 steps兩者都低於才算低窗，參考可能隨後續改善更新。到新stage重新依該階段歷史建立參考。\n\n本機僅有18400/18500/18600 checkpoint。預檢用18400保存歷史截到18000，不冒充持有Agent18000；驗證兩窗觸發、一窗容忍、在記憶體改18400 actor LR不變更權重、spatial_v2模型SHA一致。未做18000完整prepare、正式訓練或GPU測試。實驗室prepare會檢查實際18000、父狀態／鎖、LR、環境快照並生成新分支。\n\n使用者可在實驗室MATLAB建立相同配方後prepare_recovery_training，再retry(resume=新run)。不要刪原run的STOP或guard、不要從18600直接續訓。新run停止後應用固定配對情境評估來源與新checkpoint，再決定延長。資料與配方本次本機保存，未自動提交或推送。\r\n"},{"file":"guides/progressive-v2-std-recovery.md","name":"progressive-v2-std-recovery.md","title":"Stage 4 exploration-scale recovery (2026-10-17)","group":"操作與設定","text":"# Stage 4 exploration-scale recovery (2026-10-17)\n\nThe lab's frozen Agent18000 on new Stage 4 seeds 701:712 completed 11/12\nepisodes at the original exploration scale (mean reward 2402.6204), versus\n12/12 at half standard deviation (2647.8399). Seed 705 improved from 302 to\n3000 steps. Earlier seeds 601:606 were 6/6 in both modes. These are diagnostic\nsamples, not a certified success rate or proof of the cause of PPO collapse.\n\n## Bounded learning trial\n\nUse parent `20261016_162607_recovery_tpf699ae87`, checkpoint 18000, and recipe\n`configs/recovery_v2_18000_std_half.json`. The parent must be paused/stopped.\nThe new branch inherits spatial_v2 and the recorded Stage 4 position.\nActor LR stays 2.5e-5; critic LR, PPO clip/entropy settings and reward remain\nunchanged. Hardware is inherited. Five 100-episode segments give at most\n500 additional episodes, ending at 18500; the existing two-window 80%\nreward-and-steps guard can stop earlier. Do not clear a guard to continue.\n\nPreparation appends a nonlearnable factor 0.5 after softplus, keeping the\npublic std output name `sdev`. Both sampled training actions and PPO's\nprobability calculations therefore use the transformed actor distribution.\nIt is not external action noise or clipping. Mean-function parameters,\ncritic parameters and all learnable weights are preserved at preparation.\nThe underlying std branch remains learnable: this does not enforce an\nabsolute noise ceiling, and future std may increase again. Mean behavior\ncan also change as observations and learning change.\n\nThe child records `explorationStdScale` in model.json and the recipe in\nrecovery.json, and replaces only its snapshot's builder/validator plus the\nnew scaling helper. Existing parent snapshots and checkpoints are untouched.\nRepeated scaling is rejected. The changed actor is saved once; subsequent\nattempts load that checkpoint without multiplying by 0.5 again.\n\nReconstructing the actor and calling setActor does not establish preservation\nof private optimizer state. Treat this as a recovery intervention with that\nlimitation, not a controlled proof that std alone explains training results.\nThe implementation test checks persistence, mean/std replay, source hashes,\nchild snapshot validation and a tiny synthetic CPU PPO update. It does not\nvalidate GPU/multi-worker flight training or long-term convergence.\n\n## Lab commands\n\nWith training paused, pull the update in PowerShell. In MATLAB:\n\n```matlab\ncd D:\\daniel\\ModularTraining\nclear prepare_recovery_training retry\nrehash\nparentSession = fullfile(pwd,\"experiments\",\"progressive_v2\",\"runs\", ...\n    \"20261016_162607_recovery_tpf699ae87\");\ntrial = prepare_recovery_training(parentSession, ...\n    \"configs/recovery_v2_18000_std_half.json\");\ninfo = retry(resume=trial.sessionDir);\ntraining_status(info.sessionDir);\n```\n\nWhen this bounded trial stops, inspect its guard and evaluate saved checkpoints\n18000/18100/latest with exploration enabled at the default evaluation scale 1:\nthe stored actor already includes factor 0.5. Passing explorationStdScale=0.5\nwould apply another reduction during evaluation and is not the intended test.\n"},{"file":"guides/recovery-training.md","name":"recovery-training.md","title":"從已驗證候選模型準備恢復試驗","group":"操作與設定","text":"# 從已驗證候選模型準備恢復試驗\n\n2026-10-10 實驗室固定條件評估：6100／10600 都在直線與平緩 S 彎達 3000 步；固定轉彎分別為 399／1578 步。12600 三條路徑均在 138 步 IsDone。10600 因而是這三個候選中的恢復起點，並非全歷史最佳或已證明泛化成功。\n\n## 實驗室操作\n\n原實驗保持停止，PowerShell 更新程式：\n\n```powershell\ncd D:\\daniel\\ModularTraining\ngit pull --ff-only\n```\n\nMATLAB 在專案根目錄執行以下「準備」命令，尚不會訓練：\n\n```matlab\nparentSession = fullfile(pwd,\"experiments\",\"progressive_v1\",\"runs\", ...\n    \"20261009_201547_tpf1292058_f8ca_4ccd_bc7f_a66b20ee91b4\");\nrecovery = prepare_recovery_training(parentSession);\n```\n\n它會在同課程的 runs/ 下建立一個新 `_recovery_` 實驗；讀取父實驗 Agent10600 的真實歷史，依已記錄分界重建當時階段。完整保留該 checkpoint 的 actor／critic 權重與截至 10600 的訓練歷史，只將記憶體內 agent 的 actor learning rate 乘 0.5，再另存新實驗。同步改新 model.json 以通過續訓 validator，不修改父 MAT 或原課程／model_source。GPU、workers=6、minWorkers=1、fallback 等硬體設定沿用父 control。\n\n新 recovery.json 記錄父路徑、SHA256、episode、學習率前後數值與配方。可核對輸出應為 parentEpisode=10600、stageIndex=3、actorLearnRate=2.5e-5、maxAdditionalEpisodes=1000。來源若與預期不同，先查明再啟動。\n\n確認後，正式啟動**新實驗**：\n\n```matlab\ninfo = retry(resume=recovery.sessionDir);\n```\n\n這行才啟動實驗室訓練；預期從 10601 接續。不要對 parentSession 執行 resume。重新開 MATLAB 後 recovery 變數不在，需使用準備時顯示的完整新 sessionDir；不必再執行 prepare 以免多建一份。\n\n## JSON 決定的動作\n\n配方：`configs/recovery_actor_half.json`。新實驗保存獨立 `training_guard.json`，不因後續編輯共用配方而改變。\n\n- 每段 100 回合；同階段每 100 回合形成不重疊區間。\n- 參考區間必須平均 reward >=500、平均步數 >=500，選其中 reward 最高者，步數以同一區間為準。\n- 連續 3 個完整區間，reward 和步數都低於參考的 50%，標記 suspected_regression，在保存後暫停。\n- 從父 checkpoint 起最多新增 1000 回合；最後一段會被剩餘預算截短。預設最多到 11600，亦可能因退步、課程條件或程序故障提早停止。\n- 檢查在開始 attempt 前及段末 Agent_Final 完成保存後執行。新階段使用新階段歷史，避免直接把換難路徑當成退步。固定路徑尚未學好但一直低於最低參考值時不會觸發比例規則，因此另有總預算。\n- `training_guard_state.json` 記錄門檻判定、參考區間、連續低分次數及暫停原因。觸發後保持 paused；單純再呼叫 retry 不會繞過它。後續另建有來源紀錄的新試驗，勿刪狀態檔冒充解鎖。\n- 遇到段末恰好是參考最佳區間時，在 health_candidates/ 保留 CandidateN.mat。它只是 training-window candidate，不能標為最佳評估模型，也不會被 supervisor 自動拿去回滾。\n\n這是「規則自動監控與保存後暫停」，不是自動診斷失敗原因。獨立 sim 評估仍由 compare_training_checkpoints 執行；目前沒有自動選最佳評估模型、連續改參數或自動重啟恢復分支。因此沒有無限自動回滾迴圈。\n\n條件是待校準的工程保護規則，可能誤暫停，也不能阻止每次策略退步。只在存檔邊界判斷；不承諾中途每個 episode 即時停止。學習率減半是試驗假設，不是已證實的修復；分段從 1000 改 100 亦改變重啟頻率與 attempt seed，不能把後續差異全歸因於 learning rate。\n\n## 停止後比較\n\n在新實驗 stopped／paused 後執行：\n\n```matlab\nevaluation = compare_training_checkpoints(recovery.sessionDir,episodes=10600);\ndisp(jsonencode(evaluation.results,PrettyPrint=true))\n```\n\n這會比較新分支的起點 10600 和最新存檔，不要求新分支存在 6100。新分支沒有複製父 stdout 日誌；畫圖顯示新生成的回合資料，父訓練歷史則保存在 MAT 與 recovery.json 來源紀錄。\n\n## 驗證與保留\n\ntests/test_recovery_guard.m 使用合成退步歷史、既有 CPU 短測 checkpoint 及假引擎，驗證窗口、階段隔離、單指標下降不觸發、復原後重置、權重與父檔不變、learning rate／manifest 一致、剩餘預算截短、暫停後重啟不進訓練。既有課程測試同步通過。未執行正式恢復訓練或 GPU／6 workers 測試。\n\n建立分支失敗時保留 `.preparing` 目錄供診斷，retry 拒絕啟動該目錄。所有 MAT、來源 lineage、規則狀態和日誌依原 .gitignore 留在產生資料的電腦；GitHub 程式碼不是 checkpoint 備份。\n"},{"file":"guides/resume-audit.md","name":"resume-audit.md","title":"續訓退步唯讀稽核","group":"操作與設定","text":"# 續訓退步唯讀稽核\n\n訓練維持 paused/stopped，在專案根目錄執行：\n\n```matlab\naudit = audit_training_resume(info.sessionDir,episodes=[10600 10700 11000]);\ndisp(jsonencode(audit,PrettyPrint=true))\n```\n\n工具取得 supervisor 排他鎖，不 train、不 sim、不更動 checkpoint 或 guard。輸出在該 run 的 reports/resume_audit_*.json，沿用 Git 忽略規則。\n\n- checkpoints 比較所選 checkpoint 與第一個 checkpoint 的 actor／critic 可學習參數，並列出 PPO 主要設定。relative_l2_change 是差異大小，不是故障判定門檻。\n- initial_snapshots 讀取 runs/r*/Agent_Initial.mat 和同層 TrainingOptions.mat，依實際 resume checkpoint 歷史對照。這個快照在 train 呼叫之前保存。exact_equal=true 支持載入時保留可學習參數；不保證後續訓練或 optimizer 內部狀態正確。\n- options_equal 僅比較工具列出的設定，未涵蓋全部 agent 屬性。Worker seeds 和實際 workers 一併列出。\n- 只使用同一 run 下 checkpoints 內的來源檔，避免遷移後舊絕對路徑。無法對應來源或缺少 TrainingOptions 的初始快照會跳過。initial_snapshot_count=0 不能解讀成載入一致。\n\n工具不讀取 optimizer 私有狀態，不分析物理終止原因；不會因看到權重差異就自動降低學習率或回滾。實驗室 MAT 不在本機，需使用者貼回 JSON 才能判斷實際續訓載入是否一致。\n\n本機驗證：使用既有真實短測 agent，加上合成的初始快照與舊電腦路徑配置，確認同 run 解析、相同 actor／critic 參數、設定比對及來源 checkpoint 雜湊不變。未啟動訓練或模擬；不能當作實驗室稽核結果。\n"},{"file":"guides/run-lineage-proposal.md","name":"run-lineage-proposal.md","title":"Run 繼承關係與跨 run reward 畫圖","group":"操作與設定","text":"# Run 繼承關係與跨 run reward 畫圖\n\n2026-10-10 記錄構想；2026-10-11 使用者授權實作畫圖工具與文件。實作僅在 `plot_training_rewards.py`，訓練端與既有 run 資料維持原狀。\n\n## 使用方法\n\n原本指令即可自動包含父 run，不需要修改實驗 JSON：\n\n```powershell\npython plot_training_rewards.py \"experiments/progressive_v1/runs/C\" --watch 60\n```\n\n輸出預設仍在 C 的 `reports/reward_history.png` 和 `.csv`，祖先 run 不會收到輸出。停止並重啟 Python 畫圖程序即可載入新版本；訓練中只更新畫圖檔，不需重啟 MATLAB 或更新 runtime。\n\n只看目前 run 的原始日誌：\n\n```powershell\npython plot_training_rewards.py \"experiments/progressive_v1/runs/C\" --no-lineage\n```\n\n父 run 的跨機絕對路徑已失效時，可提供目前存放父 run 的專案根目錄、課程資料夾或 `runs/`，此選項可重複：\n\n```powershell\npython plot_training_rewards.py \"experiments/progressive_v1/runs/C\" --lineage-root \"D:/archive/ModularTraining\"\n```\n\n工具優先使用記錄中的有效路徑；相對位置依子 run／搜尋根目錄解析。失效路徑使用末段 run ID，在同層 runs、本專案及額外搜尋根目錄的標準 experiments、模型 runs、舊 sessions 結構尋找。候選須唯一，不會依時間或名稱相似度猜測。若多份同 ID 副本造成歧義，請使用原記錄路徑可解析的資料配置；`--lineage-root` 增加搜尋位置，不會覆蓋有效路徑或自動消除歧義。工具不掃描 Flower 或任意遞迴目錄。\n\n## 曲線語意\n\n例如 A 跑到 12600，B 從 A 的 10600 接續；B 跑到 11600，C 從 B 的 11000 接續。畫 C 的來源路線為：\n\n| 來源 | 採用 episode |\n| --- | --- |\n| A | 1–10600 |\n| B | 10601–11000 |\n| C | 11001 起 |\n\nA 在 10600 後、B 在 11000 後的其他分支資料不會接入 C。若中間 run 沒新增回合、直接再次分支，其空區段不重複計入祖先資料。同 run 重複 episode 仍使用較新 attempt；不同 run 不互相覆蓋。只有日誌內完整行才納入，寫入中的最後一行等待下一次 watch 更新。\n\n- 淡藍色：每回合 reward。各 run 平均 reward 分色；圖例標示來源 run。\n- 紫色虛線：繼承 checkpoint 與子 run 的接續點，位於 N 與 N+1 之間。\n- 灰色虛線：同 run 內 attempt 分界。\n- 橘色線與軸下文字：各 run 保存的 curriculum stage 歷史；繼承的相同階段不重複標示，不把接續點當成換階段。\n- 缺少 episode 的區域留斷線及灰色底；缺少祖先時仍畫已知子 run，並在圖上與 console 提示。找不到中間祖先時，不能推測更前面的歷史。\n\nCSV 保留 reward、average_reward、steps、total_steps、q0、attempt，新增 `source_run` 與 `source_session`。後者是目前讀取的完整本機路徑；CSV 與 PNG 沿用 Git 忽略規則。\n\n## 判讀與驗證限制\n\n平均 reward 直接使用各 run 日誌值，不跨分支重新平滑。圖例的 `configured avg window` 讀取目前 control.json，不能證明歷史所有 attempt 的窗口相同；未知值標為 unknown。圖例 `prep SLX` 為 recovery.json 內 prepare 時的模型指紋縮寫，不代表歷史實際執行版本。actor LR 亦為 recovery 準備時記錄。沒有準備紀錄的原始 run 標示未知環境；reward 定義與歷史環境未被此工具核驗，同圖不代表分數可直接比較。\n\n工具偵測循環引用、無效 episode、已知 AgentN／CandidateN 檔名與 episode 不符，以及父 checkpoint 早於該父 run 自身繼承起點。遇到錯誤停止追溯、發出警告；不修復 JSON、編造記錄或連接缺漏曲線。不載入 MAT，不核驗 checkpoint SHA256 或權重；它呈現 metadata 記錄的來源路線，不能作續訓完整性驗證。既有 `verify_training_session`／audit 工具用途不變。\n\n來源讀取為唯讀，不搬移 run、不改寫 checkpoint、curriculum、control、guard、stage state 或日誌，不控制訓練。watch 每次重新讀取來源鏈與日誌，較長祖先會增加 I/O；若需要降低更新負擔，可增大 watch 秒數。只讀檔案不會改變模型學習條件。\n\n`tests/test_plot_lineage.py` 與既有 `tests/test_plot_stages.py` 使用合成日誌驗證三代截斷、不重複繼承歷史、同 run attempt 覆蓋、半行忽略、跨機路徑、歧義、缺失父 run、錯誤 episode／checkpoint、循環、stage 分界、PNG／CSV 與來源檔案不變。這些測試不啟動 MATLAB，不代表實驗室的完整祖先日誌已在本機驗證。\n\n## 尚未實作\n\n所有分支的並排比較、steps／其他指標圖、專用可跨機 lineage schema、歷史執行環境／reward 定義的完整版本證明。現有功能使用既有 recovery.json，不新增或改寫 run 來源 metadata。\r\n"},{"file":"guides/spatial-v2.md","name":"spatial-v2.md","title":"spatial_v2：獨立的新版 reward 環境","group":"操作與設定","text":"# spatial_v2：獨立的新版 reward 環境\r\n\r\n2026-10-15，使用者授權建立 `environments/spatial_v2`，主要改 reward，並要求將進度記入 AGENTS／README 供其他聊天室接續。\r\n\r\n## 版本與修改位置\r\n\r\n- 環境 id：`spatial_v2`；reward id：`spatial_reward_v2`。\r\n- 模型：`environments/spatial_v2/FAFA_Simulation.slx`。\r\n- 新模型 SHA256：`997adbbd29b199c88e956d0778c1d8022547c60e46abd9943db1d325c295d557`。\r\n- 父版本：`spatial_v1`；父模型 SHA256：`495afb97a9fa463b4500d168909ea28f649a12912f12c0631ec1e85b93c1b6be`。\r\n- manifest：同目錄 `environment.json`；新建 run 時由現有環境快照機制驗證並複製。\r\n\r\n正式計分已寫入這份獨立 SLX，並非只有離線候選函式。原 `runtime/FAFA_Simulation.slx`、spatial_v1 及所有既有 run 快照均未更動。\r\n\r\n只有 `OBSERVATION/MATLAB Function13` 與 `OBSERVATION/MATLAB Function22` 的程式改變。SLX 存檔另外更新模型 UUID、版本號和視窗／metadata，沒有更動模型接線、guidance、WindowManager、observation、IsDone、PPO 或其他 reward 支路。\r\n\r\n## 新公式\r\n\r\n使用先前離線校準的最小修改候選，距離懲罰強度固定 w=0.2。以下 d 單位為公尺，是 guidance 的局部橫向距離，不是原始有限折線的獨立最近距離：\r\n\r\n```text\r\ncross_track = 0.2 - 0.2 * d / 30\r\ndistance_bonus = 0.1 + 0.05 * max(0, 1 - d / 10)\r\n```\r\n\r\nFunction13 保留原輸入介面，直接傳遞正規化 d，取消依曲率將直接距離懲罰減半；既有下游 Gain／Abs 完成第一條公式。Function22 將輸入 d/30 還原成公尺後，計算 10m 內的連續加分，取消舊局部 waypoint 距離30～150m加分。\r\n\r\n原有0.1基底仍保留；獨立 curvature_distance、朝向、角速度、轉向追蹤、距離變化及動作扣分均保留。沒有宣稱已解決所有 reward 投機行為，也沒有提高懲罰強度到0.4或0.6。\r\n\r\n## 評估與重現\r\n\r\n`instrument_reward` 會辨識兩個 chart 的新版標記並寫出 reward_version。`audit_training_rewards` 依記錄版本核對逐步得分，舊報告沒有版本欄位時仍依舊公式處理。混合標記或不相符的數值會拒絕；不把新版 traces 當舊公式分析。\r\n\r\n```matlab\r\naddpath('tests');\r\ntest_reward_breakdown();          % 原公式相容性\r\ntest_spatial_reward_candidate();  % 候選單位與單調性\r\ntest_spatial_v2();                % 直接讀實際 SLX 的兩個 chart 驗證\r\n% 需要本機既有診斷 checkpoint/traces，會純 sim，但不 train：\r\n% report = test_spatial_v2_simulation();\r\n```\r\n\r\n建置工具為 `environments/build_spatial_v2.m`，只用於作者從固定的 v1 產生新 bundle；若 spatial_v2 目錄已存在就拒絕覆寫。一般使用者同步完整 bundle 即可，無需重新建置。後續修改已使用的版本應另建版本，不直接改既有 run 快照。\r\n\r\n### 本次驗證結果\r\n\r\n- 直接讀取 v1/v2 全部 Stateflow MATLAB Function 程式，比對確認只有上述兩個 chart 不同；128組距離／曲率／目標距離組合與候選公式相符，版本錯配會拒絕。\r\n- 在獨立診斷測試副本，以 Agent31600、Stage6 seed205 做 CPU、關閉探索的3000步純 sim；實際抽樣風 east=2、north=3m/s、turbulence=0。這一例不代表所有風場或 turbulence 等級。\r\n- 原分數2823.4247706269057，新分數2666.4952715484128；實際 SLX 與離線重計分逐步最大差 `4.4408920985006262e-16`。\r\n- 比對位置、姿態、guidance d 與動作變化扣分，最大差均小於1e-8；evaluator 核對模擬前後權重一致，來源 checkpoint SHA 未變。來源 checkpoint SHA 為 `75bc17b133c86c974b11ebfbb23be385e9965605323486b2ff36891626c8e823`。\r\n- 精簡收據：`tests/output/spatial_v2_validation.json`；評估資料夾：`tests/output/tp2eb7dbee_c5ab_4a8f_8985_05e265193c95/reports/evaluation_20261015_135821_tp58ac2704`。兩者為本機忽略資料，完整 traces 不納入 Git。\r\n- 舊 reward 合成測試、候選單位／單調性測試、新版診斷與新 run 快照預檢通過。沒有 train、GPU／多 worker 驗證或長期收斂結論。\r\n\r\n## 與 progressive_v2 的關係\r\n\r\n**後續使用者明確要求 progressive_v2 使用 spatial_v2，已更新共享課程及遠端設定。** 原有 reward 門檻維持起始方案，尚未針對新公式長訓練校準，不宣稱能保證收斂。\r\n\r\n使用者已在遠端準備的 `20261015_134932_tpfcac90bf_7392_48ff_b6d6_e7b07dec087e` 仍綁定 spatial_v1，且依回報未開訓。不要修改它的 environment.json、SLX 或課程快照來換版本；日後選擇新環境時建立新 run。\r\n\r\n本機不啟動正式訓練；遠端須另建 spatial_v2 run，不能使用先前的 spatial_v1 草稿續訓。遠端由代理提供指令、使用者執行。待本次檔案同步後，可先在遠端專案根目錄的 MATLAB 做唯讀驗證：\r\n\r\n```matlab\r\n[manifestFile, assetDir] = trainingenv.registry(pwd,\"spatial_v2\");\r\nmanifest = trainingenv.verify(manifestFile,assetDir);\r\ndisp(manifest.id)\r\ndisp(manifest.reward_version)\r\ndisp(manifest.files.sha256)\r\n```\r\n\r\n新 reward 的長期收斂、多 worker／GPU 行為與訓練過關門檻仍待驗證。先前 frozen-policy 的重新計分不能當成新 reward 訓練效果。\r\n\r\n## progressive_v2 正式啟動（使用者已指定新版環境）\r\n\r\n先確認沒有活動訓練，再於遠端 PowerShell 執行 `git pull --ff-only`。\r\n已保存的舊 run 環境與先前 spatial_v1 草稿不改寫。於 MATLAB 專案根目錄執行：\r\n\r\n```matlab\r\nclear retry prepare_progressive_v2_training\r\nrehash\r\nprepare_progressive_v2_training();\r\ncfg=jsondecode(fileread(\"configs/lab_gpu6_progressive_v2.json\"));\r\nassert(strcmp(cfg.environment,\"spatial_v2\") && ~cfg.start);\r\nargs=namedargs2cell(cfg);\r\nnewV2=retry(args{:});\r\n[modelFile,manifest]=trainingenv.resolve(newV2.sessionDir);\r\nassert(strcmp(manifest.id,\"spatial_v2\"));\r\nassert(strcmp(manifest.reward_version,\"spatial_reward_v2\"));\r\nassert(strcmpi(checkpointreview.sha256(modelFile), ...\r\n    \"997adbbd29b199c88e956d0778c1d8022547c60e46abd9943db1d325c295d557\"));\r\ndisp(newV2.sessionDir)\r\n% 以下這一行正式啟動；此前只準備與核對。\r\ninfo=retry(resume=newV2.sessionDir);\r\n```\r\n\r\n只執行一次準備區塊；不要重用之前的 v2.sessionDir 或134932草稿。\r\n用 `training_status(info.sessionDir)` 查看進度。從Stage1、Episode1、新agent開始，\r\n目標6workers、最低1、GPU，實際worker數以日誌為準。\r\n本機已重新通過新版/舊版reward測試、實際SLX公式測試及此課程start=false\r\n環境快照核對；沒有啟動本機正式訓練或驗證遠端GPU收斂。\r\n\r\n相關：[離線校準證據](../research/reward-calibration-v2.md)、[環境快照與遠端更新](environment-versions.md)。\r\n"},{"file":"guides/stage5-evaluation.md","name":"stage5-evaluation.md","title":"Stage 5 暫停後診斷（2026-10-11）","group":"操作與設定","text":"# Stage 5 暫停後診斷（2026-10-11）\n\n實驗室在 21600 因 recovery_budget 正常暫停。11600/21600 的前三項無風評估顯示能力保留，但不回答 Stage 5 低分原因。先保持暫停，做隨機路徑的配對無風／小風擾診斷，不調 LR 或過關門檻。\n\n取得本次更新後，在 MATLAB 專案路徑可見、FAFA_Simulation 未開啟時執行：\n\n```matlab\nclear compare_training_checkpoints\nrehash\nroot = fileparts(which(\"compare_training_checkpoints\"));\nsession = fullfile(root,\"experiments\",\"progressive_v1\",\"runs\", ...\n    \"20261010_224522_recovery_tpc1c4f06e\");\nevaluation = compare_training_checkpoints(session, ...\n    episodes=21600,includeLatest=false,stages=[4 5],seeds=201:210);\ndisp(jsonencode(evaluation.summary,PrettyPrint=true))\ndisp(jsonencode(evaluation.results,PrettyPrint=true))\n```\n\n共 20 次 CPU 串行 sim、每次最多 3000 步，沒有訓練、pool 或自動續訓；可能耗時，逐次寫報告。對每個 seed，Stage 4/5 使用完全相同的隨機路徑；每組 checkpoint 都重用保存的 scenario。風場依課程整數範圍抽樣，某些小風擾樣本可能抽到全零，逐列記錄實際值，不將其偽稱有風。\n\n路徑產生器複製自訓練引擎，執行前檢查函式一致性，未修改 runtime。評估每個 seed 生成一條路徑；不重現訓練 worker 每十回合刷新與探索的歷史序列。探索關閉，不能直接把評估 reward 當訓練曲線的同分布樣本。\n\n`evaluation.summary` 每個 checkpoint/stage 提供樣本數、跑滿比例（排除同時 IsDone）、平均 reward/steps、每回合 observation7 RMS 的平均、最低 reward 的 seed/trace。只有 10 個診斷情境，不是正式可靠度或泛化合格證明。若小風擾較差，需依實際風參數與最差 traces 檢查；若兩者皆好，也不能單憑此斷言所有訓練失敗都是探索造成。\n\n`evaluation.results` 有實際 east/north/turbulence、終端原始 obs3/obs7、obs7 最大絕對值與 `termination_evidence`。此欄只是已審視觀測正規化下的終端門檻證據；unknown 保持未知，不猜測物理原因。完整軌跡和風存於 `scenarios.mat`，experience 存於各 trace，並保存 SLX/engine/產生器/課程/checkpoint SHA256。\n\nSimulink 內部亂數 seed 沿用模型保存值，MATLAB seed 並不獨立重設所有噪音來源。因此跨 seed 主要變化為路徑與抽樣風參數，不宣稱每次都有獨立 turbulence 時序。輸出報告明確保留這項限制。\n\n結果仍位於 run/reports/evaluation_*，受 Git 忽略。貼 summary 與 results 即可，先不傳完整 MAT。純評估不解除 training guard 的暫停。\n\n## 本機驗證\n\n`tests/test_wind_evaluation.m` 通過配對路徑一致性、不同 seed 路徑差異、RNG 還原與合成終端門檻案例；使用既有短測 agent 完成四次各五步的真實 CPU 模擬（含強制非零風及 turbulence）。`tests/test_checkpoint_comparison.m` 另通過六次各五步固定路徑/MAT 模擬。source SHA、agent 權重與 caller RNG 檢查通過。這是工具整合短測，未執行訓練，未測試實驗室 21600 的表現或完整 3000 步隨機風擾可靠度。\n\n## 規劃與導引訊號重播\n\n初次 20 次評估發現205/207有風失敗、210同風況成功，離線發現見 [trace 調查](../research/stage5-trace-findings-2026-10-11.md)。需要更多訊號時：\n\n```matlab\nclear compare_training_checkpoints\nrehash\nroot=fileparts(which(\"compare_training_checkpoints\"));\nsession=fullfile(root,\"experiments\",\"progressive_v1\",\"runs\", ...\n    \"20261010_224522_recovery_tpc1c4f06e\");\ndetail=compare_training_checkpoints(session,episodes=21600,includeLatest=false, ...\n    stages=[4 5],seeds=[205 207 210],diagnostics=true);\ndisp(detail.outputDir)\ndisp(jsonencode(detail.results,PrettyPrint=true))\n```\n\n共6次完整CPU純模擬。`diagnostics=true` 在系統暫存資料夾建立同名 SLX 副本，只在記憶體中啟用14路 signal logging，不改 chart 或控制演算法、不存回原模型。每個 trace 新增 `diagnostics` Dataset，記錄 E/N位置、psi/phi、完整 planner path、window path/valid/loiter/target distance、guidance target E/N、d、delta_psi、heta。完整可變長度路徑可能增加檔案大小；僅對指定少數情境使用。\n\n以 [MathWorks sim 文件](https://www.mathworks.com/help/reinforcement-learning/ref/rl.env.rlfunctionenv.sim.html) 的 `experience.SimulationInfo(1)` 取得 SimulationOutput 內的訊號資料。報告保留訊號來源 block/port；缺少必要訊號直接失敗，不以空紀錄冒充完成。這仍未直接記錄 guidance 內部 current_index/is_inside；可用實際位置及輸出路徑離線核對幾何，但有歧義時不能自行假定內部分支。\n\n請先將這次6個 reward/steps與原始205/207/210的結果比較；若不一致，須調查重播差異再推論失敗原因。最後將新的 evaluation 資料夾壓縮分享，包含新增 diagnostics 的 traces，無需 checkpoint。本機没有21600 agent，因此完整實驗室重播仍需在實驗室執行。\n\n2026-10-11 本機 `tests/test_evaluation_diagnostics.m` 通過：同 checkpoint、seed、random 路徑分別做一般與 diagnostics 模式各110步 CPU純模擬，reward、observation、action逐值完全一致；取得14路訊號並跨過約9.9秒的週期更新，原SLX SHA256不變。這不是21600實驗室模型的完整重播驗證。\n"},{"file":"guides/stage6-candidate-review.md","name":"stage6-candidate-review.md","title":"33700 / 41600 額外情境比較","group":"操作與設定","text":"# 33700 / 41600 額外情境比較\n\n先前45次評估全部跑滿，Stage6十組平均reward為33700最高，但不能宣稱已合格。\n保持訓練暫停，更新Git後在MATLAB根目錄執行：\n\n```matlab\nclear compare_training_checkpoints review_stage6_candidates\nrehash\nsession=fullfile(pwd,\"experiments\",\"progressive_v1\",\"runs\", ...\n    \"20261014_000404_recovery_tp3b623159\");\nbatch=review_stage6_candidates(session);\ndisp(batch.summaryZip)\n```\n\n預先指定seeds401:420，Stage4/5/6各40次，共120次CPU純模擬；相同seed對應\n相同路徑，按各階段風場規則設定風。不是額外訓練，無自動選擇模型或修改過關條件。\n內部turbulence seeds仍固定，不宣稱120個獨立噪音實驗或完整泛化驗證。\n\n新增 `routeMetrics=true` 僅在暫存SLX記錄東/北位置，避免完整planner訊號的大量檔案。\n每條result的route_metrics是位置到原始路線**有限線段**的最近水平距離（公尺），\n由幾何獨立計算，不使用guidance_d或reward倒推。\n同時提供所有樣本及t>=10秒的RMS、最大值、nearest-rank P95、10m內樣本比例。\n保留起始位置偏差，不把前10秒排除後的值冒充全程結果。10m只是描述性指標，\n尚未訂為通過門檻；最近線段距離在路線交叉時可能對應其他路段，不證明沿路線\n單調前進、整條路線完成或高度控制合格。提早終止的短軌跡也可能RMS很低，必須\n與steps/environment_done一起判讀。空的10秒後區間在JSON中數值為null，不是0。\n\n完成後分享顯示的Summary ZIP（只有JSON），完整MAT保留在實驗室。每個階段\n完成即保存結果；若出錯，貼錯誤與batch.json，勿立刻重跑整批。新種子結果也\n只是比較證據，需先討論明確物理驗收要求才能宣布合格。\n\n本機驗證：有限線段端點、重複路點與10秒區間的合成測試通過；實驗室提供的\n31600 checkpoint 在Stage6 seed401完成20步CPU純sim，位置記錄、幾何指標及JSON\n寫出成功，checkpoint與權重通過評估器不變檢查。這不代替33700/41600的完整\n120次實驗室評估，也不是訓練收斂或完整路程驗證。\n"},{"file":"guides/stage6-finetune-33700.md","name":"stage6-finetune-33700.md","title":"33700 分支：小學習率續訓","group":"操作與設定","text":"# 33700 分支：小學習率續訓\n\n使用者於2026-10-14提供額外120次評估，要求本輪可繼續啟動訓練。\n來源是 `20261014_000404_recovery_tp3b623159` 的 Agent33700.mat，\n不是最新Agent_Final，也不是原始31600父實驗。\n\n## 選擇依據與限制\n\nseeds401:420、每階段20組配對，全120次皆3000步、environment_done=false，\n三份報告complete、weights_unchanged=true，使用同一空間循跡SLX。\n\n|階段|33700平均reward|41600平均reward|33700平均路徑RMS(m)|41600平均路徑RMS(m)|\n|---|---:|---:|---:|---:|\n|4|3049.48|3023.91|2.231|2.610|\n|5|3020.17|3002.30|3.424|3.703|\n|6|2943.55|2933.93|7.014|7.022|\n\nRMS為各情境t>=10秒原始有限折線距離RMS的平均，不是全程或pooled RMS。\nStage6此區間的跨情境最大偏離33700為23.968m、41600為27.940m。\n33700分數較高的配對數為20/20、17/20、14/20；Stage6距離較低只有11/20，\n兩者該階段平均距離很接近。這是有限樣本候選選擇，不是證明33700全域最佳或合格。\n\n選33700作保留起點，新分支actor LR由2.5e-5改為1.25e-5，critic及其他PPO\n設定沿用；減半是待驗證的工程試驗，不是已證實學習率過大，也不保證改善。\n與前段不同訓練情境、隨機序列混在一起，不能僅以曲線差異證明LR因果。\nreward、環境、Stage6門檻不改。評估高分不能直接寫成課程完成。\n\n## 啟動\n\nPowerShell先 `git pull --ff-only`，MATLAB於專案根目錄執行：\n\n```matlab\nclear prepare_recovery_training retry\nparentSession=fullfile(pwd,\"experiments\",\"progressive_v1\",\"runs\", ...\n    \"20261014_000404_recovery_tp3b623159\");\nfine=prepare_recovery_training(parentSession,\"configs/recovery_33700_finetune.json\");\ninfo=retry(resume=fine.sessionDir);\ndisp(info.sessionDir)\n```\n\n準備程式會核對環境SHA、來源LR、checkpoint回合與停止鎖，保留權重，\n建立全新run；只有retry啟動訓練。父實驗與41600保留，不覆蓋或手動解鎖guard。\n硬體沿用父control（目標6 workers、允許可用數量及GPU設定，以實際log為準）。\n每段100回合，新增最多3000：從33701至36700。這是新分支，終點小於舊分支41600\n是正常的；圖表沿父資料只保留到33700，舊分支後續仍在原資料夾。\n\n保留既有退步guard，但它要求reward和steps同時大幅降低，不能偵測所有循跡\n品質退步。預算或guard暫停就保留暫停，再比較新分支候選與來源33700。\n不自動追加預算、不承諾達到2700或課程合格。新的3000回合不在本機代跑。\n"},{"file":"guides/stage6-progress-training.md","name":"stage6-progress-training.md","title":"Stage 6：按飛機進度提供前方路段","group":"操作與設定","text":"# Stage 6：按飛機進度提供前方路段\n\n使用者於 2026-10-13 明確選擇「沿指定路徑穩定飛行，可依飛機進度更新路段」。本版本是空間循跡環境，不是原本按時間推進 15 m/s 的移動目標追蹤。歷史 Stage 完成紀錄保留，但不能當作新環境已完成整套資格驗證。\n\n## 修正範圍\n\n- guidance 的歷史路徑只取有效的 `path_length`，避免未填入的零列形成通往原點的虛假線段。\n- WindowManager 用目前位置在局部路段上的最近 waypoint 更新單調前進的索引，不再每個取樣無條件前進一點。搜尋限於目前索引往前一個 window，避免任意跳到整條路線的遠端。\n- 目前 window 為 100 點、間隔 1.5 m。在距離段尾約 40 個 waypoint 時，提早提供下一段連續的 100 點；新舊段共享端點，讓規劃器原有 `last_point` 接段方式保持連續。第一個重疊 window 候選會退步，沒有部署。\n- 不更動 reward 公式、50 m 終止門檻、動作範圍或 PPO 學習率。但誤差幾何與路徑更新環境改變，前後 reward 不能全解讀為 agent 學習改善。\n- 此版本不提供按原時序移動的目標或原 loiter 行為。僅發送完整路段；末尾不足一段時保留最後有效路段。3000 步完成不等於到達整條軌跡終點。\n\n## 實驗室續訓\n\n先確認原實驗仍為 paused，且沒有評估／訓練使用這份 runtime。PowerShell：\n\n```powershell\ncd D:\\daniel\\ModularTraining\ngit pull --ff-only\n```\n\nMATLAB（只準備一次新分支）：\n\n```matlab\ncd D:\\daniel\\ModularTraining\nclear prepare_recovery_training retry\nrehash\nif bdIsLoaded('FAFA_Simulation'), close_system('FAFA_Simulation',0); end\nroot=fileparts(which('retry'));\nparentSession=fullfile(root,'experiments','progressive_v1','runs', ...\n    '20261012_080431_recovery_tpfaf0be04');\nnext=prepare_recovery_training(parentSession, ...\n    fullfile(root,'configs','recovery_31600_progress_window.json'));\ninfo=retry(resume=next.sessionDir);\ndisp(info.sessionDir)\n```\n\n從 Agent31600 開始，沿用 Stage 6 位置及 actor LR 2.5e-5，每段 100 回合，最多新增 10000 回合至 41600。課程達標或 guard 觸發可以提前停止。硬體沿父 control（目標 6 workers、GPU；以實際 pool_ready 為準）。配方核對正式 SLX SHA，避免只複製 JSON 卻使用舊模型。\n\n新分支保留繼承來源；不刪除原 guard，不覆盖父 checkpoint。診斷 ZIP 子集不可拿來直接續訓。此指令應在保存完整父實驗的實驗室執行。\n\n## 進度與後續驗收\n\n```matlab\ns=jsondecode(fileread(fullfile(info.sessionDir,'status.json'))); disp(s)\ntype(fullfile(info.sessionDir,'curriculum_state.json'))\nf=fullfile(info.sessionDir,sprintf('attempt_%05d',s.attempt),'stdout.log');\nif isfile(f), t=splitlines(string(fileread(f))); disp(join(t(max(1,numel(t)-29):end),newline)); end\n```\n\nStage 6 從 22400 起算；最低 10000 回合最早在 32400 到達，還必須同時滿足原有連續窗口 reward / 完成率條件。不要只憑本次純模擬通過便稱模型合格；續訓完成後仍需保存新 checkpoint，再做所有階段與新情境評估。若 `suspected_regression` 暫停，保持暫停，不直接解除。\n\n正式環境評估使用 `guidanceVariant=\"baseline\"`，表示當下正式 SLX。候選转换函式拒絕重複套用；舊版來源 fixture 僅供測試。結果與限制見 [驗證紀錄](../records/stage6-progress-validation-2026-10-13.md)。\n"},{"file":"guides/stage6-reward-review.md","name":"stage6-reward-review.md","title":"41600 暫停後的配對評估","group":"操作與設定","text":"# 41600 暫停後的配對評估\n\n本批次使用既有空間循跡環境，驗證 SLX SHA256，並比較同一 run 中的\nAgent31600、Agent33700、Agent41600。缺檔即停止，不以其他 checkpoint 代替。\n評估不訓練、不解除 guard、不修改 checkpoint 或正式 SLX。\n\n在實驗室訓練已暫停後，先於 PowerShell 的專案根目錄執行\n`git pull --ff-only` 更新工具，不需要手動傳送或解壓工具 ZIP。\n確認模型視窗已關閉，再於 MATLAB 的專案根目錄執行：\n\n```matlab\nclear compare_training_checkpoints audit_training_rewards review_stage6_checkpoints\nrehash\nsession=fullfile(pwd,\"experiments\",\"progressive_v1\",\"runs\", ...\n    \"20261014_000404_recovery_tp3b623159\");\nbatch=review_stage6_checkpoints(session);\ndisp(batch.summaryZip)\n```\n\n共 45 次 CPU 純模擬：Stage 6 seeds 201:210 的 30 次配對、seeds 202/205\n的 6 次 reward 分解、前三階段 seed 101 的 9 次保留能力檢查。\n每次上限 3000 步，時間依電腦而異；不是 45 回合訓練。\n重複的詳細案例用來拆解 reward，不當成新的獨立樣本。\n\n批次輸出位於 run/reports/stage6_review_\u003c時間>_\u003c唯一碼>/。\n完成後顯示的 ZIP 只有五個 JSON，適合先分享；完整 MAT traces 留在各\nevaluation 資料夾。ZIP 不是可續訓備份。發生錯誤時，已完成評估與 batch.json\n仍保留，先提供錯誤及 manifest，不必重跑已完成的模擬。\n\n以同 seed 的 reward、步數與逐項 reward 差異判讀，不用不同環境的訓練曲線\n證明學習改善。observation7 是正規化訊號，不直接稱為公尺；詳細診斷保留\nguidance 與原始路徑，可另核對物理距離。這批固定種子的結果不等於正式合格。\n\n本次更新只涉及評估工具、測試與說明，不修改 runtime、課程設定、模型或\n訓練資料。先前提供的工具 ZIP 已不需要；評估完成後產生的結果 ZIP 才是\n要分享的資料。若實驗室有未提交修改導致 Git 拒絕更新，先保留並比對差異，\n不要用 reset --hard 覆蓋。\n"},{"file":"guides/startup-path-fix.md","name":"startup-path-fix.md","title":"路徑首次初始化修正","group":"操作與設定","text":"# 路徑首次初始化修正\n\n`runtime/FAFA_Simulation.slx` 的 OBSERVATION/MATLAB Function3 (WindowManager) 原本只在 `mod(buffer_counter, window_length)==0` 發出有效訊號。window_length=100、取樣0.1秒，導致前99次呼叫的planner只有一點路徑，guidance回傳預設零誤差。\n\n修正為：\n\n```matlab\nif buffer_counter == 1 || mod(buffer_counter, window_length) == 0\n    valid_flag = true;\nend\n```\n\n此條件仍位於「剩餘點數足夠構成完整window」的分支內，不改輸入長度要求、之後更新週期、reward、終止門檻或agent設定。SLX封裝逐項比較確認只有chart_60.xml的這一行改變，其餘entry內容一致。\n\n## 相容性\n\n這是環境行為改變，不是checkpoint格式變更。舊agent仍可載入，但舊環境的分數與新環境不能直接視為同一測試；evaluation.json的model_sha256會不同。既有curriculum快照、checkpoint、guard狀態均不修改，不自動開始訓練。\n\n實驗室保持paused，更新後先評估：\n\n```matlab\nclear compare_training_checkpoints\nrehash\nevaluation = compare_training_checkpoints(info.sessionDir, ...\n    episodes=[10600 10700],includeLatest=false,stages=[1 2 3]);\ndisp(jsonencode(evaluation.results,PrettyPrint=true))\n```\n\n這是目前修正版環境的CPU評估，不是舊環境重現。若FAFA_Simulation已開啟，先確認沒有未存修改；評估工具會拒絕使用已開啟的模型，避免覆寫。\n\n## 驗證\n\n`tests/test_window_startup.m` 由實際SLX載入Stateflow函式並直接執行，確認有效呼叫為[1,100,200]、每次window正確切片，短於window的路徑維持無效。不啟動訓練。\n\n本機使用實驗室傳回的10600／10700，原版與修正版各做一次直線CPU sim，seed101、無探索、上限200步。原版在獨立暫存模型副本執行，四次均驗證來源checkpoint雜湊及actor/critic權重不變。\n\n|Checkpoint|原版步數／reward|修正版步數／reward|\n|---|---:|---:|\n|10600|200 / 188.5240|200 / 175.3604|\n|10700|133（IsDone）/ 116.4940|200 / 145.2127|\n\n原版10700重現實驗室133步結果。修正版10700在200步內未提前終止，不能推論已能完成3000步或修好長期收斂；10600的短段reward沒有上升。兩版初始路徑行為不同，分數變動不單獨代表模型更好。原始A/B結果及MAT保存在本機忽略目錄diagnostic_packages/startup_ab.json及startup_v*_ep*.mat。\n\n初始化缺陷修正不等於已修復PPO學習退步；不能據此解除guard或覆蓋原實驗續訓。調查背景見lab-trace-findings-2026-10-10.md。\n\n## 實驗室3000步上限評估回報\n\n使用者提供 evaluation_20261010_200516_tpa46ecfc4 的完整輸出，六項評估完成（seed101，CPU，確定策略）。10600直線/S彎/固定轉彎步數3000/3000/1578，reward3101.85/3184.58/1387.23；10700步數3000/3000/1589，reward2530.87/2686.42/1413.17。\n\n對照原版10700的133/134/133步，初始化修正消除了這組固定條件下的早期失敗。應修正之前把它概括為舊任務能力完全遺失的說法：相同權重在修正版仍可完成直線/S彎，原版的啟動行為是失敗的重要因素。但10700仍有較低reward，直線/S彎observation7 RMS為0.67378/0.65355，相比10600的0.18496/0.12763高；依已驗證d/30映射，模型路徑誤差RMS約20.21/19.61m對5.55/3.83m。兩者第三階段仍未完成，不能宣稱退步或課程難度問題全部解決。\n\n優先保留10600作為下一次獨立試驗候選，不直接resume暫停分支最新11000。若續訓需建立新run並記錄修正版模型雜湊，保留舊環境資料；本回報不代表已授權啟動訓練。此次新trace尚未傳回本機，不能假設固定轉彎仍由相同終止條件觸發。\n\n## 新實驗配方與 JSON 的位置\n\n使用者後續決定另開實驗。`configs/recovery_startup_fix.json` 指定从第一個 recovery 分支10600接續，要求來源actor LR=2.5e-5、scale=1，不再減半；100回合/段、新增上限1000，保留原guard規則與父control的硬體設定。prepare仍不啟動，正式執行由使用者呼叫retry。\n\n```matlab\nclear prepare_recovery_training retry\nparentSession = fullfile(pwd,\"experiments\",\"progressive_v1\",\"runs\", ...\n    \"20261010_155437_recovery_tpebed29a8\");\nfresh = prepare_recovery_training(parentSession,\"configs/recovery_startup_fix.json\");\ninfo = retry(resume=fresh.sessionDir);\n```\n\n共用課程仍是 experiments/progressive_v1/curriculum.json。新run複製父實驗的curriculum.json和assets快照，從10600所屬stage3接續；curriculum_state.json仍留在新run中，不會寫回共用課程或重跑stage1。這是接續學習的新run，不是新隨機初始化的agent。\n\n新run的control.json繼承硬體、model.json記錄不變學習率、recovery.json記錄來源和準備當下的runtime模型/引擎SHA256。SHA只記錄準備時版本，不是隔離整份runtime；之後仍不得在活動訓練期間更新runtime。沿用歷史時guard亦會參考同stage舊歷史，這是保守停止規則，不是新舊環境分數完全可比的證據。\n\n## 從11600跨夜接續\n\n使用者選擇新增10000回合（不是5000），維持人工共同評估，合格後再整理純腳本從頭重跑驗證。11600在修正版直線/S彎均3000步、固定轉彎2673步，支持繼續嘗試但尚未合格。\n\n`configs/recovery_11600_overnight.json` 從新環境分支11600另開run，LR不變、100/段、總上限21600，保留guard及課程過關/暫停規則。回合數不是保證運行時數；可能因退步、課程暫停或錯誤提前停止。啟動前更新，啟動後不要更新runtime。\n\n```matlab\nclear prepare_recovery_training retry\nparentSession = fullfile(pwd,\"experiments\",\"progressive_v1\",\"runs\", ...\n    \"20261010_201201_recovery_tp0241db13\");\novernight = prepare_recovery_training(parentSession,\"configs/recovery_11600_overnight.json\");\ninfo = retry(resume=overnight.sessionDir);\ndisp(info.sessionDir)\n```\n\n自動依課程切換不等於新增獨立評估迴圈；本次仍用現有訓練歷史條件與guard，不自動改參數、回滾或無限擴增預算。\n"},{"file":"guides/training-plan-v1.md","name":"training-plan-v1.md","title":"漸進式 UAV 訓練流程 v1","group":"操作與設定","text":"# 漸進式 UAV 訓練流程 v1\r\n\r\n目標是讓同一個 PPO agent 先學穩定追蹤，再處理轉彎、陌生路徑與風擾。可執行設定是 `experiments/progressive_v1/curriculum.json`；這是一份待實驗校準的起始方案，不保證收斂，也不是論文參數的精確重現。\r\n\r\n## 六個階段\r\n\r\n全程沿用 `ppo_lstm128` 的網路與超參數，避免同時改架構、學習率與任務，讓結果比較容易解釋。第一輪先確認課程本身的效果，再另開實驗比較穩定版 profile。\r\n\r\n| 階段 | 路徑與環境 | 至少回合 | 平均 reward | 其他條件 | 階段上限 |\r\n| --- | --- | ---: | ---: | --- | ---: |\r\n| 1 | MAT 直線、無風 | 2,000 | ≥1,200 | 平均步數 ≥1,500 | 25,000 |\r\n| 2 | MAT 平緩 S 彎、無風 | 3,000 | ≥1,800 | 平均步數 ≥2,100 | 20,000 |\r\n| 3 | 內建固定轉彎、無風 | 3,000 | ≥2,000 | 平均步數 ≥2,300 | 20,000 |\r\n| 4 | 隨機路徑、無風 | 5,000 | ≥2,200 | 平均步數 ≥2,500 | 30,000 |\r\n| 5 | 隨機路徑、東／北風各 −1～1 m/s、擾動 0～1 | 5,000 | ≥2,400 | 平均步數 ≥2,700 | 30,000 |\r\n| 6 | 隨機路徑、東／北風各 −3～3 m/s、擾動 0～2 | 10,000 | ≥2,700 | 跑滿 3,000 步比例 ≥80% | 40,000 |\r\n\r\n每項表現條件都要求最近三個各 100 回合、不重疊的區間分別達標，且必須滿足最低回合數。每階段到上限仍不達標便保存、暫停，不強迫升級。總預算最高 165,000 回合，並非一定要跑滿；理論最少 28,000 回合。步數是持續模擬的代理指標，不等於任務成功率。這些數值是初始工程假設，尚未以長訓練校準；尤其不同路徑的 reward 分布可能不同。\r\n\r\n第一階段保留較長探索時間，避免把從零開始的低分誤判成退步。第三階段才加入現有固定路徑的較急轉彎，避免把「固定」誤認為「簡單」。隨機路徑每個 worker 本地每 10 回合更新，程序重啟會重置本地計數。\r\n\r\n這個分解方向也與 MathWorks 的 [PPO curriculum 範例](https://www.mathworks.com/help/reinforcement-learning/ug/train-ppo-for-lka-using-curriculum-learning.html)一致：逐步增加路徑曲率，並另外做評估。但其車輛任務的 reward 門檻不能直接套到 UAV。本計畫不是花偉傑論文第一階段路徑的還原；論文背景及原本實作的差異見既有審視紀錄。\r\n\r\n## 準備與啟動\r\n\r\n在 MATLAB 切到專案根目錄：\r\n\r\n```matlab\r\ninputs = prepare_progressive_training();\r\ninfo = retry(curriculum=inputs.planFile, workers=4, minWorkers=1, ...\r\n    device=\"cpu\", checkpointEvery=100, episodesPerProcess=1000, start=false);\r\n% 檢查 info.sessionDir 中的 model.json、control.json、curriculum.json 後，\r\n% 準備正式訓練時才自行執行下一行：\r\n% info = retry(resume=info.sessionDir);\r\n```\r\n\r\n準備函式建立 6 km 的直線與平緩 S 彎，15 m/s、0.1 秒取樣、70 m 高度，並驗證 JSON。既有 MAT 若內容不同，會拒絕覆寫。它不啟動訓練。兩台電腦都執行同一函式即可重建輸入；MAT、完整日誌與 checkpoint 不納入 Git。\r\n\r\n4 workers 是可調整的起始上限，不是已測出的最佳值。可改為 6，仍以當次可用的 n 個 workers 執行；最低 1。此版本本機短測試使用 CPU／1 worker，多 worker 吞吐與 GPU 須另外驗證。正式訓練前檢查授權、RAM 與磁碟空間；每 100 回合存檔在整份預算中可能產生約 1,650 個定期 checkpoint，另有分段存檔，尚無自動保留／清理政策。\r\n\r\n條件在分段存檔邊界評估，`episodesPerProcess=1000` 代表可能達標後仍多跑到該段結束，並非每 100 回合定期 checkpoint 都立刻換階段。可縮小分段長度換取更快切換，但會增加 MATLAB／pool 重啟成本。上限會限制當段剩餘回合，不會無限重試學習。\r\n\r\n首次正式實驗建議先觀察第一個 1,000 回合區間的 episode 長度、失敗原因、wall time 和記憶體；低 reward 本身不足以宣告失敗。後續比較需同時看環境步數與時間，不只回合數。不要從三回合短測試推算收斂或可靠的長跑速度。\r\n\r\n## 退步與階段交接\r\n\r\n已實作：沿用 checkpoint 與模型權重、階段內統計、連續區間門檻、預算用盡暫停，以及匯出報告時的疑似退步診斷。課程切換後不拿上一種任務的高分直接當新任務基準。\r\n\r\n尚未實作：持續背景監測、自動因退步停訓／回滾、獨立評估選最佳 checkpoint，以及每階段學習率／探索量排程。不能把本計畫當成已具備這些能力的無人值守系統。現在可定期執行 `export_training_report.py \u003csession> --machine lab` 或 `dorm`，分享小型報告；診斷規則見 `learning-health.md`。\r\n\r\n若同一階段先學會、之後長期變差，先保存目前狀態與報告，確認任務、worker 數、重啟與 checkpoint 接續是否改變，再比較退步前後 checkpoint 的相同測試任務。不要僅依 reward 曲線直接降低 learning rate，或不保留證據就覆寫／回滾 agent。到階段預算而暫停時也應先檢查資料；不要手改實驗內的課程快照來繞過門檻。\r\n\r\n下一項建議實作是獨立 evaluator：固定一套未參與訓練的路徑、風場及 seeds，先用約 20 個平衡測試回合，比較追蹤誤差、失敗率與回合長度，再決定是否升級／保留最佳模型。評估時不更新權重，且需確認使用評估策略。MathWorks 提供 [rlEvaluator](https://www.mathworks.com/help/reinforcement-learning/ref/rl.evaluation.rlevaulator.html)；整合前仍須核對本機 R2024b API 與並行限制。訓練 reward 過關僅是目前可執行的第一層門檻。\r\n\r\n研究比較最好重複獨立 seeds，但目前 seed 由 attempt 推導，尚無可設定的實驗 root seed；重跑相同設定不能直接聲稱是獨立 seed 實驗。需先補上 seed 入口與記錄，再比較多次結果。\r\n\r\n## 雙機與修改規則\r\n\r\nGit 同步程式、JSON、文件與精簡報告。完整可續訓實驗要另外搬移 checkpoint 與相關快照，並核對 control.json 的本機路徑。任何 runtime 更新前確認該副本沒有活動訓練。已建立的實驗使用自己的課程與輸入快照，修改原始 JSON 不會改掉它；調整門檻應建立新版本與新實驗，現階段尚無正式的跨計畫 checkpoint 匯入功能。\r\n"},{"file":"guides/training-plan-v2.md","name":"training-plan-v2.md","title":"Progressive v2：在空間循跡環境從頭訓練","group":"操作與設定","text":"# Progressive v2：在空間循跡環境從頭訓練\r\n\r\n> 2026-10-15 校準註記：下表 reward 門檻仍為未校準草案，不能作為 reward v2 的正式升級門檻。新候選目前只供離線重計分，未部署 SLX；遠端設定保持 start=false。公式、證據與限制見 [reward 校準](../research/reward-calibration-v2.md)。\r\n\r\n2026-10-15 使用者明確指定本課程改用 schema 2、`environment: spatial_v2`。新 run 使用新版 reward 並保存環境快照；既有 spatial_v1 run 不改寫。\r\n\r\n使用獨立的 [spatial_v2 SLX](spatial-v2.md)，不更改共用 runtime SLX。下列課程數值維持原規劃，尚未經新 reward 從頭訓練校準，不代表保證過關或合格。\r\n\r\n2026-10-14 使用者確認另建 progressive_v2，供新 agent 從第一階段開始訓練。設定在 `experiments/progressive_v2/curriculum.json`，不接續 recovery checkpoint；階段之間則始終沿用同一 agent。這是可由現有 schema 執行的起始方案，尚未進行從頭訓練或校準門檻。\r\n\r\n## 環境與模型\r\n\r\n從第一回合使用目前正式空間循跡環境：首次有效 window、末端 lookahead v2、有效歷史路徑、依飛機局部單調進度更新路段。無風與有風都適用；任務是沿指定路徑飛行，不是追蹤按原時序移動的目標。reward 改用 spatial_reward_v2，終止門檻不變。\r\n\r\n`spatial_v1` 的模型 SHA256 為 `495afb97a9fa463b4500d168909ea28f649a12912f12c0631ec1e85b93c1b6be`。環境 manifest 與 run 副本會核對此 SHA；共用引擎和工具箱版本仍須另記錄。現有 31600 的評估不能替代新 agent 的從頭收斂驗證。\r\n\r\n模型仍為 `ppo_lstm128`。目前 profile 的 actor LR 是 5e-5、critic LR 是 1e-4；新 agent 不會自動繼承 recovery 的 actor LR 2.5e-5。先保留基準 profile，因先前退步涉及環境問題，尚無證據證明從零訓練必須減半 LR。本次不更動 PPO、網路或 runtime。\r\n\r\n## 八階段設定\r\n\r\n所有 reward、平均步數、跑滿比例條件，都要求最近三個不重疊的 100 回合區間各自達標，並同時滿足最低回合數。跑滿定義為步數 ≥3000，不是獨立的任務成功旗標。\r\n\r\n| 階段 | 路徑 | 東／北風各自範圍 m/s | turbulence 等級 | 最低回合 | reward 平均 | 步數平均 | 跑滿比例 | 回合上限 |\r\n| --- | --- | --- | --- | ---: | ---: | ---: | ---: | ---: |\r\n| 1 | 直線 MAT | 0 | 0 | 2000 | 1200 | 2700 | 80% | 25000 |\r\n| 2 | 平緩 S 彎 MAT | 0 | 0 | 3000 | 1800 | 2750 | 85% | 20000 |\r\n| 3 | 內建固定轉彎 | 0 | 0 | 3000 | 2000 | 2800 | 90% | 20000 |\r\n| 4 | 隨機路徑 | 0 | 0 | 5000 | 2200 | 2800 | 90% | 30000 |\r\n| 5 | 隨機路徑 | −1～1 | 0 | 2000 | 2200 | 2800 | 90% | 15000 |\r\n| 6 | 隨機路徑 | −1～1 | 0～1 | 3000 | 2200 | 2800 | 90% | 20000 |\r\n| 7 | 隨機路徑 | −3～3 | 0～1 | 5000 | 2200 | 2800 | 90% | 25000 |\r\n| 8 | 隨機路徑 | −3～3 | 0～2 | 10000 | 2200 | 2900 | 95% | 40000 |\r\n\r\n最低回合合計 33000，預算合計 195000；不是耗時預測，也不要求跑滿上限。每階段未達標用盡預算都 pause。若同時達標及到上限，現有引擎優先判定通過。\r\n\r\n風速及 turbulence 是現有實作的整數抽樣範圍，turbulence 等級不是 m/s。每回合抽樣，因此強風階段也含無風／低風樣本。隨機路徑保留每 worker 本地每 10 回合更新，避免同時更動課程與抽樣頻率；重啟會重設本地計數。\r\n\r\n## 與 v1 的差異及理由\r\n\r\n- 保留前三種固定幾何與第四階段無風隨機路徑，先建立能力再處理路徑變化。直線與 S 彎使用與 v1 相同的可重建幾何，但資產獨立放在 v2。\r\n- 風擾從兩階段拆成四階段：先加入小風，再增加 turbulence，再擴大平均風範圍，最後提高 turbulence 上限。每次只更動一類風場設定，並不保證任務難度線性增加。\r\n- 所有階段加入跑滿比例，並提高前段平均步數門檻，避免少數長回合拉高平均後過早升級。仍保留逐漸提高的前段最低回合數，尚不根據舊分支歷史縮短基礎訓練。\r\n- 隨機階段 reward 下限統一暫定 2200，不再隨風加大而要求更高 reward。v1 的 2400／2700 尚未在一致的新環境校準；2200 同樣只是暫定品質下限，不能視為經驗證的循跡誤差標準。\r\n- 最終跑滿比例由 v1 的 80% 提高到 95%，配合平均步數 2900。但仍可能有 5% 提前終止，且未對最強風子群單獨判定，不能稱為整體合格。\r\n\r\n## 準備與預檢（不訓練）\r\n\r\n在專案根目錄的 MATLAB 執行：\r\n\r\n```matlab\r\ninputs = prepare_progressive_v2_training();\r\n% 只生成 v2/assets 的直線及 S 彎，並呼叫 curriculum_plan 驗證。\r\n```\r\n\r\n函式不建立 run、agent 或 pool。既有 MAT 內容不同時拒絕覆寫。MAT 不納入 Git，兩台電腦各自生成。舊的 `prepare_progressive_training()` 與 `configs/lab_gpu6.json` 仍指向 v1，不會自動切到 v2。\r\n\r\n若僅閱讀尚未生成 MAT 的計畫，可執行：\r\n\r\n```matlab\r\nplan = curriculum_plan(\"experiments/progressive_v2/curriculum.json\",checkFiles=false);\r\n```\r\n\r\n未來另行準備正式 run 時，應明確指定這份課程、3000 步 episode 上限、checkpointEvery=100、episodesPerProcess=100，以及當時確認的硬體設定。100 回合一段讓條件在較近的保存邊界評估，也有重啟／建池成本。硬體和分段參數不是 curriculum schema 欄位。本次僅規劃及無訓練預檢，不建立正式 run、不啟動訓練。\r\n\r\n## 獨立評估與合格判定\r\n\r\nJSON 的門檻只看 checkpoint 保存的訓練歷史，通過後會由現有引擎自動換階段；沒有人工審核 gate，也不會自動啟動獨立評估。不可把下面的規劃當作已接入引擎的功能。\r\n\r\n未來至少在無風隨機、小風含擾動、完整風三個里程碑保存並評估 checkpoint。以預先固定、不同於訓練抽樣的情境測試，對前期固定任務做能力保留檢查，並分開列出無風、小風、強風及各 turbulence 等級的結果；不以含大量低風樣本的整體平均掩蓋強風失敗。比較 checkpoint 時使用相同情境配對。\r\n\r\n除了跑滿比例和 reward，需查看獨立原始路線距離的 RMS、尾端偏差及終止原因證據。初始 t=0 偏差與後續飛行需分開報告，不能把初始瞬間最大值直接當穩態表現。距離品質門檻目前尚無經確認的需求，不能在 JSON 虛構不支援的 CTE metric。需要人工評估後才允許升級的話，須另做引擎功能，不在這次規劃範圍。\r\n\r\n本課程也不自動建立 recovery 專用 training_guard、不回滾、不選最佳模型。既有 recovery 的停訓機制不能假設會由這份 JSON 自動繼承。新環境下若低分，先核對 traces、版本及獨立評估，再決定是否調整下一版門檻或學習參數；已建立 run 的快照不直接改寫。\r\n\r\n## 遠端執行安排\r\n\r\n使用者確認正式訓練主要在遠端電腦，本機可先測試。`configs/lab_gpu6_progressive_v2.json` 沿用先前遠端 GPU、最多 6 workers／最低 1 worker 的設定，改用 v2、100 回合一段，並明確設置 `start:false`。這是遠端預檢配方，尚未驗證遠端 GPU 或多 worker 執行。\r\n\r\n確認遠端副本沒有活動訓練，依環境更新指南先保存舊 run 的當地環境，再同步包含這次新增檔案的提交。遠端在專案根目錄執行：\r\n\r\n```matlab\r\ninputs = prepare_progressive_v2_training();\r\ncfg = jsondecode(fileread(\"configs/lab_gpu6_progressive_v2.json\"));\r\nargs = namedargs2cell(cfg);\r\ninfo = retry(args{:}); % start=false，只建立新 run 設定快照\r\ndisp(info.sessionDir)\r\n```\r\n\r\n每次重跑 retry 都建立另一個新 run，請保存 sessionDir。正式開始時另行確認環境版本及快照，再對該 sessionDir 執行 resume；目前不需啟動。MAT 由遠端自行生成，無需複製本機絕對路徑。這裡的步驟不包含純腳本重寫，沿用目前 MATLAB／Simulink 引擎。\r\n\r\n## 本次驗證\r\n\r\n2026-10-14 在本機 MATLAB R2024b 通過八階段 schema 與實際 MAT 載入檢查；連續執行兩次準備函式確認輸入可重用。各階段以合成歷史確認：達標可 advance、最低回合不足維持 continue、三個區間中任一區間跑滿比例不足維持 continue、預算用盡且不達標會 pause。未建立訓練 run、pool 或執行 sim/train，不能視為收斂驗證。\r\n\r\n參考：[從頭訓練決定](../records/from-scratch-training-decision-2026-10-14.md)、[空間循跡驗證](../records/stage6-progress-validation-2026-10-13.md)、[課程 schema](curriculum.md)。\r\n"},{"file":"guides/training-progress-display.md","name":"training-progress-display.md","title":"課程進度顯示（2026-10-18）","group":"操作與設定","text":"# 課程進度顯示（2026-10-18）\n\nReward 圖會保留橘色 stage 分界，在 N 與 N+1 之間畫線，標明 N 是上一階段最後回合、N+1 是下一階段第一回合。來源是 run 保存的課程歷史，沿用 lineage 裁切；不根據 reward、課程預算或圖形位置推測切換。\n\n圖下新增進度面板，列出該 run 快照中的目前條件：stage episodes、reward mean、steps mean、full-length rate 的指定步數與比例門檻、每區間回合數、連續達標區間數，以及 PASS/WAIT。ANY 只需其中一組通過，ALL 需全部通過。最後階段目標顯示 complete course；已保存成功 outcome 顯示 COURSE COMPLETED。\n\n`training_status(sessionDir)` 同樣列出切換、目前條件、未達原因、資料截至回合與正式 outcome。MATLAB 狀態工具沿原 parent 路徑或同層唯一同名目錄讀取祖先；Python 圖表另支援 `--lineage-root`。搬移後找不到祖先時，不補造數據。\n\n```matlab\ntraining_status(info.sessionDir);\n```\n\n```powershell\npython plot_training_rewards.py \"\u003crun 路徑>\" --watch 60 --view\n```\n\nPython 畫圖現在需要一起帶上根目錄 `curriculum_progress.py`。更新 MATLAB 顯示要一起帶上 `+trainingcurriculum/progress.m`、`progress_callback.m`、`log_history.m`、`decide.m`、`training_status.m` 及引擎修改，且應等副本沒有活動訓練。此次只修改本機，沒有直接更新遠端或 commit/push。\n\n## 暫算與正式判定\n\n- 即時 callback 使用 MATLAB 提供的歷史原值，行末標示 provisional；正式切換仍在保存 checkpoint 後執行。callback 只在原本段落上限回傳 stop，原生 MaxEpisodes 仍是同一上限；不因顯示條件達標提前停訓。\n- `training_status` 和 Python 圖表讀取 stdout，reward 已四捨五入，屬 log estimate。靠近門檻時，不能拿暫算取代 checkpoint 原值的正式判定。\n- 每條指標獨立計算最新、不重疊的完整區間，與現有課程判定一致。不把不同指標的 streak 改成共用計數器。\n- 只讀完整換行列。同一 run 重複回合由較新 attempt 覆蓋；祖先只讀到 fork checkpoint，子 run 只讀接續後回合。缺失位置填未知值，不把不連續記錄壓成連續區間。\n- stage episode 數依最後可見 episode 與保存 start_episode 的差；指標遇未知資料不顯示通過。若完全無可見資料，不能推斷最新進度。\n- 正式 outcome 顯示自身的截至回合及 decision/reason。舊日誌缺失不會推翻已有的正式成功紀錄。\n- 非課程日誌格式保持原流程。課程新增資訊接在 Q0 後；原有 reward 圖與精簡報告的欄位保持可解析。歷史日誌不補寫。\n\n## 驗證範圍\n\nMATLAB `test_curriculum`、`test_training_progress_display` 使用合成歷史、假引擎，覆蓋保存／接續／完成、ALL/ANY、at_most、缺區間、非有限值、分支缺口與 callback 的原有回合上限。Python 測試覆蓋 stage/lineage、進度計算、正式完成顯示、PNG 寫入和既有 parser；另實際生成八階段合成圖檢查標籤與面板。\n\n未啟動正式訓練，未做遠端 GPU／多 worker live callback 驗證，未修改既有 run 快照、reward、agent 或 guard。工作區在接手前已有 continuous-training／guard 相關修改；它們不是本次顯示改善新增的功能。\n"},{"file":"guides/workspace-layout.md","name":"workspace-layout.md","title":"工作區整理與兩端同步","group":"操作與設定","text":"# 工作區整理與兩端同步\n\n核心位置保持不變：根目錄是操作入口，`+training*/` 與 `+checkpointreview/` 是 MATLAB 套件，`runtime/` 是引擎，`environments/` 是環境版本，`experiments/\u003c課程>/runs/` 保存實驗。程式依自身位置推導根目錄，不能任意將入口搬入 scripts。\n\n資料分工：\n\n| 位置 | 用途 |\n| --- | --- |\n| artifacts/incoming/ | 本機收到的診斷 ZIP、散落評估 JSON、截圖與備份；忽略 Git |\n| artifacts/packages/ | Release 待上傳包與 descriptor |\n| artifacts/results/ | 已下載、驗證的成果封存；不能直接續訓 |\n| diagnostic_packages/ | 既有解壓資料與離線分析腳本，保留原位 |\n| output/ | 現有簡報與交付物，這次不搬移或刪除 |\n| tests/output/ | 可重建測試產物 |\n| docs/records/ | 工作與驗證紀錄 |\n\n新交付工作可在 output 下以任務分資料夾，將 build 中間檔與 dist 發佈檔分開；既有簡報仍依原忽略規則，不將修改或 ZIP 自動提交。舊 sessions、reports、trajectories 仍可能有相容性用途，不為目錄外觀搬動。\n\n兩台電腦各自執行（專案根目錄 PowerShell）：\n\n```powershell\ngit pull --ff-only\nif ($LASTEXITCODE -ne 0) { throw '請先處理 pull 錯誤，勿強制覆寫。' }\n.\\organize_workspace.ps1\n# 確認清單後執行：\n.\\organize_workspace.ps1 -Apply\ngit status --short\n```\n\n預覽不改檔。Apply 只處理明列的根目錄診斷 ZIP、stage8_latest300.json、compare_training_checkpoints.m.backup_*，以及「新增資料夾」內 PNG；排除 tracked 檔，拒絕來源／目的地連結，不掃描 run，不搬 configs 內的備份或未知配方。每批新建唯一目錄，搬移前保存來源／目的地／SHA256／大小，搬移後核驗。中斷時依 manifest 查找原位及目的地；再次執行只處理仍在原位的檔案。沒有自動刪除或自動復原。\n\nGit pull 同步工具與文件，不會替另一台電腦移動未追蹤資料。兩端資料量可以不同，目錄用途一致即可；實驗室簡報說明的本機修改保留，不用為了整理而 commit 全部檔案。\n\n2026-10-19 本機先整理9個檔案，SHA256前後一致，manifest位於 artifacts/incoming/cleanup-20261019/manifest.json。實驗室是否完成須看其執行結果，不能由本機完成推定。\n\n驗證：在獨立tests/output測試Git目錄，預覽不改檔、Apply搬移兩個指定檔並驗證manifest雜湊、tracked備份及未知檔保留、重跑不重複搬移；歷史AGENTS全文與整理前Git版本一致，新增入口連結存在，離線文件首頁已重建。這不是訓練測試，未啟動MATLAB。\n"},{"file":"research/autonomous-curriculum-proposal-2026-10-18.md","name":"autonomous-curriculum-proposal-2026-10-18.md","title":"下一輪課程與 JSON 自動決策評估（提案，未實作）","group":"研究調查","text":"# 下一輪課程與 JSON 自動決策評估（提案，未實作）\n\n使用者希望一次啟動後，正常情況能完成整個課程，必要時仍可介入。2026-10-18 回報 progressive_v2 run `20261017_071436_recovery_tp323769ed` 於 39300 回合、attempt 224、`conditions_met` 完成，時間為 19:31:16 +08:00。這是使用者提供的完成證據，不是本機讀取的遠端即時狀態。完成課程尚未取代獨立評估。\n\n## 先驗收這次成果\n\n在實驗室新 MATLAB session，保持訓練停止，先針對最新 checkpoint 做八階段、每階段 10 個固定 seed 的無探索評估，共 80 次 CPU sim。沿用 run 的環境快照與模型內探索倍率，不重新縮放 std。固定路徑的多 seed 不代表十條不同軌跡；既有 turbulence 內部 seeds 亦不等同獨立噪音序列。檢查完成率、失敗情境及原始路線距離，不以訓練 reward 一項驗收。\n\n```matlab\ncd D:\\daniel\\ModularTraining\nsessionDir = fullfile(pwd,\"experiments\",\"progressive_v2\",\"runs\", ...\n    \"20261017_071436_recovery_tp323769ed\");\nreview = compare_training_checkpoints(sessionDir, ...\n    episodes=[],includeLatest=true,stages=1:8,seeds=901:910, ...\n    maxSteps=3000,useExploration=false,routeMetrics=true);\ndisp(jsonencode(review.summary,PrettyPrint=true))\n```\n\n這組 seed 是候選評估組，尚未核對完整歷史，不能先稱為從未使用過的保留測試集。下一步依結果安排探索開啟的配對評估；不在同一命令直接啟動新訓練。這 80 次可能耗時，工具逐次保存結果。若要作正式可靠度主張，另訂樣本數、獨立情境生成與信賴區間。\n\n## 下一輪課程排序\n\n建議先做「固定版本、新 agent、從頭可重現」的 progressive_v3，維持八階段的任務遞進，避免同時改 reward、環境與大量難度。這不是沿用已成功 agent 的第九階段。\n\n| 階段 | 任務 | 自動驗證重點 |\n| --- | --- | --- |\n| 1 | 直線、無風 | 初始循跡與數值正常 |\n| 2 | 平緩 S 彎、無風 | 基本轉向，保留直線能力 |\n| 3 | 固定轉彎、無風 | 曲率任務，保留前兩階段 |\n| 4 | random、無風 | 路徑變化，追蹤探索與無探索差距 |\n| 5 | random、小穩定風 | 初步風擾適應 |\n| 6 | random、小風與湍流 | 風擾組合 |\n| 7 | random、較強風與小湍流 | 提高風強度 |\n| 8 | random、完整風場 | 最終任務與全階段能力保留 |\n\n從第一回合固定 spatial_v2 環境，包含現有空間循跡修正；不修改既有 run 快照。新 run 必須凍結環境 SHA、課程、模型、監督策略、root seed 與情境生成版本。現有門檻只作起始候選，須先核對成功 run 的實際快照，再依獨立評估結果決定，不從共享 JSON 推定歷史設定。\n\n## 把任務課程與訓練控制策略分開\n\n`curriculum.json` 定義每階段任務與過關門檻；另以 `controller.json` 定義觀測、條件與允許動作。run 保存兩者的不可變快照。沿用明確的 `all/any`、比較運算、完整區間、連續次數，不接受任意 MATLAB/Python 表達式或 eval。**現有 schema 不支援下列草案，不能直接交給 retry。**\n\n```json\n{\n  \"proposal_schema\": \"controller-v1-draft-not-executable\",\n  \"decision_boundary\": \"saved_checkpoint\",\n  \"rules\": [{\n    \"id\": \"confirmed_regression_actor_lr_half\",\n    \"priority\": 20,\n    \"when\": {\"all\": [\n      {\"signal\": \"training.regression\", \"equals\": true, \"consecutive_checks\": 2},\n      {\"signal\": \"validation.paired_regression\", \"equals\": true},\n      {\"signal\": \"validation.current_stage_compatible_checkpoint\", \"equals\": true},\n      {\"signal\": \"stage.intervention_count\", \"at_most\": 1},\n      {\"signal\": \"stage.episodes_since_intervention\", \"at_least\": 1000}\n    ]},\n    \"then\": {\n      \"action\": \"fork_from_validated_checkpoint\",\n      \"actor_learning_rate_scale\": 0.5,\n      \"critic_learning_rate_scale\": 1,\n      \"trial_additional_episodes\": 500,\n      \"on_validation_failure\": \"pause\"\n    }\n  }],\n  \"limits\": {\"max_total_interventions\": 4, \"on_exhausted\": \"pause\"}\n}\n```\n\n所有數值都是待校準的控制預算例子，並非已證實最佳超參數。LR 下限必須按模型設定明訂；不允許無限減半或自動提高 LR。候選checkpoint應有可比且未過期的評估，若屬較早階段，須明確恢復其階段狀態並重驗後續任務，不可挪用目前的已過關狀態。\n\n## 決策順序與限制\n\n1. 檔案／SHA 不一致、非有限權重或指標、使用者 STOP、鎖衝突，立即保存可用資料並暫停；不得用調 LR 遮蔽問題。\n2. 可恢復的程序或授權失敗，走現有有限重試／worker 降級，不更改學習參數。\n3. 到 checkpoint 邊界且沒有安全故障，評估過關與舊任務能力；全課程通過才結束。\n4. 訓練疑似退步先觸發固定 validation 情境的配對評估。訓練低分但無探索仍穩定時，不直接判定 LR 過高；記錄探索 std 分布，只有已驗證並預先授權的介入規則才可動作。\n5. 獨立驗證確認退步，且仍有介入預算，才從相容的驗證 checkpoint 開一個子 run、只改一項參數。父 run 與 checkpoint 不改；短試跑通過才能延長。候選失敗則暫停，第一版不做無限搜尋樹。\n6. 平台期不等於退步：若能力穩定但門檻未達，可在總回合／時間預算內延長一段；不自動降低門檻或略過階段。確認長期無進展才用另一條經驗證的規則處理。\n7. 同一保存邊界只提交一次動作，按固定優先序選擇；冷卻期間禁止再次介入。每次動作寫入原因、數據截至回合、規則版本、來源 SHA、父子 run 及結果。\n\n控制器需要持久狀態與具冪等性的 `evaluate -> prepare -> verify -> activate -> complete` 流程。中斷後先核對已建立子 run，不重複減半、重複建分支或同時啟動兩個 run。STOP 在所有狀態優先；遇到未知狀態暫停。\n\n## 評估資料不能反覆洩漏到最後驗收\n\n使用固定 validation 情境做調參與候選選擇，另留封存的 final test 情境，控制器不可依 final test 選 LR 或分支。定期刷新 validation 的程序與 seed 也需記錄。初版可先每 1000 新回合及階段切換時評估；疑似退步追加評估，避免每 100 回合跑全套而拖慢訓練。頻率仍待量測成本。\n\n探索倍率 0.5 在這次恢復中的成功不能直接證明新 agent 從頭也適合固定減半；下一輪先凍結一個有依據的模型設定，保留獨立實驗比較。變更 actor 建構與 setActor 對 optimizer 私有狀態的影響尚未驗證，不能自稱完全無損續訓。\n\n## 分段實作與驗收\n\n- 第一步：純腳本入口準備新 run，明確 seed 與完整快照，start=false 預覽。先做 shadow controller，只記錄「若啟用會採何動作」。\n- 第二步：以歷史重播、合成退步、缺資料、ANY/ALL、冷卻、預算耗盡與中斷重啟測試控制器；核對沒有看未來資料或跨階段拼錯歷史。\n- 第三步：啟用定期評估及有限延長；驗證其不改 agent、checkpoint、guard 或課程門檻。\n- 第四步：只開放一種有限恢復介入（候選是 actor LR 減半），驗證來源權重、模型快照、學習率實際生效、可恢復狀態與單一活動分支。探索倍率調整另行評估。\n- 第五步：使用者審閱完整 JSON 計畫後，一次啟動完整新課程；只在完成、故障、介入耗盡或需要人工決策時通知。\n\n目標是減少例行干預，不承諾任何 seed 都一定收斂，也不以關閉 guard、取消所有預算或無限 retry 達成表面上的「不停」。本次只完成規劃，未建立 controller、未啟動新訓練。\n"},{"file":"research/endpoint-lookahead-candidate.md","name":"endpoint-lookahead-candidate.md","title":"路徑末端 lookahead：只供評估的候選","group":"研究調查","text":"# 路徑末端 lookahead：只供評估的候選\n\n> 2026-10-12 更新：第二版已經實驗室擴展測試，並正式納入 runti
