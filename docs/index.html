me。以下是候選開發歷史；目前 `baseline` 表示正式第二版，不能拿它當舊版重做 A/B。重複套用候選會明確拒絕。續訓見 [正式部署操作](../guides/endpoint-v2-training.md)。\n\n詳細 traces 證據見 [Stage 5 調查](stage5-trace-findings-2026-10-11.md)。205/207 有風地速約16.3–16.4m/s，超過當前規劃路徑末端後，目標仍停留舊末點，更新時才跳回前方。此候選測試「末端目標不足」對失敗的貢獻，尚未證實能解決所有問題。\n\n`guidanceVariant=\"endpoint_lookahead\"` 僅在臨時模型副本修改 guidance chart：原 inside-window 分支若選到path末點，沿末段切線延伸目標，使沿切線到目標的剩餘距離至少50m。保留原 d/reward/IsDone、planner、更新週期、agent及學習參數。沒有更新正式 SLX。baseline 仍為預設。\n\n限制：延長線不保證與未來轉彎路徑一致，也不保證位於機頭前方；這是局部候選，不是通用路徑規劃解法。原 outside-window 分支不變。只可做模擬診斷；不能因候選回合數增加就宣稱模型學得更好或課程合格。\n\n實驗室保持暫停並更新程式後，模型關閉時執行：\n\n```matlab\nclear compare_training_checkpoints\nrehash\nroot=fileparts(which(\"compare_training_checkpoints\"));\nsession=fullfile(root,\"experiments\",\"progressive_v1\",\"runs\", ...\n    \"20261010_224522_recovery_tpc1c4f06e\");\ncandidate=compare_training_checkpoints(session,episodes=21600,includeLatest=false, ...\n    stages=[4 5],seeds=[205 207 210],diagnostics=true, ...\n    guidanceVariant=\"endpoint_lookahead\");\ndisp(candidate.outputDir)\ndisp(jsonencode(candidate.results,PrettyPrint=true))\n```\n\n與既有 baseline `evaluation_20261011_210201_tp3d1c0564` 比較：205/207無風皆3000，有風1042/743；210兩者皆3000。使用相同checkpoint、路徑seed及風參數，六次最多各3000步。檢查失敗改善、成功案例有無退步，以及實際幾何而非僅reward。後續需擴展其他seed及前三階段；不能只針對205/207調到通過。\n\n輸出包含 guidance_variant、candidate_guidance.m 及其SHA256，model_sha256仍代表未修改的來源SLX，不代表記憶體中候選版本。trace保留diagnostics，壓縮整個新evaluation目錄分享。舊報告及訓練狀態不改。\n\n本機純函式測試包含越過端點、接近端點和非末端目標；另用既有短測agent做110步CPU純模擬檢查整合，原SLX雜湊必須不變。本機尚無21600 checkpoint，沒有替代實驗室完整A/B驗證。\n\n2026-10-11 上述測試已通過：越過直線終點時原目標100、候選160；接近終點且側偏10m時候選目標140，d仍為10；非末端情境輸出相同。候選模型完成110步真實CPU純模擬且來源SLX SHA不變。短測未重現實驗室失敗，不能視為修正效果驗證。\n\n## 第二版：外部分支的末端超越\n\n第一版實驗室結果：205有風3000步，207為1145步，210仍3000；三條無風皆3000。詳細訊號顯示207在109秒超出path包圍範圍（min/max±30m）時，轉入未修改的outside分支，目標退回身後。不能稱第一版已完全修復。\n\n`guidanceVariant=\"endpoint_lookahead_v2\"` 保留第一版inside處理；outside分支新增三個同時必要條件：當前path最近waypoint是末點、沿末段切線已超過末點、到末段延長線的側向距離≤30m。符合才以投影位置加50m作目標；其他outside狀況維持原邏輯。不改原d、heta濾波、reward、IsDone、planner或更新頻率。30m沿用原margin，是候選的工程界線而非安全保證，跨出側偏界線仍可能切回舊邏輯。\n\n實驗室先更新，在相同session執行：\n\n```matlab\nclear compare_training_checkpoints\nrehash\nroot=fileparts(which(\"compare_training_checkpoints\"));\nsession=fullfile(root,\"experiments\",\"progressive_v1\",\"runs\", ...\n    \"20261010_224522_recovery_tpc1c4f06e\");\ncandidate2=compare_training_checkpoints(session,episodes=21600,includeLatest=false, ...\n    stages=[4 5],seeds=[205 207 210],diagnostics=true, ...\n    guidanceVariant=\"endpoint_lookahead_v2\");\ndisp(candidate2.outputDir)\ndisp(jsonencode(candidate2.results,PrettyPrint=true))\n```\n\n與baseline及第一版比較，特別查看207是否仍退回身後目標，以及205/210及無風是否退步。未通過廣泛seed與前階段評估前不部署正式模型、不續訓。baseline、v1、v2都可用相同工具獨立重播，各自保留候選原始碼及SHA。\n\n第二版本機測試已通過：outside末端超越、包圍邊界兩側目標連續、側偏40m和起點後方維持原結果、旋轉90度路徑；另完成110步真實CPU純模擬，原SLX雜湊不變。純函式比較重設persistent歷史以保持兩版本起始狀態一致。尚未驗證實驗室21600的第二版效果。\n"},{"file":"research/lab-regression-2026-10-10.md","name":"lab-regression-2026-10-10.md","title":"實驗室 Stage 3 低分調查","group":"研究調查","text":"# 實驗室 Stage 3 低分調查\r\n\r\n來源：使用者於 2026-10-10 貼上的 report.json；實驗 `20261009_201547_tpf1292058_f8ca_4ccd_bc7f_a66b20ee91b4`，已遷移到 experiments/progressive_v1/runs。使用者回報 attempt 25 已停止。沒有讀取遠端 MAT，也沒有啟動訓練或改模型。\r\n\r\n## 報告可以支持的結論\r\n\r\n- 已記錄到 12616 回合；這是 stdout 觀察值，不保證最後可續訓 checkpoint 也是 12616。\r\n- Stage 3 從 6101 開始，固定轉彎、無風。Stage 2 最後一段 5101–6100 平均 reward 2819.01、平均步數 2983.35、3000 步比例 99.2%。這是該訓練任務表現，不能當獨立測試成功率。\r\n- Stage 3 所有有資料 attempts 的 3000 步比例均為 0。8101–9100 與 9101–10100 平均 reward 分別 545.65、546.79，平均步數 704.53、681.29：曾有進展，但仍未跑滿回合步數上限。\r\n- 下跌在 attempt 22（10101–11100、實際 4 workers、正常退出）內開始。10675–10691 的 17 筆分箱平均 reward 947.95、步數 1230.53；10743–10759 降為 182.77／232.82；10828–10844 為 119.19／154.35。分箱不足以確定第一個失敗 episode。\r\n- 不是剛好在換階段／換 attempt 邊界發生。attempt 23 的建池錯誤發生在這段下跌之後，不能拿它解釋下跌起點。這也不等於已排除所有 worker／環境因素。\r\n- 最近 1000 回合（11617–12616）平均 reward 126.01，平均步數 173.56，87.9% 少於 256 步，無回合達 3000 步。可確認訓練資料中存在持續短回合低分，不只是平均線視覺效果。\r\n- learning_health=watch 是因預設需連續 5 個低分的完整 1000 回合區間；目前只有 1 個符合。不是認定訓練健康，也不需要為了觸發它再跑 4000 回合。\r\n\r\n## 尚未證實的原因\r\n\r\n報告沒有終止原因、追蹤誤差／姿態／動作序列、KL、entropy 或 loss，無法區分控制失敗、環境終止條件、策略更新不穩定等原因。Q0 增長本身不能證明 critic 發散。載入錯誤不能由此推論；此前遷移後成功跑完第二階段，也不支持僅憑時間順序歸咎遷移。\r\n\r\n當下程式的平緩 S 彎最大曲率約 0.00114/m（最小半徑約 875m），內建固定路徑名義轉彎半徑 120m，任務變化相當大。這是課程難度安排需要檢查的理由，不是已證實的唯一原因；目前程式指紋不等於歷史執行版本證明。\r\n\r\n## 下一步\r\n\r\n保留已停止原實驗。先確認 checkpoint 清單，尤其第二階段末 6100、Stage 3 下跌前約 10600，以及最近可用 checkpoint；不要改名覆蓋 Agent_Final 或手改課程狀態來回滾。\r\n\r\n下一個有辨識力的實驗是同一組路徑／起始條件、不更新權重，評估上述 checkpoint：同時比較直線／S 彎與固定轉彎，記錄終止條件、回合步數與追蹤誤差。這可區分第三階段尚未學會和舊任務能力是否遺失。獨立 evaluator 與從指定 checkpoint 分支課程目前尚未實作，不能直接給 retry 加不存在的參數。\r\n\r\n若評估證實難度落差，再設計中間曲率與左右轉彎階段；若同任務評估證實更新後退步，再做單一因素的恢復實驗。兩者都應另建有父 checkpoint 紀錄的新實驗，保留此失敗實驗作比較。不要現在同時改路徑、學習率、reward 與網路。\r\n\r\n## 評估工具後續\r\n\r\n使用者確認 Agent6100.mat 與 Agent10600.mat 存在。已提供 compare_training_checkpoints，操作見 [checkpoint 比較](../guides/checkpoint-comparison.md)。只做固定無風任務 sim；尚未取得實驗室實際評估結果。原文「尚未實作 evaluator」描述的是當時調查狀態，分支恢復仍未實作。\r\n\r\n## 實驗室評估已回傳\r\n\r\n6100：直線3149.46/3000步、S彎3174.21/3000步、固定轉彎362.34/399步。10600：3113.43/3000、3193.73/3000、1401.85/1578。12600：102.77/138、102.64/138、102.83/138。三者同seed101、CPU、無探索，每個任務一次；未查明物理終止原因。\r\n\r\n使用者要求繼續並詢問自動規則，已實作指定 checkpoint 分支準備和保存後暫停，見 docs/guides/recovery-training.md；本紀錄前文的「尚未實作分支」為當時狀態。此次沒有啟動實驗室恢復訓練。\r\n\r\n## 恢復分支暫停與評估錯誤\r\n\r\n實驗室 recovery 分支由 10600 接續，使用者回報在 11000 保存後因 suspected_regression 暫停：連續三個低表現區間，參考 reward 732.82／steps 921.23，最新 reward 109.96／steps 145.83。這表示此配方未阻止觀察到的退步，不能直接證明 learning rate 是根因；維持暫停，不自動回滾或重啟。\r\n\r\n比較 10600、10700、11000 時，catch 內的 trainingcurriculum.write_json 報錯，遮住原始評估例外。修正為在進入 Simulink 前綁定報告函式，記錄執行 phase、checkpoint／stage／seed 和原始完整堆疊；即使報告寫入失敗也重新拋出原始例外。尚未重現實驗室最初的失敗，不能宣稱其根因已修復。\r\n\r\n本機從既有短測 checkpoint 準備 recovery 分支並做單一任務 5 步 CPU sim，修改前後均完成；修改後 reward 5.50、權重及來源 checkpoint 驗證通過。另以故障注入確認報告寫入成功／失敗都保留原始例外及堆疊，活動訓練拒絕與統計測試亦通過。沒有啟動訓練或測試 GPU／6 workers。\r\n\r\n### 第二次錯誤回報修正\r\n\r\n實驗室再次回報 checkpointreview.fail_evaluation 無法呼叫，表示預先綁定 package handle 並不足以保護錯誤處理。已移除該 helper，改為主函式 catch 直接輸出及 rethrow，JSON writer 使用同檔 local function；報告額外保存失敗時 cwd 與 project_on_path。切換快取與目錄、模型載入後補回專案搜尋路徑，作為防禦處理，尚不宣稱已證實實驗室路徑遺失的原因。\r\n\r\n回歸測試改為呼叫真正 compare_training_checkpoints 入口，在測試替身 load_system 內移除 root 路徑後拋錯；確認原始 identifier／stack 與落盤 JSON 均保留，測試通過。上一版只測輔助函式，未涵蓋其本身無法解析的情境。\r\n\r\n第二次修正後另完成既有 recovery checkpoint 的 5 步 CPU 評估（reward 5.50），來源雜湊與權重檢查通過；未啟動訓練。\r\n\r\n## Recovery 評估與載入稽核\r\n\r\n實驗室更新後完整完成 9 次評估。10600 三項步數為 3000／3000／1578，10700 為 133／134／133，11000 三項均 144。10600 與之前評估一致，表現下降已在第一段 100 回合的存檔出現，且包含直線與 S 彎。單 seed、固定條件，不能據此斷定 optimizer、learning rate 或 LSTM 是根因。\r\n\r\n程式審視：resume 分支直接 load agent，新建網路只在無 resume 時執行；每段 train 前已存 Agent_Initial.mat。checkpoint_attempt 按 attempt 編號重設 baseSeed，並同步設定 worker seeds；恢復試驗同時改了段落長度，因此不是只有 learning rate 的單因素差異。固定無風課程 reset 仍使用相同固定軌跡；尚未發現此段程式碼必然導致退步的證據。\r\n\r\n新增 audit_training_resume，對照 train 前 initial agent 與其來源 checkpoint 的可學習參數、主要 PPO 設定及 worker seeds，再列所選 checkpoint 參數差異。此為唯讀診斷，須在實驗室執行取得實際資料；不自動開始下一個恢復試驗。操作與限制見 resume-audit.md。\r\n"},{"file":"research/lab-trace-findings-2026-10-10.md","name":"lab-trace-findings-2026-10-10.md","title":"實驗室 recovery 原始資料分析","group":"研究調查","text":"# 實驗室 recovery 原始資料分析\n\n來源 ZIP：diagnostics_20261010_155437_recovery_tpebed29a8_e44b46f8.zip。\nSHA256：EF62BE13F96E990C24992ABED900ADA3FFA4D2D775D27C4C700CE07E48A37C84。\n整包及 manifest 38 個檔案均驗證通過。MAT traces 僅載入與匯出數值，沒有 sim 或 train。來源 ZIP、解壓內容與分析圖保留在被 Git 忽略的 diagnostic_packages/。\n\n## 可確認的提前終止機制\n\nevaluation.json 記錄的 FAFA_Simulation.slx SHA256 與本機 runtime 模型一致。OBSERVATION 的 Mux (SID1628) 第7路來自 Normalization (SID1643/chart86)，輸入為 guidance_law 的 d、finite=30 (SID1642)，因此 observation7=d/30；第3路 phi 以40度正規化。d 同時由 OBSERVATION 第3輸出直送 isdone。\n\nisdone/system_362 的有效路徑是 abs(d)>=50 (SID1991) 以及 phi>=40度、phi\u003c=-40度，經 OR 接到 RL Agent。其他同名舊比較器有 Commented=on，不應誤當有效條件。\n\n|Checkpoint/任務|步數|最後 d（模型計算，m）|全程最大絕對滾轉角（度）|\n|---|---:|---:|---:|\n|10600 直線|3000|2.455|9.528|\n|10600 S彎|3000|0.876|9.528|\n|10600 固定轉彎|1578|50.081|14.438|\n|10700 直線|133|50.247|15.579|\n|10700 S彎|134|50.395|15.579|\n|10700 固定轉彎|133|50.276|15.579|\n|11000 直線|144|50.197|20.683|\n|11000 S彎|144|50.352|20.683|\n|11000 固定轉彎|144|50.116|20.683|\n\n所有提前結束的 trace 都是最後 observation 首次跨過 d=50，前一點仍低於門檻，且全程未達 roll ±40度。因此資料支持此次 IsDone 由模型的路徑誤差門檻觸發；不支持「滾轉超限」或「動作飽和」的解釋（既有評估 action_saturation_fraction=0）。這是模型計算的 d，不代表已獨立驗證其幾何計算完全正確。\n\n## 變化時間\n\n直線任務初始 observation 都為零，但第一個 action 已不同：10600=-0.0529635，10700=-0.0342917。約3秒時 action 分別為-0.0233／0.3479；13秒時 d 為9.216／45.751m。10700 並不是到轉彎才失效。\n\n前約10秒 d 都回報0；guidance_law 在 numWps\u003c2 時會直接回傳預設 d=0，WindowManager 亦定期才提供 valid_flag。不能把這段零值當作已證明完美循跡。後續應優先核實路徑就緒前的觀測與控制過渡，但這尚不是已證實的訓練退步根因。\n\n首次 attempt 每10回合平均步數：1041.2、950.7、1052.3、753.1、984.1、622.8、384.3、343.0、137.4、137.0（10601起）。所以訓練表現是在同一 attempt 內逐步變差，不能只歸因於每100回合重啟或切換stage。r000001 訓練腳本與本機引擎正規化換行後文字一致；原始位元組雜湊不同，不宣稱二者原始檔完全相同。\n\n## 限制與下一步\n\n此前 audit 已證實 train 前初始快照與10600可學習權重一致。現有證據把問題縮至訓練更新後的閉迴路行為差異，但尚未檢查 optimizer 內部狀態、每次 PPO 更新的 KL／entropy 或 recurrent state。固定條件單 seed 不是泛化測試。\n\n保留10600，保持現有分支暫停。下一步優先檢查路徑初始有效訊號與前10秒控制，並在相同觀測序列下比較 actor 分布／recurrent state，避免把不同閉迴路 observation 的 action 差異全歸於單一步輸出映射。沒有根據將 learning rate 再減半、放寬50m門檻或啟動新長訓練。\n\n## 同觀測序列重播與初始化驗證\n\n離線載入10600／10700 actor，在CPU逐點evaluate，初始LSTM state設零，每步接續evaluate回傳的state。各自重播自己的直線trace時，前150／133個action與保存結果最大差異均為0，確認時序及狀態更新相符；可學習權重前後不變。未呼叫train或sim。\n\n兩個actor都讀取10600直線trace的前150步：平均絕對action mean差異0.36509，最大0.56311；高斯標準差平均由0.52111變為0.42137。第30步均值-0.02331對0.42045，第50步-0.17990對0.37936。均值在相同觀測歷史下已有明顯偏移，並非僅由兩次飛行軌跡不同造成。讀取10700前133步時，平均絕對均值差異0.26944、最大0.49837。這不等於已證明LSTM損壞，也不等於所有狀態都退步。\n\n原始未截斷高斯分布的離線 KL(10600||10700) 在10600 trace平均0.55715；此非訓練rollout上的逐次更新KL，也不是PPO clip_factor=0.2的直接比較對象，不以此宣稱PPO clipping故障。\n\n### 路徑啟動空窗已確認\n\n模型OBSERVATION/Constant4(SID1963)=100，接入WindowManager(SID1902/chart60)的window_length。該block取樣0.1秒，buffer_counter由1開始，只在mod(counter,100)==0時valid。planner(SID1891/chart118)初始stored_path_length=1，valid以前只回傳一點路徑；guidance_law(chart167)對少於2點路徑回傳d=0、heta=0等預設值。\n\n直接從同SHA256的SLX抽出純函式測試：101次呼叫中原WindowManager只在第100次valid；單點路徑即使給定位置偏移80，guidance_law仍回傳d=0。這證實起始約10秒的零誤差是路徑未就緒時的預設輸出，不能當作有效循跡資訊。其他觀測仍有姿態、位置等，不是全部輸入都為零。\n\n在診斷目錄的獨立副本中，將valid條件改為counter==1或原週期條件，純函式測試valid呼叫變成[1,100]，保留後续週期。尚未改runtime/SLX，也未跑該候選的閉迴路評估。此初始化缺陷可能使策略對啟動行為更敏感，但尚未證明它是10600→10700更新退步的唯一原因。\n\n下一個有辨識力的比較：用獨立模型副本、相同checkpoint與seed、零訓練，對照原版與首次就緒候選的前段行為及完成步數。不能直接覆寫既有實驗的環境來續訓；修正初始化會改變任務分布，需要另留環境版本。\n\nAPI依據：[MathWorks evaluate](https://www.mathworks.com/help/reinforcement-learning/ref/rl.function.rlcontinuousdeterministicactor.evaluate.html)（高斯均值／標準差及nextState）。\n"},{"file":"research/progressive-v2-regression-2026-10-16.md","name":"progressive-v2-regression-2026-10-16.md","title":"progressive_v2 起始循跡退步：2026-10-16 離線診斷","group":"研究調查","text":"# progressive_v2 起始循跡退步：2026-10-16 離線診斷\n\n來源：使用者提供 regression_detail_20261016_160856.zip。ZIP CRC 檢查通過，包含 evaluation.json、scenarios.mat 與三份 trace；沒有 checkpoint 本體或訓練 attempt 日誌。未做模擬或訓練，未修改 runtime／實驗。\n\n評估來源 run：20261015_141048_tpcd5dc3c7_07cf_4ebb_8c77_b102cf24c18c。報告 complete、CPU、Stage 1 straight_calm、seed 501、無風、凍結策略。使用 run_snapshot spatial_v2，模型 SHA256 997adbbd29b199c88e956d0778c1d8022547c60e46abd9943db1d325c295d557；報告 weights_unchanged=true。此為報告證據，本包沒有原 checkpoint 可供本機重新核對其 SHA。\n\n| Checkpoint | 步數 | reward | 觀察 |\n|---|---:|---:|---|\n|18400|3000|2975.91494|前10秒 guidance d 最大38.78356 m，之後能恢復|\n|18500|87|55.65122|8.7秒 d=50.89947 m，提前終止|\n|18600|81|45.17112|8.1秒 d=50.54237 m，提前終止|\n\n三者初始 planned_path、window_path 完全相同；前10秒（失敗者取其全部時間）只有 t=0 發出 window_valid，且沒有後續 planned_path/window_path 內容變更。初始化已產生路徑與前方目標。故這三次評估的失敗不是等到中途換 window 才發生，也不是只改 reward 造成的圖表下降。\n\n初始 action 分別 -0.4045、-0.4083、-0.4101；後續閉迴路演化不同。t=4秒 roll 約 -0.2142、-0.3157、-0.5353 rad。18500、18600 的北向偏移持續擴大，終端 P_N 與 guidance d 相符，且 P_E 已位於原直線範圍內，因此不是只有 guidance 距離讀值變大的現象。不能把閉迴路不同時刻的 action 差異當成相同 observation 下的策略差異。\n\n使用者 audit 顯示五個 checkpoint 的主要超參數相同、權重皆 finite；其距離統計均相對17000，不能相減當作18400→18500的更新幅度。initial_snapshot_count=0 不足以證明 resume 正確或錯誤。尚未檢查 optimizer 內部狀態。\n\n結論：已確認被抽樣 checkpoint 的起始循跡能力在18400與18500之間惡化；18400也有明顯起始擺動，不能視為完全穩健或全歷史最佳。尚無證據確定學習率、PPO更新、LSTM狀態或重啟為根因。下一步需相鄰 checkpoint 本體及18401–18500相關訓練／啟動日誌，做相同觀測 actor 重播與 restart 時序核對。維持原 run 停止，不改 reward、終止門檻或 guard，不自動回滾。\n\n離線衍生資料位於忽略的 diagnostic_packages/regression_20261016/；initial_divergence.png 比較前12秒的 guidance d、roll 與 action。\r\n\n## 第二包與相同觀測重播（2026-10-16）\n\n收到 regression_models_20261016_161913.zip，ZIP CRC 通過，共1807個檔案。Agent18400／18500／18600逐檔SHA256與先前evaluation.json一致。檢查attempt197–204的啟動預檢紀錄，環境及引擎SHA均相同；這是預檢證據，不等於完整歷史執行封存。\n\n- 18101起已有較多短回合，不能說所有退步只發生在18401後。\n- attempt201涵蓋18401–18500，全段6 workers。每20回合的平均reward/steps依序1592.9/1838.2、2211.2/2565.2、1705.7/1985.7、951.3/1113.2、179.7/236.0。\n- attempt202在18501前建池失敗；attempt203才降成4 workers。因此這次降級發生於崩落之後，不能解釋attempt201內的崩落。也不能據此排除所有先前重啟影響。\n- training_options／initial snapshot：本包含TrainingOptions，沒有Agent_Initial；未做重啟前後初始權重一致性認證。\n\n對每個checkpoint載入CPU actor，將LSTM狀態歸零，依序evaluate各自已記錄的觀測（最多150步）。三者對自己的trace都與記錄action完全一致，最大誤差0；evaluate前後actor可學參數完全相同，沒有模擬或訓練。\n\n再把18400的同一串150步觀測分別送入三個actor；相對18400，18500動作平均絕對差0.183126、最大0.504293；18600平均絕對差0.553144、最大1.084608。各自LSTM狀態由同一觀測序列演化，並非強迫其隱狀態相同。這證明不同checkpoint對同一輸入歷史的策略輸出不同，不能只歸因於抽到不同路徑；但離線重播不證明換上另一actor的閉迴路結果，也不識別學習率／optimizer／PPO更新的因果。\n\n工作檔：diagnostic_packages/replay_regression_actors.m、regression_20261016/actor_replay.json。沒有修改正式runtime、checkpoint、課程或啟動正式訓練。後續應採保留父run的受限恢復試驗與獨立評估，不應直接續訓18600或放寬reward門檻。18000在先前小樣本評估通過，可列為候選；18400訓練已不穩定且直線初始擺動較大，不稱最佳恢復點。\r\n\n## 實驗室減半LR分支：18300暫停後評估\n\n使用者提供分支20261016_162607_recovery_tpf699ae87的四次直線seed501 CPU評估輸出，evaluation_20261016_192536_tpcebd1553。18000/18100/18200均3000步，reward3017.65066/2981.10267/3014.16667；18300僅79步、49.33425，末端guidance d約50.036m，獨立原路線距離最大50.036m在7.9秒，after10無樣本。\n\n分支18000的直線結果與原父run先前同情境結果一致，支持準備分支沒有破壞這項凍結策略表現；不能據此宣稱每次attempt的Agent_Initial、optimizer或worker初始化皆正確。需要實際初始快照核對。\n\n18100/18200雖跑滿，10秒後獨立距離RMS為4.910/4.001m（18000為2.707m），最大40.532/39.169m（18000為29.339m）。reward近似不代表暫態偏離同樣小。直線能力崩落可定位於已保存18200至18300之間；不是證明整段退步從18201才開始。這是Stage1的固定診斷，不是訓練Stage4或所有任務的評估。\n\n本次actor LR減半沒有避免這個分支的崩落；不以不同隨機訓練分支比較推論減半有害或學習率完全無關。保留暫停、不自動從18200再續訓。下一步收集此分支18000–18300 checkpoint、三段Agent_Initial與TrainingOptions、日誌及這次詳細traces；不再要求重跑相同評估。資料尚未傳入本機，不能把前一個run相同episode檔案混用。\r\n\n## 第三包：初始快照核對與恢復分支重播\n\n收到 recovery_review_20261016_192959.zip，50個檔案，ZIP CRC通過。四個checkpoint SHA256皆符合本包evaluation.json。三個attempt環境／引擎預檢SHA一致，皆6 workers；seed依序10001–10006、20001–20006、30001–30006。\n\n離線讀取r000001/r000002/r000003的Agent_Initial與對應18000/18100/18200，三者Actor及Critic可學權重逐值完全相同；Actor保存State和公開AgentOptions亦isequaln相同。後兩段resume路徑為Agent_Final，但已用實際快照權重對照同回合checkpoint，未用檔名推論一致性。沒有檢查optimizer私有狀態或worker執行時隱狀態，故不能宣稱所有resume問題都排除。\n\n第三段18201–18220平均1698.65步、11/20跑滿；18221–18240平均1112.5步、7/20跑滿；18241–18260平均88.65步，18261–18280平均83.65步，18281–18300平均83步，後60回合皆未跑滿。嚴重崩落發生在第三段內，且第一段後半已出現較多短回合。\n\n四個actor對各自既有觀測做CPU離線重播，前最多150個action最大誤差皆0，可學參數前後不變。使用18200同一串150步觀測及零初始LSTM狀態，18300相對18200動作平均絕對差0.407212、最大0.731470。此為輸出變化，不稱KL或單次PPO更新幅度，不能由此判定clip失效。\n\n結論：沒有載錯／重設可學權重的證據；低LR仍發生段內策略退步。應調查更新前後行為變化、訓練探索與固定評估的差異，而非直接第三次減半或改reward。這批資料已足夠接續離線分析，無需再次要求使用者重跑同一組評估。工作檔為diagnostic_packages/inspect_recovery_resume.m、replay_recovery_actors.m及recovery_review_20261016/offline_resume.json、actor_replay.json。本次無模擬、訓練或正式runtime修改。\r\n\n## Stage4新路徑配對評估：2026-10-16 19:41\n\n使用者貼回evaluation_20261016_194120_tpd47c04a4完整終端summary：恢復分支18000／18100／18200在random_calm、seed601:606，各6/6跑滿3000，平均reward2895.31095／2867.34043／2900.91153，mean_observation7_rms分別0.187201／0.241393／0.221085。這是凍結策略、關閉探索的6條路徑診斷，不是泛化成功率或課程合格。\n\n修正先前待驗證假說：18100與18200不只是保有直線能力，也保有本次六條隨機路徑的確定性執行能力。18200reward略高於18000，但guidance距離RMS較大，不能單憑reward稱更好。未收到route_metrics完整內容，不把observation7_rms冒稱獨立原路線誤差。\n\n訓練中大量短回合與凍結評估全跑滿之間仍有差異：探索、訓練中變動權重、路徑抽樣、並行執行等因素尚未分離；不宣稱探索已證實為根因。下一個有辨識力的對照是同一checkpoint／環境／路徑、凍結權重下的探索開關比較；現有compare_training_checkpoints固定UseExplorationPolicy=false，尚不支援選項，不給不存在的參數、不建議直接關閉訓練探索。保持暫停，18300已確認策略能力崩落，不因18200測試良好而自動續訓。\r\n\n## 探索開關實驗室對照：2026-10-16 19:58\n\n使用者貼回evaluation_20261016_195803_tpcc57bafc，CPU固定模型、Stage4 seeds601:606、useExploration=true。18000為6/6跑滿，mean reward2628.94638；18100及18200皆5/6，mean reward2155.28250／2174.77856。兩者皆seed601於101／99步提前終止，terminal observation7約1.6708／1.6707，對應guidance d約50.12m；只是終端門檻證據，未收到詳細trace做物理分支確認。\n\n相同六個seed關閉探索時三者均6/6。這支持18100／18200對此次動作抽樣的容忍度較18000差，確定性跑滿掩蓋了脆弱性；不是探索過大已證實，更不是獨立樣本失敗率16.7%的可靠估計（共用seed、少量配對、同起始區段）。18000探索六例皆跑滿，不應全面關閉探索。不能以此獨自解釋18300確定性能力崩落或所有並行訓練失敗。\n\n下一步不再要求新模擬：取得上述探索組及evaluation_20261016_194120_tpd47c04a4確定性組的既有trace與scenarios，配對seed601檢查初始觀測、動作抽樣／均值、位置與距離。已持有三個checkpoint，不再要求重傳。routeMetrics=true僅位置，不能冒稱有完整guidance／姿態診斷；experience內可讀觀測與動作。保持暫停，不回滾或盲目再降LR。\r\n\n## 配對trace離線分析（2026-10-17）\n\nexploration_pair_20261016_200348.zip共40檔，CRC通過；兩份報告環境SHA相同，checkpoint SHA與本機恢復包一致，scenarios.mat的scenarios逐值相同。六份seed601 trace重播確認關閉探索action與actor均值一致、actor權重不變。\n\nseed601前15秒 guidance d峰值：18000關閉探索30.968m、開啟37.153m；18100關閉40.883m、開啟50.125m（10.1秒結束）；18200關閉40.533m、開啟50.121m（9.9秒結束）。可見平均策略起始暫態本已更接近50m門檻。開啟探索前5秒沿各自trace的actor std均值18000=0.41670、18100=0.42323、18200=0.43342；不是標準差突然數倍爆炸。\n\n在三者共同前99個動作的未超過名義範圍樣本，(action-mu)/sigma相對18000最大差約1.75e-7／2.44e-7，支持此次配對使用相同標準化隨機抽樣，而不是18100／18200碰巧抽到完全不同的噪音序列。此比較僅限該seed與樣本，不能推廣到所有訓練隨機性。\n\n部分experience原始action超出[-1,1]，例如t=6s三者-1.182/-1.255/-1.245。這不能單獨當成bug或實際舵面超限：靜態SLX檢查RL輸出進inner loop及延遲／記錄分支；模型包含其他不同物理量的限幅，不能看到Saturation就宣稱action被clamp。現有action_saturation_fraction只是abs(action)>=0.99比例，不是已驗證的物理飽和比例。\n\n較精確結論：此次失敗與原有起始暫態裕度變小、探索擾動共同出現；沒有證實只縮小std即可恢復可訓練性，更沒有識別均值策略為何被更新至脆弱區域。不能取消探索或放寬50m來假裝修復。本輪未訓練、未模擬、未更改正式環境。\r\n"},{"file":"research/reward-calibration-v2.md","name":"reward-calibration-v2.md","title":"Reward v2：單位修正與分數尺度校準","group":"研究調查","text":"# Reward v2：單位修正與分數尺度校準\n\n> 後續進度：使用者已授權將本文件的 w=0.2 候選實作到獨立 `environments/spatial_v2`；詳見 [spatial_v2](../guides/spatial-v2.md)。下文「僅離線／未部署」描述的是當時校準階段，並不表示現在沒有新版 SLX。現有 v1 和 run 快照仍未更動，也尚未切換 progressive_v2 課程。\n\n2026-10-15，供 progressive_v2 從頭訓練前審視。候選版本為 `spatial_reward_v2_candidate_1`，目前只在離線重計分工具中實作，未部署正式 SLX。這份校準區分三件事：公式是否符合定義、固定飛行資料在新公式下的分數、使用新 reward 訓練後的行為。前兩者可以先測，不能據此宣稱第三者成立。\n\n## 可重現的候選定義\n\n先只修正兩條支路，其餘八項完整保留，以減少同時改變的因素。`d` 為 guidance 輸出的非負距離，單位公尺；目前幾何是引導路徑的局部直線橫向距離，不是到使用者原始有限折線的最近距離。原始路線距離必須另行評估。\n\n```text\ncross_track_new = 0.2 - w * d / 30\ndistance_bonus_new = 0.1 + 0.05 * max(0, 1 - d / 10)\nreward_new = reward_old - cross_track_old - distance_bonus_old\n             + cross_track_new + distance_bonus_new\n```\n\n參考候選 `w=0.2` 沿用原本直線條件下的距離懲罰斜率；額外測試 `w=0.4,0.6` 作敏感度比較，不因分數較高就選較弱懲罰。`30m` 是保留的尺度，不是成功門檻；`10m` 是原先加分條件的物理單位解讀，也不是已確認的任務容許誤差。\n\n- 移除 cross_track 的曲率減半分支，讓同一距離在直線與轉彎受到相同的直接懲罰；這是明確的候選設計決定，不聲稱已還原原作者意圖。\n- 移除到局部 waypoint 距離在 30～150m 的額外加分。\n- 原本近乎固定的「正規化 d≤10」加分改為物理距離 0～10m 內連續遞減，10m 處沒有跳變。\n- 保留此支路每步 0.1 的基底；不是刪去整條 distance_bonus。\n- 原本獨立的 curvature_distance 項仍保留；並非刪除所有曲率相關 reward。朝向、角速度、轉向追蹤、距離變化、動作超限與變化扣分均未改。\n- 不變更 observation、guidance、reward 以外的接線、IsDone、PPO 或探索設定。\n\n只看被修改的兩項，其他因素固定：\n\n| d（m） | w=0.2 | w=0.4 | w=0.6 |\n| ---: | ---: | ---: | ---: |\n| 0 | 0.3500 | 0.3500 | 0.3500 |\n| 5 | 0.2917 | 0.2583 | 0.2250 |\n| 10 | 0.2333 | 0.1667 | 0.1000 |\n| 20 | 0.1667 | 0.0333 | −0.1000 |\n| 30 | 0.1000 | −0.1000 | −0.3000 |\n| 50 | −0.0333 | −0.3667 | −0.7000 |\n\n距離越大，這兩項的合計必定下降。但實際飛行中其他項也會變化，不能將這張表當作整體策略不會鑽漏洞的證明。\n\n## 第一批實際 traces 重計分\n\n來源為 Agent31600、正式空間循跡模型 SHA256 `495afb97a9fa463b4500d168909ea28f649a12912f12c0631ec1e85b93c1b6be`。原評估資料夾 `diagnostic_packages/stage6_review/main/reports/evaluation_20261014_090252_tpa0964215`，兩個完整風場情境各 3000 transitions。\n\n| seed | 原 reward | w=0.2 | w=0.4 | w=0.6 | guidance d RMS（m） |\n| --- | ---: | ---: | ---: | ---: | ---: |\n| 202 | 2841.37 | 2710.01 | 2558.42 | 2406.84 | 8.58 |\n| 205 | 2823.42 | 2666.50 | 2481.73 | 2296.97 | 10.12 |\n\n表格為四捨五入的摘要，以產生的 calibration.json 精確值為準。同一條 trace 的動作與飛行時間完全相同，分數變化只是重新計分，不是政策改善或退步。w=0.2 下，cross_track 分別少約 27.08／36.84；distance_bonus 少約 104.28／120.09；動作變化扣分仍為 −38.9／−38.5。\n\n這兩條資料只能支持「單位修正會明顯改變分數尺度」。它們不能選出最佳懲罰強度，也不能證明 2666 就應該通過、或原本 2700 應平移成某個固定數字。\n\n## 補充六種條件的隔離評估\n\n本機 CPU、Agent31600、seed101、關閉探索，對既有六階段各做 3000 步純 sim，並記錄 reward 十個支路及獨立原始路線距離。資料在 `diagnostic_packages/stage6_review/main/reports/evaluation_20261015_093812_tp65194db6`；重計分報告在 `tests/output/reward_calibration_stages_20261015/calibration.json`。六例全部跑滿，原 checkpoint SHA 與模擬前後權重由 evaluator 核對；正式 SLX SHA 未變。\n\n| 條件 | 原分數 | 候選 w=0.2 | 原始路線 RMS，10秒後（m） |\n| --- | ---: | ---: | ---: |\n| 直線、無風 | 3068.14 | 3042.02 | 1.76 |\n| S 彎、無風 | 3085.97 | 3047.58 | 1.81 |\n| 固定轉彎、無風 | 2921.44 | 2858.33 | 5.48 |\n| 隨機、無風 | 2962.31 | 2903.31 | 4.26 |\n| 隨機、小風含擾動 | 2959.39 | 2893.79 | 5.09 |\n| 隨機、完整風場範圍 | 2860.78 | 2730.19 | 10.33 |\n\n本批小風實際抽到 east/north=1/1、turbulence=1；完整風場範圍實際抽到3/3、turbulence=1，不能聲稱本批驗證了 turbulence=2。最後一例10秒後約62%樣本在原始路線10m內；跑滿與2700以上都不等於已確認的距離品質合格。表格採相同飛行資料重計分，並未在候選 reward 下更新政策。\n\n總計8條完整 traces、24000個 transitions，涵蓋現有六種課程條件，但都是同一個已訓練 checkpoint。progressive_v2 新增的獨立小風無擾動階段，以及各風／擾動子群並未完整覆蓋；也沒有新 agent 或失敗政策樣本。保留 w=0.2 作單位修正的最小變動參考，w=0.4／0.6 僅列敏感度，不以這批資料宣稱已找出最佳權重。\n\n## 課程門檻狀態\n\nprogressive_v2 原草案中的 reward 1200／1800／2000／2200 尚未正式校準；尤其所有有風階段使用 2200 的理由不足。不得把這些數字當作本次候選的已驗證門檻，也不把原 reward 分數與新分數接成同一條曲線。\n\n本次先保留 JSON 作為未部署的課程草案，遠端配方仍是 start=false。離線工具不自動改寫 JSON。單一既有 agent 的關閉探索評估，不能代表新 agent 訓練時的 reward 分布；目前也沒有完整的八階段成功／失敗樣本和使用者確認的實際距離品質標準，因此不能誠實產生八個「正式校準值」。\n\n後續若使用此候選開始新的短訓練驗證，應記錄 reward 版本、候選參數及環境 SHA，先看各項分布與實際距離品質，再決定是否部署及如何訂訓練門檻。課程的跑滿比例與獨立距離評估仍需並用。新公式仍有正向基底、距離變化與轉向項，不能宣稱已完全消除偏好存活時間或其他投機行為。\n\n## 重現方式\n\n```matlab\naddpath('tests');\ntest_spatial_reward_candidate();\ntest_reward_breakdown();\nreport = calibrate_training_rewards( ...\n    \"diagnostic_packages/stage6_review/main/reports/evaluation_20261014_090252_tpa0964215\", ...\n    \"tests/output/my_reward_calibration\");\n```\n\n輸出目錄必須不存在，工具不覆寫舊結果。驗證原始逐步 reward 加總、t 與 t+0.1 秒對齊、距離正規化、環境 SHA 及 evaluation 總分後，才重計分；報告保存來源 evaluation／MAT 的 SHA256、checkpoint 來源、候選參數、逐項差值、全程及10秒後距離統計。檔案寫到新的 output，來源 traces、checkpoint、課程與正式 runtime 不改。\n\n候選純函式在 `+checkpointreview/spatial_reward_candidate.m`。合成測試涵蓋 0/5/10/30/50m、10m 邊界連續性、單調性、控制扣分保留及不合法輸入。它是離線公式，不會因新增檔案就改變 retry 的 reward。\n"},{"file":"research/stage5-trace-findings-2026-10-11.md","name":"stage5-trace-findings-2026-10-11.md","title":"Stage 5 失敗 traces 離線檢查","group":"研究調查","text":"# Stage 5 失敗 traces 離線檢查\n\n來源：使用者提供 stage5_evaluation_20261011_205243.zip，ZIP CRC 通過，包含 20 個 trace、evaluation.json、scenarios.mat。評估 SLX SHA256 與目前本機模型一致。純 MAT 讀取與數值分析，沒有 sim/train 或模型修改。\n\n21600 在十條 random 無風路徑全部跑滿，小風擾為 8/10。由 scenarios.mat 直接核對 seed 205、207、210 在 stage4/5 的 waypoints 完全相同；這不代表有風閉迴路中規劃器產生的路徑也相同。\n\n| Seed | 有風結束時間 | 終端模型 d | 全程最大 abs roll | 同路徑無風最大 d |\n|---|---:|---:|---:|---:|\n|205|104.2 s|50.094 m|19.54 deg|15.804 m|\n|207|74.3 s|50.146 m|19.83 deg|12.443 m|\n\nd=obs7*30、roll=obs3*40，依相同 SHA 的模型正規化。兩次皆首次跨過 d=50，roll 未達 ±40，action 未達 ±0.99；不能解讀為 roll 超限或 actuator 飽和。這是模型計算的 d，不是獨立幾何真值。\n\n兩次最後失敗段皆連續增長，不是單次數值跳過門檻：205 的最大正 d 增量 1.535 m/0.1 s（102.9 s），207 為 1.509（73.1 s）。205 在 99.8 s d=2.63、100.8 s d=4.12、102.8 s d=29.93、104.2 s 超過50；207 在69.9 s d=3.34、70.9 s d=3.24、72.9 s d=29.93、74.3 s 超過50。之前也有明顯誤差峰值並回落。\n\n動作反向：205 從99.8 s +0.660到100.3 s -0.486；207 從69.8 s +0.683到70.3 s -0.516。roll 隨後由正轉負。兩次時點接近 WindowManager 的每100次更新（0.1 s取樣，約99.9/69.9 s）；只有時間上的關聯，不能斷言重規劃造成失敗或動作方向錯誤。\n\n205 風為 east=1,north=1,turbulence=0；207為1,-1,0。相同205風況的210能完成3000步，最大 d=22.224m；因此不是這個風設定必然失敗，也不能將原因單獨歸給 turbulence。\n\n現有 experience 沒有實際 E/N 位置、每次 planner path、選中路段與 guidance 內部分支。scenarios.mat 是輸入軌跡，不能當作實際規劃器輸出。尚不能區分策略追蹤不足、規劃路徑突變、目標選擇／距離計算問題。下一步宜在評估副本增加上述訊號記錄並只重播205/207及成功210，保持原 runtime、checkpoint、課程和 guard 不變；不要據此直接改 LR 或放寬終止門檻。\n\n本機忽略資料：diagnostic_packages/stage5_arrays.json、inspect_stage5.m、stage5_failure_analysis.png；原ZIP與解壓資料保留。沒有執行新的模擬，亦未提交／上傳原始資料。\n\n## 詳細訊號的後續證據\n\n來源 stage5_detailed_20261011_210426.zip，CRC 通過，6次 diagnostics 重播結果與初次摘要一致；離線匯出至 stage5_detail_arrays.json。仍未在本機重播21600。\n\nseed205 在99.8秒，位置(E,N)=(1029.14,680.54)，目標為舊path終點(1030.08,671.10)，距離9.49m但沿機頭方向投影為-7.48m（目標在後方），heta=-142.0度。99.9秒window_valid=1且planned_path更新，目標改為(1041.15,731.51)，投影+47.62m、heta=+20.4度。\n\nseed207 在69.8秒，位置(891.02,-420.84)，舊目標終點(882.59,-414.10)，距離10.79m、前向投影-8.26m、heta=-140.0度。69.9秒更新後目標(922.45,-461.65)，投影+44.28m、heta=+27.6度。兩次前後地速由實際位置差分計算約16.3–16.4m/s。\n\n相同時點無風205/207，目標前向投影約+50m，heta約2–4度，地速15m/s。有風成功210在99.8秒目標仍在前方約50m，地速13.66m/s。這是選定時點的對照，不能泛化為210全程沒有類似問題。\n\nWindowManager 每0.1秒按buffer_counter推進一個1.5m waypoint，valid每100次才更新規劃器。guidance在目前path剩餘點不足時以末點作目標。因此「有風地速較快，先超過當前path終點，在等待週期更新期間導引指向後方」已有直接訊號及程式支持。動作反向與之相鄰，但尚未以候選修改A/B證明此機制是全部失敗原因。\n\n終端位置到當前planner折線的獨立最近線段距離分別50.094/50.146m，與guidance_d相符；不是只有記錄d跳變。相反，在越過舊終點時，guidance_d僅2.63/3.56m而到有限path距離9.49/10.79m：現有d使用線段延長線的橫向距離，不等同到有限折線的最近距離。因此不能單憑d接近零認為目標合理。\n\n下一步：僅在候選評估副本測試依路徑剩餘距離／飛機進度提早更新或維持前向lookahead的方案，與原版使用同checkpoint/seed/風條件做A/B，再驗證無風及其他seed。不能直接將valid永久開啟（會改變規劃成本／亂數序列）、放寬50m門檻或重啟訓練。本次只調查及記錄，原SLX與runtime未改。\n\n## endpoint_lookahead 候選完整重播\n\n使用者提供 stage5_candidate_20261011_231618.zip，CRC通過，evaluation_20261011_231328_tpf04c8dcd status=complete，candidate_guidance.m SHA與報告吻合。205有風從1042步改善至3000；207從743延至1145但仍失敗；210及三條無風仍跑滿。這是環境候選效果，非重新學習；少量情境不是泛化驗證。\n\n207仍失敗前有候選覆蓋範圍的直接問題：第一版刻意只在guidance的is_inside分支延伸目標，outside分支保留原碼。由實際planner path的min/max±30m和位置重算：\n\n|時間|is_inside|飛機E|包圍範圍最大E|目標E|\n|---|---|---:|---:|---:|\n|108.9|true|1481.21|1481.50|1531.14|\n|109.0|false|1482.80|1481.50|1451.50|\n|109.8|false|1495.60|1481.50|1451.50|\n|109.9|true（新path）|1497.20|1605.82|1539.83|\n\n109.8秒目標前向投影-43.9m，guidance_heta=153.5度；109.9秒valid更新後heta=-35.1度。114.5秒終止時，guidance_d及當前有限planner折線獨立最近距離皆50.55m。原69.8秒的問題已被候選避開（目標前方49.9m、heta4.3度），但稍後跨出包圍範圍時又失去候選的目標延伸。\n\n結論：第一候選未涵蓋所有導引分支，不能稱修好。外部分支退回舊終點的跳變已證實；其對最终失敗的貢獻仍須下一個一致性候選做閉迴路A/B確認。不要把結果解讀為必須增加訓練或降低LR，也不能無條件延伸所有outside狀態（側向偏離時需要不同處理）。本次僅离線分析，未更動候選或正式模型。\n"},{"file":"records/code-comments-2026-10-12.md","name":"code-comments-2026-10-12.md","title":"原始碼註解與課程範例（2026-10-12）","group":"工作與驗證紀錄","text":"# 原始碼註解與課程範例（2026-10-12）\n\n對 79 個 Git 管理的專案／測試程式補上 383 行繁體中文註解：61 個 `.m`、10 個 `.ps1`、8 個 `.py`。保留既有英文註解，新增檔案用途、輸入輸出／副作用、函式責任、關鍵分支與限制；不為每個直觀賦值重述語法。\n\n範圍包含入口、runtime、模型定義、課程、guard、checkpoint 評估、遷移／報告／診斷打包及 Python 畫圖／匯出工具與測試。未修改 `runs/`、`tests/output/` 既有測試產物、`diagnostic_packages/` 內的歷史來源副本。驗證輔助產物新寫在忽略的 `tests/output/`，不作訓練輸入。\n\n修改前以唯讀程序清單確認本機沒有 MATLAB 訓練程序。本次沒有啟動 train、sim、pool，也沒有更改 SLX、checkpoint、control、guard 或任何課程 JSON，未 commit／push。\n\n## 驗證\n\n- 逐檔刪除本次新增註解後，79 個檔案原始 bytes 還原一致。\n- 10 個 PowerShell 檔案 parse 成功，排除註解後的 executable tokens 與 AST 節點結構一致；沒有執行這些腳本。\n- 61 個 MATLAB 檔案只執行 Code Analyzer，診斷種類／內容一致。既有 ALIGN 訊息內的 END 行號因註解平移，比較時只正規化訊息中的 `on line N.`。\n- 8 個 Python 檔案的 AST（忽略位置資訊）一致；不執行原工具／測試。\n- 訓練與評估的 fixed／random 路徑函式同步補同一份註解，原有逐字一致性檢查仍成立。\n- `git diff --check` 通過。\n\n補註解仍會改變程式檔的 SHA-256，因此新的 engine／工具指紋不可直接當成演算法或模型環境變更；本次可執行內容保持不變，SLX 原件也沒有修改。既有 run 及報告所記錄的歷史指紋沒有重寫。\n\n## HTML\n\n`docs/diagrams/training-explorer.html` 已更新原文、來源 SHA 與對應行號。它仍有 12 個流程方塊，另外增加「課程 JSON 範例」入口：完整 progressive_v1 JSON 與六階段分頁，旁邊解釋 `model`、軌跡／風場、all 條件、連續視窗與階段預算。JSON 保持標準格式，沒有往設定內加註解或新 schema 欄位。\n\n範例是共享定義的快照，不代表 run 階段、不內嵌 MAT、不啟動或套用課程。瀏覽器檢查包含 19 份內嵌來源與工作區一致、全部程式區段、六階段 JSON、點選／搜尋／連結以及四種桌面尺寸，詳見 [圖表驗證](../diagrams/evidence/verification.md) 與 receipt。\n\n## 後續加強\n\n使用者確認正式訓練只在遠端，本機沒有活動訓練。此次只修改本機副本，未連線或更新遠端 runtime。\n\n另在 10 個 `.ps1` 與 10 個核心 `.m` 檔加入 298 行註解，累計本次對話新增 681 行。PowerShell 說明包含 `$變數`／型別轉換、`param` 與必填參數、陣列與 hashtable、管線與 `$_`、dot sourcing、作用域、比較／位元運算、正規表示式、.NET 靜態方法／物件方法、程序引數及續行、錯誤／資源清理。相關说明放在實際操作旁，原有可執行行保持原樣。\n\n新增註解的原始 bytes 還原檢查及 PowerShell token／AST 比較通過；61 個 MATLAB 檔 Code Analyzer 診斷保持一致，路徑函式的逐字相容檢查通過。檢查時抓到並修正一處註解插在 `...` 續行 options 內的語法問題，現已移到整段呼叫之前；沒有改 executable code。\n"},{"file":"records/current-status.md","name":"current-status.md","title":"目前狀態與接續入口","group":"工作與驗證紀錄","text":"# 目前狀態與接續入口\n\n更新：2026-10-19。這是專案狀態摘要，不是遠端即時監控或所有聊天室的逐字備份。\n\n## 已完成\n\n- progressive_v2 run `20261017_071436_recovery_tp323769ed`：39300回合、attempt224、conditions_met，使用者確認沒有啟動新run。\n- 無探索Stage1–8共80次、探索Stage4–8共50次都跑滿3000步。不是130個獨立情境；[完整驗收與限制](success-evaluation-2026-10-19.md)。\n- Agent_Success與Agent39300的actor／critic可學權重及公開AgentOptions一致；optimizer私有狀態未驗證。\n- 兩份成果Release已下載到本機並通過SHA256：tag尾碼 `49e0834c5ef8`（無探索）、`e177d217bc1f`（探索）。來源與路徑見驗收紀錄。\n- 階段邊界與條件進度顯示已實作；[操作說明](../guides/training-progress-display.md)。連續模式可明確啟用，但不是自動LR控制器；[限制](../guides/continuous-training.md)。\n\n## 下一步\n\n1. 依[整理工具](../guides/workspace-layout.md)統一兩端目錄用途；遠端由使用者執行。\n2. 整理新agent從頭重跑入口，固定spatial_v2、八階段與環境SHA；尚未建立正式新run。\n3. [JSON自動決策](../research/autonomous-curriculum-proposal-2026-10-18.md)仍是提案：先可重播的shadow判斷，再獨立validation、有限延長與恢復。未實作自動LR／選分支。\n4. Stage8 seed902後段47.59m偏離保留為回歸案例；根因尚未分析，不能藉放寬50m門檻宣稱修復。\n\n## 查找紀錄\n\n- [歷史交接原文](project-history-through-2026-10-19.md)：原AGENTS完整封存，內含當時狀態與已失效的待辦描述；勿當作目前狀態。\n- [文件索引](../README.md)、[離線可搜尋首頁](../index.html)、[配方分類](../../configs/README.md)。\n- 各聊天室沒有自動完整寫入專案；重要新決策需更新本頁，細節另寫records／research並在AGENTS保留必要規則。歷史文獻與結論不改寫成最新結果。\n"},{"file":"records/from-scratch-training-decision-2026-10-14.md","name":"from-scratch-training-decision-2026-10-14.md","title":"純腳本從頭訓練的環境決定（2026-10-14）","group":"工作與驗證紀錄","text":"# 純腳本從頭訓練的環境決定（2026-10-14）\n\n## 使用者確認的方向\n\n未來整理純腳本從頭重跑時，從第一階段、第一回合就使用目前正式的空間循跡環境。後期有風情境促成的路徑處理修正，也適用於前期無風階段，不必等到有風才啟用。\n\n六階段共用一致的環境規則，依課程逐步增加路線難度與風擾；階段之間沿用同一個 agent。任務定位為「沿指定路徑穩定飛行，可依飛機進度更新路段」，不是追蹤按原時序移動的目標。\n\n## 從頭重跑應保留的正式修正\n\n- 初始化首次呼叫即提供有效完整 window。\n- 已正式部署的第二版末端 lookahead 處理，依既有條件延伸引導目標。\n- guidance 只使用有效歷史路徑範圍，排除尚未填入的零列。\n- WindowManager 依局部單調進度更新，接近路段尾端時提前提供連續下一段。\n\n問題指的是飛機越過「目前局部路段的末點」，使引導目標落到後方，並非已完成整條任務路線。風會改變地速與進度，但無風也可能遇到此情況，因此上述處理不應限定於有風階段。已納入正式 SLX 的修正直接使用，不再次套用舊候選轉換函式；未部署的重疊 window 候選不納入。\n\n## 未來實作與驗證邊界\n\n純腳本重跑應建立新 run、初始化新 agent，固定並記錄正式環境版本與 SHA、課程及執行設定，從第一階段開始；不以既有 recovery 分支的訓練歷史替代從頭驗證。此次決定不另行更改 reward 公式、終止門檻或 PPO 參數。\n\n既有 Agent31600 在目前環境的前三階段單 seed 評估均跑滿 3000 步，全部評估共 43 個不同組合跑滿；這支持既有能力在此次測試中保留，但不證明新 agent 從頭訓練能穩定收斂或整套課程已合格。仍需另行驗證從頭訓練及各階段評估；舊環境與新環境分數不能直接當成同一條學習曲線。\n\n本次僅記錄未來重跑方向，不實作入口腳本、不修改 runtime 或既有 run、不啟動訓練；未授權 commit 或 push。沿用先前在目前方案確認合格後，再整理純腳本重跑驗證的安排。\n\n## 相關文件\n\n- [空間循跡部署與操作](../guides/stage6-progress-training.md)\n- [空間循跡評估證據與限制](stage6-progress-validation-2026-10-13.md)\n"},{"file":"records/project-history-through-2026-10-19.md","name":"project-history-through-2026-10-19.md","title":"歷史交接原文（封存至2026-10-19）","group":"工作與驗證紀錄","text":"# 歷史交接原文（封存至2026-10-19）\n\n以下為整理前AGENTS全文，保留當時表述；其中已被取代的狀態不是目前指令。最新資訊見 [current-status.md](current-status.md)。\n\n---\n\n# 專案背景與工作規則\r\n\r\n## 連續訓練與雙機同步（2026-10-19 後續）\r\n\r\n- 使用者明確授權檢查、測試並推送先前未提交的 continuous-training 程式與配方；不包含簡報、診斷 ZIP、模型或啟動訓練。未設定的舊配方維持原暫停行為。\r\n- continuous_training=true 僅在 prepare 的新分支啟用 on_limit=continue、budget_enabled=false、regression_action=monitor；原過關條件、父 run 保留，既有暫停鎖不繞過。這不是自動 LR／回滾控制器，也不保證收斂；18500 配方是歷史恢復用途，不是完成39300後的新訓練指令。操作與測試見 docs/guides/continuous-training.md。\r\n- MATLAB 三組合成／假引擎測試及 Python 42 項測試通過，沒有 train/sim。實驗室由使用者執行更新；其未追蹤 configs/recovery_v2_18000_guarded.json 須先保留，避免阻擋 pull；不得 reset/clean 或覆蓋其本機簡報說明修改。\r\n- 上述 Release 已由實驗室成功上傳並下載驗證，本機也已 sync 並通過 ZIP／逐檔 SHA256，共105檔、58,971,797 bytes，位於 artifacts/results/result-20261017_071436_recovery_tp323769ed-49e0834c5ef8，含 Agent_Success.mat。此紀錄取代下方早期「尚未傳輸／驗證」狀態。尚未核對 success 與受評估 checkpoint 的可學權重是否相同。\r\n\r\n## GitHub 雙機成果同步（2026-10-19）\r\n\r\n- 使用者決定程式碼維持 Git push/pull、成功模型／環境／完整評估透過同 repo Release 附件同步；不把活動 run 相互覆蓋、不將 MAT／完整日誌加入 Git 歷史。\r\n- 新 training_artifacts.py：pack 離線封裝；publish 封裝並建立 Draft Release、上傳後重新下載驗證；sync 依明確 tag 下載到 artifacts/results/。使用 gh 既有登入、origin 推導 repo、SHA256 manifest；重跑不 clobber、不修改既有來源／快照、不自動公開 release、不啟動訓練。詳見 docs/guides/github-artifact-sync.md。\r\n- 包含 Agent_Success 與實際受評估 checkpoint，不以相同回合數宣稱權重相同。這是評估封存包，不是可直接 retry 的完整 run；不要自行補 supervisor.lock 或修改原機器控制路徑當作跨機續訓。\r\n- 使用者貼回 evaluation_20261018_234801_tpc304c6c6：39300、八階段各10次、seeds901:910、useExploration=false，共80次全跑滿3000。前三固定路徑的多 seed 結果重複，不當作十條不同路徑；尚未在本機核驗完整模型／traces，也未證明從頭自主訓練成功。\r\n- 工具以合成檔案及 mock gh 驗證，尚未建立真實 Release／傳輸實驗室模型；首次實際發布由使用者在實驗室執行。依本對話既有 push 授權提交同步工具，保留其他未提交修改；不自行啟動新一輪訓練。\r\n- 後續實驗室已產生並驗證 `result-20261017_071436_recovery_tp323769ed-49e0834c5ef8` 包，建立 draft 後查詢失敗；使用者貼回 gh release view 確認 draft/tag/body 正確，尚未確認附件已上傳。工具修正為精確 tag 查詢、區分不可見／內容不符，新增 `upload \u003c原JSON>` 接續原包不重打包。ZIP SHA256 為 ea599944359e847da901980cb8c422f87bd341dfba36b423d68e057ecc55d022；這是使用者提供的草稿說明值，尚非本機下載驗證。\r\n\r\n## 訓練結束後自動接續的顯示改善（2026-10-18 已實作）\r\n\r\n- 使用者貼回目標 run 在 2026-10-18 19:31:16 +08:00 的成功結果：attempt 224、39300 episodes、conditions_met、Agent_Success.mat，pool 關閉且正常退出；後續確認另一端執行已終止，授權接手現有修改。本機修改前未發現 MATLAB 程序。這是使用者提供的遠端完成證據，不是代理即時連線檢查。\r\n- 已完成 stage 精確邊界、圖表條件面板、training_status 與 callback 行末進度；判定共用 progress，Python 按同樣條件語意計算。日誌是 rounded provisional estimate，保存 outcome 才是正式判定；缺回合保留未知位置、繼承在 fork 裁切。使用與測試限制見 docs/guides/training-progress-display.md。\r\n- 使用者後續授權本批 commit/push；不包含自行更新實驗室副本或啟動正式訓練。先前「未授權 commit/push」由此取代。工作區原有 continuous-training、guard、恢復配方與簡報變更保留，不混入本批顯示改善提交。\r\n- 使用者另要求評估下一輪可少干預的 JSON 決策課程。已寫 docs/research/autonomous-curriculum-proposal-2026-10-18.md，含驗收指令、八階段從頭驗證、有限 LR 介入／分支、驗證集與最後測試分離、冷卻與中斷恢復。這是提案，controller schema 與自動介入尚未實作；下一步先獨立評估完成模型，未啟動新訓練。\r\n\r\n- 原授權要求先記錄，等實驗室 progressive_v2 訓練跑完後才實作；不得修改活動中的 runtime 或啟動／終止訓練。目標 run 為 `20261017_071436_recovery_tp323769ed`；當時其他聊天室貼回的 episode 37680、Stage 8 已由上述完成證據取代。\r\n- 後續代理取得訓練已結束、且待更新副本沒有活動訓練的明確證據後，應主動接續以下已授權實作，不需再詢問是否要做，以免使用者忘記。不得只因預估到達某個 episode 或經過一段時間就認定已結束；未結束前保留待辦。\r\n- Reward 圖：在既有 stage 分界上明確標示「哪個 episode 切換到哪個 stage」，沿用 run 實際課程歷史與 lineage 邊界語義，區分上一階段最後回合與新階段第一回合，不以圖形位置猜測或補造歷史。\r\n- 圖表另顯示當前階段過關進度：每項條件的目前值、門檻、是否達標，以及還差哪些條件才能進入下一階段；最後階段改為顯示還差哪些條件才能完成課程。包含最低階段回合數、平均 reward、平均 steps、跑滿指定步數的比例、連續達標區間數，依該 run 課程快照實際定義顯示，不硬編碼 Stage 8 門檻。\r\n- `training_status(info.sessionDir)` 同樣顯示上述當前條件與未達標原因；訓練日誌 `Episode: xx/xx | ...` 行末追加精簡的階段／過關進度資訊，讓使用者直接看到滿步比例及其他條件差距。\r\n- 顯示邏輯須與實際課程判定共用或保持一致，正確處理 all/any、區間不足及最低回合數；明確標示資料截至哪個 episode，以及即時日誌暫算／checkpoint 保存邊界的正式判定差異。保留原日誌欄位及現有報告／畫圖解析相容性。\r\n- 此項只改善可觀察性，不改課程門檻、reward、agent、guard 或切換規則，不改寫既有 run 快照／階段狀態。實作後做對應合成歷史與日誌相容性驗證；不自行啟動正式訓練。本次未授權 commit/push 或直接更新遠端。\r\n- 本段是持久待辦與後續實作授權，不是已建立排程或遠端完成監控；代理需在後續對話或獲授權的執行中讀到完成證據才接續。\r\n\r\n## 2026-10-17 Stage 4 探索減半短續訓\r\n\r\n- 實驗室 Agent18000 新 seeds701:712 原探索11/12、std乘0.5為12/12跑滿；seed705從302變3000步。這不是訓練收斂或唯一根因證明。\r\n- configs/recovery_v2_18000_std_half.json 從162607恢復分支的18000另開run，actor LR維持2.5e-5、spatial_v2不變、100/段、最多新增500至18500，保留80%雙指標兩區間guard。使用者在遠端自行啟動。\r\n- prepare可一次性將actor softplus後加0.5固定倍率，保存model.json探索倍率與子run建構/驗證程式快照；不改父run，拒絕重複套用。底層std仍可學習，不保證後續噪音不會增加；optimizer私有狀態未驗證保留。\r\n- 新分支checkpoint評估用useExploration=true、預設explorationStdScale=1，因checkpoint已含0.5。操作與限制見docs/guides/progressive-v2-std-recovery.md。\r\n\r\n## 來源與獨立定位\r\n\r\n- 使用者於 2026-10-09 確認，本專案是**複製**出來的，不是搬移；原資料夾仍存在。\r\n- 原始來源：`D:\\daniel\\GradSchool\\0-Beginner\\Paper\\Flower\\Deep Reinforcement Learning\\ModularTraining`。\r\n- 現在的獨立專案：`D:\\daniel\\GradSchool\\0-Beginner\\ModularTraining`，位置在 Flower 所在的 Paper 資料夾之外。\r\n- 使用者於 2026-10-09 告知已自行將此獨立專案放上 GitHub；本機也已有 Git repository。這不代表授權代理自行 commit 或 push。\r\n- Flower 提供研究背景與原始實作參考；不要將其路徑當成本專案的執行依賴，也不要假設兩邊後續仍同步。\r\n- 使用者已授權讀取 `D:\\daniel\\GradSchool\\0-Beginner\\Paper\\Flower`。此授權不包含修改來源資料夾。\r\n\r\n## 實作注意事項\r\n\r\n- 路徑應從程式／專案所在位置推導，避免硬編碼本機絕對路徑或依賴 Flower 的相對位置。\r\n- 訓練入口是 `retry.m`；模型定義在 `+trainingmodels/`，獨立執行引擎在 `runtime/`。\r\n- 新課程實驗資料在 `experiments/\u003c課程>/runs/\u003c實驗>/`；非課程與既有實驗保留 `+trainingmodels/\u003c模型>/runs/\u003c實驗>/`。複製的舊設定可能包含來源絕對路徑，續訓前需確認其指向。\r\n- 不要擅自啟動、終止訓練或修改活動中的 runtime。\r\n- 準備 GitHub 時遵循 `.gitignore`，不要自動納入訓練成果、checkpoint、日誌或快取。\r\n\r\n## Reward 畫圖工具\r\n\r\n- 根目錄的 `plot_training_rewards.py` 移植自 Flower 的 `Deep Reinforcement Learning/Simulink/plot_training_rewards.py`。\r\n- 已調整為搜尋本專案 `experiments/\u003c課程>/runs/`、模型的 `runs/` 與舊 `sessions/`，無須讀取 Flower。\r\n- 使用 Python 與 matplotlib，讀取實驗內 `attempt_*/stdout.log`，輸出 `reports/reward_history.png` 與 `.csv`。\r\n- 相同 episode 重複出現時採用較新 attempt 的紀錄；`--watch` 定期更新圖表，不控制訓練程序。\r\n\r\n## 雙機與診斷分享（2026-10-09）\r\n\r\n- 使用者有宿舍與實驗室兩台電腦；本次提供的 387,512 episodes／388 attempts reward 圖來自實驗室，不代表目前本機已有該實驗日誌。\r\n- 圖中約 18 萬回合後長期低 reward 是待調查的觀察，不能直接歸因於 learning rate、LSTM 或 checkpoint 損壞。\r\n- 用根目錄 `export_training_report.py \u003c實驗資料夾> --machine lab`（或 `dorm`）產生 `\u003c實驗資料夾>/reports/report.json`，作為可提交 GitHub 的精簡診斷紀錄。\r\n- 完整訓練日誌、MAT checkpoint、快取留在產生資料的電腦；`.gitignore` 只放行指定結構的精簡報告。匯出不等於授權 commit、建立遠端或 push。\r\n- 分享報告不等於搬移可續訓實驗。跨機續訓要另行確認 checkpoint 與 control.json 路徑，尤其 diagnosticDir 可能仍指向舊電腦。\r\n- 匯出器獨立於 runtime，不修改訓練或自動停訓；當下程式指紋不能當作歷史執行版本的證明。\r\n- 架構審視、限制與本次工作紀錄見 `docs/records/review-2026-10-09.md`；分享方式見 `reports/README.md`。\r\n\r\n## Worker 與學習退步處理（2026-10-09 後續）\r\n\r\n- 使用者希望同一段訓練立即使用可用的 n 個 MATLAB workers，而非只在下一次 attempt 降級。\r\n- `retry(workers=6,minWorkers=1)` 現在以 `[minWorkers,workers]` 範圍建立 pool；成功取得 n 個後，在同一 attempt 使用 n 個，seed 數量亦依實際 pool 大小。`minWorkers=workers` 可要求固定數量。\r\n- 範圍建池不等於保留未完成的連線；pool 整體建立失敗／卡住時仍走 supervisor 的失敗恢復與 watchdog。fallbackWorkers 作為失敗後的上限備援，不得低於 minWorkers。\r\n- `learning_health.py` 在匯出報告時依連續區間計算疑似退步，預設只診斷，不自動停訓、回滾或改超參數。單次匯出不會持續監控。\r\n- 預設門檻是待驗證的工程規則，不能當成 PPO 故障或 learning rate 過大的證明。策略及實作範圍見 `docs/guides/learning-health.md`。\r\n- 本機修改不會自動同步實驗室；更新實驗室 runtime 前應先確認該副本沒有活動訓練。\r\n\r\n## JSON 分階段課程（2026-10-09）\r\n\r\n- 使用者確認階段之間沿用同一個 agent，只改軌跡與訓練條件；模型放在 JSON 最外層。不要擅自把階段切換改成重新初始化模型。\r\n- 新入口：`retry(curriculum=\"curricula/fixed_to_random.json\",start=false)` 可建立計畫與輸入快照；`curriculum_plan(...)` 只檢查設定。使用者未授權啟動正式訓練。\r\n- 支援內建固定路徑、MAT 軌跡和 random 軌跡。兩個 MAT 輸入的模板是 `curricula/two_mat_then_random.example.json`；使用者尚未提供實際軌跡1／軌跡2，不能假設檔案存在或變數格式相容。\r\n- 條件支援 all/any、階段回合數、平均 reward／steps 及達指定步數比例；詳見 `docs/guides/curriculum.md`。範例門檻只是示範，不是已驗證的論文復現參數。\r\n- 條件只使用 checkpoint 保存的歷史，在存檔邊界切換；`max_episodes` 是當階段預算，`on_limit=pause` 保存後暫停，只有明確指定 advance 才按預算換階段。\r\n- 每個實驗保存 `curriculum.json`、`curriculum_assets/`、`curriculum_state.json`、`curriculum_outcome.json`。已有 checkpoint 卻遺失階段狀態時拒絕猜測，不可隨意刪除狀態或改寫課程快照。\r\n- 課程模式的過關條件以 JSON 為準，不接受另外傳入 targetReward；既有非課程實驗維持原流程。不要把既有普通實驗直接改旗標當成課程實驗。\r\n- `+trainingcurriculum/` 屬執行程式，與 runtime 一樣不得在活動訓練期間修改。MAT 輸入不會自動納入 Git，沿用原忽略規則。\r\n- 已通過合成歷史、入口假引擎、設定與報告測試；2026-10-09 亦在使用者授權下完成 CPU／1 worker 的真實 Simulink 三階段短測，見 `docs/records/validation-2026-10-09.md`。不能將其視為長期收斂或多 worker 驗證。\r\n\r\n## 六階段訓練方案與短測（2026-10-09）\r\n\r\n- `experiments/progressive_v1/curriculum.json`：直線 → 平緩 S 彎 → 固定轉彎 → random 無風 → 小風擾 → 完整風擾，沿用 ppo_lstm128。設計、起始門檻、限制與操作見 `docs/guides/training-plan-v1.md`。\r\n- `prepare_progressive_training()` 只生成可重建的 MAT 輸入並檢查設定，不啟動訓練；兩台電腦各自執行即可。不同內容的既有 MAT 不會被覆寫。\r\n- 每階段使用最低回合數與連續三個 100 回合區間表現門檻，預算用盡 pause。數值尚未經長訓練校準；不宣稱能防止所有退步，learning_health 仍只在匯出時計算。\r\n- 使用者這次授權短時間真實測試；`tests/test_curriculum_end_to_end.m` 已完成固定 → MAT → random 各一回合，總計 525 步、約 434 秒，確認跨階段 actor／critic 權重接續。測試已退出，沒有啟動正式六階段長訓練。\r\n- 獨立 evaluator、最佳評估 checkpoint 選擇、可設定 root seed、退步自動停訓／回滾尚未實作；不要把規劃文件中的後續建議當成現有功能。\r\n\r\n## 實驗室正式設定與提交（2026-10-09）\r\n\r\n- 使用者本次明確要求 commit／上傳這批訓練方案，並準備遠端 6 workers＋GPU 設定；不在本機測試此組合或啟動正式訓練。\r\n- `configs/lab_gpu6.json` 保存 retry 參數，使用 progressive_v1 課程、workers=6、minWorkers=1、device=gpu；仍維持當次有 n 個可用就先用 n 個的策略。操作步驟見 `docs/guides/lab-start.md`。\r\n- 執行參數 JSON 透過 jsondecode 與 namedargs2cell 傳入 retry；在專案根目錄執行。不要將硬體參數混入嚴格驗證的 curriculum schema。\r\n- 實驗室回報 Java 將相對課程路徑解析到 System32；retry 已改為先從自身專案根目錄建立絕對路徑，再 canonicalize，resume 同樣處理。不要直接以 java.io.File(relative).getCanonicalPath() 解析使用者路徑。原 CPU 短測用絕對路徑，未涵蓋這項啟動差異。\r\n\r\n## 課程分類與活動實驗保留（2026-10-10）\r\n\r\n- 使用者希望以課程管理實驗、模型為課程參數。標準 curriculum.json 入口按父課程資料夾名稱存入 experiments；其他獨立 JSON 按檔名分類；同名計畫共用分類但各有唯一實驗 ID。\r\n- 實驗室的 20261009_201547 實驗仍在舊目錄且使用者希望保留；禁止為結構調整而搬移或修改活動實驗。續訓始終依指定目錄原位進行。\r\n- 畫圖新增由 curriculum_state.json 讀取的橘色 stage 分界與軸下方標籤；灰線為 attempt。可單獨更新 Python 畫圖檔並重啟畫圖工具，完整執行程式更新則等訓練退出後進行。\r\n- 操作與備份限制見 docs/guides/curriculum-layout.md；此次只做無訓練驗證，不代表遠端模型已備份或可安全搬移。\r\n- 使用者後續回報實驗室 attempt 8 已 STOP，並要求把此次模型接續到新架構、上傳修改。migrate_training_session.ps1 僅對已停止且可取得鎖的實驗完整複製與逐檔 SHA256 驗證，原件保留；新副本的控制路徑修正，歷史紀錄不改寫。verify_training_session 在 MATLAB 唯讀檢查可用 checkpoint 及階段位置後，才由使用者 retry(resume=新位置)。不得在兩份副本同時續訓。\r\n- 畫圖 stage 缺失修正：MATLAB jsondecode/jsonencode 會將 singleton struct array 重新編碼為單一 object，completed 必須兼容 list／object；不可據此認定階段歷史遺失。PNG 使用同目錄暫存檔完成後替換，watch 遇 OSError 會提示並重試；不修改訓練狀態。\r\n\r\n## Stage 3 低分調查（2026-10-10）\r\n\r\n- 使用者已停止實驗室 attempt 25 並提供精簡報告，日誌觀察到 12616 回合。詳見 docs/research/lab-regression-2026-10-10.md；此回合數不是已驗證的 checkpoint 進度。\r\n- Stage 3 從 6101 開始；約 10700–10800 的下降在 attempt 22 內（10101–11100、4 workers），未與換階段／重啟邊界重合。最近 1000 回合平均步數 173.56，87.9% 少於 256 步，不能僅視為畫圖現象。\r\n- 根因尚未證實；先保留 6100、下跌前約 10600 和最近可用 checkpoint 候選。獨立評估與分支恢復尚未實作，勿直接改課程狀態或覆蓋 checkpoint 作回滾，也未授權重新啟動訓練。\r\n\r\n## 課程工作區與每次實驗報告（2026-10-10）\r\n\r\n- 正式課程定義移至 experiments/progressive_v1/curriculum.json，prepare_progressive_training 產生同層 assets/；curricula/ 保留其他範例。舊 progressive_v1 入口由 resolve_curriculum_path 相容轉址。\r\n- curriculum_state.json 是各 run 的實際進度，必須留在 runs/\u003csession>/；頂層只放共享定義，既有 run 的課程和輸入快照不改寫。\r\n- 圖表與精簡報告預設輸出到各 run/reports/。Git 僅放行頂層 curriculum.json 及 run/reports/report.json；MAT、完整日誌、PNG、CSV 仍忽略。\r\n- organize_training_reports.ps1 在停止狀態與排他鎖下複製舊報告和圖表，比對雜湊、保留原件；相同檔案可重跑，不同目的檔拒絕覆蓋。已遷移的 run 不要重跑完整 migrate_training_session。\r\n- 使用者明確授權本次架構修改、commit 與 push；沒有授權重啟目前因 Stage 3 退步停止的實驗。驗證使用 Python、PowerShell 合成測試與 MATLAB start=false，不代表長訓練收斂驗證。\r\n\r\n## 停訓 checkpoint 比較（2026-10-10 後續）\r\n\r\n- compare_training_checkpoints(sessionDir) 預設比較 6100、10600 及最新存檔，在快照前三階段各做一次 CPU 純 sim；不啟動 pool、不 train、不 prepare 課程或回滾。只支援無風 MAT／fixed_builtin。\r\n- 使用者確認實驗室 6100 與 10600 存在，但尚未評估。不可把本機既有短測 checkpoint 的模擬當成實驗室結果。\r\n- 結果在每次 run/reports/evaluation_\u003c時間>_\u003c唯一碼>/；逐次 JSON 和 MAT traces 都受 Git 忽略，可請使用者貼 evaluation.results。預設固定條件單 seed 診斷不是泛化成功率。\r\n- 工具鎖住已停止實驗，檢查原 checkpoint SHA256 及 sim 前後權重。IsDone 不是具體物理終止原因，observation7_rms 不是已確認公尺單位誤差。分支恢復、自動最佳模型選擇與停訓仍未實作。\r\n- 操作與測試見 docs/guides/checkpoint-comparison.md；使用短系統暫存路徑做 Simulink 快取，避免 Windows 260 字元限制。不要在原 checkpoint 裡改探索模式／裝置後另存覆寫；工具只改記憶體內 agent。\r\n\r\n## 恢復試驗與自動暫停（2026-10-10 後續）\r\n\r\n- 使用者貼回實驗室評估：6100／10600 在直線及 S 彎各 3000 步，固定轉彎為399／1578；12600 三項均138步。僅證明該固定條件下退步，10600 是三個候選中的恢復起點，不稱全歷史最佳。\r\n- 新 prepare_recovery_training(parentSession) 預設用 configs/recovery_actor_half.json：10600、actor LR 乘0.5，其餘學習參數與課程不變。另建新 run、保留權重與歷史、記錄 recovery.json，不改父實驗，不自動訓練。model.json 與 agent optimizer rate 同步。\r\n- 硬體沿用父 control；段落改100回合，總新增上限1000。段落與 seed 變化也是差異，不能把效果全歸因於 LR。以 retry(resume=新session) 才正式啟動。\r\n- 新分支 training_guard.json：同階段100回合區間、參考 reward/steps 均>=500，連續3個區間 reward 與 steps 都低於參考的50%時，在保存後暫停；總預算到達亦暫停。training_guard_state.json 暫停保持鎖定，單純retry不繞過。\r\n- health_candidates/CandidateN.mat 只是訓練區間候選，不是最佳評估模型。沒有自動回滾、改參數、重啟分支或週期獨立評估；手動 compare_training_checkpoints 仍可用。learning_health.py 與 runtime guard 不同，report.json 分別呈現。\r\n- 本次使用既有本機 checkpoint、合成歷史與假引擎驗證，不啟動正式恢復訓練或 GPU／6 workers。配方、操作、限制見 docs/guides/recovery-training.md。\r\n- 實驗室 recovery 在 11000 被 guard 暫停；比較 checkpoint 時報告寫入例外遮住原始錯誤。評估工具已改為預先綁定報告函式，保留 phase、原始堆疊，寫報告失敗不能取代原始例外。本機未重現實驗室最初錯誤，需依重新執行後的原始訊息調查；不要因此續訓或改 guard 狀態。\r\n- 後續實驗室證實預先綁定 package handle 仍可能呼叫失敗；現改成入口內直接 catch/rethrow 與同檔 local JSON writer，不再使用 fail_evaluation 套件函式。切換 Simulink 快取／目錄與載入模型後補回 root/runtime 路徑。實際入口故障注入已驗證：移除 root 路徑後仍保存失敗報告、拋出原始模型錯誤；實驗室初始錯誤仍待確認。\r\n- 實驗室後續完整評估成功：10600 步數3000/3000/1578，10700為133/134/133，11000均144；第一段100回合內已觀察到舊任務能力下降。audit_training_resume 唯讀核對既有 Agent_Initial 與其 resume 來源、主要設定及權重差異，不解析 optimizer 私有狀態、不自動續訓。單 seed 結果不證明根因，操作見 docs/guides/resume-audit.md。\r\n- 使用者同意以診斷 ZIP／GitHub Release 附件跨機分享，不解除 MAT/log 忽略或重寫 Git 歷史。pack_training_diagnostics.ps1 只在停止狀態及排他鎖下選取 checkpoint、initial snapshot、evaluation traces 與設定日誌，產生 diagnostic_packages/ ZIP 並驗證逐檔 SHA256；不自動上傳、不啟動訓練，子集不能作完整續訓備份。實驗室打包和草稿附件流程見 docs/guides/diagnostic-package.md。\r\n- 實驗室 ZIP 已由使用者複製回本機並通過38檔雜湊驗證。讀取 traces 並比對相同SHA256的模型後，確認本次提前終止對應模型 d>=50m，非roll±40度；observation7=d/30。10601–10700 同一 attempt 內表現逐步變差。根因仍未證實，尤其前約10秒 d=0 不可解讀為完美循跡；詳見 docs/research/lab-trace-findings-2026-10-10.md。未啟動訓練或模擬。\r\n- 後續離線actor重播各自trace最大action誤差0；相同10600觀測前150步，10600/10700均值平均絕對差0.365。純函式驗證WindowManager首次valid在第100次(0.1秒取樣)，之前planner輸出單點導致guidance回傳假零誤差。首次valid候選僅在diagnostic_packages副本測試[1,100]，未改SLX或runtime，未證實是更新退步唯一根因；閉迴路候選比較尚未做，不得宣稱已修復收斂。\r\n- 使用者後續要求修正初始化：runtime/FAFA_Simulation.slx的WindowManager改成首次呼叫及原週期發出valid，仍需完整window。只更改chart60一行；tests/test_window_startup從實際模型驗證[1,100,200]和短路徑拒絕。這是環境版本變更，不能把新舊分數直接合併；不改既有checkpoint/課程快照或自動續訓。操作見docs/guides/startup-path-fix.md。\r\n- 初始化修正A/B：實驗室10600與10700各在原版/修正版直線seed101 CPU評估，上限200步；10600均200步，10700由原版133步IsDone變為修正版200步上限。四次權重及checkpoint SHA不變；無訓練，未證明3000步完成或長期收斂。新評估使用新模型SHA，不與歷史環境混為一談。\r\n- 完整實驗室回報修正版10600/10700直線及S彎皆3000步，固定轉彎1578/1589；10700仍較大循跡誤差。使用者決定新run：configs/recovery_startup_fix.json從第一個recovery分支10600接續，來源LR必須2.5e-5，scale=1，不再減半；沿用stage3快照和硬體，100/段、上限1000。prepare記錄當下runtime模型/引擎SHA但不啟動。共用課程JSON不改，舊run不改；操作見docs/guides/startup-path-fix.md。\r\n- 11600評估直線/S彎3000步、固定轉彎2673步。使用者決定先維持共同判讀訓練，合格後提醒整理純腳本另行重跑驗證；已設定本對話條件式提醒，未確認合格時保持安靜。跨夜配方configs/recovery_11600_overnight.json從20261010_201201分支11600另開run，新增10000（最終要求，取代5000），最多21600，LR不變、100/段、guard保留。不要自動解除退步停訓或宣稱一定跨夜/合格。\r\n\r\n## Run 繼承與跨實驗畫圖（2026-10-10 記錄，2026-10-11 實作）\r\n\r\n- 2026-10-10 原要求只記錄；2026-10-11 使用者授權實作畫圖與文件。plot_training_rewards.py 預設沿 recovery.json 的 parent_session／parent_episode 追溯，祖先只取到分支 checkpoint，子 run 只取接續後的新回合；不同 run 不套用較新 attempt 覆蓋規則。CSV 帶來源欄位，stage 橘線、接續點紫線、各 run 平均 reward 分色。\r\n- --no-lineage 恢復單 run 畫法；--lineage-root 提供跨機搬移後的搜尋根目錄。同名來源不唯一、來源缺失、循環或錯誤繼承關係會提示，不猜測來源、不補資料。只讀日誌與 JSON、寫指定 PNG／CSV，不修改 checkpoint、課程、控制或訓練程式；訓練中可單獨更新畫圖檔並重啟畫圖程序。\r\n- 圖例的 prepared_runtime_model_sha256 只證明 prepare 當時環境，configured avg window 來自當下 control，不是歷史執行證據。平均 reward 保留日誌值，不跨 run 重算；未知 reward 版本不能宣稱可直接比較。不實作所有分支比較或其他指標圖。操作、限制與合成測試見 docs/guides/run-lineage-proposal.md。\r\n\r\n## Stage 5 配對評估（2026-10-11）\r\n\r\n- 實驗室 21600 因 recovery_budget 暫停；前三項無風任務均跑滿，但 Stage 5 低分原因尚未證實。使用者授權下一步擴充評估，不授權續訓。\r\n- compare_training_checkpoints 現支援 random 與課程風場；相同 seed 配對路徑，另外抽樣整數風，保存 scenarios 與逐次 traces，CPU 純 sim、不改 runtime/checkpoint/guard。操作見 docs/guides/stage5-evaluation.md。\r\n- summary 提供樣本完成率及最差 reward trace；終端門檻證據不是 IsDone 分支因果證明。內部 turbulence seeds 沿用 SLX；多 seed 不等於獨立噪音時序，10 組診斷不代表合格。實驗室 21600 checkpoint 尚未在本機測試。\r\n- 使用者提供完整20次Stage4/5評估ZIP：無風10/10、有風8/10；205/207在104.2/74.3秒達d≈50，動作反向接近路徑更新時點，未證實因果。純離線比對與限制見 docs/research/stage5-trace-findings-2026-10-11.md。\r\n- diagnostics=true 只在暫存SLX副本啟用訊號記錄，新增位置、planner/window paths及guidance目標；原runtime/checkpoint不改。下一步實驗室重播205/207/210並核對原結果，保持訓練暫停。未授權自動重啟訓練。\r\n- 詳細ZIP證實205/207失敗前地速16.3–16.4m/s、越過當前path末點，目標落到後方，valid更新後跳回前方；終端獨立折線距離與d一致。不能單凭此認定唯一根因。新增評估專用 guidanceVariant=\"endpoint_lookahead\"，只在暫存副本沿末段切線補足lookahead，不動正式SLX/reward/IsDone。說明與A/B指令見 docs/research/endpoint-lookahead-candidate.md；尚未驗證21600候選效果，不得啟動續訓或宣稱修復收斂。\r\n- 第一版候選在實驗室205有風改善至3000、207延至1145仍失敗；詳細trace確認109秒越出包圍範圍時outside分支退回舊終點。第二版 endpoint_lookahead_v2 僅對outside且最近點為末點、沿切線超越、側偏≤30m時延伸目標，其餘保留。不改正式模型；第二版21600效果仍待實驗室A/B，不可宣稱已解決。\r\n\r\n## 第二版正式部署（2026-10-12）\r\n\r\n- 實驗室第二版擴展測試43/43跑滿3000步，另原版新情境20/20；前三階段能力在單seed保留，Stage6未驗證，不代表整體合格。詳見docs/guides/endpoint-v2-training.md。\r\n- 使用者授權正式納入修正、push並提供立即續訓指令。runtime SLX guidance 採用已評估第二版；不改reward/IsDone。新configs/recovery_21600_endpoint_v2.json從21600另開run，LR不變、100/段、新增10000至最多31600、guard保留、Stage5進度沿用。不得改寫父實驗或自行在本機啟動正式訓練。\r\n- baseline現在表示正式第二版環境；候選函式拒絕重複套用，舊版guidance文字fixture只供測試。新舊環境分數不能全視為agent學習變化。prepare記錄新環境SHA；用戶自行在實驗室啟動。\r\n\r\n## Stage6 有效歷史路徑候選（2026-10-13）\r\n\r\n- 使用者提供兩個診斷ZIP並授權繼續隔離評估。380個manifest檔案及補充包SHA已驗證；本機首次使用實驗室31600checkpoint做CPU純sim，未訓練。工作區既有註解及文件重組修改保留，未提交。\r\n- 確認guidance的path_CTE包含global_path未填入零列，末點可能錯連(0,0)。新增guidanceVariant=\"valid_history\"僅在評估副本截到path_length，正式SLX未改。27次評估：baseline4次重現；候選小風10/10、完整風6/10、前三階段3/3，完整風失敗步數2596/998/695/730變2715/1111/1417/730，並非已修復合格。\r\n- 剩餘失敗有真實偏離與path更新後目標轉向；不可僅放寬門檻、改小d或盲目續訓。後續需評估前方路徑不足與時間window/實際地速進度的關係，不能未說明便改任務語義。來源、證據與限制見docs/records/stage6-history-review-2026-10-13.md。\r\n\r\n## Stage 6 空間循跡部署（2026-10-13）\r\n\r\n- 使用者明確選擇「沿指定路徑穩定飛行，可依飛機進度更新路段」，授權此任務語義變更；不再宣稱追蹤按原時序移動的目標。\r\n- 正式 SLX 修正有效歷史範圍，WindowManager 改成局部單調進度、距尾約40點時提前提供連續下一段。重疊 window 候選退步，未部署；未改 reward 公式、終止門檻或 PPO 參數。\r\n- 實驗室 Agent31600 的本機 CPU 純sim：Stage5 10/10、Stage6既有10/10、新20/20、前三階段3/3，共43個不同組合全跑滿3000。四例獨立原始路線距離RMS8.86–10.57m；全程最大50m皆在初始t=0，10秒後最大18.50–21.28m。這不是完整合格或長訓練收斂證明。\r\n- configs/recovery_31600_progress_window.json 鎖定新 SLX SHA，31600另開分支、LR不變、100/段、最多新增10000至41600，guard保留。只提供實驗室啟動指令，不自行啟動正式訓練。保留舊階段紀錄不代表新環境已逐階訓練驗證；未來合格後仍需純腳本從頭重跑。\r\n- 操作及完整證據見 docs/guides/stage6-progress-training.md、docs/records/stage6-progress-validation-2026-10-13.md。目前 baseline 是空間循跡環境，舊候選不可重複套用；更新 runtime 前仍須確認副本沒有活動訓練。\r\n\r\n## 未來純腳本從頭重跑（2026-10-14）\r\n\r\n- 使用者確認未來從頭重跑時，從第一階段即使用目前正式空間循跡環境，包括初始化、末端 lookahead v2、有效歷史範圍及依飛機進度更新路段；這些處理也適用於無風，不等到有風階段才啟用。六階段共用一致任務規則，階段之間沿用同一 agent。\r\n- 未來另建新 run、初始化新 agent，固定並記錄環境版本，從第一階段驗證；既有31600評估不代表從頭收斂。沿用目前方案合格後再整理純腳本的安排。本次只記錄，未授權實作、啟動訓練或 commit/push。詳細決定見 docs/records/from-scratch-training-decision-2026-10-14.md。\r\n\r\n## 環境版本與遠端保存（2026-10-15）\r\n\r\n- 使用者授權實作環境版本架構，並確認遠端已停止或暫停。新 run 從 environments/ 選環境，保存 environment.json 與 environment/ 資產；retry 續訓與 attempt 必須驗證快照 SHA，不再隱式跟隨共用 SLX。\r\n- progressive_v2 使用 schema 2、environment=spatial_v1；目前仍是正式空間循跡與原 reward，未部署離線 reward v2 候選。schema 1 課程仍相容，未綁定環境的舊 run 續訓拒絕猜測。\r\n- 遠端更新前先單獨複製 preserve_training_environment.ps1，對停止且可取得排他鎖的舊 run 保存當地 runtime SLX／相依資產、核對預期 SHA；不搬移 run、不改 checkpoint／課程／guard。保存當下檔案不證明歷史版本；勿先更新後再冒充舊環境。\r\n- 已綁定 run 的評估及恢復分支使用快照；明確跨環境恢復尚未提供，配方 SHA 不符時拒絕。未綁定舊 run 的唯讀評估仍可使用當下 runtime，報告會標明不是歷史環境證據。\r\n- 共用引擎與 MATLAB／工具箱未整體封存，每次 attempt 記錄預檢的模型／引擎 SHA。正式 runtime SLX 保留相容且內容未改。操作與限制見 docs/guides/environment-versions.md。\r\n- 本機已通過 schema、start=false、假引擎、既有課程／恢復 guard、PowerShell 停止／鎖／雜湊／不可覆寫測試及 CPU 五步快照評估；未啟動正式訓練、未驗證遠端 GPU／多 workers、未 commit/push 或直接更新遠端。\r\n- 使用者後續明確授權提交與推送本次課程、reward 校準及環境管理修改。遠端操作由代理提供指令、使用者自行執行；不要自行連線修改遠端或啟動遠端訓練。保存環境必須先於更新程式。\r\n\r\n## spatial_v2 新 reward 環境（2026-10-15 後續）\r\n\r\n- 使用者要求建立獨立 environments/spatial_v2，並將進度寫入 AGENTS／README 供其他聊天室接續。已建立 SLX 與 environment.json；reward_version=spatial_reward_v2，模型 SHA256 為 997adbbd29b199c88e956d0778c1d8022547c60e46abd9943db1d325c295d557。\r\n- 只有 OBSERVATION/MATLAB Function13、Function22 的 reward 程式更改：取消曲率減半距離懲罰、取消局部 waypoint 距離30～150m加分；以公尺 d 計算 cross_track=0.2-0.2*d/30、distance_bonus=0.1+0.05*max(0,1-d/10)。輸入 d/30 先還原單位；其餘八項 reward、guidance、WindowManager、observation、IsDone、PPO 不變。d 仍是 guidance 局部橫向距離，不是原始有限折線距離。\r\n- spatial_v1 與 runtime SLX SHA 仍為495afb97a9fa463b4500d168909ea28f649a12912f12c0631ec1e85b93c1b6be。新模型存檔另有 UUID／版本號／視窗 metadata 差異，不能說二進位檔只改兩行。\r\n- 通過實際 SLX 兩個 chart 的128組距離／曲率／目標距離測試；原 reward 與新 reward 的診斷均可辨識。CPU 固定 Agent31600、Stage6 seed205 純 sim 跑滿3000步，新分數2666.49527155，舊分數2823.42477063；與離線候選逐步最大差4.44e-16，比對位置／姿態／guidance d／動作變化扣分一致，checkpoint SHA 與權重未改。這不是新 reward 訓練或收斂證明；未驗證GPU／多 workers。\r\n- progressive_v2 的共享 curriculum.json 仍指定 spatial_v1，尚未校準新 reward 的正式訓練門檻，不要自動切換。使用者貼回的遠端草稿為 D:\\daniel\\ModularTraining\\experiments\\progressive_v2\\runs\\20261015_134932_tpfcac90bf_7392_48ff_b6d6_e7b07dec087e，當時 start=false 且綁定spatial_v1；不是對遠端目前程序狀態的即時確認。不要改該 run 的環境／課程快照，未來使用 spatial_v2 應另建新 run。\r\n- 本批尚未 commit/push、未直接更新遠端、未啟動正式訓練。遠端仍由代理提供指令、使用者執行。完整位置、建置工具、測試與限制見 docs/guides/spatial-v2.md；README 已加入進度入口。\r\n\r\n## progressive_v2 選用 spatial_v2（2026-10-15 明確授權）\r\n\r\n- 使用者要求 progressive_v2 使用 spatial_v2 並 push、提供遠端啟動指令，取代前述「尚未切換」決定。共享課程與 configs/lab_gpu6_progressive_v2.json 均指定 spatial_v2；start=false 保留預檢，驗證後由使用者 retry(resume=新run) 啟動。\r\n- 新 reward 門檻維持八階段起始設定，尚未長訓練校準。先前134932草稿仍屬 spatial_v1，不改快照、不用它開始新版訓練。本機不啟動正式訓練，不將凍結策略評估當作收斂證據。\r\n\n## 凍結策略探索對照（2026-10-16）\n\n- progressive_v2恢復分支18000–18200在Stage4 seeds601:606關閉探索皆跑滿；18300已退步。不可因此直接續訓或認定探索為根因。\n- compare_training_checkpoints新增useExploration，預設false不變；true僅在記憶體agent上以CPU純sim抽樣動作，報告記錄use_exploration。不train、不改父run或guard。同seed配對scenario，不等於重現訓練worker隨機序列。\n- 操作與限制見docs/guides/exploration-evaluation.md。實驗室保持paused，先用既有18次無探索結果與同組探索評估比較。\r\n- 2026-10-17新增評估專用explorationStdScale，預設1；useExploration=true時允許(0,1]，只縮放記憶體Gaussian actor的std輸出，不改可學權重、均值函式或原checkpoint。scale=0.5是待測候選，不代表正式訓練配方。完整限制與指令仍見exploration-evaluation.md。\r\n"},{"file":"records/review-2026-10-09.md","name":"review-2026-10-09.md","title":"2026-10-09 架構審視與工作紀錄","group":"工作與驗證紀錄","text":"# 2026-10-09 架構審視與工作紀錄\n\n## 背景與證據範圍\n\n使用者確認有宿舍／實驗室兩台電腦，提供的圖是實驗室產生。圖顯示 387,512 episodes、388 attempts，最後記錄平均 111.03；約 18 萬回合後低迷持續至圖尾。圖上 session 為 `20260923_234543_tpebcab813_6804_4fb1_8ae2_8e4a5c1296c5`，snapshot 標示 2026-10-02 12:57:14。\n這是圖片讀值；本次沒有該實驗原始日誌，不能確定使用哪個模型、版本、worker 歷史或崩落原因。既有 TUNING.md 的 29,000 回合是另一個舊實驗，不能混為本圖證據。\n\n## 目前的架構\n\n`retry.m` 建立／恢復實驗設定與模型快照 → PowerShell supervisor 管理程序與重試 → `checkpoint_attempt.m` 選 checkpoint、注入模型回呼 → `training_engine.m` 建環境／pool 並訓練 → checkpoint、結果與診斷寫回該實驗。\n\n模型 profile 與 builder 已分離；每個實驗有自己的模型原始碼快照。控制程序與實際 MATLAB 訓練程序分離，可以在程序失敗後重啟。這些隔離有利於管理實驗，但以下限制仍存在。\n\n## 已確認的程式行為與限制\n\n1. **存檔進度不等於學習進度。** `checkpoint_supervisor.ps1` 在正常返回結果或最新存檔候選改變時重設 noProgressFailures；沒有 reward 退步／長期低迷判斷。因此圖中的長時間低 reward 與目前控制邏輯相容，並不會觸發「無進度」暫停。\n2. **續訓不是最佳模型選取。** supervisor 依修改時間排序候選，`checkpoint_select_agent.m` 選可讀且基本相容的第一個。它沒有比較 reward。`training_engine.m` 又會拒絕覆蓋同目錄更晚的 checkpoint，故「跳過壞存檔」不保證能從舊檔順利恢復；也不應在原目錄偷偷回滾。\n3. **完整執行版本尚未凍結。** 新實驗快照只有模型程式；runtime、入口和 SLX 沒有一起凍結。引擎在每次開始訓練時另存自身快照，但仍不是完整依賴。雙機不同 runtime 可能使相同模型名稱代表不同執行條件。\n4. **跨機路徑需要處理。** `retry.m` 續訓會更新 scriptDir/sessionDir/modularRoot/matlabExe，已存在的 diagnosticDir 卻沿用。直接複製整份實驗到另一台可能寫到舊路徑或失敗；本次不修改續訓與活動 runtime。\n5. **重啟不是完整環境狀態恢復。** `checkpoint_attempt.m` 使用 attempt × 10000 作 baseSeed，worker 再加索引。路徑、風場與 worker-local episode 計數重建；不是每次重用相同 seed。worker 數改變也會改變採樣條件。\n6. **圖表是日誌觀測序列。** parser 用最新 attempt 覆蓋同 episode，但沒驗證那些 episode 是否位於最終保存的 checkpoint 歷史中。388 attempts 不等於 388 次 crash；預設每 1000 回合本來就正常重啟一次。\n7. **目前觀測不足以定因。** reward、steps、Q0、worker 紀錄可用來定位退步區間；缺少策略 KL／entropy、critic loss、梯度範數與明確 episode 終止原因。不能僅據圖認定是 PPO 超參數、critic 或環境故障。\n8. **actor 有一維共享瓶頸。** `build_agent.m` 在 actor hidden 後先投影成 1 維 `ip_out`，再分給 mean/std 網路；兩個 head 共用此單一特徵。這是可做新 profile 對照的設計選項，尚無證據證明是本次退步原因。\n9. **有額外磁碟成本。** supervisor 會把 attempt log/json 再複製到 diagnostics；引擎每段另存 initial/final agent，並保留定期 checkpoint。精簡報告只減少分享量，不會清理這些本機資料。\n\n## 本次實作\n\n- 新增獨立、標準函式庫的精簡匯出器，保留有界區間摘要與最近資料；可聚焦指定 episode 範圍，不匯出原始 log 文字／設定絕對路徑。\n- `.gitignore` 排除訓練成果、完整日誌、MAT／Simulink／Python 快取，只放行 `reports/\u003cmachine>/\u003csession>/report.json`。\n- 舊 `analyze_training.py` 改用本專案 parser 及明確指定來源，不再假設相鄰 Simulink；它仍是完整舊分析，不是精簡分享工具，輸出預設留在指定實驗中。\n- 將雙機背景和分享約定寫入 AGENTS.md、README 及 reports/README.md。\n- 未啟動／終止訓練，未更改 runtime、模型設定或 SLX；未建立 Git repository、commit 或 push。\n\n## 下一步資料與架構方向\n\n先在實驗室匯出該實驗 report，重點比較 170000–190000 前後的 steps、reward、Q0、attempt 和 worker 變化。若仍無法定位，再提供相關 attempt 的錯誤摘要或終止原因；不要先傳所有 checkpoint。\n\n後續停機開發時可加入 reward 退步告警、獨立 best-evaluation 模型保留、固定測試條件評估與更完整 runtime／環境版本快照。告警應與程序故障重試分開，任何自動停訓或回滾須另行設計並取得授權。調參比較應使用新實驗，避免改寫活動實驗的模型設定。\n\n## 本次驗證\n\n`python -m unittest discover -s tests -p test_training_report.py -v`：7 項通過。涵蓋重啟去重、缺回合、不完整行、非有限數值、設定白名單、舊 diagnostics 明確路徑、CLI 來源保護、Git 忽略規則及大規模輸出。\n以合成資料模擬 387,512 episodes／388 attempts，匯出 JSON 約 293 KB（未含真實實驗的 worker 歷史）；此數字是測試結果，不是實驗室實際報告。匯出檔另有 1.5 MB 硬上限。\nWindows sandbox 暫存目錄權限使首輪測試無法建立 fixture，已透過核准的外部 sandbox 執行完成測試。未執行 MATLAB 訓練測試；實驗室資料尚未分析。\n\n## 同日後續：worker 範圍與學習診斷\n\n使用者補充已自行上傳 GitHub；本機現有初始 commit。使用者要求在同段使用能成功建立的 n 個 workers，而非等待下一次 attempt。\n確認本機沒有 MATLAB 訓練程序後，修改此本機副本 runtime：加入 minWorkers（預設 1）並用範圍建立 pool；實際 workers 數回填到訓練選項與 seed 數量。整個 pool 失敗仍交 supervisor 處理，備援上限不低於 minWorkers。沒有啟動正式訓練或同步實驗室。\n\n精簡報告加入 learning_health：可設定區間長度、連續退步次數、相對門檻與最低參考平均。它只在匯出時產生疑似退步訊號，沒有自動停訓、回滾或調參。完整策略見 learning-health.md。\n\n驗證：MATLAB R2024b 的 test_worker_range（模擬 pool，不啟動 workers）、test_model_layout（start=false）通過；PowerShell 語法檢查與 episode 格式測試通過；Python 4 項學習診斷及 7 項報告測試通過。尚未驗證實驗室 worker 連線失敗情境或實際 UAV 長時間訓練。\n\n## 同日後續：JSON 課程規劃器\n\n使用者提出以 JSON／YAML 描述階段（MAT 軌跡1 → MAT 軌跡2 → random），並確認階段間沿用同一 agent。本次採 JSON，新增 `+trainingcurriculum/`、`curriculum_plan.m`、兩份設定範例，接入 retry／attempt／訓練引擎／supervisor。\n\n條件使用 all/any 與明確的數值指標，不使用 eval 或自由程式碼。進度從保存的訓練歷史計算，只在存檔邊界換階段；MAT／計畫會快照到實驗。提供階段預算與保存後暫停，最後完成原因明確區分過關與按預算前進。現有平均 reward 門檻只保留給非課程模式。\n\n匯出器的退步診斷改用當前階段範圍。使用者尚未提供真實 MAT，兩個檔案路徑為模板，不宣稱已驗證其內容。使用說明見 `docs/guides/curriculum.md`。\n\n測試僅使用合成已保存歷史、MAT 測試資料、start=false 與隔離假訓練引擎。初輪已通過；追加入口測試時自動核准審查曾因用量限制中斷，使用者要求繼續後重新執行成功。未啟動真實訓練／workers，未 commit 或 push。\n\n最終驗證：test_curriculum 通過（含遺失狀態拒絕、階段邊界一致性、實際 attempt 入口的環境傳遞／段落上限、到預算後不呼叫引擎）；既有 test_worker_range、test_model_layout 通過。Python 報告測試 8 項通過，包含當前階段的 learning_health 隔離；PowerShell 語法／episode 格式檢查通過。training_engine 靜態解析沒有語法錯誤，仍有原有 global、預配置及固定開關等 Code Analyzer 提醒。\n"},{"file":"records/reward-audit-2026-10-14.md","name":"reward-audit-2026-10-14.md","title":"空間循跡 reward 拆解（2026-10-14）","group":"工作與驗證紀錄","text":"# 空間循跡 reward 拆解（2026-10-14）\n\n使用者要求確認 reward 是否需要修改。本次只新增隔離評估記錄及離線拆解工具，不修改正式 SLX、runtime、checkpoint、課程、guard 或門檻，不啟停實驗室訓練。工作區原有「未來從頭重跑」文件及 AGENTS 修改保留。\n\n## 方法與資料範圍\n\n本機 MATLAB R2024b / CPU，以已提供的實驗室 Agent31600、Stage6 seeds202/205 做兩次 frozen-policy sim。不是新實驗 Agent36300 的分析，也不是正在訓練的 episode。正式 SLX SHA 為 `495afb97a9fa463b4500d168909ea28f649a12912f12c0631ec1e85b93c1b6be`。\n\n`compare_training_checkpoints(...,rewardDiagnostics=true)` 自動開啟 diagnostics，在暫存副本記錄 OBSERVATION/Sum3 的十個實際輸入、總分、正規化 d/curvature 及 bonus indicator。rewardDiagnostics 預設 false，不增加一般評估的記錄量。`audit_training_rewards(evaluation.outputDir)` 讀保存的 traces，輸出同資料夾的 reward_breakdown.json；不重新 sim 或 train。\n\nRL experience 的 transition reward 標在 t，但對應 signal logging 的 t+0.1 秒。工具明確驗證這個偏移及每筆值，拒絕錯位，沒有直接把 3001 個訊號樣本當 3000 個 reward 加總。兩例十項加總的逐步殘差均為 0，總分與無額外 instrumentation 的既有結果一致，兩例均3000步，權重/checkpoint SHA保持不變。\n\n本機資料：`diagnostic_packages/stage6_review/main/reports/evaluation_20261014_090252_tpa0964215`。MAT traces 約數十MB/例，不納入 Git。完整明細在其中 reward_breakdown.json。\n\n## 各項實得分\n\n| 項目 | seed202 | seed205 |\n|---|---:|---:|\n| 循跡誤差 | 475.49 | 452.08 |\n| 距離變化 | 249.97 | 254.38 |\n| 朝向 | 431.28 | 431.94 |\n| 曲率與距離組合 | 436.87 | 434.51 |\n| 滾轉角速度 | 150.00 | 150.00 |\n| 偏航角速度 | 150.00 | 150.00 |\n| 轉向追蹤 | 536.01 | 538.37 |\n| 距離加分支路（含基底） | 450.65 | 450.65 |\n| 動作幅度超限 | 0 | 0 |\n| 動作變化扣分 | -38.90 | -38.50 |\n| 總 reward | **2841.37** | **2823.42** |\n\n## 確認的評分語義問題\n\n### 1. 舊目標距離加分與新任務不一致\n\n實際支路是 `0.1 * (1 + a + b)`，不是整條支路全都來自目標距離：\n\n- 固定基底：每步0.1，共300分。\n- `a=0.5` 當 distance_to_window_target 在30至150m：兩例各僅13/3000步、0.433%，共0.65分。新的 signal 是局部最近 waypoint 距離，不是舊定時移動目標的距離。\n- `b=0.5` 當傳入的 d\u003c=10：兩例全程成立，共150分。\n\n因此不能把450.65分全稱為「舊目標距離加分」，也不能说完全沒有拿到這條支路的分数。這個 a 條件對空間循跡存在方向錯置：離路徑變遠到30m反而可能多拿0.05/步；本次樣本只在初始接入階段拿到，尚未證明模型實際利用此漏洞。\n\n### 2. 所謂 d\u003c=10 收到的是 d/30\n\nMATLAB Function22 的 d 來自 MATLAB Function1 正規化輸出，故條件等價於原始 guidance d\u003c=300m，不是10m。正常未終止時 d通常小於50m，因此它幾乎是固定加分。\n\n兩例該條件100%成立，但實際 guidance d\u003c=10m 的樣本比例只有77.97%／58.13%。這項目前無法有效區分是否保持在10m內；修正為物理單位後，分數可能下降，不是為了提高分數而改。\n\n### 3. 曲率判斷有另一個尺度疑點\n\nFunction13 收到 `k_normalized=k/(1/55)`，卻以 `abs(k_normalized)>=1/55` 判斷是否將 d 懲罰减半。等價原始曲率門檻為1/3025，而非1/55。兩例當前觸發比例37.27%／37.20%；若設計原意為原始曲率1/55，兩例均不觸發。不能僅憑常數推定原設計意圖，應在新 reward 規格中明列單位與門檻後再修。\n\n## 決策\n\n有理由另立 reward v2：取消舊移動目標距離條件，明確定義以公尺衡量的循跡品質，並釐清曲率門檻；保留控制平順度及物理終止保護。這裡沒有實作或部署 v2，不把尚未評估的公式直接套到活動 run。\n\n**不能據此認定這些問題造成最新訓練平均2474.88。** 同一現行 reward 下，未再訓練的31600在本次兩例仍高於2700，證明2700不是此環境不可達的上限。需要目前run保存的33700、36300或後續checkpoint，在相同情境拆分得分比較，才可解釋新分支的變化；目前本機沒有這些checkpoint。\n\n下一版門檻應與明確的完成率、實際循跡距離、控制平順度一起校準，不直接平移總分，不為了過關降低2700。新舊 reward 另記版本；既有正在執行的實驗保留原定義，待停止/預算結束後再決定分支。\n\n## 使用方式（實驗停止後）\n\n```matlab\nevaluation=compare_training_checkpoints(info.sessionDir, ...\n    episodes=[31600 33700 36300],includeLatest=false, ...\n    stages=6,seeds=[202 205],rewardDiagnostics=true);\naudit=audit_training_rewards(evaluation.outputDir);\ndisp(jsonencode(audit.results,PrettyPrint=true))\n```\n\n先確認指定 checkpoint 存在；不為評估覆寫或補造checkpoint。這是小樣本診斷，不代表泛化合格。新增測試 `test_reward_breakdown` 已驗證合成資料加總、時間错位拒絕、距離與曲率正規化判讀；真實兩例另外驗證完整數值一致性。\n"},{"file":"records/stage6-checkpoint-review-2026-10-14.md","name":"stage6-checkpoint-review-2026-10-14.md","title":"41600 預算暫停後：實驗室三模型評估","group":"工作與驗證紀錄","text":"# 41600 預算暫停後：實驗室三模型評估\n\n使用者提供根目錄 `stage6_review_20261014_184455_tp80b6bb5e_5c48_4cac_95e3_1edb6c16f8e8.zip`。\n此紀錄為讀取實驗室結果，不是本機新跑的模擬，未啟停訓練或改 checkpoint。\nZIP SHA256：7002e9a6a167f1c3e7b0b2b96ace7866086e74ca1aa6980193f12fe76750ebb6。\n\n## 完整性與範圍\n\n- ZIP CRC 通過；五個 JSON 可解析；batch 與三份 evaluation 均 complete。\n- 30 次 Stage 6 配對、6 次詳細重播、9 次前三階段保留測試，共45次均3000步且 environment_done=false。\n- 詳細重播6次與配對中對應案例 reward 誤差小於1e-8；reward 分解逐步殘差皆0。\n- 三份評估 checkpoint 路徑與 SHA256 記錄一致。\n- 正式空間循跡 SLX SHA256：495afb97a9fa463b4500d168909ea28f649a12912f12c0631ec1e85b93c1b6be。\n- ZIP 不包含原始 MAT traces，不能憑此重新計算獨立原始折線距離。內部 turbulence seeds 的既有限制仍適用。\n\n## Stage 6 seeds 201:210\n\n| checkpoint | 跑滿 | 平均 reward | 平均 observation7 RMS（正規化） |\n|---|---|---|---|\n|31600|10/10|2886.6131|0.26927|\n|33700|10/10|2929.6009|0.24223|\n|41600|10/10|2917.1078|0.25530|\n\n33700 比31600的10個配對分數全高，平均+42.99；41600比31600為9/10較高，平均+30.49。\n41600比33700為2/10較高，平均-12.49（約0.43%）。這是有限樣本描述，不宣稱顯著退步。\n33700是本批候選中值得保留的模型，不能稱為全歷史最佳或已合格。\n\n前三階段各單seed101均跑滿：33700在直線/S彎的分數及正規化誤差優於41600；\n41600在固定轉彎的分數及正規化誤差較好。不存在所有情境皆勝出的候選。\n\n## Reward 分解\n\n兩個詳細seed202/205中，33700相對31600的改善包含 cross_track、yaw_tracking，\n以及減少 action_change 懲罰。六例 distance_bonus 皆450.65，因此它不解釋本批模型間的分差。\n其中300為基礎加分、150為正規化距離門檻加分、0.65為距離帶加分。\n先前發現的單位疑點仍存在，但本次結果不支持直接把最新訓練平台歸因於這些疑點。\n\n## 判讀與下一步\n\n訓練最後平均2584.01與本次固定checkpoint、關閉探索的評估分數並非相同量測條件。\n評估只有固定10組情境，訓練包含不同情境及更新中的策略；尚未隔離探索或情境差異各自的貢獻。\n不可把評估超2700寫回課程進度，亦不能據此宣稱滿足原先連續訓練窗口過關條件。\n\n先保持暫停，保留三個checkpoint；將33700與41600視為候選，下一步使用預先選定的額外情境\n比較Stage4/5/6與實際循跡品質，再決定模型選擇與合格標準。暫不單憑訓練分數追加預算、\n降低門檻或部署新reward。下一輪額外情境入口與限制見\n`docs/guides/stage6-candidate-review.md`；新批次尚待實驗室執行。\n"},{"file":"records/stage6-history-review-2026-10-13.md","name":"stage6-history-review-2026-10-13.md","title":"Stage 6 歷史路徑有效範圍調查","group":"工作與驗證紀錄","text":"# Stage 6 歷史路徑有效範圍調查\n\n## 範圍\n\n本次使用者授權繼續隔離評估。正式 runtime/FAFA_Simulation.slx 與原 checkpoint 不修改；所有模擬使用診斷包解出的副本、CPU、關閉探索，不 train、不啟動 pool。工作區既有程式註解與文件重組未覆寫，也未將它們納入提交。\n\n兩包來源及完整性：\n\n- 主包 `diagnostics_20261012_080431_recovery_tpfaf0be04_ee09c9b1.zip`，SHA256 `cbed0437d94e4c295cf829bd29a08cb57a32310eb5f18d81ded2759663d84e83`，380個manifest項目全部驗證。\n- 補充包 `stage6_extra_579587cc961c4f62978679a58f403a7e.zip`，SHA256 `878dbc48ebdb6d5caceee3e6efda4976cf44562688b0ff354e0d79c672231025` 與使用者提供的一致，ZIP CRC通過。\n- 評估來源SLX與本機相同，SHA256 `b28c5a5c967347c498cb23f032b483841ca63b98ab4da137ca902e193225714c`。程式註解可能不同，不能因此宣稱所有runtime歷史指紋相同。\n\n## 已證實的問題\n\nguidance 的 `global_path` 預配置500000列，`path_length`代表已填入列數。原 `path_CTE=global_path` 包含尾端零值。outside分支找到最後有效點時，`current_index+1`仍在配置大小內，因此把它連到未使用的 `(0,0)`，不是有效路段。\n\n用記錄的planned_path串接，重算全部12個失敗trace。202/204/205跨三個checkpoint的9次終端誤差與末點接零座標的假線段計算值吻合至小數6位；207則選到已填入的內部路段，不能全部歸為相同原因。\n\n31600的202/204/205終端logged d為50.424913/50.895169/50.180986m，而末段延長線側偏7.017/1.549/2.891m。延長線不等於有限路徑或未來期望路徑，不能據此宣稱飛機已完成真正循跡。207有真實約50m偏離與更新後轉向問題。\n\n## 最小候選\n\n`compare_training_checkpoints(...,guidanceVariant=\"valid_history\")` 只把暫存guidance改成 `path_CTE=global_path(1:path_length,:)`。有效末點會走原有末段分支，不再連到零值。不更動lookahead、reward公式、終止門檻、planner、更新頻率或模型參數。\n\n因距離也是observation/reward/termination的輸入，改正距離會改變閉迴路動作及分數。即使回合延長，也不代表agent重新學習或真實循跡已合格。此候選仍使用原無限直線橫向距離，而非將所有距離改成有限折線最近距離。\n\n輸入MAT未包含在診斷包；只在本機解壓副本，從已提供的前三階段evaluation/scenarios.mat還原相同waypoints/velocity，未生成不同路徑、未改課程JSON。診斷副本只是評估材料，不可用它直接續訓。\n\n## 驗證\n\n`tests/test_history_candidate.m` 已通過：非原點直線末端越過時排除假線段、5m側偏保留、inside目標及距離不變、重複轉換拒絕。\n\n本機 baseline 31600 / Stage6 / seeds202,204,205,207 重現實驗室2596/998/695/730步及對應reward。初始權重稽核原報告initial_snapshot_count=0，不能聲稱已核對全部接續時刻的initial/resume一致性。\n\n本輪共27次CPU純sim完成（4 baseline +20 candidate +3 retention）。候選小風10/10、完整風6/10，前三階段3/3。正式SLX雜湊與所有被評估checkpoint雜湊保持不變，sim前後權重檢查通過。\n\n| Stage6 seed | 原版步數 | 有效歷史候選步數 |\n|---|---:|---:|\n|202|2596|2715|\n|204|998|1111|\n|205|695|1417|\n|207|730|730|\n\n完整風平均reward從2262.88到2359.97，平均steps2301.9到2397.3，完成數未增加。小風平均reward3036.81；前三階段reward及RMS與原版相同。不能把修正後reward提高當成學習改善。\n\n候選終端已不是同一零值誤索引：202/204/205/207的logged d為50.18/50.93/50.82/50.53m，對當前有限planned_path獨立計算的最近距離吻合約0.01m內。更新前可見沿舊末段延伸已越過路徑末點約74~109m；269.9/109.9/139.9/69.9s新path更新後，目標/轉向需求大變，終端目標在機頭後方。WindowManager仍每步前移一個waypoint且每100步valid，而飛機地速隨風變化；目前只定位了時間推進與實際進度不一致的症狀，尚未驗證新的planner策略。\n\n評估資料（均在忽略的diagnostic_packages/stage6_review/main/reports）：baseline evaluation_20261013_191041_tpf4c1cd04；candidate evaluation_20261013_191142_tp9695204b；retention evaluation_20261013_191447_tpadf7f19a。下一步需隔離驗證前方路徑不足／更新跳變的處理，並明確保留任務的空間或時間跟隨語義；本輪不部署正式環境、不重啟訓練、不放寬終止門檻。\n"},{"file":"records/stage6-progress-validation-2026-10-13.md","name":"stage6-progress-validation-2026-10-13.md","title":"Stage 6 空間進度 window 驗證","group":"工作與驗證紀錄","text":"# Stage 6 空間進度 window 驗證\n\n本次由使用者提供的實驗室 Agent31600，在本機 MATLAB R2024b / CPU 做純 sim。使用者明確選擇空間循跡，可按飛機進度更新路段；不是原本的定時移動目標任務。沒有使用 AI 在模擬中介入控制，也沒有用本機評估冒充實驗室續訓。\n\n## 證據與修改\n\n原模型在 Stage 6 seeds201:210 為 6/10 跑滿；202/204/205/207 分別在 2596/998/695/730 步終止。只修正歷史零列後仍為 6/10。詳細調查見 [前一份紀錄](stage6-history-review-2026-10-13.md)。\n\n第一個空間候選採用重疊 preview，四個失敗情境僅一個跑滿，其餘 691/1186/794 步；未部署。現有規劃器用前段末點作新段起點，重疊資料不能直接代入。最後採用連續路段（共享端點），當進度距段尾約 40 點時提早發布下一段。保留原規劃器、reward 公式、動作及終止門檻，另修有效歷史範圍。任務時序及誤差幾何確實改變，不能稱只改資料顯示或只有 agent 變好。\n\n## 固定 Agent31600 評估\n\n| 場景 | 樣本 | 跑滿 3000 步 | 平均 reward |\n|---|---:|---:|---:|\n| Stage 5，201:210 | 10 | 10/10 | 2954.81 |\n| Stage 6，201:210 | 10 | 10/10 | 2886.61 |\n| Stage 6，新 seeds301:320 | 20 | 20/20 | 2892.22 |\n| 直線，101 | 1 | 1/1 | 3068.14 |\n| S 彎，101 | 1 | 1/1 | 3085.97 |\n| 固定轉彎，101 | 1 | 1/1 | 2921.44 |\n\n合計 43 個不同 checkpoint/stage/seed 組合。之前四個開發重播包含在十個已知 Stage 6 情境內，不重複計入 43。新二十個 seed 沒有用於調整此次候選；仍是有限抽樣，且內部 turbulence seeds 沿模型設定，不代表二十個獨立噪音實現。前三階段只是單 seed 能力保留檢查。Stage 4 本次未單獨重測。\n\n所有評估保持 checkpoint SHA 和 actor/critic 權重不變。候選 43 次執行時正式 SLX 未變；完成後才將相同候選原碼保存成正式模型。不是訓練收斂證明，也不是整套課程合格證書。\n\n## 獨立位置檢查\n\n對四個原失敗案例，以原始 scenario waypoints 的有限線段計算飛機座標到路線的最短距離，不使用 guidance 的 d：\n\n| seed | 全程 RMS（m） | 10 秒後最大距離（m） |\n|---|---:|---:|\n| 202 | 9.109 | 18.496 |\n| 204 | 8.862 | 19.077 |\n| 205 | 10.572 | 21.276 |\n| 207 | 9.039 | 21.162 |\n\n四例全程最大值均為 50 m，出現在 t=0：原始 route 第一點在初始飛機前方，planner 另接入起始段。表格另外明列 10 秒後的最大值，沒有把初始距離刪除再宣稱全程小於 50 m。此檢查支持確實循跡，而非僅藉錯誤 d 避免終止；不代表每個未測風場都安全。\n\n## 版本與可追溯性\n\n- checkpoint SHA256：`75bc17b133c86c974b11ebfbb23be385e9965605323486b2ff36891626c8e823`\n- 原正式 SLX：`b28c5a5c967347c498cb23f032b483841ca63b98ab4da137ca902e193225714c`\n- 空間循跡正式 SLX：`495afb97a9fa463b4500d168909ea28f649a12912f12c0631ec1e85b93c1b6be`\n- 本機配對報告：`evaluation_20261013_234910_tp4457a624`\n- 新情境報告：`evaluation_20261013_235203_tpf8e356d1`\n- 保留能力報告：`evaluation_20261013_235421_tp89d535d5`\n- 四例詳細位置來源：`evaluation_20261013_234642_tpd8fddaaa`\n\n完整 traces、checkpoint、日誌留在忽略的 diagnostic_packages；未納入 Git。舊 window/guidance 文字 fixture 供重現幾何測試，不是可續訓模型。\n\n正式存檔後再以 baseline 重播 seed207，3000 步、reward 2825.01763893，與候選完全一致；另有 110 步舊短測 agent 的 Simulink 接線驗證。有效歷史、空間 window、舊 window 初始化、endpoint 幾何、配方環境雜湊拒絕及原有分支/guard 測試均通過。SLX 差異核對只有兩個 chart 的程式、模型版本遞增和視窗/metadata。沒有執行本機正式 train，也未測 GPU/6 workers；純 sim 成功不等於保證續訓收斂。\n\n續訓配方及實驗室指令見 [操作文件](../guides/stage6-progress-training.md)。新分支從 31600 延續、最多新增 10000，保留 guard；不能解除舊 run 暫停直接覆蓋。正式環境的 baseline 指現在的空間版本。\n"},{"file":"records/success-evaluation-2026-10-19.md","name":"success-evaluation-2026-10-19.md","title":"完成模型與探索評估核驗","group":"工作與驗證紀錄","text":"# 完成模型與探索評估核驗\n\n來源 run：20261017_071436_recovery_tp323769ed，checkpoint 39300。無探索評估 evaluation_20261018_234801_tpc304c6c6（Stage1–8、seeds901:910）80/80跑滿；探索評估 evaluation_20261019_075841_tpdf0ef65f（Stage4–8、相同seeds）50/50跑滿3000步。兩份 Release 已同步本機並經 SHA256 驗證，後者 tag 為 result-20261017_071436_recovery_tp323769ed-e177d217bc1f。\n\n本機唯讀 MATLAB 比較 Agent_Success.mat 與 Agent39300.mat，actor／critic 可學參數及公開 AgentOptions isequaln 相同；兩個 MAT 雜湊不同，但讀取前後各自 SHA 不變。未核對 optimizer 私有狀態，未執行 train/sim。\n\n探索組使用 useExploration=true、explorationStdScale=1；模型本身已有0.5倍率，沒有再縮放。Stage4–8平均reward依序2669.4176、2632.5904、2631.2990、2504.8058、2502.2036。\n\nStage8 seed902：東風參數3、北風參數1m/s、turbulence=2；reward2353.1222，3000步。觀測還原 guidance 距離最大47.587506m，出現在279.9秒；3001個觀測中37個>=40m、21個>=45m，不能把樣本數直接當成連續事件長度。獨立有限原路線距離在10秒後最大亦為47.587506m、RMS11.919254m、P95為24.421037m。全程原路線最大50m在初始t=0，與上述後段偏離分開解讀。已確認真實後段偏離，未分析其控制／路段更新因果。\n\n這批測試通過，但不是130個獨立情境或泛化可靠度保證；階段之間可能抽到相同風參數，固定路徑多seed也不等於多條路線。保留本例作回歸診斷，不將其當成未看過的最終測試集。\n\n下一輪方案仍採新agent、固定spatial_v2、八階段順序。核對成功run快照：階段最低回合依序2000/3000/3000/5000/2000/3000/5000/10000；所有表現指標均連續三個100回合區間，末階段reward>=2200、steps均值>=2900、3000步比例>=95%。這是既有門檻基準，不代表新agent已驗證能從頭通過。\n\n先保留此課程與環境基準，不因本例調reward或放寬50m門檻。後續自動決策應分清平台期、探索脆弱與確定性退步，透過獨立validation再決定有限延長／恢復；關閉guard並不能替代這套控制器。詳細提案見 ../research/autonomous-curriculum-proposal-2026-10-18.md。未建立新正式run或啟動訓練。\n"},{"file":"records/validation-2026-10-09.md","name":"validation-2026-10-09.md","title":"本機真實訓練驗證：2026-10-09","group":"工作與驗證紀錄","text":"# 本機真實訓練驗證：2026-10-09\n\n使用者授權短時間試跑後，在本機 MATLAB R2024b 執行 `tests/test_curriculum_end_to_end.m`。本次使用真實 FAFA Simulink 環境、PPO agent、CPU、1 個 Processes worker，沒有使用假引擎或假 pool。\n\n實驗 ID：`20261009_182703_tp24591b71_9769_4162_a931_20fd74f3a780`，位於 `+trainingmodels/ppo_lstm128/runs/`。2026-10-09 18:27 至 18:34（Asia/Taipei），supervisor 執行約 434.1 秒，含三次程序啟動／建池／模擬／存檔。測試與 supervisor 均成功退出；結束後確認沒有剩餘 MATLAB、checkpoint supervisor 或 watchdog 程序。\n\n| Attempt | 軌跡 | 累計回合 | Reward | 步數 | 實際 workers |\n| --- | --- | ---: | ---: | ---: | ---: |\n| 1 | 內建固定 | 1 | 108.385653 | 133 | 1 |\n| 2 | 生成的 MAT 直線 | 2 | 108.274919 | 133 | 1 |\n| 3 | Random | 3 | 193.543365 | 259 | 1 |\n\n測試專用門檻是每階段完成一回合，三個階段都是無風。驗證成功存檔 `Agent_Success.mat`、累計三回合且 reward 有限、課程完成狀態、每次 attempt 的 stage／resumeFile，以及 episode_workers.csv 的三筆紀錄。另逐一讀取上一段 Agent_Final 與下一段 Agent_Initial，確認 actor 和 critic 的 learnable parameters 完全相同，證明階段交接沒有重新初始化權重。\n\n本機完整測試收據在 `tests/output/curriculum-smoke-latest.json`；此目錄與實驗 MAT／日誌均受 Git 忽略，本文件保留可分享的結果。後續重跑會更新 latest 收據，實驗則另建獨立目錄。\n\n另實際執行 `prepare_progressive_training()` 兩次，確認輸入生成具冪等性；兩條軌跡均為 4001×3、S 彎速度模長為 15 m/s，六階段 JSON 通過驗證，`retry(...,start=false)` 成功建立課程及輸入快照。這份六階段正式實驗沒有啟動。\n\n本次證明真實流程可執行並可跨階段接續，沒有驗證收斂、長期穩定性、GPU、多 worker、資源不足時實際建池降級，或六階段門檻的適當性。三回合也不足以證明有效策略更新。S 彎與有風條件尚未做真實訓練短測；其設定／輸入已驗證。不得把測試用「完成」視為 UAV 任務已學會。\n"},{"file":"reference/architecture-notes.md","name":"architecture-notes.md","title":"架構圖核對與閱讀說明","group":"參考資料","text":"# 架構圖核對與閱讀說明\r\n\r\n圖表入口：[architecture.html](../architecture.html)。規格與收據移至 `../diagrams/src/architecture.json`、`../diagrams/evidence/`；收據內絕對路徑保留為原驗證時間的歷史記錄。\r\n\r\n核對日期：2026-10-10。架構 HTML／JSON 已依目前程式更新；此次未啟動或修改訓練。舊簡報中的架構頁不會因 HTML 更新而自動同步。\r\n\r\n## 課程驅動的執行順序\r\n\r\n1. `configs/lab_gpu6.json` 指定硬體、存檔與重試參數，引用 `experiments/progressive_v1/curriculum.json`。課程指定模型、軌跡、風場、過關條件與各階段預算；模型定義仍在 `+trainingmodels/`。\r\n2. `retry.m` 新建 `experiments/\u003c課程>/runs/\u003c實驗 ID>/`，保存 control、curriculum、軌跡、model 與 model_source 快照。非課程實驗保留模型目錄分類；resume 依完整實驗路徑原位接續。\r\n3. PowerShell supervisor 啟動 `checkpoint_attempt.m`。它選取有效 checkpoint，透過 `training.m` 取得模型建立／驗證回呼，並用 `trainingcurriculum.prepare` 檢查課程歷史、取得目前階段環境。課程結束或預算暫停時不啟動 engine。\r\n4. `training_engine.m` 載入原 agent 與訓練歷史或建立新 agent；建立 pool，讓 workers 執行 `FAFA_Simulation.slx`。同一課程跨階段沿用 agent，沒有重新初始化網路。\r\n5. 實驗室設定每 100 回合存 checkpoint、每段最多追加 1000 回合。段落結束保存 Agent_Final，再按該階段保存的歷史判斷；達標於下一個 attempt 切換階段，預算用盡則依 on_limit 處理。最後階段達標才發布課程成功。\r\n6. 課程模式不採舊的全實驗 reward >=2900 成功規則。progressive_v1 每階段結合最低回合數、連續三個 100 回合區間 reward 與步數指標；這些門檻仍待長期驗證。\r\n\r\n## Worker 與失敗恢復\r\n\r\n- lab_gpu6 目標 6、最低 1，使用 parpool 的數量範圍；只有成功返回的 pool 才能訓練。「Connected to 5 of 6」不是已可使用的 5-worker pool。\r\n- pool 建立失敗後，後續 attempt 依 lab_gpu6 的 4 → 2 → 1 備援重建。不是保留未完成的部分連線。一般 retry 預設備援仍為 [4 2]，不要混淆設定檔與函式預設。\r\n- 成功建池後，下一段恢復目標數量。狀態中的 running 只代表程序執行中；Pool ready 與 Episode 日誌才證明後續進展。\r\n- 預設啟動逾時 600 秒、日誌無活動逾時 1800 秒；連續無進度失敗達上限便暫停。STOP 中止程序，保留已保存 checkpoint，不會額外先保存尚未完成的回合。\r\n\r\n## 實驗、圖表與遷移\r\n\r\n- 診斷存於實驗 diagnostics／attempt 目錄。`plot_training_rewards.py` 讀 stdout 回合資料，讀 curriculum_state.json 的實際分界，在 run/reports/ 產生有 Stage 標籤的 reward 圖。灰線是 attempt，橘線是 stage。\r\n- `export_training_report.py` 在 run/reports/ 產生可分享的小型 report.json；learning_health 是匯出時計算的規則式診斷，沒有持續監控、自動停訓或回滾。完整 checkpoint 仍需另行保留。\r\n- `migrate_training_session.ps1` 只接受已停止、可取得排他鎖的實驗；複製全部資料、比對 SHA256、修正新副本控制路徑，保留原件。`verify_training_session.m` 讀回有效 PPO checkpoint 與階段位置，不啟動訓練；之後以 retry(resume=新位置) 接續。\r\n- 歷史日誌中的舊路徑不重寫。不能同時續跑新舊副本，不能在活動訓練時搬移或改 runtime。\r\n\r\n## 圖的抽象範圍與證據\r\n\r\n- 箭頭表示主要控制／資料關係，不全是函式呼叫；課程規劃器會將階段環境回傳給 attempt，圖中省略返回箭頭。引擎段末另呼叫 outcome 判斷條件。\r\n- 「診斷、曲線與精簡報告」將資料與離線工具合併呈現：supervisor 收集日誌，但不會自動啟動畫圖或匯出報告。Database 圖例表示檔案資料，不是資料庫服務。\r\n- 模型快照不包含整套 runtime；同一實驗不是任意版本執行程式的完整封裝。已提供固定無風任務的手動 evaluator；最佳評估模型自動選擇、退步自動回滾尚未實作。\r\n- 對照來源：retry.m、training.m、configs/lab_gpu6.json、experiments/progressive_v1/curriculum.json、+trainingcurriculum/prepare.m 與 outcome.m、runtime/checkpoint_supervisor.ps1、runtime/training_engine.m、migrate_training_session.ps1、verify_training_session.m、plot_training_rewards.py。\r\n- 本次使用 archify 技能產生 architecture 類型 HTML；繁體中文內容，固定 Viewer UI 與 HTML 語系為英文。\r\n- architecture-receipt.json：9/9 靜態 artifact 檢查通過，composition 0 errors／0 warnings，包含 specification 與 artifact SHA256／bytes。\r\n- architecture.visual-check.json：真實 Chrome 對 1440×900、1600×1000、1920×1080、2048×1320 的測量均無水平或垂直溢出；明暗截圖已產生。\r\n- 人工影像檢閱：檢查四張端點尺寸的明暗截圖，節點、箭頭、卡片與圖例未見裁切或遮擋；此判斷獨立於自動收據的 visualReview=pending，未改寫該欄位。\r\n\r\n頂層 experiments/\u003c課程>/curriculum.json 是共享課程定義，assets/ 是輸入；各 run 的 curriculum_state.json 是獨立進度。organize_training_reports.ps1 可複製整理舊報告，保留原件與模型。\r\n\r\n## 恢復分支與段末保護\r\n\r\nprepare_recovery_training 複製指定 checkpoint 的權重和歷史到新 run，只在新副本設定 actor learning rate，保留來源雜湊。圖中停止後處理節點合併表示原 migrate_training_session 與新增分支工具。+trainingguard 由 attempt 開始前及 engine 完成 Agent_Final 保存後呼叫；依同階段保存歷史判斷，透過 result.pause 讓 supervisor 正常暫停。課程規劃節點概括了這項決策，省略 engine 到 guard 的返回呼叫。\r\n\r\n恢復配方預設每段 100、總新增 1000 回合；guard 三個 100 回合區間 reward 和 steps 同時低於合格參考的 50% 時暫停。既有沒有 training_guard.json 的 run 行為不變。learning_health.py 仍只匯出診斷，與這個執行時 guard 分開；不會自動跑獨立評估、改參數或重新啟動分支。\r\n"},{"file":"reference/presentation_sources.md","name":"presentation_sources.md","title":"簡報資料來源與程式對照","group":"參考資料","text":"# 簡報資料來源與程式對照\n\n備忘稿保留可直接朗讀的口語內容，資料來源集中於此。\n\n## 原簡報第 1 頁\n\n花偉傑碩士論文，2026；研究進度日誌 2026/09/23。\n\n## 原簡報第 2 頁\n\n花偉傑，2026，基於位置式視覺伺服之固定翼無人機地面移動目標追蹤與深度強化學習控制。\n封面、摘要。\n來源檔：NCKU_PBVS for Moving Ground Target Tracking Using a Fixed-Wing UAV with DRL Controller_unlocked.pdf\n\n## 原簡報第 3 頁\n\n研究進度日誌_2026-09-23.md；本地 training_autoretry_sessions 與 reward_history_preview.csv。\n\n## 原簡報第 4 頁\n\n花偉傑，2026，基於位置式視覺伺服之固定翼無人機地面移動目標追蹤與深度強化學習控制。\n§1.3，正文頁 7–8。\n來源檔：NCKU_PBVS for Moving Ground Target Tracking Using a Fixed-Wing UAV with DRL Controller_unlocked.pdf\n\n## 原簡報第 5 頁\n\n花偉傑，2026，基於位置式視覺伺服之固定翼無人機地面移動目標追蹤與深度強化學習控制。\n§1.3、§3.1、第 5 章。\n來源檔：NCKU_PBVS for Moving Ground Target Tracking Using a Fixed-Wing UAV with DRL Controller_unlocked.pdf\n\n## 原簡報第 6 頁\n\n花偉傑，2026，基於位置式視覺伺服之固定翼無人機地面移動目標追蹤與深度強化學習控制。\n§3.1，圖 3.1-1。\n來源檔：NCKU_PBVS for Moving Ground Target Tracking Using a Fixed-Wing UAV with DRL Controller_unlocked.pdf\n\n## 原簡報第 7 頁\n\n花偉傑，2026，基於位置式視覺伺服之固定翼無人機地面移動目標追蹤與深度強化學習控制。\n§3.2，圖 3.2-2 至 3.2-4，正文頁 18–23。\n來源檔：NCKU_PBVS for Moving Ground Target Tracking Using a Fixed-Wing UAV with DRL Controller_unlocked.pdf\n\n## 原簡報第 8 頁\n\n花偉傑，2026，基於位置式視覺伺服之固定翼無人機地面移動目標追蹤與深度強化學習控制。\n§3.3.1–3.3.3，圖 3.3-2，正文頁 24–31。\n來源檔：NCKU_PBVS for Moving Ground Target Tracking Using a Fixed-Wing UAV with DRL Controller_unlocked.pdf\n\n## 原簡報第 9 頁\n\n花偉傑，2026，基於位置式視覺伺服之固定翼無人機地面移動目標追蹤與深度強化學習控制。\n§3.3.4–3.3.5，圖 3.3-4，正文頁 32–41。\n來源檔：NCKU_PBVS for Moving Ground Target Tracking Using a Fixed-Wing UAV with DRL Controller_unlocked.pdf\n\n## 原簡報第 10 頁\n\n花偉傑，2026，基於位置式視覺伺服之固定翼無人機地面移動目標追蹤與深度強化學習控制。\n§2.3、§4.1、§5.4，圖 2.3-1。\n來源檔：NCKU_PBVS for Moving Ground Target Tracking Using a Fixed-Wing UAV with DRL Controller_unlocked.pdf\n\n## 原簡報第 11 頁\n\n花偉傑，2026，基於位置式視覺伺服之固定翼無人機地面移動目標追蹤與深度強化學習控制。\n§2.4、§4.2，圖 2.4-1。\n來源檔：NCKU_PBVS for Moving Ground Target Tracking Using a Fixed-Wing UAV with DRL Controller_unlocked.pdf\n\n## 原簡報第 12 頁\n\n花偉傑，2026，基於位置式視覺伺服之固定翼無人機地面移動目標追蹤與深度強化學習控制。\n§3.4.1，圖 3.4-1，正文頁 43–45。\n來源檔：NCKU_PBVS for Moving Ground Target Tracking Using a Fixed-Wing UAV with DRL Controller_unlocked.pdf\n\n## 原簡報第 13 頁\n\n花偉傑，2026，基於位置式視覺伺服之固定翼無人機地面移動目標追蹤與深度強化學習控制。\n§3.4.1–3.4.3，正文頁 43–57；§5.3、圖 5.3-4。\n來源檔：NCKU_PBVS for Moving Ground Target Tracking Using a Fixed-Wing UAV with DRL Controller_unlocked.pdf\n\n## 原簡報第 14 頁\n\n花偉傑，2026，基於位置式視覺伺服之固定翼無人機地面移動目標追蹤與深度強化學習控制。\n§3.5.1、§4.1、§4.3，圖 3.5-1。\n來源檔：NCKU_PBVS for Moving Ground Target Tracking Using a Fixed-Wing UAV with DRL Controller_unlocked.pdf\n\n## 原簡報第 15 頁\n\n花偉傑，2026，基於位置式視覺伺服之固定翼無人機地面移動目標追蹤與深度強化學習控制。\n§3.5.2，表 3.5-2、式 3.5.6–3.5.8，正文頁 63–64。\n來源檔：NCKU_P
