const DOCS=[{"file": "guides/checkpoint-comparison.md", "name": "checkpoint-comparison.md", "title": "停訓後比較 checkpoint", "group": "操作與設定", "text": "# 停訓後比較 checkpoint\n\n`compare_training_checkpoints` 使用 `sim`，不呼叫 `train`、不回滾、不改寫課程狀態或 MAT checkpoint。先評估再決定是否續訓；另開分支使用 prepare_recovery_training。\n\n## 實驗室操作\n\n確認原實驗 stopped，於 PowerShell 更新：\n\n```powershell\ncd D:\\daniel\\ModularTraining\ngit pull --ff-only\n```\n\n在 MATLAB 專案根目錄執行（FAFA_Simulation 必須未開啟；建議另開乾淨 MATLAB）：\n\n```matlab\nsessionDir = fullfile(pwd,\"experiments\",\"progressive_v1\",\"runs\",\"20261009_201547_tpf1292058_f8ca_4ccd_bc7f_a66b20ee91b4\");\nevaluation = compare_training_checkpoints(sessionDir);\ndisp(jsonencode(evaluation.results,PrettyPrint=true))\n```\n\n預設比較 6100、10600 與最新 checkpoint，各在課程快照前三階段評估一次，最多各 3000 步。若最新與前兩個重複則去重。checkpoint 的 episode 以已保存訓練歷史驗證；最新候選不可讀時明確報錯，不偷偷改用較舊模型。\n\n使用 CPU、單程序，不啟動 worker pool，不更改正式 GPU／6 workers 設定。明確關閉策略探索，各次 sim 重載 agent；相同 seed、相同保存軌跡、模型初始條件與零風。以上為預設前三階段；2026-10-11 新增 random 與風場評估，使用方式及配對 seed、終端門檻證據的限制見 [Stage 5 診斷](stage5-evaluation.md)。\n\n## 結果\n\n每次建立新的 `run/reports/evaluation_<時間>_<唯一碼>/`，內含：\n\n- `evaluation.json`：checkpoint 路徑／episode／SHA256、目前 runtime／SLX／課程指紋、每次 reward、步數、IsDone、動作飽和比例等。可貼回對話；目前整個 evaluation 目錄受 Git 忽略，不使用 `git add -f` 上傳。\n- `scenarios.mat`：本次實際使用的固定軌跡與選項。\n- `ep*_stage*_seed*.mat`：原始 observation/action/reward/IsDone experience，留在實驗室。\n\n逐次保存結果；`status=complete` 才表示整組成功。失敗會記錄 failed 與錯誤，不能把部分完成當全組比較。Ctrl+C 可以停止評估，不會動訓練存檔；中斷時 JSON 可能仍為 running，已保存列可讀取但不是完整結果。編譯快取放在系統暫存目錄，避免 Windows 深層路徑限制；路徑會寫入 JSON。\n\n`reached_step_limit` 只表示跑到本次設定上限，不保證路徑完成或控制正確。`environment_done` 只代表模型的 IsDone；termination_evidence 新增終端 observation 門檻證據，並非直接記錄 IsDone 分支，不能推論失速；詳見 Stage 5 診斷文件。`observation7_rms` 是原始 observation 第 7 通道統計，不宣稱為公尺單位追蹤誤差。\n\n這是已訓練任務的固定條件診斷，不是獨立泛化測試。預設只有一個 seed；即使指定多個 seed，固定初始狀態／零風／確定策略也可能完全重複，不代表多個獨立測試情境。不能從此結果宣稱統計成功率。\n\n## 保護與驗證\n\n工具取得既有 supervisor.lock 排他鎖並檢查停止狀態；不呼叫會更新狀態的 trainingcurriculum.prepare。要求模型未開啟，不操作其他 pool。結束後還原 cwd、path、rng、原 Agent_Stage2、軌跡 globals 與 Simulink 快取設定；模型關閉但不存檔。checkpoint 比較前後比對 SHA256，sim 前後比對 actor／critic 權重。\n\n固定路徑與模型設定輔助程式取自目前 training_engine，避免更動活動訓練的程式；每次評估檢查固定路徑函式與引擎版本一致，若後續修改造成差異則拒絕執行。這仍是「目前執行版本」的評估，不能證明它與歷史訓練 runtime 完全相同。\n\n測試入口：`tests/test_checkpoint_comparison_guards.m`（不模擬）；`tests/test_checkpoint_comparison.m`（使用既有本機短測 checkpoint，六次各五步 CPU 真實模擬，不訓練）。\n\n2026-10-10 驗證：初次短測發現深層快取觸發 Windows 路徑限制，已改為系統暫存短路徑。通過真實模擬的範圍是本機既有短測 checkpoint，不是實驗室 6100／10600，也沒有測 GPU／多 worker 或長期收斂。\n"}, {"file": "guides/curriculum-layout.md", "name": "curriculum-layout.md", "title": "以課程管理實驗，保留既有訓練", "group": "操作與設定", "text": "# 以課程管理實驗，保留既有訓練\n\n2026-10-10 更新：課程定義與輸入在課程目錄，每次執行的進度、模型與報告留在自己的 run：\n\n```text\nconfigs/lab_gpu6.json                  硬體與重試設定\n+trainingmodels/ppo_lstm128/            模型定義\nexperiments/progressive_v1/\n  curriculum.json                     課程定義，指定模型和各階段條件\n  assets/                             可重建的 MAT 輸入（不納入 Git）\n  runs/<時間_唯一碼>/\n    curriculum.json                   此實驗的課程快照\n    curriculum_assets/                軌跡輸入快照\n    curriculum_state.json             實際階段分界與進度\n    model.json、model_source/          此實驗使用的模型及原始碼\n    control.json                      此實驗的硬體／執行設定\n    Agent_Final.mat、checkpoints/      可用 checkpoint（訓練後產生）\n    attempt_*/、diagnostics/、runs/    日誌與分段紀錄\n    reports/report.json               此實驗精簡報告（可納入 Git）\n    reports/reward_history.png、.csv   圖與逐回合資料（不納入 Git）\n```\n\n標準入口是 experiments/<課程>/curriculum.json，課程名稱取自父資料夾。其他獨立 JSON 範例仍按檔名分類。舊的 curricula/progressive_v1.json 入口由 retry／curriculum_plan 轉到新路徑並提示，不保留兩份可編輯定義。課程改版建議另取 progressive_v2。模型是課程參數；更換模型會建立不同實驗，並不代表不同架構可直接沿用權重。curriculum_state.json 是每次 run 的進度，不放在共享課程層。\n\n非 curriculum 訓練仍使用 `+trainingmodels/<model>/runs/`。已有課程實驗無論放在此舊目錄或新目錄，都依 `retry(resume=完整實驗路徑)` 原位續用，不會被自動搬到新位置。新實驗目錄只放行課程定義與各 run 的 reports/report.json，其餘資料受 Git 忽略；舊模型目錄仍整體忽略。畫圖及報告工具可搜尋兩種結構。\n\n## 已遷移實驗的 reports 整理（本次更新）\n\n目前已在 experiments/progressive_v1/runs 下的實驗不需再搬 checkpoint，亦不重建模型。確認已 stopped，並停止舊的 Python watch 後，在實驗室專案根目錄執行：\n\n```powershell\ngit pull --ff-only\npowershell.exe -NoProfile -ExecutionPolicy Bypass -File .\\organize_training_reports.ps1 -SessionPath \"D:\\daniel\\ModularTraining\\experiments\\progressive_v1\\runs\\20261009_201547_tpf1292058_f8ca_4ccd_bc7f_a66b20ee91b4\" -Machine lab\n```\n\n此工具將根目錄 reports/lab/<實驗>/report.json、run 根目錄舊 reward_history.png／.csv 複製到 run/reports，逐檔比對 SHA256，原件保留。不存在的來源會提示略過；已有相同內容可重跑，不同內容則拒絕覆蓋。若舊報告另存他處，可提供 -LegacyReportPath。來源報告必須符合 session_id 與 machine，避免混入其他實驗。\n\n之後原本匯出／畫圖指令不變，自動寫入 run/reports；--output 仍可明確選擇其他輸出位置。要重建頂層 assets，可在 MATLAB 執行 prepare_progressive_training()，不啟動訓練；目前停止的 Stage 3 問題尚未處理，不因更新目錄而自動續訓。\n\n## 舊版遷移背景：活動訓練的處理\n\n1. 保留目前 `+trainingmodels/ppo_lstm128/runs/20261009_201547_...` 原位，讓既有 supervisor 繼續執行。不需要為分類改變而停止訓練。\n2. 不搬移、不改名、不刪除該實驗，也不編輯其 control／curriculum 快照。活動中的程序持有舊絕對路徑，移動資料可能造成後續讀寫失敗。\n3. 現在若只要 stage 分界圖，只複製新版 `plot_training_rewards.py` 到實驗室，停止並重新啟動畫圖工具。不要在訓練中整包更新會被後續 attempt 載入的執行程式。畫圖工具只讀訓練資料、寫圖與 CSV；停止它不會停止訓練。\n4. 等訓練正常結束／暫停、supervisor 與 worker 都退出後，將整個實驗資料夾備份到另一位置；不要只備份單一 MAT。課程狀態、輸入與模型快照也需要保留。\n5. 再更新完整程式。可指定原路徑續訓，或使用下方工具把已停止的實驗複製到新結構；不支援活動實驗搬移或跨課程匯入。\n\nGitHub 的精簡 report.json 不是模型備份；MAT 與完整實驗仍留在原電腦。這次變更沒有操作實驗室檔案，不能取代對遠端磁碟／備份的確認。\n\n## 舊版完整遷移（已完成者不要重跑）\n\n2026-10-10 使用者已回報實驗室 attempt 8 為 stopped，並要求在新結構繼續這次模型。先在實驗室專案根目錄更新程式，再執行 PowerShell：\n\n```powershell\ngit pull --ff-only\npowershell.exe -NoProfile -ExecutionPolicy Bypass -File .\\migrate_training_session.ps1 -SourceSession \"D:\\daniel\\ModularTraining\\+trainingmodels\\ppo_lstm128\\runs\\20261009_201547_tpf1292058_f8ca_4ccd_bc7f_a66b20ee91b4\" -CurriculumName progressive_v1\n```\n\n工具取得 supervisor 排他鎖、拒絕活動狀態／已存在目的地／外置 diagnostics／連結目錄。完整複製到暫存位置，逐檔 SHA256 比對並保留原檔；只修正新副本的 control.json 執行路徑與 status／STOP，完成後才發布到 `experiments/progressive_v1/runs/<原實驗 ID>/`。模型、課程狀態、輸入與歷史日誌保持原始內容；歷史日誌裡的舊路徑不改寫。複製全部資料需額外磁碟空間，雜湊驗證也可能花時間。\n\n失敗會保留原件與可能存在的 `.incoming_*` 暫存資料，絕不自動刪除；不要拿暫存目錄續訓。成功後仍不自動訓練。原 `matlabExe` 保留，同機續訓時 retry 會再以目前 MATLAB 更新它；此工具不是任意跨機遷移工具。\n\nMATLAB 的 Current Folder 切到實驗室專案根目錄：\n\n```matlab\nclear retry verify_training_session\nnewSession = fullfile(pwd,\"experiments\",\"progressive_v1\",\"runs\", ...\n    \"20261009_201547_tpf1292058_f8ca_4ccd_bc7f_a66b20ee91b4\");\nverified = verify_training_session(newSession);\n% 上行成功並確認顯示的 episode/stage 合理後，才執行：\ninfo = retry(resume=newSession);\n```\n\n驗證函式讀取最新可用 PPO checkpoint、真實累計回合數與課程位置，不啟動 pool 或訓練。不可讀的最新檔案會列出並嘗試較舊候選；若候選皆無效或早於目前階段起點，拒絕通過，不能從零開始冒充續訓。停止前未存檔回合仍需重跑。原件保留但不要同時續跑兩份。\n\n畫圖工具請停止舊 watch 並重新指向 `newSession` 的新完整路徑；MATLAB 的 info 在續訓後也會指向新位置。GPU、workers、階段及既有模型設定由副本保留，無須重跑 prepare_progressive_training 或新實驗入口。\n\n## 圖上的階段分界\n\n灰色虛線仍代表 attempt 邊界；橘色點劃線代表實際 stage 切換。Episode 軸下方標示 Stage 1／Stage 2 與階段 id。如果 Stage 2 的 start_episode=3000，線畫在 3000 與 3001 之間。\n\n標記只讀該實驗的 `curriculum.json` 和 `curriculum_state.json`，不依 JSON 預算或 reward 猜分界。沒有課程紀錄的舊實驗仍可畫 reward；狀態讀取不完整或不一致時會警告並暫不畫 stage，下次 watch 更新再讀取。\n\n2026-10-10 修正：MATLAB 重新編碼單筆 completed 時可能從陣列變成物件，畫圖端現在兼容兩種形狀；原先會誤報 Incomplete stage history。這不需要修改實驗 JSON 或停止訓練。PNG 改為暫存檔完成後原子替換；寫入失敗保留前張成功圖片，watch 提示後重試，持續失敗可關閉圖片檢視器或改用 --output 路徑。PNG 與 CSV 仍是分別輸出，不是兩檔交易式快照。\n\n啟動指令不變，務必指定正在跑的實驗完整路徑，避免自動選到別的測試實驗：\n\n```powershell\npython plot_training_rewards.py \"D:\\daniel\\ModularTraining\\+trainingmodels\\ppo_lstm128\\runs\\20261009_201547_tpf1292058_f8ca_4ccd_bc7f_a66b20ee91b4\" --watch 30\n```\n\n驗證：MATLAB 以 start=false 確認新目錄、舊課程目錄原位續用、非課程模型目錄相容；Python 驗證新舊搜尋、3000.5 分界、無課程／無效狀態，以及既有報告／退步診斷。另用合成資料產圖檢查標籤，非實驗室真實曲線。不重跑真實訓練。\n"}, {"file": "guides/curriculum.md", "name": "curriculum.md", "title": "JSON 訓練課程：同一 agent，逐階段換軌跡", "group": "操作與設定", "text": "# JSON 訓練課程：同一 agent，逐階段換軌跡\n\n一份 JSON 描述「要訓練什麼、何時進下一階段、沒學會時怎麼辦」。規劃器解析固定欄位，不執行設定檔內的程式碼；目前採 JSON，尚未支援 YAML。\n\n依 2026-10-09 使用者確認，模型在整份課程最外層指定。階段切換沿用同一個 agent 的 checkpoint 和累計訓練歷史，不重新初始化網路，也不允許每階段偷偷換不同架構。各階段目前可改軌跡、風場與過關／預算條件；學習率與 PPO 超參數仍由 model profile 決定，不在課程中動態調整。\n\n## 直接使用\n\n```matlab\n% 只讀與檢查設定，不訓練、不建 pool：\nplan = curriculum_plan(\"curricula/fixed_to_random.json\");\n\n% 先建立可檢查的實驗快照，不啟動訓練：\ninfo = retry(curriculum=\"curricula/fixed_to_random.json\", start=false);\n\n% 使用者準備好時才執行：\n% info = retry(resume=info.sessionDir, workers=6, minWorkers=1);\n```\n\n`curricula/fixed_to_random.json` 不需要外部 MAT，依序使用現有固定路徑函式與現有隨機路徑生成器。條件數字是示範，不是已重現花偉傑論文成效的參數；內建固定路徑亦不能當成論文第一階段路徑的精確復原。\n\n`curricula/two_mat_then_random.example.json` 對應「軌跡1 → 軌跡2 → random」。其中 MAT 尚未提供，可先用 `curriculum_plan(...,checkFiles=false)` 檢查格式；真正建立實驗時必須有有效 MAT。\n\n## 一個階段怎麼寫\n\n```json\n{\n  \"id\": \"trajectory_one\",\n  \"trajectory\": {\n    \"type\": \"mat\",\n    \"file\": \"../trajectories/軌跡1.mat\",\n    \"waypoints_variable\": \"waypoints\",\n    \"velocity_variable\": \"velocity\"\n  },\n  \"wind\": {\"east_mps\": [0, 0], \"north_mps\": [0, 0], \"turbulence\": [0, 0]},\n  \"advance_when\": {\n    \"all\": [\n      {\"metric\": \"stage_episodes\", \"at_least\": 5000},\n      {\"metric\": \"reward_mean\", \"window\": 100, \"consecutive_windows\": 3, \"at_least\": 2500}\n    ]\n  },\n  \"max_episodes\": 20000,\n  \"on_limit\": \"pause\"\n}\n```\n\n含義：此階段至少完成 5000 回合，而且最近三個各 100 回合、不重疊的區間平均 reward 都 >=2500 才進下一階段。跑到 20000 回合還沒通過，就在存檔後暫停。\n`consecutive_windows:3` 是最近 300 回合切成三段全部符合，不是同一份日誌被規劃器讀三次，也不是三個重疊的 rolling average。\n\n最外層固定為 `{\"schema_version\":1,\"model\":\"ppo_lstm128\",\"stages\":[...]}`。\n`id` 使用不重複的英文字母開頭名稱，例如 `trajectory_one`；MAT 檔名可以用中文。\n\n## 條件字典\n\n| 欄位／指標 | 意義 |\n| --- | --- |\n| `all` | 裡面條件全部成立，等同 AND |\n| `any` | 裡面任一條件成立，等同 OR；可與 all 巢狀組合 |\n| `stage_episodes` | 目前這一階段已保存的回合數，不是全實驗累計數 |\n| `reward_mean` | 最近 window 回合的平均 reward |\n| `steps_mean` | 最近 window 回合的平均步數 |\n| `full_length_rate` | 最近 window 回合中，步數 >= steps_at_least 的比例（0～1） |\n| `at_least`／`at_most` | >=／<=；每個指標只能選一種 |\n| `window` | reward／steps／比例指標必填，資料不足時不通過 |\n| `consecutive_windows` | 需連續符合的完整不重疊區間數，預設 1 |\n\n若單純要排程「此階段跑 10000 回合就換」，使用 `{\"metric\":\"stage_episodes\",\"at_least\":10000}`。\n若要「至少 5000 回合且表現達標」，用 all。不要把最少回合與 reward 寫成 any，否則只要跑滿回合就會過關。\n`full_length_rate` 是步數指標，不能當成真正任務成功率；目前環境未提供可供此規劃器判定的獨立成功旗標。\n\n## 軌跡與風場\n\n- `fixed_builtin`：使用 runtime 現有 `createFixedPath()`，整階段維持該路徑。\n- `mat`：位置與速度都需為有限實數 N×3 陣列、N>=2 且形狀相同。位置沿用現有模型的 East/North/高度公尺慣例，速度為相應三軸 m/s；不自動猜測座標系、插值或轉換 waypoint-only 檔案。請確認取樣間距、速度及起點適合目前 0.1 秒／15 m/s 環境。\n- `random`：必填 `refresh_every_worker_episodes`；10 代表每個 worker 的本地回合計數每 10 回合更新。程序重啟會重置本地計數，不代表全域精確每 10 回合同步換路徑。\n- `east_mps`／`north_mps` 是每回合均勻抽取的整數範圍；`[0,0]` 為零風。`turbulence` 是 0～2 的整數範圍。不是任意連續風速或 turbulence 物理量。\n\nMAT 路徑相對於 JSON 所在資料夾解析，不接受絕對路徑。MAT 輸入仍受專案 `*.mat` 忽略規則保護，不會自動上傳 GitHub；雙機準備新實驗時需另行提供這些輸入，或明確決定哪些小型輸入資產要版控。\n\n## 規劃器的執行與恢復\n\n1. `retry(curriculum=...)` 檢查所有階段與 MAT，保存 `curriculum.json` 和 `curriculum_assets/`。後續編輯原 JSON／MAT 不影響已建立實驗。\n2. 每個 attempt 選有效 checkpoint，再用其中保存的 EpisodeReward／EpisodeSteps 計算條件。stdout 與 worker-local 計數不作為切換依據。\n3. 一段最多執行 `episodesPerProcess` 回合（預設 1000），且不超過當前階段剩餘預算。只在存檔邊界判斷；條件成立後下一段換環境並沿用 agent。不是達到某個 reward 的瞬間中斷平行 workers。\n4. `curriculum_state.json` 保存階段索引、階段起始 episode 和已完成階段；重啟後不重複計算上一階段。checkpoint 若早於目前階段起點，或已有 checkpoint 卻遺失狀態檔，拒絕猜測與靜默回滾。\n5. 過關判斷優先於預算上限。同時滿足時算通過；未通過而達上限，`on_limit:\"pause\"` 保存後暫停；明確指定 `\"advance\"` 才按預算直接進下一階段。\n6. 最後一階段 advance 代表課程結束，保存 `Agent_Success.mat`。若原因是 `episode_budget_reached`，只代表預算排程完成，不代表學會任務。`curriculum_outcome.json` 保存實際原因。\n\n課程模式不使用全實驗 `targetReward` 作停止條件，顯式傳入它會被拒絕；過關全部寫在 advance_when。原本沒有 curriculum 的 retry 呼叫仍維持原流程。\n平均 reward 圖與 MATLAB 原有歷史仍是全實驗累計；規劃器指標只看當前階段。匯出報告的 learning_health 也改為只看當前階段，避免固定路徑→random 的難度變化直接觸發跨階段退步訊號。\n\n已開始實驗的課程是快照。預算耗盡後直接 resume 同一份設定，仍會停在相同限制，不會自動清零預算；目前不提供執行中改課程或 fork checkpoint 並更換課程的入口。調整原計畫並建立新實驗會從新 agent 開始，勿誤當接續舊權重。\n`+trainingcurriculum` 與 runtime 一樣屬執行程式，活動訓練期間不要修改或同步覆蓋它們。\n\n## 驗證範圍\n\n`tests/test_curriculum.m` 在 R2024b 用合成已保存訓練歷史測試條件、MAT 變數映射與快照、跨階段恢復、預算暫停和完成重入；不執行 train()，也不建立真實 worker pool。\n尚未完成真實 Simulink 平行訓練的跨階段驗證；使用者尚未提供軌跡1／軌跡2的實際 MAT，因此範例檔仍是待填入輸入的模板。\n"}, {"file": "guides/diagnostic-package.md", "name": "diagnostic-package.md", "title": "跨機診斷 ZIP（不進 Git 歷史）", "group": "操作與設定", "text": "# 跨機診斷 ZIP（不進 Git 歷史）\n\n在已停止的實驗室副本，用 PowerShell 執行：\n\n```powershell\ncd D:\\daniel\\ModularTraining\ngit pull --ff-only\npowershell.exe -NoProfile -ExecutionPolicy Bypass -File .\\pack_training_diagnostics.ps1 -SessionPath \".\\experiments\\progressive_v1\\runs\\20261010_155437_recovery_tpebed29a8\" -EvaluationName \"evaluation_20261010_183235_tp0d559eeb\"\n```\n\n預設選取 Agent10600／10700、runs/r000001 的初始 agent／訓練選項／腳本快照、課程及恢復設定、指定完整 evaluation 的 JSON 與 traces、稽核 JSON 及 attempt 診斷日誌。可用 -Episodes 10600,10700,11000（直接以 PowerShell 呼叫腳本時）調整 checkpoint；預設兩個足以調查第一次退步。不納入模型快取或全部歷史 checkpoint。這是診斷子集，不能用作完整續訓備份。\n\nZIP 寫入專案 diagnostic_packages/（Git 忽略），含 manifest.json 的逐檔大小和 SHA256；封裝後重新讀 ZIP 核對每個來源雜湊。工具持有 supervisor 排他鎖並要求停止狀態；不更動來源，不上傳。失敗留下 .partial 供調查，不會冒充成功 ZIP。實際大型檔案的時間／大小須以實驗室結果為準；本機通過合成小檔案測試。\n\n## GitHub 傳送\n\n在 repository 的 Releases → Draft a new release，填獨立標籤如 diagnostics-20261010-recovery，將 Verified ZIP 對應的檔案加入附件，選 Save draft。不要用 Add file 將 ZIP 提交到程式碼，也不要以 git add -f 加入 MAT。\n\n草稿下載需要可存取草稿的帳號；宿舍端用相同／有權限帳號下載，告知本機 ZIP 路徑與打包印出的 SHA256，即可驗證後分析。如果改成正式發佈，先確認 repository 可見性與附件內容（檔案可能包含機器路徑）。啟用 immutable releases 時，正式發佈後有附件修改／刪除限制，診斷用途保持草稿即可。\n\n這裡的工具不自動建立 Release、刪除附件或重寫 Git 歷史。附件傳完後可手動刪除草稿；已下載的副本不會隨之刪除。\n\n參考：[GitHub 管理 Releases](https://docs.github.com/en/repositories/releasing-projects-on-github/managing-releases-in-a-repository)。\n"}, {"file": "guides/endpoint-v2-training.md", "name": "endpoint-v2-training.md", "title": "第二版末端目標修正與續訓", "group": "操作與設定", "text": "# 第二版末端目標修正與續訓\n\n2026-10-12 使用者授權正式部署、push 及提供續訓指令。正式 runtime/FAFA_Simulation.slx 的 guidance 採用實驗室已評估的 endpoint_lookahead_v2 原碼；reward、IsDone、planner、課程與 optimizer 不變。這是環境變更，不能將前後分數差異全歸因於學習。\n\n實驗室 Agent21600：第二版既有 seeds201:210 的 Stage4/5 共20次、新 seeds211:220 共20次、前三階段 seed101 共3次，全跑滿3000步；另外原版新情境20次也全部完成。新情境小風平均reward原版2917.28、第二版2995.42，平均observation7 RMS 0.22024、0.21226。Stage5 抽樣包含零風案例，不代表全是非零風。最差距離仍接近46m；Stage6尚未驗證，不能宣稱整體合格。評估報告為使用者實驗室輸出，本機未執行21600checkpoint。\n\n新配方 configs/recovery_21600_endpoint_v2.json 從21600接續，actor LR保持2.5e-5，每段100，新增預算10000（最多31600），保留退步保護。繼承原課程Stage5進度，不因評估通過而跳階；提前課程完成、退步或其他暫停條件仍可能先停止。硬體沿父control（原目標6workers/GPU），不是本機驗證此組合。\n\n先確認實驗室沒有活動訓練／評估。PowerShell：\n\n```powershell\ncd D:\\daniel\\ModularTraining\ngit pull --ff-only\n```\n\nMATLAB：\n\n```matlab\ncd D:\\daniel\\ModularTraining\nclear prepare_recovery_training retry\nrehash\nif bdIsLoaded('FAFA_Simulation'), close_system('FAFA_Simulation',0); end\nroot=fileparts(which('retry'));\nparentSession=fullfile(root,'experiments','progressive_v1','runs', ...\n    '20261010_224522_recovery_tpc1c4f06e');\nnext=prepare_recovery_training(parentSession, ...\n    fullfile(root,'configs','recovery_21600_endpoint_v2.json'));\ninfo=retry(resume=next.sessionDir);\ndisp(info.sessionDir)\n```\n\n只執行一次 prepare；它每次建立新分支。後續查進度用 info.sessionDir。不要解除舊run的guard或從舊run直接retry。prepare 保留父checkpoint並記錄新環境SHA與繼承關係；純評估未消耗或增加訓練回合。課程快照、父實驗和checkpoint不覆寫。\n\n正式環境預設評估不再傳 guidanceVariant；baseline 指當前來源SLX。舊版A/B應使用歷史版本的獨立副本，禁止將舊版runtime覆蓋到活動訓練中。tests/fixtures/guidance_before_endpoint.m.txt 僅供幾何回歸，不是可續訓模型。\n\n本機驗證已通過：正式chart與已評估v2原碼相等、末端及邊界幾何、重複套用拒絕、110步CPU純sim、WindowManager初始化、實際短測checkpoint的分支權重/來源保留與假引擎預算暫停。未在本機啟動正式訓練或GPU/6workers測試。SLX其他差異僅視窗開啟狀態與存檔版本/metadata。\n\n使用者預計五小時後檢查一次、之後兩天不使用電腦。此次預算是回合數，不保證五小時跑完，也不自動在五小時停訓；到預算或guard暫停就保留結果等待人工判讀，不自動另開分支。保持實驗室主機供電、不休眠；五小時後可讀取status及最新日誌，不必停訓評估。\n"}, {"file": "guides/lab-start.md", "name": "lab-start.md", "title": "實驗室啟動：6 workers 上限＋GPU", "group": "操作與設定", "text": "# 實驗室啟動：6 workers 上限＋GPU\n\n本機已通過 CPU／1 worker 的三階段真實短測，詳見 `validation-2026-10-09.md`。本設定的 GPU、多 worker、六階段長訓練尚未實測，收斂與門檻仍待校準。本次僅準備設定，不在本機啟動訓練。\n\n## 更新程式\n\n確認實驗室這份專案沒有活動訓練後，在專案根目錄的終端機執行：\n\n```powershell\ngit pull --ff-only\n```\n\nMATLAB 的 Current Folder 切到這份 ModularTraining 根目錄。以下所有相對路徑均以此為基準，不使用宿舍的絕對路徑。\n\n`retry` 的相對 curriculum／resume 路徑固定以 retry.m 所在專案根目錄解析，不依賴 Java 的程序工作目錄（Windows 有時為 System32）。MATLAB 的 fileread 設定檔指令仍需在上述 Current Folder 執行。\n\n## 新實驗：直接啟動\n\n```matlab\nprepare_progressive_training();\ncfg = jsondecode(fileread(\"configs/lab_gpu6.json\"));\nargs = namedargs2cell(cfg);\ninfo = retry(args{:});\ndisp(info.sessionDir)\n```\n\n第一行生成直線與 S 彎 MAT，後面讀取 JSON 並正式啟動背景 supervisor。請記下印出的 sessionDir；重複執行這段會建立另一個新實驗，並非續訓。MATLAB 返回提示符不代表背景訓練已結束。\n\n如要先檢查設定而不訓練，將上方 `info = retry(args{:});` 改為：\n\n```matlab\ninfo = retry(args{:}, start=false);\n% 檢查該 sessionDir 的 control.json、model.json、curriculum.json 後啟動：\ninfo = retry(resume=info.sessionDir);\n```\n\n## 設定含義\n\n- `configs/lab_gpu6.json` 是 retry 的執行參數；`experiments/progressive_v1/curriculum.json` 定義六階段路徑、風場與過關條件。分開保留，方便兩台電腦用不同硬體執行同一課程。\n- `workers:6`、`minWorkers:1`：最多 6 個 MATLAB workers，當次成功取得 n 個便使用 n 個，符合先前的可用數量策略。若整個 pool 建立失敗，後續 attempt 可用 4、2、1 作備援。不是強制湊滿 6 才開始。\n- `device:\"gpu\"`：模型使用 GPU；不代表需要或分配了 6 張 GPU，也不保證比 CPU 快。本設定不會自動改成 CPU。遠端需具備相容 GPU、驅動與相應 MATLAB 工具箱／授權。\n- 每 100 回合存 checkpoint，每段最多 1,000 回合後重啟 MATLAB 並評估階段條件。階段預算不足 1,000 時會縮短該段。\n- `maxAttempts:0` 不限制總 attempt 數；各階段仍有自己的回合上限，未過關會暫停。連續沒有進展的失敗限制為 3；不要把重試機制當成退步自動修正。\n\n若明確想要求「必須正好 6 個」，請同時設定 `minWorkers:6`、`fallbackWorkers:[]`；這會放棄可用 n 個就先跑的策略。\n\n## 查看、停止與續訓\n\n```matlab\nstatus = jsondecode(fileread(fullfile(info.sessionDir,\"status.json\")))\n```\n\nattempt 的 `pool_ready.json` 記錄實際 workers；`control.json` 的 trainingDevice 應為 gpu。遇到 GPU 或建池錯誤，查該 attempt 的 stdout.log／stderr.log。\n\n需要停止時，使用專案既有 STOP 機制：\n\n```matlab\nfid = fopen(fullfile(info.sessionDir,\"STOP\"),\"w\");\nassert(fid ~= -1); fclose(fid);\n```\n\nSTOP 可能中斷尚未存檔的回合，保留可用 checkpoint；確認 status 顯示停止且原 supervisor 已退出後才續訓。下一次 MATLAB 開啟後，使用原 sessionDir 的完整路徑：\n\n```matlab\ninfo = retry(resume=\"此處換成原實驗資料夾完整路徑\");\n```\n\n續訓讀取原 control.json（包含 GPU／worker 設定）與課程快照；不重新讀 configs/lab_gpu6.json。若因階段預算用盡而暫停，應先檢查報告與門檻，單純續訓不會自動增加預算。\n\n分享精簡診斷，在終端機執行：\n\n```powershell\npython export_training_report.py \"此處換成實驗資料夾完整路徑\" --machine lab\n```\n\n完整日誌與 MAT 留在實驗室，僅 reports 下的指定 report.json 可納入 Git。訓練流程與尚未實作的獨立評估／退步回滾見 `training-plan-v1.md`。\n"}, {"file": "guides/learning-health.md", "name": "learning-health.md", "title": "純腳本如何應對學習退步", "group": "操作與設定", "text": "# 純腳本如何應對學習退步\n\n2026-10-09：使用者指出訓練環境只有腳本，沒有 AI 即時修正。可用確定性的規則實作偵測、保留成果與停損，但必須區分訓練 reward 波動、評估退步與程序故障。\n\n## 已實作：診斷訊號\n\n`learning_health.py` 由 `export_training_report.py` 呼叫。每 1000 個連續回合形成一個不重疊區間；若已有平均 >=500 的參考區間，後面連續 5 個完整區間平均低於先前最佳區間的 50%，標記 `suspected_regression`。例如先前最佳區間平均 1800，連續 5000 回合分段平均都小於 900 才觸發。這避免單回合尖峰或少量失敗立即触發停損。\n\n門檻皆可用 CLI 調整；它們只是初始工程規則，不是已驗證的 PPO 收斂判準。輸出會保存門檻、參考區間、最近完成區間、連續低迷次數與未滿區間的資料數。缺回合會打斷連續低迷計數；舊的最佳區間仍可當參考。\n\n這層只標記：每次匯出才計算，沒有背景服務，不會動 MATLAB、超參數或 checkpoint。它不等於已導入自動退步停訓。圖中實驗仍需在實驗室匯出資料，才能驗證訊號是否符合觀察。\n\n## 後續建議的處置順序（尚未實作）\n\n1. **用相同條件評估候選模型。** 定期用固定且獨立於訓練的路徑／風場／seed 集合測試；只評估，不更新權重。不要直接用不同 worker／風場下的單段訓練 reward 判定模型優劣。評估會增加運算成本，頻率應配合每段 1000 回合的設計。\n2. **分開保留最新與最佳模型。** latest 用來恢復進度，best-evaluation 用來保留已取得的能力；兩者保存各自模型、歷史與評估條件。即使後面退步，也不覆蓋 best。尚未有固定評估前，若保留 best-training 也應明確標為暫定候選。\n3. **持續退步後在段落邊界安全暫停。** 當多輪獨立評估都下降，先完成並保存當段，再記錄 `paused_regression`，而不是中途殺掉 MATLAB。目前 STOP 會強制終止所屬程序，不能直接拿它充當「保存後暫停」。必須新增 supervisor 在段落邊界的決策與持久化狀態。\n4. **恢復試驗另開分支實驗。** 可以事先定義候選策略，例如回到最佳模型、僅降低 actor learning rate，設定最多幾次恢復試驗及總訓練預算。保存父 checkpoint 指紋／父 episode 與新參數，避免不斷回滾、覆蓋歷史、重播同一輪失敗。現有 validator 與同目錄防回滾限制會拒絕部分此類操作，需專門設計 fork-from-checkpoint 入口。\n\n不建議偵測到 training reward 一跌就自動改 learning rate：worker 數、隨機風場、路徑或 episode 提前結束都可能造成同樣曲線；不同故障不適合套同一處方。PPO loss、策略 entropy／KL、action 飽和比例與終止原因的紀錄，可幫助選擇恢復策略。\n\n## Worker 數量變更的關係\n\n現在同一段可以用成功建立的 n 個 workers；下一段可重新嘗試目標上限。比較學習成效時仍要一起看 ActualWorkers、總環境步數與訓練時間。現有 seed 由 attempt 決定，跨段或跨機不是完全相同採樣條件。\n\n採用 MATLAB `parpool(cluster,[minWorkers workers])` 的範圍語意，已核對本機 R2024b 的 parpool 說明與 [MathWorks 文件](https://www.mathworks.com/help/parallel-computing/parpool.html)。此語意容許成功 pool 小於上限，不能保證所有授權／worker 連線錯誤都能自動產生小 pool。整個 pool 失敗時仍需 supervisor 的恢復機制。\n\n## 2026-10-10：手動比較工具\n\ncompare_training_checkpoints 已提供停止後的固定無風任務比較，不更新權重；見 [操作與限制](checkpoint-comparison.md)。這補上有限範圍的手動評估入口，仍沒有持續監控、獨立泛化測試集、自動 best 選擇、回滾或分支恢復。\n\n## 2026-10-10：恢復分支的 runtime guard\n\n現在也支援 [恢復試驗](recovery-training.md) 的保存後自動暫停。這是 +trainingguard 的另一組規則，並非本文件原本 learning_health.py 的匯出診斷：每段100回合、連續3個窗口、reward 和 steps 同時下降，或新增1000回合預算用完則暫停。原本沒有 training_guard.json 的實驗不會自動啟用。狀態與有限來源資訊可由 exporter 的 recovery_monitor 分享。\n"}, {"file": "guides/recovery-training.md", "name": "recovery-training.md", "title": "從已驗證候選模型準備恢復試驗", "group": "操作與設定", "text": "# 從已驗證候選模型準備恢復試驗\n\n2026-10-10 實驗室固定條件評估：6100／10600 都在直線與平緩 S 彎達 3000 步；固定轉彎分別為 399／1578 步。12600 三條路徑均在 138 步 IsDone。10600 因而是這三個候選中的恢復起點，並非全歷史最佳或已證明泛化成功。\n\n## 實驗室操作\n\n原實驗保持停止，PowerShell 更新程式：\n\n```powershell\ncd D:\\daniel\\ModularTraining\ngit pull --ff-only\n```\n\nMATLAB 在專案根目錄執行以下「準備」命令，尚不會訓練：\n\n```matlab\nparentSession = fullfile(pwd,\"experiments\",\"progressive_v1\",\"runs\", ...\n    \"20261009_201547_tpf1292058_f8ca_4ccd_bc7f_a66b20ee91b4\");\nrecovery = prepare_recovery_training(parentSession);\n```\n\n它會在同課程的 runs/ 下建立一個新 `_recovery_` 實驗；讀取父實驗 Agent10600 的真實歷史，依已記錄分界重建當時階段。完整保留該 checkpoint 的 actor／critic 權重與截至 10600 的訓練歷史，只將記憶體內 agent 的 actor learning rate 乘 0.5，再另存新實驗。同步改新 model.json 以通過續訓 validator，不修改父 MAT 或原課程／model_source。GPU、workers=6、minWorkers=1、fallback 等硬體設定沿用父 control。\n\n新 recovery.json 記錄父路徑、SHA256、episode、學習率前後數值與配方。可核對輸出應為 parentEpisode=10600、stageIndex=3、actorLearnRate=2.5e-5、maxAdditionalEpisodes=1000。來源若與預期不同，先查明再啟動。\n\n確認後，正式啟動**新實驗**：\n\n```matlab\ninfo = retry(resume=recovery.sessionDir);\n```\n\n這行才啟動實驗室訓練；預期從 10601 接續。不要對 parentSession 執行 resume。重新開 MATLAB 後 recovery 變數不在，需使用準備時顯示的完整新 sessionDir；不必再執行 prepare 以免多建一份。\n\n## JSON 決定的動作\n\n配方：`configs/recovery_actor_half.json`。新實驗保存獨立 `training_guard.json`，不因後續編輯共用配方而改變。\n\n- 每段 100 回合；同階段每 100 回合形成不重疊區間。\n- 參考區間必須平均 reward >=500、平均步數 >=500，選其中 reward 最高者，步數以同一區間為準。\n- 連續 3 個完整區間，reward 和步數都低於參考的 50%，標記 suspected_regression，在保存後暫停。\n- 從父 checkpoint 起最多新增 1000 回合；最後一段會被剩餘預算截短。預設最多到 11600，亦可能因退步、課程條件或程序故障提早停止。\n- 檢查在開始 attempt 前及段末 Agent_Final 完成保存後執行。新階段使用新階段歷史，避免直接把換難路徑當成退步。固定路徑尚未學好但一直低於最低參考值時不會觸發比例規則，因此另有總預算。\n- `training_guard_state.json` 記錄門檻判定、參考區間、連續低分次數及暫停原因。觸發後保持 paused；單純再呼叫 retry 不會繞過它。後續另建有來源紀錄的新試驗，勿刪狀態檔冒充解鎖。\n- 遇到段末恰好是參考最佳區間時，在 health_candidates/ 保留 CandidateN.mat。它只是 training-window candidate，不能標為最佳評估模型，也不會被 supervisor 自動拿去回滾。\n\n這是「規則自動監控與保存後暫停」，不是自動診斷失敗原因。獨立 sim 評估仍由 compare_training_checkpoints 執行；目前沒有自動選最佳評估模型、連續改參數或自動重啟恢復分支。因此沒有無限自動回滾迴圈。\n\n條件是待校準的工程保護規則，可能誤暫停，也不能阻止每次策略退步。只在存檔邊界判斷；不承諾中途每個 episode 即時停止。學習率減半是試驗假設，不是已證實的修復；分段從 1000 改 100 亦改變重啟頻率與 attempt seed，不能把後續差異全歸因於 learning rate。\n\n## 停止後比較\n\n在新實驗 stopped／paused 後執行：\n\n```matlab\nevaluation = compare_training_checkpoints(recovery.sessionDir,episodes=10600);\ndisp(jsonencode(evaluation.results,PrettyPrint=true))\n```\n\n這會比較新分支的起點 10600 和最新存檔，不要求新分支存在 6100。新分支沒有複製父 stdout 日誌；畫圖顯示新生成的回合資料，父訓練歷史則保存在 MAT 與 recovery.json 來源紀錄。\n\n## 驗證與保留\n\ntests/test_recovery_guard.m 使用合成退步歷史、既有 CPU 短測 checkpoint 及假引擎，驗證窗口、階段隔離、單指標下降不觸發、復原後重置、權重與父檔不變、learning rate／manifest 一致、剩餘預算截短、暫停後重啟不進訓練。既有課程測試同步通過。未執行正式恢復訓練或 GPU／6 workers 測試。\n\n建立分支失敗時保留 `.preparing` 目錄供診斷，retry 拒絕啟動該目錄。所有 MAT、來源 lineage、規則狀態和日誌依原 .gitignore 留在產生資料的電腦；GitHub 程式碼不是 checkpoint 備份。\n"}, {"file": "guides/resume-audit.md", "name": "resume-audit.md", "title": "續訓退步唯讀稽核", "group": "操作與設定", "text": "# 續訓退步唯讀稽核\n\n訓練維持 paused/stopped，在專案根目錄執行：\n\n```matlab\naudit = audit_training_resume(info.sessionDir,episodes=[10600 10700 11000]);\ndisp(jsonencode(audit,PrettyPrint=true))\n```\n\n工具取得 supervisor 排他鎖，不 train、不 sim、不更動 checkpoint 或 guard。輸出在該 run 的 reports/resume_audit_*.json，沿用 Git 忽略規則。\n\n- checkpoints 比較所選 checkpoint 與第一個 checkpoint 的 actor／critic 可學習參數，並列出 PPO 主要設定。relative_l2_change 是差異大小，不是故障判定門檻。\n- initial_snapshots 讀取 runs/r*/Agent_Initial.mat 和同層 TrainingOptions.mat，依實際 resume checkpoint 歷史對照。這個快照在 train 呼叫之前保存。exact_equal=true 支持載入時保留可學習參數；不保證後續訓練或 optimizer 內部狀態正確。\n- options_equal 僅比較工具列出的設定，未涵蓋全部 agent 屬性。Worker seeds 和實際 workers 一併列出。\n- 只使用同一 run 下 checkpoints 內的來源檔，避免遷移後舊絕對路徑。無法對應來源或缺少 TrainingOptions 的初始快照會跳過。initial_snapshot_count=0 不能解讀成載入一致。\n\n工具不讀取 optimizer 私有狀態，不分析物理終止原因；不會因看到權重差異就自動降低學習率或回滾。實驗室 MAT 不在本機，需使用者貼回 JSON 才能判斷實際續訓載入是否一致。\n\n本機驗證：使用既有真實短測 agent，加上合成的初始快照與舊電腦路徑配置，確認同 run 解析、相同 actor／critic 參數、設定比對及來源 checkpoint 雜湊不變。未啟動訓練或模擬；不能當作實驗室稽核結果。\n"}, {"file": "guides/run-lineage-proposal.md", "name": "run-lineage-proposal.md", "title": "Run 繼承關係與跨 run reward 畫圖", "group": "操作與設定", "text": "# Run 繼承關係與跨 run reward 畫圖\n\n2026-10-10 記錄構想；2026-10-11 使用者授權實作畫圖工具與文件。實作僅在 `plot_training_rewards.py`，訓練端與既有 run 資料維持原狀。\n\n## 使用方法\n\n原本指令即可自動包含父 run，不需要修改實驗 JSON：\n\n```powershell\npython plot_training_rewards.py \"experiments/progressive_v1/runs/C\" --watch 60\n```\n\n輸出預設仍在 C 的 `reports/reward_history.png` 和 `.csv`，祖先 run 不會收到輸出。停止並重啟 Python 畫圖程序即可載入新版本；訓練中只更新畫圖檔，不需重啟 MATLAB 或更新 runtime。\n\n只看目前 run 的原始日誌：\n\n```powershell\npython plot_training_rewards.py \"experiments/progressive_v1/runs/C\" --no-lineage\n```\n\n父 run 的跨機絕對路徑已失效時，可提供目前存放父 run 的專案根目錄、課程資料夾或 `runs/`，此選項可重複：\n\n```powershell\npython plot_training_rewards.py \"experiments/progressive_v1/runs/C\" --lineage-root \"D:/archive/ModularTraining\"\n```\n\n工具優先使用記錄中的有效路徑；相對位置依子 run／搜尋根目錄解析。失效路徑使用末段 run ID，在同層 runs、本專案及額外搜尋根目錄的標準 experiments、模型 runs、舊 sessions 結構尋找。候選須唯一，不會依時間或名稱相似度猜測。若多份同 ID 副本造成歧義，請使用原記錄路徑可解析的資料配置；`--lineage-root` 增加搜尋位置，不會覆蓋有效路徑或自動消除歧義。工具不掃描 Flower 或任意遞迴目錄。\n\n## 曲線語意\n\n例如 A 跑到 12600，B 從 A 的 10600 接續；B 跑到 11600，C 從 B 的 11000 接續。畫 C 的來源路線為：\n\n| 來源 | 採用 episode |\n| --- | --- |\n| A | 1–10600 |\n| B | 10601–11000 |\n| C | 11001 起 |\n\nA 在 10600 後、B 在 11000 後的其他分支資料不會接入 C。若中間 run 沒新增回合、直接再次分支，其空區段不重複計入祖先資料。同 run 重複 episode 仍使用較新 attempt；不同 run 不互相覆蓋。只有日誌內完整行才納入，寫入中的最後一行等待下一次 watch 更新。\n\n- 淡藍色：每回合 reward。各 run 平均 reward 分色；圖例標示來源 run。\n- 紫色虛線：繼承 checkpoint 與子 run 的接續點，位於 N 與 N+1 之間。\n- 灰色虛線：同 run 內 attempt 分界。\n- 橘色線與軸下文字：各 run 保存的 curriculum stage 歷史；繼承的相同階段不重複標示，不把接續點當成換階段。\n- 缺少 episode 的區域留斷線及灰色底；缺少祖先時仍畫已知子 run，並在圖上與 console 提示。找不到中間祖先時，不能推測更前面的歷史。\n\nCSV 保留 reward、average_reward、steps、total_steps、q0、attempt，新增 `source_run` 與 `source_session`。後者是目前讀取的完整本機路徑；CSV 與 PNG 沿用 Git 忽略規則。\n\n## 判讀與驗證限制\n\n平均 reward 直接使用各 run 日誌值，不跨分支重新平滑。圖例的 `configured avg window` 讀取目前 control.json，不能證明歷史所有 attempt 的窗口相同；未知值標為 unknown。圖例 `prep SLX` 為 recovery.json 內 prepare 時的模型指紋縮寫，不代表歷史實際執行版本。actor LR 亦為 recovery 準備時記錄。沒有準備紀錄的原始 run 標示未知環境；reward 定義與歷史環境未被此工具核驗，同圖不代表分數可直接比較。\n\n工具偵測循環引用、無效 episode、已知 AgentN／CandidateN 檔名與 episode 不符，以及父 checkpoint 早於該父 run 自身繼承起點。遇到錯誤停止追溯、發出警告；不修復 JSON、編造記錄或連接缺漏曲線。不載入 MAT，不核驗 checkpoint SHA256 或權重；它呈現 metadata 記錄的來源路線，不能作續訓完整性驗證。既有 `verify_training_session`／audit 工具用途不變。\n\n來源讀取為唯讀，不搬移 run、不改寫 checkpoint、curriculum、control、guard、stage state 或日誌，不控制訓練。watch 每次重新讀取來源鏈與日誌，較長祖先會增加 I/O；若需要降低更新負擔，可增大 watch 秒數。只讀檔案不會改變模型學習條件。\n\n`tests/test_plot_lineage.py` 與既有 `tests/test_plot_stages.py` 使用合成日誌驗證三代截斷、不重複繼承歷史、同 run attempt 覆蓋、半行忽略、跨機路徑、歧義、缺失父 run、錯誤 episode／checkpoint、循環、stage 分界、PNG／CSV 與來源檔案不變。這些測試不啟動 MATLAB，不代表實驗室的完整祖先日誌已在本機驗證。\n\n## 尚未實作\n\n所有分支的並排比較、steps／其他指標圖、專用可跨機 lineage schema、歷史執行環境／reward 定義的完整版本證明。現有功能使用既有 recovery.json，不新增或改寫 run 來源 metadata。\n"}, {"file": "guides/stage5-evaluation.md", "name": "stage5-evaluation.md", "title": "Stage 5 暫停後診斷（2026-10-11）", "group": "操作與設定", "text": "# Stage 5 暫停後診斷（2026-10-11）\n\n實驗室在 21600 因 recovery_budget 正常暫停。11600/21600 的前三項無風評估顯示能力保留，但不回答 Stage 5 低分原因。先保持暫停，做隨機路徑的配對無風／小風擾診斷，不調 LR 或過關門檻。\n\n取得本次更新後，在 MATLAB 專案路徑可見、FAFA_Simulation 未開啟時執行：\n\n```matlab\nclear compare_training_checkpoints\nrehash\nroot = fileparts(which(\"compare_training_checkpoints\"));\nsession = fullfile(root,\"experiments\",\"progressive_v1\",\"runs\", ...\n    \"20261010_224522_recovery_tpc1c4f06e\");\nevaluation = compare_training_checkpoints(session, ...\n    episodes=21600,includeLatest=false,stages=[4 5],seeds=201:210);\ndisp(jsonencode(evaluation.summary,PrettyPrint=true))\ndisp(jsonencode(evaluation.results,PrettyPrint=true))\n```\n\n共 20 次 CPU 串行 sim、每次最多 3000 步，沒有訓練、pool 或自動續訓；可能耗時，逐次寫報告。對每個 seed，Stage 4/5 使用完全相同的隨機路徑；每組 checkpoint 都重用保存的 scenario。風場依課程整數範圍抽樣，某些小風擾樣本可能抽到全零，逐列記錄實際值，不將其偽稱有風。\n\n路徑產生器複製自訓練引擎，執行前檢查函式一致性，未修改 runtime。評估每個 seed 生成一條路徑；不重現訓練 worker 每十回合刷新與探索的歷史序列。探索關閉，不能直接把評估 reward 當訓練曲線的同分布樣本。\n\n`evaluation.summary` 每個 checkpoint/stage 提供樣本數、跑滿比例（排除同時 IsDone）、平均 reward/steps、每回合 observation7 RMS 的平均、最低 reward 的 seed/trace。只有 10 個診斷情境，不是正式可靠度或泛化合格證明。若小風擾較差，需依實際風參數與最差 traces 檢查；若兩者皆好，也不能單憑此斷言所有訓練失敗都是探索造成。\n\n`evaluation.results` 有實際 east/north/turbulence、終端原始 obs3/obs7、obs7 最大絕對值與 `termination_evidence`。此欄只是已審視觀測正規化下的終端門檻證據；unknown 保持未知，不猜測物理原因。完整軌跡和風存於 `scenarios.mat`，experience 存於各 trace，並保存 SLX/engine/產生器/課程/checkpoint SHA256。\n\nSimulink 內部亂數 seed 沿用模型保存值，MATLAB seed 並不獨立重設所有噪音來源。因此跨 seed 主要變化為路徑與抽樣風參數，不宣稱每次都有獨立 turbulence 時序。輸出報告明確保留這項限制。\n\n結果仍位於 run/reports/evaluation_*，受 Git 忽略。貼 summary 與 results 即可，先不傳完整 MAT。純評估不解除 training guard 的暫停。\n\n## 本機驗證\n\n`tests/test_wind_evaluation.m` 通過配對路徑一致性、不同 seed 路徑差異、RNG 還原與合成終端門檻案例；使用既有短測 agent 完成四次各五步的真實 CPU 模擬（含強制非零風及 turbulence）。`tests/test_checkpoint_comparison.m` 另通過六次各五步固定路徑/MAT 模擬。source SHA、agent 權重與 caller RNG 檢查通過。這是工具整合短測，未執行訓練，未測試實驗室 21600 的表現或完整 3000 步隨機風擾可靠度。\n\n## 規劃與導引訊號重播\n\n初次 20 次評估發現205/207有風失敗、210同風況成功，離線發現見 [trace 調查](../research/stage5-trace-findings-2026-10-11.md)。需要更多訊號時：\n\n```matlab\nclear compare_training_checkpoints\nrehash\nroot=fileparts(which(\"compare_training_checkpoints\"));\nsession=fullfile(root,\"experiments\",\"progressive_v1\",\"runs\", ...\n    \"20261010_224522_recovery_tpc1c4f06e\");\ndetail=compare_training_checkpoints(session,episodes=21600,includeLatest=false, ...\n    stages=[4 5],seeds=[205 207 210],diagnostics=true);\ndisp(detail.outputDir)\ndisp(jsonencode(detail.results,PrettyPrint=true))\n```\n\n共6次完整CPU純模擬。`diagnostics=true` 在系統暫存資料夾建立同名 SLX 副本，只在記憶體中啟用14路 signal logging，不改 chart 或控制演算法、不存回原模型。每個 trace 新增 `diagnostics` Dataset，記錄 E/N位置、psi/phi、完整 planner path、window path/valid/loiter/target distance、guidance target E/N、d、delta_psi、heta。完整可變長度路徑可能增加檔案大小；僅對指定少數情境使用。\n\n以 [MathWorks sim 文件](https://www.mathworks.com/help/reinforcement-learning/ref/rl.env.rlfunctionenv.sim.html) 的 `experience.SimulationInfo(1)` 取得 SimulationOutput 內的訊號資料。報告保留訊號來源 block/port；缺少必要訊號直接失敗，不以空紀錄冒充完成。這仍未直接記錄 guidance 內部 current_index/is_inside；可用實際位置及輸出路徑離線核對幾何，但有歧義時不能自行假定內部分支。\n\n請先將這次6個 reward/steps與原始205/207/210的結果比較；若不一致，須調查重播差異再推論失敗原因。最後將新的 evaluation 資料夾壓縮分享，包含新增 diagnostics 的 traces，無需 checkpoint。本機没有21600 agent，因此完整實驗室重播仍需在實驗室執行。\n\n2026-10-11 本機 `tests/test_evaluation_diagnostics.m` 通過：同 checkpoint、seed、random 路徑分別做一般與 diagnostics 模式各110步 CPU純模擬，reward、observation、action逐值完全一致；取得14路訊號並跨過約9.9秒的週期更新，原SLX SHA256不變。這不是21600實驗室模型的完整重播驗證。\n"}, {"file": "guides/startup-path-fix.md", "name": "startup-path-fix.md", "title": "路徑首次初始化修正", "group": "操作與設定", "text": "# 路徑首次初始化修正\n\n`runtime/FAFA_Simulation.slx` 的 OBSERVATION/MATLAB Function3 (WindowManager) 原本只在 `mod(buffer_counter, window_length)==0` 發出有效訊號。window_length=100、取樣0.1秒，導致前99次呼叫的planner只有一點路徑，guidance回傳預設零誤差。\n\n修正為：\n\n```matlab\nif buffer_counter == 1 || mod(buffer_counter, window_length) == 0\n    valid_flag = true;\nend\n```\n\n此條件仍位於「剩餘點數足夠構成完整window」的分支內，不改輸入長度要求、之後更新週期、reward、終止門檻或agent設定。SLX封裝逐項比較確認只有chart_60.xml的這一行改變，其餘entry內容一致。\n\n## 相容性\n\n這是環境行為改變，不是checkpoint格式變更。舊agent仍可載入，但舊環境的分數與新環境不能直接視為同一測試；evaluation.json的model_sha256會不同。既有curriculum快照、checkpoint、guard狀態均不修改，不自動開始訓練。\n\n實驗室保持paused，更新後先評估：\n\n```matlab\nclear compare_training_checkpoints\nrehash\nevaluation = compare_training_checkpoints(info.sessionDir, ...\n    episodes=[10600 10700],includeLatest=false,stages=[1 2 3]);\ndisp(jsonencode(evaluation.results,PrettyPrint=true))\n```\n\n這是目前修正版環境的CPU評估，不是舊環境重現。若FAFA_Simulation已開啟，先確認沒有未存修改；評估工具會拒絕使用已開啟的模型，避免覆寫。\n\n## 驗證\n\n`tests/test_window_startup.m` 由實際SLX載入Stateflow函式並直接執行，確認有效呼叫為[1,100,200]、每次window正確切片，短於window的路徑維持無效。不啟動訓練。\n\n本機使用實驗室傳回的10600／10700，原版與修正版各做一次直線CPU sim，seed101、無探索、上限200步。原版在獨立暫存模型副本執行，四次均驗證來源checkpoint雜湊及actor/critic權重不變。\n\n|Checkpoint|原版步數／reward|修正版步數／reward|\n|---|---:|---:|\n|10600|200 / 188.5240|200 / 175.3604|\n|10700|133（IsDone）/ 116.4940|200 / 145.2127|\n\n原版10700重現實驗室133步結果。修正版10700在200步內未提前終止，不能推論已能完成3000步或修好長期收斂；10600的短段reward沒有上升。兩版初始路徑行為不同，分數變動不單獨代表模型更好。原始A/B結果及MAT保存在本機忽略目錄diagnostic_packages/startup_ab.json及startup_v*_ep*.mat。\n\n初始化缺陷修正不等於已修復PPO學習退步；不能據此解除guard或覆蓋原實驗續訓。調查背景見lab-trace-findings-2026-10-10.md。\n\n## 實驗室3000步上限評估回報\n\n使用者提供 evaluation_20261010_200516_tpa46ecfc4 的完整輸出，六項評估完成（seed101，CPU，確定策略）。10600直線/S彎/固定轉彎步數3000/3000/1578，reward3101.85/3184.58/1387.23；10700步數3000/3000/1589，reward2530.87/2686.42/1413.17。\n\n對照原版10700的133/134/133步，初始化修正消除了這組固定條件下的早期失敗。應修正之前把它概括為舊任務能力完全遺失的說法：相同權重在修正版仍可完成直線/S彎，原版的啟動行為是失敗的重要因素。但10700仍有較低reward，直線/S彎observation7 RMS為0.67378/0.65355，相比10600的0.18496/0.12763高；依已驗證d/30映射，模型路徑誤差RMS約20.21/19.61m對5.55/3.83m。兩者第三階段仍未完成，不能宣稱退步或課程難度問題全部解決。\n\n優先保留10600作為下一次獨立試驗候選，不直接resume暫停分支最新11000。若續訓需建立新run並記錄修正版模型雜湊，保留舊環境資料；本回報不代表已授權啟動訓練。此次新trace尚未傳回本機，不能假設固定轉彎仍由相同終止條件觸發。\n\n## 新實驗配方與 JSON 的位置\n\n使用者後續決定另開實驗。`configs/recovery_startup_fix.json` 指定从第一個 recovery 分支10600接續，要求來源actor LR=2.5e-5、scale=1，不再減半；100回合/段、新增上限1000，保留原guard規則與父control的硬體設定。prepare仍不啟動，正式執行由使用者呼叫retry。\n\n```matlab\nclear prepare_recovery_training retry\nparentSession = fullfile(pwd,\"experiments\",\"progressive_v1\",\"runs\", ...\n    \"20261010_155437_recovery_tpebed29a8\");\nfresh = prepare_recovery_training(parentSession,\"configs/recovery_startup_fix.json\");\ninfo = retry(resume=fresh.sessionDir);\n```\n\n共用課程仍是 experiments/progressive_v1/curriculum.json。新run複製父實驗的curriculum.json和assets快照，從10600所屬stage3接續；curriculum_state.json仍留在新run中，不會寫回共用課程或重跑stage1。這是接續學習的新run，不是新隨機初始化的agent。\n\n新run的control.json繼承硬體、model.json記錄不變學習率、recovery.json記錄來源和準備當下的runtime模型/引擎SHA256。SHA只記錄準備時版本，不是隔離整份runtime；之後仍不得在活動訓練期間更新runtime。沿用歷史時guard亦會參考同stage舊歷史，這是保守停止規則，不是新舊環境分數完全可比的證據。\n\n## 從11600跨夜接續\n\n使用者選擇新增10000回合（不是5000），維持人工共同評估，合格後再整理純腳本從頭重跑驗證。11600在修正版直線/S彎均3000步、固定轉彎2673步，支持繼續嘗試但尚未合格。\n\n`configs/recovery_11600_overnight.json` 從新環境分支11600另開run，LR不變、100/段、總上限21600，保留guard及課程過關/暫停規則。回合數不是保證運行時數；可能因退步、課程暫停或錯誤提前停止。啟動前更新，啟動後不要更新runtime。\n\n```matlab\nclear prepare_recovery_training retry\nparentSession = fullfile(pwd,\"experiments\",\"progressive_v1\",\"runs\", ...\n    \"20261010_201201_recovery_tp0241db13\");\novernight = prepare_recovery_training(parentSession,\"configs/recovery_11600_overnight.json\");\ninfo = retry(resume=overnight.sessionDir);\ndisp(info.sessionDir)\n```\n\n自動依課程切換不等於新增獨立評估迴圈；本次仍用現有訓練歷史條件與guard，不自動改參數、回滾或無限擴增預算。\n"}, {"file": "guides/training-plan-v1.md", "name": "training-plan-v1.md", "title": "漸進式 UAV 訓練流程 v1", "group": "操作與設定", "text": "# 漸進式 UAV 訓練流程 v1\n\n目標是讓同一個 PPO agent 先學穩定追蹤，再處理轉彎、陌生路徑與風擾。可執行設定是 `experiments/progressive_v1/curriculum.json`；這是一份待實驗校準的起始方案，不保證收斂，也不是論文參數的精確重現。\n\n## 六個階段\n\n全程沿用 `ppo_lstm128` 的網路與超參數，避免同時改架構、學習率與任務，讓結果比較容易解釋。第一輪先確認課程本身的效果，再另開實驗比較穩定版 profile。\n\n| 階段 | 路徑與環境 | 至少回合 | 平均 reward | 其他條件 | 階段上限 |\n| --- | --- | ---: | ---: | --- | ---: |\n| 1 | MAT 直線、無風 | 2,000 | ≥1,200 | 平均步數 ≥1,500 | 25,000 |\n| 2 | MAT 平緩 S 彎、無風 | 3,000 | ≥1,800 | 平均步數 ≥2,100 | 20,000 |\n| 3 | 內建固定轉彎、無風 | 3,000 | ≥2,000 | 平均步數 ≥2,300 | 20,000 |\n| 4 | 隨機路徑、無風 | 5,000 | ≥2,200 | 平均步數 ≥2,500 | 30,000 |\n| 5 | 隨機路徑、東／北風各 −1～1 m/s、擾動 0～1 | 5,000 | ≥2,400 | 平均步數 ≥2,700 | 30,000 |\n| 6 | 隨機路徑、東／北風各 −3～3 m/s、擾動 0～2 | 10,000 | ≥2,700 | 跑滿 3,000 步比例 ≥80% | 40,000 |\n\n每項表現條件都要求最近三個各 100 回合、不重疊的區間分別達標，且必須滿足最低回合數。每階段到上限仍不達標便保存、暫停，不強迫升級。總預算最高 165,000 回合，並非一定要跑滿；理論最少 28,000 回合。步數是持續模擬的代理指標，不等於任務成功率。這些數值是初始工程假設，尚未以長訓練校準；尤其不同路徑的 reward 分布可能不同。\n\n第一階段保留較長探索時間，避免把從零開始的低分誤判成退步。第三階段才加入現有固定路徑的較急轉彎，避免把「固定」誤認為「簡單」。隨機路徑每個 worker 本地每 10 回合更新，程序重啟會重置本地計數。\n\n這個分解方向也與 MathWorks 的 [PPO curriculum 範例](https://www.mathworks.com/help/reinforcement-learning/ug/train-ppo-for-lka-using-curriculum-learning.html)一致：逐步增加路徑曲率，並另外做評估。但其車輛任務的 reward 門檻不能直接套到 UAV。本計畫不是花偉傑論文第一階段路徑的還原；論文背景及原本實作的差異見既有審視紀錄。\n\n## 準備與啟動\n\n在 MATLAB 切到專案根目錄：\n\n```matlab\ninputs = prepare_progressive_training();\ninfo = retry(curriculum=inputs.planFile, workers=4, minWorkers=1, ...\n    device=\"cpu\", checkpointEvery=100, episodesPerProcess=1000, start=false);\n% 檢查 info.sessionDir 中的 model.json、control.json、curriculum.json 後，\n% 準備正式訓練時才自行執行下一行：\n% info = retry(resume=info.sessionDir);\n```\n\n準備函式建立 6 km 的直線與平緩 S 彎，15 m/s、0.1 秒取樣、70 m 高度，並驗證 JSON。既有 MAT 若內容不同，會拒絕覆寫。它不啟動訓練。兩台電腦都執行同一函式即可重建輸入；MAT、完整日誌與 checkpoint 不納入 Git。\n\n4 workers 是可調整的起始上限，不是已測出的最佳值。可改為 6，仍以當次可用的 n 個 workers 執行；最低 1。此版本本機短測試使用 CPU／1 worker，多 worker 吞吐與 GPU 須另外驗證。正式訓練前檢查授權、RAM 與磁碟空間；每 100 回合存檔在整份預算中可能產生約 1,650 個定期 checkpoint，另有分段存檔，尚無自動保留／清理政策。\n\n條件在分段存檔邊界評估，`episodesPerProcess=1000` 代表可能達標後仍多跑到該段結束，並非每 100 回合定期 checkpoint 都立刻換階段。可縮小分段長度換取更快切換，但會增加 MATLAB／pool 重啟成本。上限會限制當段剩餘回合，不會無限重試學習。\n\n首次正式實驗建議先觀察第一個 1,000 回合區間的 episode 長度、失敗原因、wall time 和記憶體；低 reward 本身不足以宣告失敗。後續比較需同時看環境步數與時間，不只回合數。不要從三回合短測試推算收斂或可靠的長跑速度。\n\n## 退步與階段交接\n\n已實作：沿用 checkpoint 與模型權重、階段內統計、連續區間門檻、預算用盡暫停，以及匯出報告時的疑似退步診斷。課程切換後不拿上一種任務的高分直接當新任務基準。\n\n尚未實作：持續背景監測、自動因退步停訓／回滾、獨立評估選最佳 checkpoint，以及每階段學習率／探索量排程。不能把本計畫當成已具備這些能力的無人值守系統。現在可定期執行 `export_training_report.py <session> --machine lab` 或 `dorm`，分享小型報告；診斷規則見 `learning-health.md`。\n\n若同一階段先學會、之後長期變差，先保存目前狀態與報告，確認任務、worker 數、重啟與 checkpoint 接續是否改變，再比較退步前後 checkpoint 的相同測試任務。不要僅依 reward 曲線直接降低 learning rate，或不保留證據就覆寫／回滾 agent。到階段預算而暫停時也應先檢查資料；不要手改實驗內的課程快照來繞過門檻。\n\n下一項建議實作是獨立 evaluator：固定一套未參與訓練的路徑、風場及 seeds，先用約 20 個平衡測試回合，比較追蹤誤差、失敗率與回合長度，再決定是否升級／保留最佳模型。評估時不更新權重，且需確認使用評估策略。MathWorks 提供 [rlEvaluator](https://www.mathworks.com/help/reinforcement-learning/ref/rl.evaluation.rlevaulator.html)；整合前仍須核對本機 R2024b API 與並行限制。訓練 reward 過關僅是目前可執行的第一層門檻。\n\n研究比較最好重複獨立 seeds，但目前 seed 由 attempt 推導，尚無可設定的實驗 root seed；重跑相同設定不能直接聲稱是獨立 seed 實驗。需先補上 seed 入口與記錄，再比較多次結果。\n\n## 雙機與修改規則\n\nGit 同步程式、JSON、文件與精簡報告。完整可續訓實驗要另外搬移 checkpoint 與相關快照，並核對 control.json 的本機路徑。任何 runtime 更新前確認該副本沒有活動訓練。已建立的實驗使用自己的課程與輸入快照，修改原始 JSON 不會改掉它；調整門檻應建立新版本與新實驗，現階段尚無正式的跨計畫 checkpoint 匯入功能。\n"}, {"file": "research/endpoint-lookahead-candidate.md", "name": "endpoint-lookahead-candidate.md", "title": "路徑末端 lookahead：只供評估的候選", "group": "研究調查", "text": "# 路徑末端 lookahead：只供評估的候選\n\n> 2026-10-12 更新：第二版已經實驗室擴展測試，並正式納入 runtime。以下是候選開發歷史；目前 `baseline` 表示正式第二版，不能拿它當舊版重做 A/B。重複套用候選會明確拒絕。續訓見 [正式部署操作](../guides/endpoint-v2-training.md)。\n\n詳細 traces 證據見 [Stage 5 調查](stage5-trace-findings-2026-10-11.md)。205/207 有風地速約16.3–16.4m/s，超過當前規劃路徑末端後，目標仍停留舊末點，更新時才跳回前方。此候選測試「末端目標不足」對失敗的貢獻，尚未證實能解決所有問題。\n\n`guidanceVariant=\"endpoint_lookahead\"` 僅在臨時模型副本修改 guidance chart：原 inside-window 分支若選到path末點，沿末段切線延伸目標，使沿切線到目標的剩餘距離至少50m。保留原 d/reward/IsDone、planner、更新週期、agent及學習參數。沒有更新正式 SLX。baseline 仍為預設。\n\n限制：延長線不保證與未來轉彎路徑一致，也不保證位於機頭前方；這是局部候選，不是通用路徑規劃解法。原 outside-window 分支不變。只可做模擬診斷；不能因候選回合數增加就宣稱模型學得更好或課程合格。\n\n實驗室保持暫停並更新程式後，模型關閉時執行：\n\n```matlab\nclear compare_training_checkpoints\nrehash\nroot=fileparts(which(\"compare_training_checkpoints\"));\nsession=fullfile(root,\"experiments\",\"progressive_v1\",\"runs\", ...\n    \"20261010_224522_recovery_tpc1c4f06e\");\ncandidate=compare_training_checkpoints(session,episodes=21600,includeLatest=false, ...\n    stages=[4 5],seeds=[205 207 210],diagnostics=true, ...\n    guidanceVariant=\"endpoint_lookahead\");\ndisp(candidate.outputDir)\ndisp(jsonencode(candidate.results,PrettyPrint=true))\n```\n\n與既有 baseline `evaluation_20261011_210201_tp3d1c0564` 比較：205/207無風皆3000，有風1042/743；210兩者皆3000。使用相同checkpoint、路徑seed及風參數，六次最多各3000步。檢查失敗改善、成功案例有無退步，以及實際幾何而非僅reward。後續需擴展其他seed及前三階段；不能只針對205/207調到通過。\n\n輸出包含 guidance_variant、candidate_guidance.m 及其SHA256，model_sha256仍代表未修改的來源SLX，不代表記憶體中候選版本。trace保留diagnostics，壓縮整個新evaluation目錄分享。舊報告及訓練狀態不改。\n\n本機純函式測試包含越過端點、接近端點和非末端目標；另用既有短測agent做110步CPU純模擬檢查整合，原SLX雜湊必須不變。本機尚無21600 checkpoint，沒有替代實驗室完整A/B驗證。\n\n2026-10-11 上述測試已通過：越過直線終點時原目標100、候選160；接近終點且側偏10m時候選目標140，d仍為10；非末端情境輸出相同。候選模型完成110步真實CPU純模擬且來源SLX SHA不變。短測未重現實驗室失敗，不能視為修正效果驗證。\n\n## 第二版：外部分支的末端超越\n\n第一版實驗室結果：205有風3000步，207為1145步，210仍3000；三條無風皆3000。詳細訊號顯示207在109秒超出path包圍範圍（min/max±30m）時，轉入未修改的outside分支，目標退回身後。不能稱第一版已完全修復。\n\n`guidanceVariant=\"endpoint_lookahead_v2\"` 保留第一版inside處理；outside分支新增三個同時必要條件：當前path最近waypoint是末點、沿末段切線已超過末點、到末段延長線的側向距離≤30m。符合才以投影位置加50m作目標；其他outside狀況維持原邏輯。不改原d、heta濾波、reward、IsDone、planner或更新頻率。30m沿用原margin，是候選的工程界線而非安全保證，跨出側偏界線仍可能切回舊邏輯。\n\n實驗室先更新，在相同session執行：\n\n```matlab\nclear compare_training_checkpoints\nrehash\nroot=fileparts(which(\"compare_training_checkpoints\"));\nsession=fullfile(root,\"experiments\",\"progressive_v1\",\"runs\", ...\n    \"20261010_224522_recovery_tpc1c4f06e\");\ncandidate2=compare_training_checkpoints(session,episodes=21600,includeLatest=false, ...\n    stages=[4 5],seeds=[205 207 210],diagnostics=true, ...\n    guidanceVariant=\"endpoint_lookahead_v2\");\ndisp(candidate2.outputDir)\ndisp(jsonencode(candidate2.results,PrettyPrint=true))\n```\n\n與baseline及第一版比較，特別查看207是否仍退回身後目標，以及205/210及無風是否退步。未通過廣泛seed與前階段評估前不部署正式模型、不續訓。baseline、v1、v2都可用相同工具獨立重播，各自保留候選原始碼及SHA。\n\n第二版本機測試已通過：outside末端超越、包圍邊界兩側目標連續、側偏40m和起點後方維持原結果、旋轉90度路徑；另完成110步真實CPU純模擬，原SLX雜湊不變。純函式比較重設persistent歷史以保持兩版本起始狀態一致。尚未驗證實驗室21600的第二版效果。\n"}, {"file": "research/lab-regression-2026-10-10.md", "name": "lab-regression-2026-10-10.md", "title": "實驗室 Stage 3 低分調查", "group": "研究調查", "text": "# 實驗室 Stage 3 低分調查\n\n來源：使用者於 2026-10-10 貼上的 report.json；實驗 `20261009_201547_tpf1292058_f8ca_4ccd_bc7f_a66b20ee91b4`，已遷移到 experiments/progressive_v1/runs。使用者回報 attempt 25 已停止。沒有讀取遠端 MAT，也沒有啟動訓練或改模型。\n\n## 報告可以支持的結論\n\n- 已記錄到 12616 回合；這是 stdout 觀察值，不保證最後可續訓 checkpoint 也是 12616。\n- Stage 3 從 6101 開始，固定轉彎、無風。Stage 2 最後一段 5101–6100 平均 reward 2819.01、平均步數 2983.35、3000 步比例 99.2%。這是該訓練任務表現，不能當獨立測試成功率。\n- Stage 3 所有有資料 attempts 的 3000 步比例均為 0。8101–9100 與 9101–10100 平均 reward 分別 545.65、546.79，平均步數 704.53、681.29：曾有進展，但仍未跑滿回合步數上限。\n- 下跌在 attempt 22（10101–11100、實際 4 workers、正常退出）內開始。10675–10691 的 17 筆分箱平均 reward 947.95、步數 1230.53；10743–10759 降為 182.77／232.82；10828–10844 為 119.19／154.35。分箱不足以確定第一個失敗 episode。\n- 不是剛好在換階段／換 attempt 邊界發生。attempt 23 的建池錯誤發生在這段下跌之後，不能拿它解釋下跌起點。這也不等於已排除所有 worker／環境因素。\n- 最近 1000 回合（11617–12616）平均 reward 126.01，平均步數 173.56，87.9% 少於 256 步，無回合達 3000 步。可確認訓練資料中存在持續短回合低分，不只是平均線視覺效果。\n- learning_health=watch 是因預設需連續 5 個低分的完整 1000 回合區間；目前只有 1 個符合。不是認定訓練健康，也不需要為了觸發它再跑 4000 回合。\n\n## 尚未證實的原因\n\n報告沒有終止原因、追蹤誤差／姿態／動作序列、KL、entropy 或 loss，無法區分控制失敗、環境終止條件、策略更新不穩定等原因。Q0 增長本身不能證明 critic 發散。載入錯誤不能由此推論；此前遷移後成功跑完第二階段，也不支持僅憑時間順序歸咎遷移。\n\n當下程式的平緩 S 彎最大曲率約 0.00114/m（最小半徑約 875m），內建固定路徑名義轉彎半徑 120m，任務變化相當大。這是課程難度安排需要檢查的理由，不是已證實的唯一原因；目前程式指紋不等於歷史執行版本證明。\n\n## 下一步\n\n保留已停止原實驗。先確認 checkpoint 清單，尤其第二階段末 6100、Stage 3 下跌前約 10600，以及最近可用 checkpoint；不要改名覆蓋 Agent_Final 或手改課程狀態來回滾。\n\n下一個有辨識力的實驗是同一組路徑／起始條件、不更新權重，評估上述 checkpoint：同時比較直線／S 彎與固定轉彎，記錄終止條件、回合步數與追蹤誤差。這可區分第三階段尚未學會和舊任務能力是否遺失。獨立 evaluator 與從指定 checkpoint 分支課程目前尚未實作，不能直接給 retry 加不存在的參數。\n\n若評估證實難度落差，再設計中間曲率與左右轉彎階段；若同任務評估證實更新後退步，再做單一因素的恢復實驗。兩者都應另建有父 checkpoint 紀錄的新實驗，保留此失敗實驗作比較。不要現在同時改路徑、學習率、reward 與網路。\n\n## 評估工具後續\n\n使用者確認 Agent6100.mat 與 Agent10600.mat 存在。已提供 compare_training_checkpoints，操作見 [checkpoint 比較](../guides/checkpoint-comparison.md)。只做固定無風任務 sim；尚未取得實驗室實際評估結果。原文「尚未實作 evaluator」描述的是當時調查狀態，分支恢復仍未實作。\n\n## 實驗室評估已回傳\n\n6100：直線3149.46/3000步、S彎3174.21/3000步、固定轉彎362.34/399步。10600：3113.43/3000、3193.73/3000、1401.85/1578。12600：102.77/138、102.64/138、102.83/138。三者同seed101、CPU、無探索，每個任務一次；未查明物理終止原因。\n\n使用者要求繼續並詢問自動規則，已實作指定 checkpoint 分支準備和保存後暫停，見 docs/guides/recovery-training.md；本紀錄前文的「尚未實作分支」為當時狀態。此次沒有啟動實驗室恢復訓練。\n\n## 恢復分支暫停與評估錯誤\n\n實驗室 recovery 分支由 10600 接續，使用者回報在 11000 保存後因 suspected_regression 暫停：連續三個低表現區間，參考 reward 732.82／steps 921.23，最新 reward 109.96／steps 145.83。這表示此配方未阻止觀察到的退步，不能直接證明 learning rate 是根因；維持暫停，不自動回滾或重啟。\n\n比較 10600、10700、11000 時，catch 內的 trainingcurriculum.write_json 報錯，遮住原始評估例外。修正為在進入 Simulink 前綁定報告函式，記錄執行 phase、checkpoint／stage／seed 和原始完整堆疊；即使報告寫入失敗也重新拋出原始例外。尚未重現實驗室最初的失敗，不能宣稱其根因已修復。\n\n本機從既有短測 checkpoint 準備 recovery 分支並做單一任務 5 步 CPU sim，修改前後均完成；修改後 reward 5.50、權重及來源 checkpoint 驗證通過。另以故障注入確認報告寫入成功／失敗都保留原始例外及堆疊，活動訓練拒絕與統計測試亦通過。沒有啟動訓練或測試 GPU／6 workers。\n\n### 第二次錯誤回報修正\n\n實驗室再次回報 checkpointreview.fail_evaluation 無法呼叫，表示預先綁定 package handle 並不足以保護錯誤處理。已移除該 helper，改為主函式 catch 直接輸出及 rethrow，JSON writer 使用同檔 local function；報告額外保存失敗時 cwd 與 project_on_path。切換快取與目錄、模型載入後補回專案搜尋路徑，作為防禦處理，尚不宣稱已證實實驗室路徑遺失的原因。\n\n回歸測試改為呼叫真正 compare_training_checkpoints 入口，在測試替身 load_system 內移除 root 路徑後拋錯；確認原始 identifier／stack 與落盤 JSON 均保留，測試通過。上一版只測輔助函式，未涵蓋其本身無法解析的情境。\n\n第二次修正後另完成既有 recovery checkpoint 的 5 步 CPU 評估（reward 5.50），來源雜湊與權重檢查通過；未啟動訓練。\n\n## Recovery 評估與載入稽核\n\n實驗室更新後完整完成 9 次評估。10600 三項步數為 3000／3000／1578，10700 為 133／134／133，11000 三項均 144。10600 與之前評估一致，表現下降已在第一段 100 回合的存檔出現，且包含直線與 S 彎。單 seed、固定條件，不能據此斷定 optimizer、learning rate 或 LSTM 是根因。\n\n程式審視：resume 分支直接 load agent，新建網路只在無 resume 時執行；每段 train 前已存 Agent_Initial.mat。checkpoint_attempt 按 attempt 編號重設 baseSeed，並同步設定 worker seeds；恢復試驗同時改了段落長度，因此不是只有 learning rate 的單因素差異。固定無風課程 reset 仍使用相同固定軌跡；尚未發現此段程式碼必然導致退步的證據。\n\n新增 audit_training_resume，對照 train 前 initial agent 與其來源 checkpoint 的可學習參數、主要 PPO 設定及 worker seeds，再列所選 checkpoint 參數差異。此為唯讀診斷，須在實驗室執行取得實際資料；不自動開始下一個恢復試驗。操作與限制見 resume-audit.md。\n"}, {"file": "research/lab-trace-findings-2026-10-10.md", "name": "lab-trace-findings-2026-10-10.md", "title": "實驗室 recovery 原始資料分析", "group": "研究調查", "text": "# 實驗室 recovery 原始資料分析\n\n來源 ZIP：diagnostics_20261010_155437_recovery_tpebed29a8_e44b46f8.zip。\nSHA256：EF62BE13F96E990C24992ABED900ADA3FFA4D2D775D27C4C700CE07E48A37C84。\n整包及 manifest 38 個檔案均驗證通過。MAT traces 僅載入與匯出數值，沒有 sim 或 train。來源 ZIP、解壓內容與分析圖保留在被 Git 忽略的 diagnostic_packages/。\n\n## 可確認的提前終止機制\n\nevaluation.json 記錄的 FAFA_Simulation.slx SHA256 與本機 runtime 模型一致。OBSERVATION 的 Mux (SID1628) 第7路來自 Normalization (SID1643/chart86)，輸入為 guidance_law 的 d、finite=30 (SID1642)，因此 observation7=d/30；第3路 phi 以40度正規化。d 同時由 OBSERVATION 第3輸出直送 isdone。\n\nisdone/system_362 的有效路徑是 abs(d)>=50 (SID1991) 以及 phi>=40度、phi<=-40度，經 OR 接到 RL Agent。其他同名舊比較器有 Commented=on，不應誤當有效條件。\n\n|Checkpoint/任務|步數|最後 d（模型計算，m）|全程最大絕對滾轉角（度）|\n|---|---:|---:|---:|\n|10600 直線|3000|2.455|9.528|\n|10600 S彎|3000|0.876|9.528|\n|10600 固定轉彎|1578|50.081|14.438|\n|10700 直線|133|50.247|15.579|\n|10700 S彎|134|50.395|15.579|\n|10700 固定轉彎|133|50.276|15.579|\n|11000 直線|144|50.197|20.683|\n|11000 S彎|144|50.352|20.683|\n|11000 固定轉彎|144|50.116|20.683|\n\n所有提前結束的 trace 都是最後 observation 首次跨過 d=50，前一點仍低於門檻，且全程未達 roll ±40度。因此資料支持此次 IsDone 由模型的路徑誤差門檻觸發；不支持「滾轉超限」或「動作飽和」的解釋（既有評估 action_saturation_fraction=0）。這是模型計算的 d，不代表已獨立驗證其幾何計算完全正確。\n\n## 變化時間\n\n直線任務初始 observation 都為零，但第一個 action 已不同：10600=-0.0529635，10700=-0.0342917。約3秒時 action 分別為-0.0233／0.3479；13秒時 d 為9.216／45.751m。10700 並不是到轉彎才失效。\n\n前約10秒 d 都回報0；guidance_law 在 numWps<2 時會直接回傳預設 d=0，WindowManager 亦定期才提供 valid_flag。不能把這段零值當作已證明完美循跡。後續應優先核實路徑就緒前的觀測與控制過渡，但這尚不是已證實的訓練退步根因。\n\n首次 attempt 每10回合平均步數：1041.2、950.7、1052.3、753.1、984.1、622.8、384.3、343.0、137.4、137.0（10601起）。所以訓練表現是在同一 attempt 內逐步變差，不能只歸因於每100回合重啟或切換stage。r000001 訓練腳本與本機引擎正規化換行後文字一致；原始位元組雜湊不同，不宣稱二者原始檔完全相同。\n\n## 限制與下一步\n\n此前 audit 已證實 train 前初始快照與10600可學習權重一致。現有證據把問題縮至訓練更新後的閉迴路行為差異，但尚未檢查 optimizer 內部狀態、每次 PPO 更新的 KL／entropy 或 recurrent state。固定條件單 seed 不是泛化測試。\n\n保留10600，保持現有分支暫停。下一步優先檢查路徑初始有效訊號與前10秒控制，並在相同觀測序列下比較 actor 分布／recurrent state，避免把不同閉迴路 observation 的 action 差異全歸於單一步輸出映射。沒有根據將 learning rate 再減半、放寬50m門檻或啟動新長訓練。\n\n## 同觀測序列重播與初始化驗證\n\n離線載入10600／10700 actor，在CPU逐點evaluate，初始LSTM state設零，每步接續evaluate回傳的state。各自重播自己的直線trace時，前150／133個action與保存結果最大差異均為0，確認時序及狀態更新相符；可學習權重前後不變。未呼叫train或sim。\n\n兩個actor都讀取10600直線trace的前150步：平均絕對action mean差異0.36509，最大0.56311；高斯標準差平均由0.52111變為0.42137。第30步均值-0.02331對0.42045，第50步-0.17990對0.37936。均值在相同觀測歷史下已有明顯偏移，並非僅由兩次飛行軌跡不同造成。讀取10700前133步時，平均絕對均值差異0.26944、最大0.49837。這不等於已證明LSTM損壞，也不等於所有狀態都退步。\n\n原始未截斷高斯分布的離線 KL(10600||10700) 在10600 trace平均0.55715；此非訓練rollout上的逐次更新KL，也不是PPO clip_factor=0.2的直接比較對象，不以此宣稱PPO clipping故障。\n\n### 路徑啟動空窗已確認\n\n模型OBSERVATION/Constant4(SID1963)=100，接入WindowManager(SID1902/chart60)的window_length。該block取樣0.1秒，buffer_counter由1開始，只在mod(counter,100)==0時valid。planner(SID1891/chart118)初始stored_path_length=1，valid以前只回傳一點路徑；guidance_law(chart167)對少於2點路徑回傳d=0、heta=0等預設值。\n\n直接從同SHA256的SLX抽出純函式測試：101次呼叫中原WindowManager只在第100次valid；單點路徑即使給定位置偏移80，guidance_law仍回傳d=0。這證實起始約10秒的零誤差是路徑未就緒時的預設輸出，不能當作有效循跡資訊。其他觀測仍有姿態、位置等，不是全部輸入都為零。\n\n在診斷目錄的獨立副本中，將valid條件改為counter==1或原週期條件，純函式測試valid呼叫變成[1,100]，保留後续週期。尚未改runtime/SLX，也未跑該候選的閉迴路評估。此初始化缺陷可能使策略對啟動行為更敏感，但尚未證明它是10600→10700更新退步的唯一原因。\n\n下一個有辨識力的比較：用獨立模型副本、相同checkpoint與seed、零訓練，對照原版與首次就緒候選的前段行為及完成步數。不能直接覆寫既有實驗的環境來續訓；修正初始化會改變任務分布，需要另留環境版本。\n\nAPI依據：[MathWorks evaluate](https://www.mathworks.com/help/reinforcement-learning/ref/rl.function.rlcontinuousdeterministicactor.evaluate.html)（高斯均值／標準差及nextState）。\n"}, {"file": "research/stage5-trace-findings-2026-10-11.md", "name": "stage5-trace-findings-2026-10-11.md", "title": "Stage 5 失敗 traces 離線檢查", "group": "研究調查", "text": "# Stage 5 失敗 traces 離線檢查\n\n來源：使用者提供 stage5_evaluation_20261011_205243.zip，ZIP CRC 通過，包含 20 個 trace、evaluation.json、scenarios.mat。評估 SLX SHA256 與目前本機模型一致。純 MAT 讀取與數值分析，沒有 sim/train 或模型修改。\n\n21600 在十條 random 無風路徑全部跑滿，小風擾為 8/10。由 scenarios.mat 直接核對 seed 205、207、210 在 stage4/5 的 waypoints 完全相同；這不代表有風閉迴路中規劃器產生的路徑也相同。\n\n| Seed | 有風結束時間 | 終端模型 d | 全程最大 abs roll | 同路徑無風最大 d |\n|---|---:|---:|---:|---:|\n|205|104.2 s|50.094 m|19.54 deg|15.804 m|\n|207|74.3 s|50.146 m|19.83 deg|12.443 m|\n\nd=obs7*30、roll=obs3*40，依相同 SHA 的模型正規化。兩次皆首次跨過 d=50，roll 未達 ±40，action 未達 ±0.99；不能解讀為 roll 超限或 actuator 飽和。這是模型計算的 d，不是獨立幾何真值。\n\n兩次最後失敗段皆連續增長，不是單次數值跳過門檻：205 的最大正 d 增量 1.535 m/0.1 s（102.9 s），207 為 1.509（73.1 s）。205 在 99.8 s d=2.63、100.8 s d=4.12、102.8 s d=29.93、104.2 s 超過50；207 在69.9 s d=3.34、70.9 s d=3.24、72.9 s d=29.93、74.3 s 超過50。之前也有明顯誤差峰值並回落。\n\n動作反向：205 從99.8 s +0.660到100.3 s -0.486；207 從69.8 s +0.683到70.3 s -0.516。roll 隨後由正轉負。兩次時點接近 WindowManager 的每100次更新（0.1 s取樣，約99.9/69.9 s）；只有時間上的關聯，不能斷言重規劃造成失敗或動作方向錯誤。\n\n205 風為 east=1,north=1,turbulence=0；207為1,-1,0。相同205風況的210能完成3000步，最大 d=22.224m；因此不是這個風設定必然失敗，也不能將原因單獨歸給 turbulence。\n\n現有 experience 沒有實際 E/N 位置、每次 planner path、選中路段與 guidance 內部分支。scenarios.mat 是輸入軌跡，不能當作實際規劃器輸出。尚不能區分策略追蹤不足、規劃路徑突變、目標選擇／距離計算問題。下一步宜在評估副本增加上述訊號記錄並只重播205/207及成功210，保持原 runtime、checkpoint、課程和 guard 不變；不要據此直接改 LR 或放寬終止門檻。\n\n本機忽略資料：diagnostic_packages/stage5_arrays.json、inspect_stage5.m、stage5_failure_analysis.png；原ZIP與解壓資料保留。沒有執行新的模擬，亦未提交／上傳原始資料。\n\n## 詳細訊號的後續證據\n\n來源 stage5_detailed_20261011_210426.zip，CRC 通過，6次 diagnostics 重播結果與初次摘要一致；離線匯出至 stage5_detail_arrays.json。仍未在本機重播21600。\n\nseed205 在99.8秒，位置(E,N)=(1029.14,680.54)，目標為舊path終點(1030.08,671.10)，距離9.49m但沿機頭方向投影為-7.48m（目標在後方），heta=-142.0度。99.9秒window_valid=1且planned_path更新，目標改為(1041.15,731.51)，投影+47.62m、heta=+20.4度。\n\nseed207 在69.8秒，位置(891.02,-420.84)，舊目標終點(882.59,-414.10)，距離10.79m、前向投影-8.26m、heta=-140.0度。69.9秒更新後目標(922.45,-461.65)，投影+44.28m、heta=+27.6度。兩次前後地速由實際位置差分計算約16.3–16.4m/s。\n\n相同時點無風205/207，目標前向投影約+50m，heta約2–4度，地速15m/s。有風成功210在99.8秒目標仍在前方約50m，地速13.66m/s。這是選定時點的對照，不能泛化為210全程沒有類似問題。\n\nWindowManager 每0.1秒按buffer_counter推進一個1.5m waypoint，valid每100次才更新規劃器。guidance在目前path剩餘點不足時以末點作目標。因此「有風地速較快，先超過當前path終點，在等待週期更新期間導引指向後方」已有直接訊號及程式支持。動作反向與之相鄰，但尚未以候選修改A/B證明此機制是全部失敗原因。\n\n終端位置到當前planner折線的獨立最近線段距離分別50.094/50.146m，與guidance_d相符；不是只有記錄d跳變。相反，在越過舊終點時，guidance_d僅2.63/3.56m而到有限path距離9.49/10.79m：現有d使用線段延長線的橫向距離，不等同到有限折線的最近距離。因此不能單憑d接近零認為目標合理。\n\n下一步：僅在候選評估副本測試依路徑剩餘距離／飛機進度提早更新或維持前向lookahead的方案，與原版使用同checkpoint/seed/風條件做A/B，再驗證無風及其他seed。不能直接將valid永久開啟（會改變規劃成本／亂數序列）、放寬50m門檻或重啟訓練。本次只調查及記錄，原SLX與runtime未改。\n\n## endpoint_lookahead 候選完整重播\n\n使用者提供 stage5_candidate_20261011_231618.zip，CRC通過，evaluation_20261011_231328_tpf04c8dcd status=complete，candidate_guidance.m SHA與報告吻合。205有風從1042步改善至3000；207從743延至1145但仍失敗；210及三條無風仍跑滿。這是環境候選效果，非重新學習；少量情境不是泛化驗證。\n\n207仍失敗前有候選覆蓋範圍的直接問題：第一版刻意只在guidance的is_inside分支延伸目標，outside分支保留原碼。由實際planner path的min/max±30m和位置重算：\n\n|時間|is_inside|飛機E|包圍範圍最大E|目標E|\n|---|---|---:|---:|---:|\n|108.9|true|1481.21|1481.50|1531.14|\n|109.0|false|1482.80|1481.50|1451.50|\n|109.8|false|1495.60|1481.50|1451.50|\n|109.9|true（新path）|1497.20|1605.82|1539.83|\n\n109.8秒目標前向投影-43.9m，guidance_heta=153.5度；109.9秒valid更新後heta=-35.1度。114.5秒終止時，guidance_d及當前有限planner折線獨立最近距離皆50.55m。原69.8秒的問題已被候選避開（目標前方49.9m、heta4.3度），但稍後跨出包圍範圍時又失去候選的目標延伸。\n\n結論：第一候選未涵蓋所有導引分支，不能稱修好。外部分支退回舊終點的跳變已證實；其對最终失敗的貢獻仍須下一個一致性候選做閉迴路A/B確認。不要把結果解讀為必須增加訓練或降低LR，也不能無條件延伸所有outside狀態（側向偏離時需要不同處理）。本次僅离線分析，未更動候選或正式模型。\n"}, {"file": "records/code-comments-2026-10-12.md", "name": "code-comments-2026-10-12.md", "title": "原始碼註解與課程範例（2026-10-12）", "group": "工作與驗證紀錄", "text": "# 原始碼註解與課程範例（2026-10-12）\n\n對 79 個 Git 管理的專案／測試程式補上 383 行繁體中文註解：61 個 `.m`、10 個 `.ps1`、8 個 `.py`。保留既有英文註解，新增檔案用途、輸入輸出／副作用、函式責任、關鍵分支與限制；不為每個直觀賦值重述語法。\n\n範圍包含入口、runtime、模型定義、課程、guard、checkpoint 評估、遷移／報告／診斷打包及 Python 畫圖／匯出工具與測試。未修改 `runs/`、`tests/output/` 既有測試產物、`diagnostic_packages/` 內的歷史來源副本。驗證輔助產物新寫在忽略的 `tests/output/`，不作訓練輸入。\n\n修改前以唯讀程序清單確認本機沒有 MATLAB 訓練程序。本次沒有啟動 train、sim、pool，也沒有更改 SLX、checkpoint、control、guard 或任何課程 JSON，未 commit／push。\n\n## 驗證\n\n- 逐檔刪除本次新增註解後，79 個檔案原始 bytes 還原一致。\n- 10 個 PowerShell 檔案 parse 成功，排除註解後的 executable tokens 與 AST 節點結構一致；沒有執行這些腳本。\n- 61 個 MATLAB 檔案只執行 Code Analyzer，診斷種類／內容一致。既有 ALIGN 訊息內的 END 行號因註解平移，比較時只正規化訊息中的 `on line N.`。\n- 8 個 Python 檔案的 AST（忽略位置資訊）一致；不執行原工具／測試。\n- 訓練與評估的 fixed／random 路徑函式同步補同一份註解，原有逐字一致性檢查仍成立。\n- `git diff --check` 通過。\n\n補註解仍會改變程式檔的 SHA-256，因此新的 engine／工具指紋不可直接當成演算法或模型環境變更；本次可執行內容保持不變，SLX 原件也沒有修改。既有 run 及報告所記錄的歷史指紋沒有重寫。\n\n## HTML\n\n`docs/diagrams/training-explorer.html` 已更新原文、來源 SHA 與對應行號。它仍有 12 個流程方塊，另外增加「課程 JSON 範例」入口：完整 progressive_v1 JSON 與六階段分頁，旁邊解釋 `model`、軌跡／風場、all 條件、連續視窗與階段預算。JSON 保持標準格式，沒有往設定內加註解或新 schema 欄位。\n\n範例是共享定義的快照，不代表 run 階段、不內嵌 MAT、不啟動或套用課程。瀏覽器檢查包含 19 份內嵌來源與工作區一致、全部程式區段、六階段 JSON、點選／搜尋／連結以及四種桌面尺寸，詳見 [圖表驗證](../diagrams/evidence/verification.md) 與 receipt。\n\n## 後續加強\n\n使用者確認正式訓練只在遠端，本機沒有活動訓練。此次只修改本機副本，未連線或更新遠端 runtime。\n\n另在 10 個 `.ps1` 與 10 個核心 `.m` 檔加入 298 行註解，累計本次對話新增 681 行。PowerShell 說明包含 `$變數`／型別轉換、`param` 與必填參數、陣列與 hashtable、管線與 `$_`、dot sourcing、作用域、比較／位元運算、正規表示式、.NET 靜態方法／物件方法、程序引數及續行、錯誤／資源清理。相關说明放在實際操作旁，原有可執行行保持原樣。\n\n新增註解的原始 bytes 還原檢查及 PowerShell token／AST 比較通過；61 個 MATLAB 檔 Code Analyzer 診斷保持一致，路徑函式的逐字相容檢查通過。檢查時抓到並修正一處註解插在 `...` 續行 options 內的語法問題，現已移到整段呼叫之前；沒有改 executable code。\n"}, {"file": "records/review-2026-10-09.md", "name": "review-2026-10-09.md", "title": "2026-10-09 架構審視與工作紀錄", "group": "工作與驗證紀錄", "text": "# 2026-10-09 架構審視與工作紀錄\n\n## 背景與證據範圍\n\n使用者確認有宿舍／實驗室兩台電腦，提供的圖是實驗室產生。圖顯示 387,512 episodes、388 attempts，最後記錄平均 111.03；約 18 萬回合後低迷持續至圖尾。圖上 session 為 `20260923_234543_tpebcab813_6804_4fb1_8ae2_8e4a5c1296c5`，snapshot 標示 2026-10-02 12:57:14。\n這是圖片讀值；本次沒有該實驗原始日誌，不能確定使用哪個模型、版本、worker 歷史或崩落原因。既有 TUNING.md 的 29,000 回合是另一個舊實驗，不能混為本圖證據。\n\n## 目前的架構\n\n`retry.m` 建立／恢復實驗設定與模型快照 → PowerShell supervisor 管理程序與重試 → `checkpoint_attempt.m` 選 checkpoint、注入模型回呼 → `training_engine.m` 建環境／pool 並訓練 → checkpoint、結果與診斷寫回該實驗。\n\n模型 profile 與 builder 已分離；每個實驗有自己的模型原始碼快照。控制程序與實際 MATLAB 訓練程序分離，可以在程序失敗後重啟。這些隔離有利於管理實驗，但以下限制仍存在。\n\n## 已確認的程式行為與限制\n\n1. **存檔進度不等於學習進度。** `checkpoint_supervisor.ps1` 在正常返回結果或最新存檔候選改變時重設 noProgressFailures；沒有 reward 退步／長期低迷判斷。因此圖中的長時間低 reward 與目前控制邏輯相容，並不會觸發「無進度」暫停。\n2. **續訓不是最佳模型選取。** supervisor 依修改時間排序候選，`checkpoint_select_agent.m` 選可讀且基本相容的第一個。它沒有比較 reward。`training_engine.m` 又會拒絕覆蓋同目錄更晚的 checkpoint，故「跳過壞存檔」不保證能從舊檔順利恢復；也不應在原目錄偷偷回滾。\n3. **完整執行版本尚未凍結。** 新實驗快照只有模型程式；runtime、入口和 SLX 沒有一起凍結。引擎在每次開始訓練時另存自身快照，但仍不是完整依賴。雙機不同 runtime 可能使相同模型名稱代表不同執行條件。\n4. **跨機路徑需要處理。** `retry.m` 續訓會更新 scriptDir/sessionDir/modularRoot/matlabExe，已存在的 diagnosticDir 卻沿用。直接複製整份實驗到另一台可能寫到舊路徑或失敗；本次不修改續訓與活動 runtime。\n5. **重啟不是完整環境狀態恢復。** `checkpoint_attempt.m` 使用 attempt × 10000 作 baseSeed，worker 再加索引。路徑、風場與 worker-local episode 計數重建；不是每次重用相同 seed。worker 數改變也會改變採樣條件。\n6. **圖表是日誌觀測序列。** parser 用最新 attempt 覆蓋同 episode，但沒驗證那些 episode 是否位於最終保存的 checkpoint 歷史中。388 attempts 不等於 388 次 crash；預設每 1000 回合本來就正常重啟一次。\n7. **目前觀測不足以定因。** reward、steps、Q0、worker 紀錄可用來定位退步區間；缺少策略 KL／entropy、critic loss、梯度範數與明確 episode 終止原因。不能僅據圖認定是 PPO 超參數、critic 或環境故障。\n8. **actor 有一維共享瓶頸。** `build_agent.m` 在 actor hidden 後先投影成 1 維 `ip_out`，再分給 mean/std 網路；兩個 head 共用此單一特徵。這是可做新 profile 對照的設計選項，尚無證據證明是本次退步原因。\n9. **有額外磁碟成本。** supervisor 會把 attempt log/json 再複製到 diagnostics；引擎每段另存 initial/final agent，並保留定期 checkpoint。精簡報告只減少分享量，不會清理這些本機資料。\n\n## 本次實作\n\n- 新增獨立、標準函式庫的精簡匯出器，保留有界區間摘要與最近資料；可聚焦指定 episode 範圍，不匯出原始 log 文字／設定絕對路徑。\n- `.gitignore` 排除訓練成果、完整日誌、MAT／Simulink／Python 快取，只放行 `reports/<machine>/<session>/report.json`。\n- 舊 `analyze_training.py` 改用本專案 parser 及明確指定來源，不再假設相鄰 Simulink；它仍是完整舊分析，不是精簡分享工具，輸出預設留在指定實驗中。\n- 將雙機背景和分享約定寫入 AGENTS.md、README 及 reports/README.md。\n- 未啟動／終止訓練，未更改 runtime、模型設定或 SLX；未建立 Git repository、commit 或 push。\n\n## 下一步資料與架構方向\n\n先在實驗室匯出該實驗 report，重點比較 170000–190000 前後的 steps、reward、Q0、attempt 和 worker 變化。若仍無法定位，再提供相關 attempt 的錯誤摘要或終止原因；不要先傳所有 checkpoint。\n\n後續停機開發時可加入 reward 退步告警、獨立 best-evaluation 模型保留、固定測試條件評估與更完整 runtime／環境版本快照。告警應與程序故障重試分開，任何自動停訓或回滾須另行設計並取得授權。調參比較應使用新實驗，避免改寫活動實驗的模型設定。\n\n## 本次驗證\n\n`python -m unittest discover -s tests -p test_training_report.py -v`：7 項通過。涵蓋重啟去重、缺回合、不完整行、非有限數值、設定白名單、舊 diagnostics 明確路徑、CLI 來源保護、Git 忽略規則及大規模輸出。\n以合成資料模擬 387,512 episodes／388 attempts，匯出 JSON 約 293 KB（未含真實實驗的 worker 歷史）；此數字是測試結果，不是實驗室實際報告。匯出檔另有 1.5 MB 硬上限。\nWindows sandbox 暫存目錄權限使首輪測試無法建立 fixture，已透過核准的外部 sandbox 執行完成測試。未執行 MATLAB 訓練測試；實驗室資料尚未分析。\n\n## 同日後續：worker 範圍與學習診斷\n\n使用者補充已自行上傳 GitHub；本機現有初始 commit。使用者要求在同段使用能成功建立的 n 個 workers，而非等待下一次 attempt。\n確認本機沒有 MATLAB 訓練程序後，修改此本機副本 runtime：加入 minWorkers（預設 1）並用範圍建立 pool；實際 workers 數回填到訓練選項與 seed 數量。整個 pool 失敗仍交 supervisor 處理，備援上限不低於 minWorkers。沒有啟動正式訓練或同步實驗室。\n\n精簡報告加入 learning_health：可設定區間長度、連續退步次數、相對門檻與最低參考平均。它只在匯出時產生疑似退步訊號，沒有自動停訓、回滾或調參。完整策略見 learning-health.md。\n\n驗證：MATLAB R2024b 的 test_worker_range（模擬 pool，不啟動 workers）、test_model_layout（start=false）通過；PowerShell 語法檢查與 episode 格式測試通過；Python 4 項學習診斷及 7 項報告測試通過。尚未驗證實驗室 worker 連線失敗情境或實際 UAV 長時間訓練。\n\n## 同日後續：JSON 課程規劃器\n\n使用者提出以 JSON／YAML 描述階段（MAT 軌跡1 → MAT 軌跡2 → random），並確認階段間沿用同一 agent。本次採 JSON，新增 `+trainingcurriculum/`、`curriculum_plan.m`、兩份設定範例，接入 retry／attempt／訓練引擎／supervisor。\n\n條件使用 all/any 與明確的數值指標，不使用 eval 或自由程式碼。進度從保存的訓練歷史計算，只在存檔邊界換階段；MAT／計畫會快照到實驗。提供階段預算與保存後暫停，最後完成原因明確區分過關與按預算前進。現有平均 reward 門檻只保留給非課程模式。\n\n匯出器的退步診斷改用當前階段範圍。使用者尚未提供真實 MAT，兩個檔案路徑為模板，不宣稱已驗證其內容。使用說明見 `docs/guides/curriculum.md`。\n\n測試僅使用合成已保存歷史、MAT 測試資料、start=false 與隔離假訓練引擎。初輪已通過；追加入口測試時自動核准審查曾因用量限制中斷，使用者要求繼續後重新執行成功。未啟動真實訓練／workers，未 commit 或 push。\n\n最終驗證：test_curriculum 通過（含遺失狀態拒絕、階段邊界一致性、實際 attempt 入口的環境傳遞／段落上限、到預算後不呼叫引擎）；既有 test_worker_range、test_model_layout 通過。Python 報告測試 8 項通過，包含當前階段的 learning_health 隔離；PowerShell 語法／episode 格式檢查通過。training_engine 靜態解析沒有語法錯誤，仍有原有 global、預配置及固定開關等 Code Analyzer 提醒。\n"}, {"file": "records/validation-2026-10-09.md", "name": "validation-2026-10-09.md", "title": "本機真實訓練驗證：2026-10-09", "group": "工作與驗證紀錄", "text": "# 本機真實訓練驗證：2026-10-09\n\n使用者授權短時間試跑後，在本機 MATLAB R2024b 執行 `tests/test_curriculum_end_to_end.m`。本次使用真實 FAFA Simulink 環境、PPO agent、CPU、1 個 Processes worker，沒有使用假引擎或假 pool。\n\n實驗 ID：`20261009_182703_tp24591b71_9769_4162_a931_20fd74f3a780`，位於 `+trainingmodels/ppo_lstm128/runs/`。2026-10-09 18:27 至 18:34（Asia/Taipei），supervisor 執行約 434.1 秒，含三次程序啟動／建池／模擬／存檔。測試與 supervisor 均成功退出；結束後確認沒有剩餘 MATLAB、checkpoint supervisor 或 watchdog 程序。\n\n| Attempt | 軌跡 | 累計回合 | Reward | 步數 | 實際 workers |\n| --- | --- | ---: | ---: | ---: | ---: |\n| 1 | 內建固定 | 1 | 108.385653 | 133 | 1 |\n| 2 | 生成的 MAT 直線 | 2 | 108.274919 | 133 | 1 |\n| 3 | Random | 3 | 193.543365 | 259 | 1 |\n\n測試專用門檻是每階段完成一回合，三個階段都是無風。驗證成功存檔 `Agent_Success.mat`、累計三回合且 reward 有限、課程完成狀態、每次 attempt 的 stage／resumeFile，以及 episode_workers.csv 的三筆紀錄。另逐一讀取上一段 Agent_Final 與下一段 Agent_Initial，確認 actor 和 critic 的 learnable parameters 完全相同，證明階段交接沒有重新初始化權重。\n\n本機完整測試收據在 `tests/output/curriculum-smoke-latest.json`；此目錄與實驗 MAT／日誌均受 Git 忽略，本文件保留可分享的結果。後續重跑會更新 latest 收據，實驗則另建獨立目錄。\n\n另實際執行 `prepare_progressive_training()` 兩次，確認輸入生成具冪等性；兩條軌跡均為 4001×3、S 彎速度模長為 15 m/s，六階段 JSON 通過驗證，`retry(...,start=false)` 成功建立課程及輸入快照。這份六階段正式實驗沒有啟動。\n\n本次證明真實流程可執行並可跨階段接續，沒有驗證收斂、長期穩定性、GPU、多 worker、資源不足時實際建池降級，或六階段門檻的適當性。三回合也不足以證明有效策略更新。S 彎與有風條件尚未做真實訓練短測；其設定／輸入已驗證。不得把測試用「完成」視為 UAV 任務已學會。\n"}, {"file": "reference/architecture-notes.md", "name": "architecture-notes.md", "title": "架構圖核對與閱讀說明", "group": "參考資料", "text": "# 架構圖核對與閱讀說明\n\n圖表入口：[architecture.html](../architecture.html)。規格與收據移至 `../diagrams/src/architecture.json`、`../diagrams/evidence/`；收據內絕對路徑保留為原驗證時間的歷史記錄。\n\n核對日期：2026-10-10。架構 HTML／JSON 已依目前程式更新；此次未啟動或修改訓練。舊簡報中的架構頁不會因 HTML 更新而自動同步。\n\n## 課程驅動的執行順序\n\n1. `configs/lab_gpu6.json` 指定硬體、存檔與重試參數，引用 `experiments/progressive_v1/curriculum.json`。課程指定模型、軌跡、風場、過關條件與各階段預算；模型定義仍在 `+trainingmodels/`。\n2. `retry.m` 新建 `experiments/<課程>/runs/<實驗 ID>/`，保存 control、curriculum、軌跡、model 與 model_source 快照。非課程實驗保留模型目錄分類；resume 依完整實驗路徑原位接續。\n3. PowerShell supervisor 啟動 `checkpoint_attempt.m`。它選取有效 checkpoint，透過 `training.m` 取得模型建立／驗證回呼，並用 `trainingcurriculum.prepare` 檢查課程歷史、取得目前階段環境。課程結束或預算暫停時不啟動 engine。\n4. `training_engine.m` 載入原 agent 與訓練歷史或建立新 agent；建立 pool，讓 workers 執行 `FAFA_Simulation.slx`。同一課程跨階段沿用 agent，沒有重新初始化網路。\n5. 實驗室設定每 100 回合存 checkpoint、每段最多追加 1000 回合。段落結束保存 Agent_Final，再按該階段保存的歷史判斷；達標於下一個 attempt 切換階段，預算用盡則依 on_limit 處理。最後階段達標才發布課程成功。\n6. 課程模式不採舊的全實驗 reward >=2900 成功規則。progressive_v1 每階段結合最低回合數、連續三個 100 回合區間 reward 與步數指標；這些門檻仍待長期驗證。\n\n## Worker 與失敗恢復\n\n- lab_gpu6 目標 6、最低 1，使用 parpool 的數量範圍；只有成功返回的 pool 才能訓練。「Connected to 5 of 6」不是已可使用的 5-worker pool。\n- pool 建立失敗後，後續 attempt 依 lab_gpu6 的 4 → 2 → 1 備援重建。不是保留未完成的部分連線。一般 retry 預設備援仍為 [4 2]，不要混淆設定檔與函式預設。\n- 成功建池後，下一段恢復目標數量。狀態中的 running 只代表程序執行中；Pool ready 與 Episode 日誌才證明後續進展。\n- 預設啟動逾時 600 秒、日誌無活動逾時 1800 秒；連續無進度失敗達上限便暫停。STOP 中止程序，保留已保存 checkpoint，不會額外先保存尚未完成的回合。\n\n## 實驗、圖表與遷移\n\n- 診斷存於實驗 diagnostics／attempt 目錄。`plot_training_rewards.py` 讀 stdout 回合資料，讀 curriculum_state.json 的實際分界，在 run/reports/ 產生有 Stage 標籤的 reward 圖。灰線是 attempt，橘線是 stage。\n- `export_training_report.py` 在 run/reports/ 產生可分享的小型 report.json；learning_health 是匯出時計算的規則式診斷，沒有持續監控、自動停訓或回滾。完整 checkpoint 仍需另行保留。\n- `migrate_training_session.ps1` 只接受已停止、可取得排他鎖的實驗；複製全部資料、比對 SHA256、修正新副本控制路徑，保留原件。`verify_training_session.m` 讀回有效 PPO checkpoint 與階段位置，不啟動訓練；之後以 retry(resume=新位置) 接續。\n- 歷史日誌中的舊路徑不重寫。不能同時續跑新舊副本，不能在活動訓練時搬移或改 runtime。\n\n## 圖的抽象範圍與證據\n\n- 箭頭表示主要控制／資料關係，不全是函式呼叫；課程規劃器會將階段環境回傳給 attempt，圖中省略返回箭頭。引擎段末另呼叫 outcome 判斷條件。\n- 「診斷、曲線與精簡報告」將資料與離線工具合併呈現：supervisor 收集日誌，但不會自動啟動畫圖或匯出報告。Database 圖例表示檔案資料，不是資料庫服務。\n- 模型快照不包含整套 runtime；同一實驗不是任意版本執行程式的完整封裝。已提供固定無風任務的手動 evaluator；最佳評估模型自動選擇、退步自動回滾尚未實作。\n- 對照來源：retry.m、training.m、configs/lab_gpu6.json、experiments/progressive_v1/curriculum.json、+trainingcurriculum/prepare.m 與 outcome.m、runtime/checkpoint_supervisor.ps1、runtime/training_engine.m、migrate_training_session.ps1、verify_training_session.m、plot_training_rewards.py。\n- 本次使用 archify 技能產生 architecture 類型 HTML；繁體中文內容，固定 Viewer UI 與 HTML 語系為英文。\n- architecture-receipt.json：9/9 靜態 artifact 檢查通過，composition 0 errors／0 warnings，包含 specification 與 artifact SHA256／bytes。\n- architecture.visual-check.json：真實 Chrome 對 1440×900、1600×1000、1920×1080、2048×1320 的測量均無水平或垂直溢出；明暗截圖已產生。\n- 人工影像檢閱：檢查四張端點尺寸的明暗截圖，節點、箭頭、卡片與圖例未見裁切或遮擋；此判斷獨立於自動收據的 visualReview=pending，未改寫該欄位。\n\n頂層 experiments/<課程>/curriculum.json 是共享課程定義，assets/ 是輸入；各 run 的 curriculum_state.json 是獨立進度。organize_training_reports.ps1 可複製整理舊報告，保留原件與模型。\n\n## 恢復分支與段末保護\n\nprepare_recovery_training 複製指定 checkpoint 的權重和歷史到新 run，只在新副本設定 actor learning rate，保留來源雜湊。圖中停止後處理節點合併表示原 migrate_training_session 與新增分支工具。+trainingguard 由 attempt 開始前及 engine 完成 Agent_Final 保存後呼叫；依同階段保存歷史判斷，透過 result.pause 讓 supervisor 正常暫停。課程規劃節點概括了這項決策，省略 engine 到 guard 的返回呼叫。\n\n恢復配方預設每段 100、總新增 1000 回合；guard 三個 100 回合區間 reward 和 steps 同時低於合格參考的 50% 時暫停。既有沒有 training_guard.json 的 run 行為不變。learning_health.py 仍只匯出診斷，與這個執行時 guard 分開；不會自動跑獨立評估、改參數或重新啟動分支。\n"}, {"file": "reference/presentation_sources.md", "name": "presentation_sources.md", "title": "簡報資料來源與程式對照", "group": "參考資料", "text": "# 簡報資料來源與程式對照\n\n備忘稿保留可直接朗讀的口語內容，資料來源集中於此。\n\n## 原簡報第 1 頁\n\n花偉傑碩士論文，2026；研究進度日誌 2026/09/23。\n\n## 原簡報第 2 頁\n\n花偉傑，2026，基於位置式視覺伺服之固定翼無人機地面移動目標追蹤與深度強化學習控制。\n封面、摘要。\n來源檔：NCKU_PBVS for Moving Ground Target Tracking Using a Fixed-Wing UAV with DRL Controller_unlocked.pdf\n\n## 原簡報第 3 頁\n\n研究進度日誌_2026-09-23.md；本地 training_autoretry_sessions 與 re h DRL Controller_unlocked.pdf\n\n## 原簡報第 34 頁\n\n花偉傑，2026，基於位置式視覺伺服之固定翼無人機地面移動目標追蹤與深度強化學習控制。\n§3.2.3、§4.5、§5.2–5.4。\n來源檔：NCKU_PBVS for Moving Ground Target Tracking Using a Fixed-Wing UAV with DRL Controller_unlocked.pdf\n\n## 原簡報第 35 頁\n\n花偉傑，2026，基於位置式視覺伺服之固定翼無人機地面移動目標追蹤與深度強化學習控制。\n§3.2.3、§5.4、第 6 章；本頁實驗建議為報告者討論。\n來源檔：NCKU_PBVS for Moving Ground Target Tracking Using a Fixed-Wing UAV with DRL Controller_unlocked.pdf\n\n## 原簡報第 36 頁\n\n研究進度日誌_2026-09-23.md；本地 training_autoretry_sessions 與 reward_history_preview.csv。\n\n## 原簡報第 37 頁\n\n研究進度日誌_2026-09-23.md；本地 training_autoretry_sessions 與 reward_history_preview.csv。\n\n## 原簡報第 38 頁\n\nreward_history_preview.csv；session 20260922_122929_tp02dc5edf_2a72_40db_9688_ae5cdbc2383e；每100回合取樣並保留第1回合。25,000 與 29,000 節點已核對 stdout.log。\n\n## 原簡報第 39 頁\n\nreward_history_preview.csv；四個100回合區間重新計算 mean(reward)、mean(steps) 及 steps==3000 的回合數。\n\n## 原簡報第 40 頁\n\n研究進度日誌_2026-09-23.md；本地 training_autoretry_sessions 與 reward_history_preview.csv。\n\n## 本次新增詳細流程頁\n\n架構：docs/diagrams/src/architecture.json（已修正為目前程式）。\n模型與快照：retry.m、training.m、+trainingmodels/load_profile.m、build_agent.m、validate_agent.m。\n重試與降級：runtime/checkpoint_supervisor.ps1、checkpoint_watchdog.ps1、checkpoint_open_pool.m、checkpoint_worker_diagnostics.ps1。\n訓練與存檔：runtime/checkpoint_attempt.m、training_engine.m、checkpoint_select_agent.m、checkpoint_save_final.m、checkpoint_mark_success.m。\n調參：+trainingmodels/ppo_lstm128_tuned_stability_20260923_v1/TUNING.md 與同名 .m 定義。\n\n流程核對屬於靜態程式檢查；未啟動新的長時間訓練，也不構成穩定性或收斂保證。\n"}, {"file": "guides/stage6-progress-training.md", "name": "stage6-progress-training.md", "group": "操作與設定", "title": "Stage 6：按飛機進度提供前方路段", "text": "# Stage 6：按飛機進度提供前方路段\n\n使用者於 2026-10-13 明確選擇「沿指定路徑穩定飛行，可依飛機進度更新路段」。本版本是空間循跡環境，不是原本按時間推進 15 m/s 的移動目標追蹤。歷史 Stage 完成紀錄保留，但不能當作新環境已完成整套資格驗證。\n\n## 修正範圍\n\n- guidance 的歷史路徑只取有效的 `path_length`，避免未填入的零列形成通往原點的虛假線段。\n- WindowManager 用目前位置在局部路段上的最近 waypoint 更新單調前進的索引，不再每個取樣無條件前進一點。搜尋限於目前索引往前一個 window，避免任意跳到整條路線的遠端。\n- 目前 window 為 100 點、間隔 1.5 m。在距離段尾約 40 個 waypoint 時，提早提供下一段連續的 100 點；新舊段共享端點，讓規劃器原有 `last_point` 接段方式保持連續。第一個重疊 window 候選會退步，沒有部署。\n- 不更動 reward 公式、50 m 終止門檻、動作範圍或 PPO 學習率。但誤差幾何與路徑更新環境改變，前後 reward 不能全解讀為 agent 學習改善。\n- 此版本不提供按原時序移動的目標或原 loiter 行為。僅發送完整路段；末尾不足一段時保留最後有效路段。3000 步完成不等於到達整條軌跡終點。\n\n## 實驗室續訓\n\n先確認原實驗仍為 paused，且沒有評估／訓練使用這份 runtime。PowerShell：\n\n```powershell\ncd D:\\daniel\\ModularTraining\ngit pull --ff-only\n```\n\nMATLAB（只準備一次新分支）：\n\n```matlab\ncd D:\\daniel\\ModularTraining\nclear prepare_recovery_training retry\nrehash\nif bdIsLoaded('FAFA_Simulation'), close_system('FAFA_Simulation',0); end\nroot=fileparts(which('retry'));\nparentSession=fullfile(root,'experiments','progressive_v1','runs', ...\n    '20261012_080431_recovery_tpfaf0be04');\nnext=prepare_recovery_training(parentSession, ...\n    fullfile(root,'configs','recovery_31600_progress_window.json'));\ninfo=retry(resume=next.sessionDir);\ndisp(info.sessionDir)\n```\n\n從 Agent31600 開始，沿用 Stage 6 位置及 actor LR 2.5e-5，每段 100 回合，最多新增 10000 回合至 41600。課程達標或 guard 觸發可以提前停止。硬體沿父 control（目標 6 workers、GPU；以實際 pool_ready 為準）。配方核對正式 SLX SHA，避免只複製 JSON 卻使用舊模型。\n\n新分支保留繼承來源；不刪除原 guard，不覆盖父 checkpoint。診斷 ZIP 子集不可拿來直接續訓。此指令應在保存完整父實驗的實驗室執行。\n\n## 進度與後續驗收\n\n```matlab\ns=jsondecode(fileread(fullfile(info.sessionDir,'status.json'))); disp(s)\ntype(fullfile(info.sessionDir,'curriculum_state.json'))\nf=fullfile(info.sessionDir,sprintf('attempt_%05d',s.attempt),'stdout.log');\nif isfile(f), t=splitlines(string(fileread(f))); disp(join(t(max(1,numel(t)-29):end),newline)); end\n```\n\nStage 6 從 22400 起算；最低 10000 回合最早在 32400 到達，還必須同時滿足原有連續窗口 reward / 完成率條件。不要只憑本次純模擬通過便稱模型合格；續訓完成後仍需保存新 checkpoint，再做所有階段與新情境評估。若 `suspected_regression` 暫停，保持暫停，不直接解除。\n\n正式環境評估使用 `guidanceVariant=\"baseline\"`，表示當下正式 SLX。候選转换函式拒絕重複套用；舊版來源 fixture 僅供測試。結果與限制見 [驗證紀錄](../records/stage6-progress-validation-2026-10-13.md)。\n"}, {"file": "records/stage6-history-review-2026-10-13.md", "name": "stage6-history-review-2026-10-13.md", "group": "工作與驗證紀錄", "title": "Stage 6 歷史路徑有效範圍調查", "text": "# Stage 6 歷史路徑有效範圍調查\n\n## 範圍\n\n本次使用者授權繼續隔離評估。正式 runtime/FAFA_Simulation.slx 與原 checkpoint 不修改；所有模擬使用診斷包解出的副本、CPU、關閉探索，不 train、不啟動 pool。工作區既有程式註解與文件重組未覆寫，也未將它們納入提交。\n\n兩包來源及完整性：\n\n- 主包 `diagnostics_20261012_080431_recovery_tpfaf0be04_ee09c9b1.zip`，SHA256 `cbed0437d94e4c295cf829bd29a08cb57a32310eb5f18d81ded2759663d84e83`，380個manifest項目全部驗證。\n- 補充包 `stage6_extra_579587cc961c4f62978679a58f403a7e.zip`，SHA256 `878dbc48ebdb6d5caceee3e6efda4976cf44562688b0ff354e0d79c672231025` 與使用者提供的一致，ZIP CRC通過。\n- 評估來源SLX與本機相同，SHA256 `b28c5a5c967347c498cb23f032b483841ca63b98ab4da137ca902e193225714c`。程式註解可能不同，不能因此宣稱所有runtime歷史指紋相同。\n\n## 已證實的問題\n\nguidance 的 `global_path` 預配置500000列，`path_length`代表已填入列數。原 `path_CTE=global_path` 包含尾端零值。outside分支找到最後有效點時，`current_index+1`仍在配置大小內，因此把它連到未使用的 `(0,0)`，不是有效路段。\n\n用記錄的planned_path串接，重算全部12個失敗trace。202/204/205跨三個checkpoint的9次終端誤差與末點接零座標的假線段計算值吻合至小數6位；207則選到已填入的內部路段，不能全部歸為相同原因。\n\n31600的202/204/205終端logged d為50.424913/50.895169/50.180986m，而末段延長線側偏7.017/1.549/2.891m。延長線不等於有限路徑或未來期望路徑，不能據此宣稱飛機已完成真正循跡。207有真實約50m偏離與更新後轉向問題。\n\n## 最小候選\n\n`compare_training_checkpoints(...,guidanceVariant=\"valid_history\")` 只把暫存guidance改成 `path_CTE=global_path(1:path_length,:)`。有效末點會走原有末段分支，不再連到零值。不更動lookahead、reward公式、終止門檻、planner、更新頻率或模型參數。\n\n因距離也是observation/reward/termination的輸入，改正距離會改變閉迴路動作及分數。即使回合延長，也不代表agent重新學習或真實循跡已合格。此候選仍使用原無限直線橫向距離，而非將所有距離改成有限折線最近距離。\n\n輸入MAT未包含在診斷包；只在本機解壓副本，從已提供的前三階段evaluation/scenarios.mat還原相同waypoints/velocity，未生成不同路徑、未改課程JSON。診斷副本只是評估材料，不可用它直接續訓。\n\n## 驗證\n\n`tests/test_history_candidate.m` 已通過：非原點直線末端越過時排除假線段、5m側偏保留、inside目標及距離不變、重複轉換拒絕。\n\n本機 baseline 31600 / Stage6 / seeds202,204,205,207 重現實驗室2596/998/695/730步及對應reward。初始權重稽核原報告initial_snapshot_count=0，不能聲稱已核對全部接續時刻的initial/resume一致性。\n\n本輪共27次CPU純sim完成（4 baseline +20 candidate +3 retention）。候選小風10/10、完整風6/10，前三階段3/3。正式SLX雜湊與所有被評估checkpoint雜湊保持不變，sim前後權重檢查通過。\n\n| Stage6 seed | 原版步數 | 有效歷史候選步數 |\n|---|---:|---:|\n|202|2596|2715|\n|204|998|1111|\n|205|695|1417|\n|207|730|730|\n\n完整風平均reward從2262.88到2359.97，平均steps2301.9到2397.3，完成數未增加。小風平均reward3036.81；前三階段reward及RMS與原版相同。不能把修正後reward提高當成學習改善。\n\n候選終端已不是同一零值誤索引：202/204/205/207的logged d為50.18/50.93/50.82/50.53m，對當前有限planned_path獨立計算的最近距離吻合約0.01m內。更新前可見沿舊末段延伸已越過路徑末點約74~109m；269.9/109.9/139.9/69.9s新path更新後，目標/轉向需求大變，終端目標在機頭後方。WindowManager仍每步前移一個waypoint且每100步valid，而飛機地速隨風變化；目前只定位了時間推進與實際進度不一致的症狀，尚未驗證新的planner策略。\n\n評估資料（均在忽略的diagnostic_packages/stage6_review/main/reports）：baseline evaluation_20261013_191041_tpf4c1cd04；candidate evaluation_20261013_191142_tp9695204b；retention evaluation_20261013_191447_tpadf7f19a。下一步需隔離驗證前方路徑不足／更新跳變的處理，並明確保留任務的空間或時間跟隨語義；本輪不部署正式環境、不重啟訓練、不放寬終止門檻。\n"}, {"file": "records/stage6-progress-validation-2026-10-13.md", "name": "stage6-progress-validation-2026-10-13.md", "group": "工作與驗證紀錄", "title": "Stage 6 空間進度 window 驗證", "text": "# Stage 6 空間進度 window 驗證\n\n本次由使用者提供的實驗室 Agent31600，在本機 MATLAB R2024b / CPU 做純 sim。使用者明確選擇空間循跡，可按飛機進度更新路段；不是原本的定時移動目標任務。沒有使用 AI 在模擬中介入控制，也沒有用本機評估冒充實驗室續訓。\n\n## 證據與修改\n\n原模型在 Stage 6 seeds201:210 為 6/10 跑滿；202/204/205/207 分別在 2596/998/695/730 步終止。只修正歷史零列後仍為 6/10。詳細調查見 [前一份紀錄](stage6-history-review-2026-10-13.md)。\n\n第一個空間候選採用重疊 preview，四個失敗情境僅一個跑滿，其餘 691/1186/794 步；未部署。現有規劃器用前段末點作新段起點，重疊資料不能直接代入。最後採用連續路段（共享端點），當進度距段尾約 40 點時提早發布下一段。保留原規劃器、reward 公式、動作及終止門檻，另修有效歷史範圍。任務時序及誤差幾何確實改變，不能稱只改資料顯示或只有 agent 變好。\n\n## 固定 Agent31600 評估\n\n| 場景 | 樣本 | 跑滿 3000 步 | 平均 reward |\n|---|---:|---:|---:|\n| Stage 5，201:210 | 10 | 10/10 | 2954.81 |\n| Stage 6，201:210 | 10 | 10/10 | 2886.61 |\n| Stage 6，新 seeds301:320 | 20 | 20/20 | 2892.22 |\n| 直線，101 | 1 | 1/1 | 3068.14 |\n| S 彎，101 | 1 | 1/1 | 3085.97 |\n| 固定轉彎，101 | 1 | 1/1 | 2921.44 |\n\n合計 43 個不同 checkpoint/stage/seed 組合。之前四個開發重播包含在十個已知 Stage 6 情境內，不重複計入 43。新二十個 seed 沒有用於調整此次候選；仍是有限抽樣，且內部 turbulence seeds 沿模型設定，不代表二十個獨立噪音實現。前三階段只是單 seed 能力保留檢查。Stage 4 本次未單獨重測。\n\n所有評估保持 checkpoint SHA 和 actor/critic 權重不變。候選 43 次執行時正式 SLX 未變；完成後才將相同候選原碼保存成正式模型。不是訓練收斂證明，也不是整套課程合格證書。\n\n## 獨立位置檢查\n\n對四個原失敗案例，以原始 scenario waypoints 的有限線段計算飛機座標到路線的最短距離，不使用 guidance 的 d：\n\n| seed | 全程 RMS（m） | 10 秒後最大距離（m） |\n|---|---:|---:|\n| 202 | 9.109 | 18.496 |\n| 204 | 8.862 | 19.077 |\n| 205 | 10.572 | 21.276 |\n| 207 | 9.039 | 21.162 |\n\n四例全程最大值均為 50 m，出現在 t=0：原始 route 第一點在初始飛機前方，planner 另接入起始段。表格另外明列 10 秒後的最大值，沒有把初始距離刪除再宣稱全程小於 50 m。此檢查支持確實循跡，而非僅藉錯誤 d 避免終止；不代表每個未測風場都安全。\n\n## 版本與可追溯性\n\n- checkpoint SHA256：`75bc17b133c86c974b11ebfbb23be385e9965605323486b2ff36891626c8e823`\n- 原正式 SLX：`b28c5a5c967347c498cb23f032b483841ca63b98ab4da137ca902e193225714c`\n- 空間循跡正式 SLX：`495afb97a9fa463b4500d168909ea28f649a12912f12c0631ec1e85b93c1b6be`\n- 本機配對報告：`evaluation_20261013_234910_tp4457a624`\n- 新情境報告：`evaluation_20261013_235203_tpf8e356d1`\n- 保留能力報告：`evaluation_20261013_235421_tp89d535d5`\n- 四例詳細位置來源：`evaluation_20261013_234642_tpd8fddaaa`\n\n完整 traces、checkpoint、日誌留在忽略的 diagnostic_packages；未納入 Git。舊 window/guidance 文字 fixture 供重現幾何測試，不是可續訓模型。\n\n正式存檔後再以 baseline 重播 seed207，3000 步、reward 2825.01763893，與候選完全一致；另有 110 步舊短測 agent 的 Simulink 接線驗證。有效歷史、空間 window、舊 window 初始化、endpoint 幾何、配方環境雜湊拒絕及原有分支/guard 測試均通過。SLX 差異核對只有兩個 chart 的程式、模型版本遞增和視窗/metadata。沒有執行本機正式 train，也未測 GPU/6 workers；純 sim 成功不等於保證續訓收斂。\n\n續訓配方及實驗室指令見 [操作文件](../guides/stage6-progress-training.md)。新分支從 31600 延續、最多新增 10000，保留 guard；不能解除舊 run 暫停直接覆蓋。正式環境的 baseline 指現在的空間版本。\n"}];const $=id=>document.getElementById(id);let current=null,raw=false;

function render(doc){const lines=doc.text.replace(/\r/g,'').split('\n'),out=[];let code=false,buffer=[],list=false,table=false;const close=()=>{if(list){out.push('</ul>');list=false;}if(table){out.push('</tbody></table>');table=false;}};for(const line of lines){if(line.startsWith('```')){if(code){out.push('<pre>'+esc(buffer.join('\n'))+'</pre>');buffer=[];code=false;}else{close();code=true;}continue;}if(code){buffer.push(line);continue;}if(!line.trim()){close();continue;}const heading=line.match(/^(#{1,6})\s+(.+)$/);if(heading){close();out.push('<h'+heading[1].length+'>'+inline(heading[2],doc.file)+'</h'+heading[1].length+'>');continue;}if(/^\s*\|.*\|\s*$/.test(line)){if(/^\s*\|[\s|:\-]+\|\s*$/.test(line))continue;if(!table){close();out.push('<table><tbody>');table=true;}out.push('<tr>'+line.trim().slice(1,-1).split('|').map(cell=>'<td>'+inline(cell.trim(),doc.file)+'</td>').join('')+'</tr>');continue;}const item=line.match(/^\s*(?:[-*]|\d+\.)\s+(.+)$/);if(item){if(table)close();if(!list){out.push('<ul>');list=true;}out.push('<li>'+inline(item[1],doc.file)+'</li>');continue;}close();out.push('<p>'+inline(line,doc.file)+'</p>');}close();return out.join('');}
